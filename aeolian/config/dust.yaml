schema_version: 1

# Calibration for the offline dust component. Every constant here is an Earth
# calibration or a declared assumption, each with its source and what it is
# worth, in the same way `pedology/config/pedogenesis.yaml` carries its own.
# Nothing in `scripts/` hardcodes a Vesper number.
#
# DECLARED BEFORE THE FIRST RUN, 2026-08-17. Values that could not be taken from
# a source carry a `bracket`, and the model reports the spread across it rather
# than the central value alone. Do not tune anything here to land on a number;
# `notes/dust.md` fixes a reopening test at land-mean AOD 0.10 and 1.5 W/m2, and
# tuning toward or away from it would make the test meaningless.

# --- emission: Kok et al. (2014) brittle fragmentation -----------------------
#
# Kok, Mahowald, Fratini, Gillies, Ishizuka, Leys, Mikami, Park, Park, Van Pelt,
# Zobeck (2014). An improved dust emission model - Part 1. Atmos. Chem. Phys.
# 14, 13023-13041. doi 10.5194/acp-14-13023-2014. Read; see references/INDEX.md.
#
# Equation 18a, the vertical dust flux:
#
#   Fd = Cd fbare fclay (rho_a (u*^2 - u*t^2) / u*st) (u*/u*t)^(Ca (u*st - u*st0)/u*st0)
#
# for u* > u*t, with Cd = Cd0 exp(-Ce (u*st - u*st0)/u*st0), equation 18b.
#
# Chosen over Marticorena-Bergametti because K14 derives the emitted size
# distribution from fragmentation physics rather than fitting it, so it carries
# one fewer unconstrained knob. On a synthetic planet with no aerosol optical
# depth observations to tune against, a globally tuned constant is worth nothing.
emission:
  # Fitted by K14 against a quality-controlled compilation of vertical dust flux
  # data sets; the +/- values are theirs and are carried as the bracket.
  cd0: 4.4e-5              # dimensionless, K14 section 3: (4.4 +/- 0.5)e-5
  cd0_bracket: [3.9e-5, 4.9e-5]
  ce: 2.0                  # K14: 2.0 +/- 0.3
  ce_bracket: [1.7, 2.3]
  c_alpha: 2.7             # K14: 2.7 +/- 1.0
  c_alpha_bracket: [1.7, 3.7]
  # Standardized threshold friction velocity of an optimally erodible soil, a
  # bed of 100 um loose sand. K14 section 2.3.
  u_star_st0_m_s: 0.16
  # Air density at sea level, the standardization reference. K14 equation 6
  # defines u*st = u*t sqrt(rho_a / rho_a0).
  rho_a0_kg_m3: 1.225
  # Standardized threshold for a typical erodible soil, K14's own stated value.
  # The bracket spans an optimally erodible bed at u*st0 to a crusted, resistant
  # surface. This is the single most influential constant in the scheme, because
  # the flux depends on u*st both directly and through the exponent.
  u_star_st_typical_m_s: 0.20
  u_star_st_typical_bracket: [0.16, 0.30]

  # GRAVITY. Both thresholds above are Kok's, fitted on Earth, so Earth's
  # gravity is inside them. Kok's own standardization (equation 6) corrects for
  # air density and for nothing else, so on a 1.31 g planet they are too low and
  # the error is one-signed.
  #
  # The exponent is derived rather than guessed, and it is NOT sqrt(g).
  # Shao and Lu (2000) equation 22 gives
  #
  #     u*t^2 = f(Re*t) * (sigma_p g d + gamma / (rho d))
  #
  # a gravity term rising with grain size and a cohesion term falling with it.
  # The threshold has a minimum where the two are equal -- Kok et al. (2012)
  # section 2.1 says exactly that, "the interparticle forces are approximately
  # equal in magnitude to the gravitational force" at the 75-100 um minimum --
  # and setting d(u*t^2)/dd = 0 gives
  #
  #     d_opt      = sqrt(gamma / (rho_p g))
  #     u*t,min^2  = 2 f sqrt(rho_p g gamma) / rho      ->   u*t,min ~ g^(1/4)
  #
  # So at the optimum the scaling is the FOURTH root, and gamma cancels out of
  # the ratio entirely. That matters, because gamma is only known to a factor of
  # three: Shao and Lu give 1.65e-4 to 5.0e-4 N/m and Kok and Renno (2006) fit
  # 2.9e-4. Checked numerically across that whole range and the ratio is 1.0691
  # to four figures in every case.
  #
  # Using sqrt(g) instead would give 1.1429 and over-correct by 2.1x on the
  # correction. u*st0 is defined as an OPTIMALLY erodible bed, which is the
  # minimum, so the fourth root is the right exponent for it; u*st_typical sits
  # slightly off the optimum, where the true exponent is between 1/4 and 1/2, and
  # the same factor is applied to both because the K14 relations for Cd and alpha
  # depend on (u*st - u*st0)/u*st0, which is invariant under a common scaling.
  gravity_scaling_exponent: 0.25
  gravity_reference_m_s2: 9.80665

# --- threshold: soil moisture ------------------------------------------------
#
# Fecan, Marticorena, Bergametti (1999). Parametrization of the increase of the
# aeolian erosion threshold wind friction velocity due to soil moisture for arid
# and semi-arid areas. Ann. Geophys. 17, 149-157. doi 10.1007/s00585-999-0149-7.
# Read; equations 14 and 15.
#
#   u*tw / u*td = 1                                for w <= w'
#   u*tw / u*td = [1 + A (w - w')^b]^0.5           for w > w'
#   w' = 0.0014 (%clay)^2 + 0.17 (%clay)
#
# w is GRAVIMETRIC soil moisture in percent. Their fitted A and b' are 1.21 and
# 0.68, and they report the mean relative error on w' as about 12%.
moisture:
  a: 1.21
  b: 0.68
  clay_quadratic: 0.0014
  clay_linear: 0.17

# --- threshold: drag partition ------------------------------------------------
#
# Marticorena, Bergametti (1995). Modeling the atmospheric dust cycle 1: design
# of a soil-derived dust emission scheme. JGR 100(D8), 16415-16430.
# doi 10.1029/95JD00690. Read; the drag partition of section 2.
#
#   feff = 1 - ln(z0/z0s) / ln(0.35 (X/z0s)^0.8),  z0, z0s, X in centimetres
#
# The 0.35 is Pendergrass and Arya's adiabatic value, which MB95 retain because
# it is the condition consistent with the logarithmic wind profile they assume;
# 0.8 is Elliott's exponent, confirmed by Glaser; X = 10 cm is the compromise
# they show is within 20% of a rigorous integration for feff above 0.2.
drag_partition:
  x_cm: 10.0
  a: 0.35
  b: 0.8
  # Smooth roughness of the erodible bed itself, taken as Dp/30 for a 100 um
  # particle. Declared rather than measured; the bracket spans a fine silt bed
  # to a coarse sand one.
  z0s_cm: 3.3e-4
  z0s_bracket_cm: [1.0e-4, 1.0e-3]
  # WHICH ROUGHNESS THE SCHEME IS FED, and it is not the obvious one.
  #
  # `orogen_T42_surf_0173.sra` is a GRID CELL effective roughness: it carries
  # subgrid orography measured as the elevation spread among the ~610 mesh
  # regions in a cell, and its land mean is anchored to 2.0 m so the value
  # ExoPlaSim was tuned against does not move. Over the cells that actually hold
  # erodible ground its median is 0.49 m.
  #
  # MB95 returns zero above a z0 of about 4.4 mm, so feeding it that field shuts
  # emission off over 99% of the source area. That is not a result, it is a
  # category error: MB95 partitions stress between a bed and centimetre-scale
  # roughness ELEMENTS standing on it, and a 15 km orographic variance is not
  # a roughness element. Dust models that use MB95 in a GCM carry a separate
  # aeolian roughness map for exactly this reason.
  #
  # So the scheme is driven by the aeolian roughness of the erodible surface
  # itself, and the grid-cell roughness is not used for the partition at all.
  # The consequence, which should be stated wherever a number from this
  # component is quoted: SHELTERING OF AN ERODIBLE PATCH BY THE TERRAIN AROUND
  # IT IS NOT REPRESENTED, and that biases emission high by an unknown amount.
  #
  # The bracket below is the real uncertainty and it is wide on purpose: a
  # wet-smoothed clay pan is near the bottom, a playa carrying pebbles, ripples
  # and small dunes is near the top. Emission goes as roughly u* cubed and u*
  # goes as 1/ln(z/z0), so this bracket is not a small correction.
  aeolian_z0_m: 1.0e-4
  aeolian_z0_bracket_m: [3.0e-6, 1.0e-3]
# --- the subgrid wind distribution -------------------------------------------
#
# NOT OPTIONAL, and the reason is arithmetic rather than taste. Emission goes as
# roughly u* cubed above a threshold, so a gridbox-mean wind emits almost
# nothing while the same mean with realistic variance emits a great deal. The
# approach is Cakmur, Miller, Torres (2004), who integrate emission over a
# Weibull distribution of subgrid wind speeds.
#
# The shape parameter is DECLARED, not taken from a source, and it is the least
# grounded constant in this file. On this world it also has to absorb sub-bin
# temporal variance as well as subgrid spatial variance, because the climatology
# is a 12-bin mean, which argues for a broader distribution than a purely
# spatial one. k = 2 is the Rayleigh case.
subgrid_wind:
  weibull_shape: 2.0
  weibull_shape_bracket: [1.5, 3.0]
  # Integration is over this many quadrature points in the Weibull tail. Above
  # the threshold the integrand is steep, so the count matters; checked for
  # convergence at build time rather than assumed.
  quadrature_points: 96

# --- what can emit at all ----------------------------------------------------
#
# THE POINT OF DOING THIS OUTSIDE THE GCM. ExoPlaSim's own scheme is
# `fcoeff * land_mask`, which emits as much from forest as from salt pan.
#
# `substrate_class` is consolidated lithology PLUS closed-basin fill, so on this
# world the only unconsolidated surface material the export carries is the fill.
# Bedrock does not emit: it has no loose fines until weathering makes regolith,
# and regolith that supports vegetation is not a dust source either.
#
# The erodible weights are per rock class, relative to loose fine clastics at
# 1.0. Only the two barren classes are given any weight, matching
# `config/planet.yaml`'s `barren_rock_classes`, which is the project's declared
# position on what cannot carry vegetation.
source:
  erodible_weight:
    # Playa mud and alluvial fan fill: loose, fine, and the direct analogue of
    # the Bodele, which supplies a large share of Earth's dust from a single dry
    # lake bed. This is the reference class at 1.0 by definition.
    playa_clastic: 1.0
    # Salt crust. A cemented evaporite crust is NOT a silicate soil and resists
    # deflation, which is why the Bodele is efficient as diatomite rather than
    # as a salt pan. Kok's brittle fragmentation is calibrated on silicate soils
    # and does not describe halite cement, so this weight is a declared
    # suppression rather than a measured efficiency. It is the difference
    # between a dust world and a merely dusty one, so the bracket is wide.
    evaporite: 0.10
  erodible_weight_bracket:
    evaporite: [0.0, 0.30]
  # Fraction of a cell's land that is bare erodible soil is further reduced by
  # standing water, snow cover, and vegetation. Lakes and snow are taken from
  # artifacts; vegetation is the assumption below.
  snow_suppression_depth_m: 0.01   # snow deeper than this shuts a cell off
  # THE ASSUMPTION THAT MOST LIMITS THIS PRODUCT. No vegetation model has run on
  # this build, so cover is taken from the project's existing declared position:
  # everything that is not a barren class carries a canopy and does not emit.
  # That is generous, and knowingly so: median land runoff on this build is
  # 3.8 mm per Earth year with two thirds of land under 50, which is not a
  # canopy. The `arid_bare_ground` variant below brackets it by letting dry
  # cells emit regardless of lithology, and the model reports both.
  arid_bare_ground:
    enabled_as_bracket: true
    # A cell drier than this is treated as bare regardless of its rock class.
    # Chosen as the conventional desert boundary rather than fitted.
    precipitation_mm_per_earth_year: 250.0
    # Weight given to bare bedrock regolith when it does qualify. Lower than
    # playa fill because bedrock regolith is coarser and partly armoured.
    weight: 0.30

# --- transport and removal ---------------------------------------------------
transport:
  # Dust is carried as a well-mixed column of this scale height, advected by the
  # mass-weighted wind of the layers below `steering_sigma`. A single steering
  # layer is a simplification; it is declared because the alternative is a
  # three-dimensional tracer solve, which is what the GCM would be for.
  dust_scale_height_m: 3000.0
  dust_scale_height_bracket_m: [2000.0, 5000.0]
  steering_sigma: 0.5
  # Steady state per time bin, reached by explicit stepping. Convergence is
  # checked rather than assumed.
  # The explicit step is CFL-limited by the convergence of the longitude grid at
  # the poles, and the finest bin relaxes on a timescale of years where nothing
  # rains. At 4000 iterations the solver reached 27.6 days against a 1351-day
  # relaxation time and reported not-converged, correctly.
  max_iterations: 40000
  convergence_fraction: 1.0e-4
  # Floor on cos(latitude) in the grid spacing, purely numerical. Without it the
  # polar rows set a 14 km cell width and a 597 s step for the whole globe. Dust
  # sources are not polar, so the distortion is where it does not matter, but it
  # IS a distortion of polar transport and it is declared rather than hidden.
  polar_coslat_floor: 0.2
  # Horizontal diffusion, as a numerical regulariser for the upwind advection
  # rather than as physics. Reported so it is not mistaken for a transport term.
  diffusion_m2_s: 50000.0

removal:
  # Gravitational settling is Stokes with the Cunningham slip correction, and it
  # uses THIS WORLD's gravity from config/planet.yaml, not Earth's. At 12.81
  # m/s2 settling is 1.31x faster than Earth for the same particle, so dust
  # lifetime here is shorter than terrestrial intuition suggests.
  particle_density_kg_m3: 2600.0     # matches analysis/dust_optics.json
  # Below-cloud scavenging, Lambda = A p^B with p the precipitation rate in
  # mm/h. Sportisse (2007), A review of parameterizations for modelling dry
  # deposition and scavenging of radionuclides, Atmos. Environ. 41, 2683-2698,
  # Table 12: for particle diameters near 2 um, A = 1.72e-6 and B = 0.61.
  #
  # This is the least certain term in the removal budget and it matters most:
  # without wet scavenging the fine mode's lifetime is out by an order of
  # magnitude. The bracket spans that table's own size dependence, from
  # 1.72e-6 at 2.16 um to 3.49e-6 at 1.66 um, and up to the NAME model's
  # 8.05e-5 for below-cloud snow scavenging.
  scavenging_a: 1.72e-6
  scavenging_b: 0.61
  scavenging_a_bracket: [1.72e-6, 8.05e-5]

# --- emitted size distribution -----------------------------------------------
#
# Kok (2011). A scaling theory for the size distribution of emitted dust
# aerosols suggests climate models underestimate the size of the global dust
# cycle. PNAS 108(3), 1016-1021. doi 10.1073/pnas.1014798108. Read; equation 6.
#
#   dV/dlnD = (D/cV) [1 + erf(ln(D/Ds) / (sqrt(2) ln(sigma_s)))] exp(-(D/lambda)^3)
#
# Constants are Kok's fitted values with his stated uncertainties.
size_distribution:
  median_diameter_um: 3.4          # Ds, 3.4 +/- 1.9
  geometric_sigma: 3.0             # sigma_s, 3.0 +/- 0.4
  crack_length_um: 12.0            # lambda, 12 +/- 1
  # Bin edges in micrometres. Four bins with independent settling and no
  # inter-bin microphysics, which is right for mineral dust: it neither
  # coagulates nor grows appreciably, so size resolution buys differential
  # settling and nothing else.
  bin_edges_um: [0.1, 1.0, 2.5, 5.0, 20.0]

# --- optics ------------------------------------------------------------------
#
# NOT recomputed here. `analysis/dust_optics.json` carries two-band mass
# extinction efficiency, single-scattering albedo and asymmetry parameter
# integrated against this star's spectrum, from a Mie code validated against
# Bohren-Huffman and OPAC. Optical depth is column mass times mass extinction
# efficiency.
optics:
  source: analysis/dust_optics.json
  # Which entry to use for the band-1 and band-2 efficiency. Di Biagio is the
  # measured-index case and Rocha-Lima the digitised one; OPAC is the absorbing
  # end and is carried as the bracket in dust_optics.json rather than here.
  band1_indices: Di Biagio 2019 measured
  band2_indices: Rocha-Lima Algeria fine
