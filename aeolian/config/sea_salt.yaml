  # The magnitude the calcium arm is read against, and it is an EARTH
  # measurement at one site rather than a global mean. Chadwick, Derry, Vitousek,
  # Huebert and Hedin (1999) measured atmospheric input directly on the Hawaiian
  # substrate-age sequence and report 600 +/- 400 mg Ca per m2 per Earth year,
  # mostly marine aerosol. `biosphere/notes/abiotic-nutrient-ledger.md` carries
  # it as the ANUT-7 anchor. A single maritime tropical site is an upper end for
  # a land mean: it is small, wet and surrounded by ocean, so this world's
  # land mean landing below the band is expected and only a land mean ABOVE it
  # would be a defect.
  magnitude_anchor:
    source: Chadwick et al. (1999), a Hawaiian site
    calcium_mg_m2_earth_year: [200, 1000]
