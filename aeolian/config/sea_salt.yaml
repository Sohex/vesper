schema_version: 1

# Calibration for the offline sea-salt component, in the same form as
# `dust.yaml` beside it: every constant is a published calibration or a declared
# assumption, each with its source and what it is worth, and anything that could
# not be taken from a source carries a `bracket` that the model reports rather
# than collapsing. Nothing in `scripts/` hardcodes a Vesper number.
#
# DECLARED BEFORE THE FIRST RUN, 2026-08-19. There is no reopening test here
# analogous to `notes/dust.md`'s, because sea salt has no equivalent of the
# carve verdict downstream of it; what it has to answer is whether it is a term
# in the error budget, and that question is settled by a number rather than by a
# threshold. Do not tune anything here to land on a comparison with dust.

# --- emission: Grythe et al. (2014) G13T ------------------------------------
#
# Grythe, Strom, Krejci, Quinn, Stohl (2014). A review of sea-spray aerosol
# source functions using a large global set of sea salt aerosol concentration
# measurements. Atmos. Chem. Phys. 14, 1277-1297. doi 10.5194/acp-14-1277-2014.
# Read; see references/INDEX.md.
#
# Equation 7, the number flux per unit dry diameter:
#
#   dF/dDp = TW(T) [ 235 U10^3.5 exp(-0.55 [ln(Dp/0.1)]^2)
#                  +  0.2 U10^3.5 exp(-1.5  [ln(Dp/3)]^2)
#                  +  6.8 U10^3   exp(-1.0  [ln(Dp/30)]^2) ]
#
# in particles m-2 s-1 um-1, with Dp the DRY diameter in um and U10 the 10 m
# wind speed in m/s.
#
# Chosen over Monahan (1986) and Gong (2003) because it is the function that
# review fits to the observations rather than one of the 21 it reviews, and
# because it is the only one here whose global mass production the authors
# state, which is what makes the Earth check below possible.
emission:
  # Grythe eq. 7, three lognormal modes: amplitude, wind exponent, centre
  # diameter in um, and the coefficient inside the squared logarithm.
  modes:
    - {amplitude: 235.0, wind_exponent: 3.5, centre_dp_um: 0.1, log_width: 0.55}
    - {amplitude: 0.2,   wind_exponent: 3.5, centre_dp_um: 3.0, log_width: 1.5}
    - {amplitude: 6.8,   wind_exponent: 3.0, centre_dp_um: 30.0, log_width: 1.0}
  # Temperature weight, Grythe eq. A7 (from Jaegle et al. 2011), with T the sea
  # surface temperature in DEGREES CELSIUS. Grythe tested four temperature
  # treatments and found this one fits the observations best.
  #
  # It is a cubic fitted over roughly 0 to 30 C and it MUST NOT be extrapolated:
  # outside that range it turns over and goes negative. The script clamps the
  # temperature to the fitted range and reports how much ocean area was clamped,
  # rather than evaluating a fitted polynomial where it was never fitted.
  temperature_weight: [0.3, 0.1, -0.0076, 0.00021]
  temperature_fit_range_c: [0.0, 30.0]
  # Dry diameter limits of the integration, um. The upper limit is Grythe's own
  # reporting cut and is why the Earth check below has a number to hit: their
  # stated global production is for Dp < 10 um. It is also physical -- the
  # 30 um spume mode is mostly outside it, and spume drops of that size fall out
  # within minutes and never become aerosol.
  dp_min_um: 0.01
  dp_max_um: 10.0
  # Dry sea-salt density, OPAC's value for both sea-salt components, and the
  # same number the size-distribution table beside the refractive indices in
  # exoplasim/data/sea_salt/ carries at 0% relative humidity.
  dry_density_kg_m3: 2200.0
  # Emission is suppressed under sea ice, linearly in the ice fraction. There is
  # no whitecap under ice, and this is the one term that makes this world's cold
  # branch differ from its warm one in sea salt.
  sea_ice_suppression: true

# --- the Earth check ---------------------------------------------------------
#
# The only numbers in this file that are not inputs. Grythe et al.'s Table 2
# reports the global annual production their model computes for every source
# function it reviews, on 25 years of ECMWF winds, over the same Dp < 10 um
# range. That is a right answer supplied by the source, so the test can fail.
#
# THE COMPARISON IS ABOUT MONAHAN, and that has to be said because the obvious
# reading is that it is about equation 7. Grythe's Table 2 prices each function
# over ITS OWN validity range, not over a common cut, and it applies the
# temperature weight only to the rows whose acronym ends in T. So the two rows
# are not the same kind of quantity:
#
#   M86   4.51 Pg/yr over Dp 0.8-8 um, NO temperature weight
#   M86E  5.20 Pg/yr over Dp 0.1-10 um, the same function extrapolated, no weight
#   G13T  8.91 Pg/yr over Dp 0.01-10 um, WITH the Jaegle weight of equation A7
#
# G13T's target therefore carries a temperature weight this check cannot
# reproduce. The weight is a cubic in sea surface temperature and Grythe applied
# it cell by cell over 25 years of reanalysis; evaluating it once at an ocean
# mean is not the same number, because the mean of a cubic is not the cubic of
# the mean and this world's check has one temperature. Grythe report no
# weight-free total for equation 7 -- they name that variant G13 and do not
# table it. So G13T is REPORTED here and not gated, and the two arms that are
# gated are Monahan's, whose rows carry no weight.
#
# THE ABSOLUTE BAND IS GRYTHE'S OWN, and it prices exactly the thing this check
# cannot control. Of Monahan, section 5.2: "published global fluxes reported in
# the literature range from 3.3 to 11.7 Pg yr-1 (Lewis and Schwartz, 2004), with
# at least seven published estimates in between. These different estimates can
# largely be explained by differences in the models' surface wind and in part by
# differences in model resolution." That is one source function put through
# eight machineries, and the spread is the wind treatment. Our wind is a Weibull
# at an assumed ocean mean and theirs is a reanalysis at 1 degree and 3 hours,
# so landing inside that band is the strongest absolute statement available and
# it is one this project did not choose. A unit slip in the integration, a wrong
# ocean area or an inverted subgrid moment moves the total by orders of
# magnitude and cannot survive a factor-of-3.5 band.
#
# THE SIZE-RANGE RATIO IS WHERE THE INTEGRATOR IS ACTUALLY TESTED, and it is a
# ratio that carries no wind at all. Monahan factorises exactly into a whitecap
# term in U10 and a size term in Dp, so the wind cancels between the two rows and
# M86E/M86 = 5.20/4.51 is a property of the size function and the two intervals
# and nothing else. Reproducing it tests the mass integration, the size grid and
# the bin-edge handling against a number Grythe supply. The old form of this
# check compared two DIFFERENT source functions over the same interval, which
# shares the size integration between the arms and therefore cannot see an error
# in it; this compares the same function over two intervals, which cannot see an
# error in the source function and is meant not to.
#
# The tolerance is 5 per cent. Grythe print both totals to three significant
# figures, so the ratio itself carries about 0.14 per cent of rounding; 5 per
# cent is an order above that, allows for their integral being over a discrete
# emission spectrum rather than an analytic one, and is far inside the
# factor-3.5 wind band, so an integration error still shows.
#
# THE SPUME MODE IS EXCLUDED FROM THE G13T LINE AND NOT FROM THE MODEL, and the
# reason is recorded because it is a real property of equation 7. Grythe's third
# mode is centred at Dp = 30 um and its lower tail dominates the mass integral
# below 10 um. Their own transport discretised the emitted spectrum into four
# lognormal classes with modal radii at 80% relative humidity of 0.65, 4.7, 6.8
# and 8.9 um, so their reported total is not the analytic integral of equation 7
# to 10 um. The tail stays in the emission because those drops are really
# emitted; what removes them is settling, which is a physical answer rather than
# a truncation.
earth_check:
  # EARTH's global ocean-area-weighted annual mean 10 m SCALAR wind speed.
  # MEASURED, from NOAA NCEI Blended Global Sea Surface Winds (NBS) v2.0, the
  # 1991-2020 monthly climatology
  # `NBS_v02_wind_climmonthly_s1991_e2020_c20221206.nc`, 0.25 degree, zlev 10 m,
  # documented by Saha and Zhang (2022), Front. Mar. Sci. 9:935549,
  # `10.3389/fmars.2022.935549`. The file's own `windspeed` field, its own ocean
  # mask (`mask == 1`, so lakes and rivers are out), cos(latitude) weighting,
  # 694,835 ocean cells covering 71.42 per cent of the sphere, every cell finite
  # in every month. Month-weighted and day-weighted annual means agree to four
  # decimals; the seasonal cycle is 0.24 m/s peak to peak and a latitude cap
  # anywhere from 60 to 90 degrees moves the answer by under 0.06 m/s.
  #
  # THE SCALAR-VERSUS-VECTOR DISTINCTION IS THE WHOLE OF THIS NUMBER, and it was
  # verified rather than assumed: in January the same file's area-mean
  # `windspeed` is 7.540 m/s against 4.133 for the area-mean of
  # sqrt(u_wind^2 + v_wind^2), a factor of 1.8. Emission goes as U10^3.41, so a
  # vector mean read as a scalar one would be wrong by two orders of magnitude.
  # Any replacement for this number must be a mean of the instantaneous speed.
  #
  # EQUIVALENT-NEUTRAL, AND THAT IS THE RIGHT KIND. NBS speeds are microwave
  # radiometer and scatterometer retrievals, which are 10 m equivalent-neutral
  # winds rather than true ones. `u10_from_level` reaches U10 by a Charnock
  # roughness and a NEUTRAL log profile with no stability function, so this
  # world's U10 is equivalent-neutral by construction and the satellite product
  # is the like-for-like comparison rather than a biased one.
  #
  # WHAT IT REPLACED. 7.0 m/s, declared and unsourced, attributed in this file to
  # Grythe's Fig. 3. Grythe state no ocean-mean 10 m wind speed anywhere; what
  # they give is the MODE, section 5.2, "the most frequent wind speeds are
  # 5-7 m s-1 with a long-tailed distribution towards higher wind speeds", and a
  # mode read as a mean on a long-tailed distribution is low by construction,
  # which was the sign of the miss. At 7.0 the absolute arm failed at 2.75 Pg/yr
  # against a band bottom of 3.3; at the measured value all three arms pass.
  # Nothing was fitted to reach it: the bars were fixed in world-fgak before the
  # first run and the wind was sourced without reference to them. world-3e2d.
  ocean_mean_u10_m_s: 7.566
  # EARTH's ocean wind-speed Weibull shape, and it is the Earth check's own
  # rather than `subgrid_wind.weibull_shape`. It used to be the latter, which is
  # THIS WORLD's shape and is fitted at build time from a Vesper high-cadence
  # extract, so a refit here would have moved an Earth verdict for a reason
  # having nothing to do with Earth. The check is sensitive enough for that to
  # matter: holding the wind at the value above, the gated arms pass at shape
  # 1.6 and 2.0 and FAIL at 2.6, the top of this world's declared bracket.
  #
  # SOURCED, and to the right object. Monahan (2006) Part I, section 5, asks
  # exactly this question of QuikSCAT and answers it: "The observed PDF of w is
  # somewhat narrower than the Rayleigh PDF ... Despite these small differences,
  # the Rayleigh PDF is a reasonable approximation to the global PDF of w."
  # Rayleigh is Weibull with shape 2. That is the POOLED global distribution,
  # which is the object this check needs, because the check applies one moment
  # ratio to one global mean production. The same paper's Fig. 3 is why the
  # pooled distribution and not a typical local one: the LOCAL shape runs 2 to 3
  # in the northern midlatitudes and the warm pool, 3 to 4 over the Southern
  # Ocean and above 4 on the flanks of the subtropical highs, and it is the
  # variation of the local mean between those regions that broadens the pool
  # back to Rayleigh. Part II adds that all four datasets it compares share that
  # pattern.
  #
  # Monahan's winds are 10 m equivalent-neutral scatterometer winds, the same
  # kind as `ocean_mean_u10_m_s` above and the same kind `u10_from_level`
  # produces, so the mean and the shape are consistent in kind as well as in
  # source.
  weibull_shape: 2.0
  ocean_area_m2: 3.61e+14
  sst_mean_c: 18.0
  # Grythe et al. (2014) Table 2. `dp_um` is that row's own validity range and
  # `temperature_weight` is whether the row carries the equation A7 weight;
  # both differ row to row and both had been read as common.
  grythe_table2:
    M86:  {pg_per_year: 4.51, dp_um: [0.8, 8.0], temperature_weight: false, gated: true}
    M86E: {pg_per_year: 5.20, dp_um: [0.1, 10.0], temperature_weight: false, gated: true}
    G13T: {pg_per_year: 8.91, dp_um: [0.01, 10.0], temperature_weight: true, gated: false}
  # Published global production for the Monahan function across eight
  # implementations, Grythe section 5.2 quoting Lewis and Schwartz (2004). The
  # gated arms must land inside it. Pg per Earth year.
  absolute_pg_per_year_band: [3.3, 11.7]
  # M86E/M86 is a pure property of the size function and the two intervals,
  # because the whitecap term cancels. See the argument above for the 5 per cent.
  size_range_ratio_tolerance: 0.05
  # The sum over the configured size bins against the total from the same call:
  # the same integral computed two ways, so this is an IDENTITY rather than a
  # comparison, and the tolerance is what two trapezoid grids of at least 200
  # points per decade can differ by. The per-bin field is what the whole
  # transported budget rides on and nothing was checking it.
  bin_sum_identity_tolerance: 1.0e-3
  # Monahan et al. (1986) via Grythe equations A1 and A2, the harmonised form.
  # Every coefficient checked against the printed equations:
  #   W_M = 3.84e-6 U10^3.41
  #   dF/dDp = W_M * 3.6e5 * Dp^-3 (1 + 0.057 Dp^1.05) * 10^(1.19 exp(-B^2))
  #   B  = (0.38 - log10 Dp) / 0.65
  monahan:
    whitecap_coefficient: 3.84e-6
    wind_exponent: 3.41
    amplitude: 3.6e+5
    size_power: -3.0
    tail_coefficient: 0.057
    tail_power: 1.05
    log_amplitude: 1.19
    b_offset: 0.38
    b_scale: 0.65

# --- the wind, and its subgrid distribution ----------------------------------
#
# THE SAME ARITHMETIC AS DUST, AND FOR THE SAME REASON. Production goes as
# U10^3.5, so a T42 gridbox mean produces far less than the same mean with
# realistic variance. Here it is exact rather than quadrature: for a Weibull of
# shape k, the moment ratio is
#
#   <U^p> / <U>^p = Gamma(1 + p/k) / Gamma(1 + 1/k)^p
#
# which the script evaluates analytically. At k = 2 that is 2.455 for p = 3.5
# and 1.910 for p = 3. Jensen guarantees it exceeds 1, which is the cheap check.
subgrid_wind:
  # Fitted from instantaneous samples over OCEAN cells, the way dust.yaml's is
  # fitted over erodible land, because the shape differs between the two
  # surfaces and neither should borrow the other's. Fitted at build time from
  # the high-cadence extract, which --gust-samples must name explicitly; this
  # value is reached only if that fit is unavailable, and the bracket bounds it.
  weibull_shape: 2.0
  weibull_shape_bracket: [1.6, 2.6]

# --- the surface layer -------------------------------------------------------
#
# The source function wants U10 and the climatology carries the lowest model
# level, near 109 m here. The conversion is a logarithmic profile over the
# roughness of open water, and the roughness of open water is where THIS
# WORLD'S GRAVITY ENTERS THE EMISSION.
#
# Charnock (1955) as calibrated by Smith (1988): z0 = 0.11 nu / u* + a u*^2 / g.
# Smith, S. D. (1988), Coefficients for sea surface wind stress, heat flux, and
# wind profiles as a function of wind speed and temperature, J. Geophys. Res.
# 93(C12), 15467-15472, doi 10.1029/JC093iC12p15467. The Charnock coefficient
# 0.011 is Smith's open-ocean value; 0.018 is the shallow-water and
# fetch-limited value and is the upper bracket.
#
# At 12.81 m/s2 the same friction velocity gives a roughness 0.766 times
# Earth's, so the wind profile is slightly steeper and U10 slightly lower for
# the same level wind. It is a small term and it is carried because it is free,
# not because it is decisive.
surface_layer:
  charnock: 0.011
  charnock_bracket: [0.011, 0.018]
  smooth_flow_coefficient: 0.11
  kinematic_viscosity_m2_s: 1.5e-5
  von_karman: 0.4
  reference_height_m: 10.0
  iterations: 4

# --- hygroscopic growth ------------------------------------------------------
#
# Sea salt is not mineral dust and this is the difference that matters. A sea
# salt particle at ambient humidity is a solution droplet: bigger, less dense,
# and optically nearer water than salt. Every one of those changes its settling
# velocity and its extinction, so the wet state is carried through the whole
# chain rather than applied at the end.
#
# Growth factor and wet density are OPAC's own, tabulated at eight relative
# humidities in exoplasim/data/sea_salt/opac_sea_salt_size_distribution.dat and
# interpolated in relative humidity. They are not independent: the wet density
# and the growth in mode radius are two statements of the same salt volume
# fraction and they agree inside the optics script's enforced 0.01 g/cm3 check.
#
# OPAC's growth factor at 80% relative humidity is 1.99, which is the r80 = 2
# r_dry convention Grythe equation 2 states, arrived at from a different
# direction. That agreement is what licenses using Grythe's DRY diameters and
# OPAC's WET optics in the same calculation.
growth:
  source: exoplasim/data/sea_salt/opac_sea_salt_size_distribution.dat
  # Relative humidity is taken from the model's own lowest level over ocean and
  # clamped into OPAC's tabulated range. Below the deliquescence point a real
  # sea salt particle on the drying branch stays a droplet, which is the branch
  # OPAC's single-valued curve assumes and states it assumes; the clamp is at
  # the bottom of the table rather than at deliquescence for that reason.
  rh_min_percent: 50.0
  rh_max_percent: 99.0

# --- transport and removal ---------------------------------------------------
transport:
  # Sea salt is a marine boundary layer aerosol and does not reach dust's free
  # troposphere: the source is at the surface, the particles are large, and the
  # removal is fast. The scale height is correspondingly lower than dust's
  # 3000 m and is declared rather than derived.
  scale_height_m: 1000.0
  scale_height_bracket_m: [700.0, 1500.0]
  steering_sigma: 0.85
  diffusion_m2_s: 1.0e+5
  max_iterations: 40000
  convergence_fraction: 1.0e-6
  polar_coslat_floor: 0.2

removal:
  # Settling is Stokes with the Cunningham slip correction at this world's
  # gravity, evaluated on the WET particle: the grown diameter and the reduced
  # wet density. Growing a particle raises its settling velocity despite the
  # lower density, because the diameter enters squared and the density linearly.
  #
  # WET REMOVAL IS NOT DUST'S, AND THE DIFFERENCE IS THE WHOLE MASS BUDGET.
  # `dust.yaml` carries Sportisse's BELOW-CLOUD scavenging, which is the right
  # process for a weakly hygroscopic mineral. Sea salt is the most cloud-
  # condensation-active aerosol there is: it is removed IN cloud, by being the
  # nucleus of the drop that falls. Using dust's below-cloud coefficient here
  # gives the accumulation mode a lifetime of three weeks against a measured
  # one of about a day, and the optical depth that follows is an order of
  # magnitude out.
  #
  # So the LEVEL is calibrated to Jaegle et al. (2011), who report an
  # accumulation-mode lifetime of 25 h dominated by wet deposition, 12 h for
  # 0.5 < r_dry < 4 um, and shorter for larger; and the SHAPE in precipitation
  # is kept from Sportisse (2007), which is the same exponent dust uses.
  #
  # Jaegle, Quinn, Bates, Alexander, Lin (2011). Global distribution of sea salt
  # aerosols: new constraints from in situ and remote sensing observations.
  # Atmos. Chem. Phys. 11, 3137-3157. doi 10.5194/acp-11-3137-2011. Read.
  #
  # The calibration is at EARTH's ocean-mean precipitation and is applied here
  # through this world's own precipitation field, so the transfer is of a
  # process rate and not of a result.
  wet_lifetime_hours: 25.0
  wet_lifetime_hours_bracket: [12.0, 40.0]
  reference_precipitation_mm_per_hour: 0.1256   # 1100 mm per Earth year, the
                                                # ocean-mean, DECLARED
  scavenging_b: 0.61                            # Sportisse (2007) Table 12
  # Kept for the record and NOT used: this is what dust.yaml carries, and
  # substituting it here is the order-of-magnitude error described above.
  below_cloud_scavenging_a_dust: 1.72e-6

# --- size bins ---------------------------------------------------------------
#
# Dry diameter edges in um. Four bins, chosen so that the two Grythe modes that
# carry the mass inside the 10 um cut are resolved separately from each other:
# the film and jet mode near 0.1 um, and the mode near 3 um that carries most of
# the mass. Each bin settles and scavenges independently and there is no
# inter-bin microphysics, which unlike mineral dust is an APPROXIMATION here --
# a real sea salt population coagulates and its droplets exchange water with the
# air. Both are slow against a lifetime of days.
size:
  bin_edges_um: [0.01, 0.5, 2.0, 5.0, 10.0]

# --- optics ------------------------------------------------------------------
#
# NOT recomputed here. `analysis/sea_salt_optics.json` carries the two-band mass
# extinction efficiency, single-scattering albedo and asymmetry parameter per
# dry size bin and per relative humidity, integrated against this star's
# spectrum by a Mie code validated against Bohren-Huffman and OPAC.
#
# The mass extinction efficiency there is PER GRAM OF DRY SEA SALT, not per gram
# of wet particle, because the emission and transport budget is in dry salt
# mass. Getting that wrong is a factor of four at 80% relative humidity.
optics:
  source: analysis/sea_salt_optics.json
  indices: OPAC ssam and sscm, at ambient relative humidity
  # The wind the emitted size distribution is shaped at, for the WITHIN-BIN
  # weighting only: each bin is band-averaged on its own, so this sets how the
  # population is distributed inside a bin and never the burden, which comes
  # from `build_sea_salt.py` and this world's own winds.
  #
  # DECLARED HERE RATHER THAN BORROWED, and that is the point of the entry.
  # `sea_salt_optics.py` used to default to `earth_check.ocean_mean_u10_m_s`,
  # so an EARTH constant shaped a VESPER optics product and a change to the
  # Earth check moved an artifact nothing had asked it to move.
  #
  # It is nearly wind-independent by construction, and that was MEASURED rather
  # than argued: two of Grythe's three modes carry `wind_exponent` 3.5 and only
  # the 30 um spume mode carries 3.0, so the wind divides out of the normalised
  # within-bin shape everywhere the spume tail does not reach. Re-running the
  # whole table at 7.0 and at 7.566 m/s, an 8 per cent change in the wind, moves
  # the worst mass extinction efficiency by 1.2e-3 relative, the worst asymmetry
  # parameter by 1.3e-4, the worst critical surface albedo by 1.0e-4 and the
  # worst single-scattering albedo by 1.1e-5. So the coupling was harmless and
  # the defect was that it existed at all.
  #
  # The value is unchanged from the borrowed default so that exposing the
  # coupling does not also move the artifact, and there is no reason to prefer
  # this world's own ocean-mean wind here: `sea_salt_optics` runs before any
  # climatology is read, and at that sensitivity it would not matter if it did.
  emitted_shape_u10_m_s: 7.0

# --- composition, for the nutrient carrier -----------------------------------
#
# ANUT-7 retains marine aerosol as a base-cation and sulfur source to
# `soil_solution` in `biosphere/config/abiotic_nutrients.yaml`, and a ledger
# needs an element mass. This block turns the dry sea-salt mass the transport
# deposits into element masses, once, so that no consumer does the molar
# arithmetic a second time and differently.
#
# THE SOURCE IS THE REFERENCE COMPOSITION, Table D.3 p. 144 of IOC, SCOR and
# IAPSO (2010), the TEOS-10 Manual, Manuals and Guides No. 56, UNESCO, which
# reproduces Table 4 of Millero et al. (2008) and is the definition of record.
# `Wj` is the printed mass fraction column and the caption states its
# denominator exactly: "the mass of a particular solute as a fraction of the
# total mass of solute", so it is per kg of SEA SALT and not per kg of solution,
# which is the mass the transport carries.
#
# IT CLOSES BY CONSTRUCTION AND NOT APPROXIMATELY. The mole fractions ARE the
# definition, integers over 1e7 summing to exactly 10,000,000 with charge
# summing to exactly zero, and the mass fractions follow as Wj = Xj Mj / MS with
# MS = 31.4038218 g/mol. The printed digits sum to 1.0 with no renormalisation,
# which is why `aerosol_deposition.check_composition` is an identity with a
# right answer rather than a comparison with a tolerance.
#
# WHAT IT LEAVES OUT IS NOT A RESIDUAL. Appendix A.3 p. 74 lists the omissions
# as omissions from REAL seawater rather than as a gap inside the table: Li+ and
# Rb+ at about 0.18 and 0.12 mg/kg, dissolved N2 and O2 as not affecting density
# or conductivity, nutrients as negligible, organic matter excluded entirely.
# Departures of real seawater are carried as an Absolute Salinity Anomaly. A
# ledger that read the omissions as a closure gap would be misreading the table.
#
# THIS WORLD'S OCEAN IS DECLARED TO CARRY THAT COMPOSITION, and that is an
# assumption rather than a result. Nothing in this project models ocean
# chemistry; `config/planet.yaml` declares a salinity and no proportions. The
# assumption is the same one the source function already makes by carrying no
# salinity weight at all, so adopting it here adds no new commitment. What it
# does mean is that every element mass below inherits it, and a future ocean
# chemistry would move all of them together rather than one at a time.
#
# ELEMENT MASS PER UNIT SOLUTE MASS. Unity for the monatomic ions. For sulfate,
# M_S / M_SO4 from the manual's own numbers rather than an external table:
# Table D.6 p. 146 gives M(O2) = 31.9988 so M(O) = 15.9994, and Table D.3's
# M(SO4) = 96.0626 gives M(S) = 96.0626 - 4 M(O) = 32.0650, hence 0.3337928.
# The carbonate, borate and hydroxide solutes are listed so the sum closes and
# carry no element, because the ledger asks for none of C, B or O and deriving
# them would add molar masses this file has no use for.
composition:
  source: >
    Reference Composition of seawater, Table D.3 p. 144 of IOC, SCOR and IAPSO
    (2010), The international thermodynamic equation of seawater 2010,
    Manuals and Guides No. 56, UNESCO, reproducing Table 4 of Millero et al.
    (2008). Mass fractions are per unit mass of SEA SALT.
  solutes:
    sodium:      {mass_fraction: 0.3065958, elements: {Na: 1.0}}
    magnesium:   {mass_fraction: 0.0365055, elements: {Mg: 1.0}}
    calcium:     {mass_fraction: 0.0117186, elements: {Ca: 1.0}}
    potassium:   {mass_fraction: 0.0113495, elements: {K: 1.0}}
    strontium:   {mass_fraction: 0.0002260, elements: {Sr: 1.0}}
    chloride:    {mass_fraction: 0.5503396, elements: {Cl: 1.0}}
    sulfate:     {mass_fraction: 0.0771319, elements: {S: 0.3337928}}
    bicarbonate: {mass_fraction: 0.0029805, elements: {}}
    bromide:     {mass_fraction: 0.0019134, elements: {Br: 1.0}}
    carbonate:   {mass_fraction: 0.0004078, elements: {}}
    borate:      {mass_fraction: 0.0002259, elements: {}}
    fluoride:    {mass_fraction: 0.0000369, elements: {F: 1.0}}
    hydroxide:   {mass_fraction: 0.0000038, elements: {}}
