# Shared acceptance rule for every downstream LPJ-GUESS output consumer.
#
# Every number below carries its disposition. The argument, the measurement it
# rests on and what each earlier form of this rule could and could not detect are
# in `biosphere/notes/equilibrium-trend-null.md`.
contract_version: vesper-lpj-equilibrium-window/6
# The PER-CELL HALF'S window, and nothing else's. It used to name three spans at
# once -- the reported value's, the equilibrium claim's, and this one -- and the
# first two are the whole retained record. A slope fitted over ten cycles sits
# inside one memory time for 61 of the 64 columns it used to judge, and a mean
# taken over ten cycles is one effective sample of them.
complete_forcing_cycles: 10
# WHAT A CONSUMER READS, and it is the span the contract certifies. Reporting a
# ten-cycle mean while certifying the whole record hands a consumer a number
# whose own sampling error is larger than the drift the certificate refuses: at
# a memory time of tens to hundreds of cycles a ten-cycle mean cannot be known
# better than the series' marginal scatter, and ten of those columns have
# a marginal scatter above `relative_end_to_end_limit` outright. The reduced
# value, its temporal spread and its own standard error are therefore taken over
# the whole retained record, and the standard error travels with the value.
reported_span: whole_retained_record
# WHAT THE ACCEPTANCE CLAIM IS ABOUT, and it is a list of QUANTITIES A CONSUMER
# READS rather than a table's columns. The claim this contract makes is that
# these have settled to the tolerance each owes ITS OWN consumer; it is not a
# claim that the simulated biosphere as a whole has settled, and the artifact
# says so. Every column keeps a reported drift bound as a diagnostic, so what is
# outside the claim is visible rather than absent.
#
# A COLUMN THAT ENTERS A CONSUMER QUANTITY ONLY THROUGH A SUM OWES NOTHING
# BEYOND WHAT THE SUM OWES. The sum's own cycle series carries that column's
# drift at its own share, with every cancellation and every reinforcement
# already in it, and the drift bound applied to the sum bounds the sum exactly.
# Bounding each column separately at the sum's tolerance is a strictly stronger
# claim than any consumer makes, and it is what a per-plant-functional-type
# column costs: on the 1253-cycle record the binding column was anpp.out TrBR at
# 33846 cycles, twenty-seven times what the consumer quantities need, and no
# consumer reads it.
#
# ADDING A CONSUMER ADDS A ROW HERE. That is the whole of the maintenance rule:
# a quantity is assessed because something reads it, so a new reader that forms
# a sum this list does not name is a sum this contract has not certified.
#
# AND A READER THAT IMPOSES NO DRIFT TOLERANCE IS NOT A CONSUMER FOR THIS
# PURPOSE. The acceptance contract's own closure block used to put four pool and
# flux totals here -- cpool.out and npool.out Total, aaet.out Total and
# tot_runoff.out Total -- at the tightest tolerance derived anywhere in the tree,
# on the ground that a conservative number is better than none. It is not: a
# tolerance nothing demands refuses runs and buys nothing, which is the same
# defect a per-plant-functional-type column was costing before this contract
# scoped itself to consumers.
#
# THE POOL CLOSURES ARE CONSERVATION IDENTITIES. `assess_lpj_run.py` forms
# `(stock[-1] - stock[0]) + sum(flux)` against a share of the flux throughput,
# and a drifting pool enters both sides of that: it holds exactly when the model
# conserves and fails exactly when it does not, at any state of drift. THE WATER
# CLOSURE HAS NO STOCK TERM AT ALL, so what it needs settled is the soil water,
# ice and snowpack no annual table carries, and a drift tolerance on a runoff or
# a transpiration column is not that requirement. `aaet.out` Total's stated
# reader was `stability_outputs`, which is the list of tables this reducer runs
# on: it was assessed because it was assessed.
#
# All four keep a reported drift bound on the acceptance artifact as a
# diagnostic, so what left the claim is visible rather than absent, and the
# closure block still runs on every one of them. What narrowed is the claim that
# they have SETTLED, which nothing was making use of. world-cqoc.
assessed:
  reduction: sum
  quantities:
    # `build_surface_albedo.py --mode modelled` sums every non-grass column into
    # tree cover and C3G+C4G into grass cover, and mixes the two into the surface
    # albedo at different albedos, so the composition between them is visible to
    # it and the composition WITHIN each is not. The tree side is stated as an
    # exclusion for the same reason the consumer states it that way: a list of a
    # dozen tree codes silently misses a newly added one.
    - id: fpc.out tree cover
      table: fpc.out
      columns_excluding: [C3G, C4G, Total]
      relative_end_to_end_limit: 0.05
      read_by: [exoplasim/scripts/build_surface_albedo.py, biosphere/scripts/score_prediction.py]
      derivation: biosphere/scripts/derive_cover_tolerance.py, and it is the chain the tolerance below was derived through
    - id: fpc.out grass cover
      table: fpc.out
      columns: [C3G, C4G]
      relative_end_to_end_limit: 0.05
      read_by: [exoplasim/scripts/build_surface_albedo.py, biosphere/scripts/score_prediction.py]
      derivation: biosphere/scripts/derive_cover_tolerance.py, and it is the chain the tolerance below was derived through
    # `build_soil.py` reads the SoilC column for positive baseline iterations,
    # and it is loop B's exit quantity. Its physical chain IS priced: soil carbon
    # to organic mass fraction through the Adams mixing rule, to the volumetric
    # plant-available water capacity as an additive term beside texture and
    # allophane, to the climate model's dwmax, whose overflow is its runoff.
    # The gain along it is about a twentieth -- a relative drift in soil carbon
    # moves the capacity by 0.034 to 0.065 of itself -- so the perturbation this
    # tolerance permits is two orders of magnitude below the capacity's OWN
    # declared bracket in pedology/config/pedogenesis.yaml. Nothing that route
    # can ask for is tighter than this number, and it would take a drift of over
    # five hundred per cent for it to reach that bracket.
    #
    # LOOP B'S EXIT CRITERION IS THE OTHER READER AND IT CANNOT PRICE THIS YET.
    # It differences the land-mean of this column between successive iterations
    # against `convergence.soil_carbon_relative_tolerance`, at unit gain. Two
    # things stop that setting the number. The tolerance it would be set from
    # carries no derivation of its own, so pricing this one against it would
    # launder one undeclared number into another and lengthen every future run
    # on that basis. And the criterion is a DIFFERENCE between two runs of the
    # same model under the same forcing and the same spin-up policy, whose
    # residual drifts are largely common and cancel from it at a gain nobody has
    # measured. world-cqoc holds both.
    - id: cpool.out soil carbon
      table: cpool.out
      columns: [SoilC]
      relative_end_to_end_limit: 0.05
      read_by: [pedology/scripts/build_soil.py]
      derivation: priced through the water-capacity chain, which cannot ask for tighter; loop B's own criterion is undeclared
    # `score_prediction.py` scores ten bands fixed in notes/productivity-prediction.md
    # before the model ran a Vesper gridcell, so their tolerance is pre-registered
    # rather than chosen here: a drift must not carry a value at a band's centre
    # out of the band, which is the band's half-width over its centre. The
    # tightest of the ten is 0.2727, set by line 3 (1.6 to 2.8) and line 5 (0.40
    # to 0.70); the loosest is 1.0. Reading the drift against the record MEAN
    # rather than against any point in the record would double it, and the
    # stricter reading is taken. Where a quantity has two readers it takes the
    # tighter, which is why the two fpc cover rows above carry the albedo chain's
    # number and these carry this one.
    - id: anpp.out total productivity
      table: anpp.out
      columns: [Total]
      relative_end_to_end_limit: 0.2727
      read_by: [biosphere/scripts/score_prediction.py]
      derivation: tightest half-width over centre of the ten pre-registered prediction bands
    - id: lai.out total leaf area
      table: lai.out
      columns: [Total]
      relative_end_to_end_limit: 0.2727
      read_by: [biosphere/scripts/score_prediction.py]
      derivation: tightest half-width over centre of the ten pre-registered prediction bands
    - id: fpc.out C4 grass cover
      table: fpc.out
      columns: [C4G]
      relative_end_to_end_limit: 0.2727
      read_by: [biosphere/scripts/score_prediction.py]
      derivation: tightest half-width over centre of the ten pre-registered prediction bands
    - id: fpc.out boreal needleleaf cover
      table: fpc.out
      columns: [BNE, BINE, BNS]
      relative_end_to_end_limit: 0.2727
      read_by: [biosphere/scripts/score_prediction.py]
      derivation: tightest half-width over centre of the ten pre-registered prediction bands
trend:
  # DERIVED through the consumer that closes a loop with it, and re-derivable:
  # `biosphere/scripts/derive_cover_tolerance.py --run <run>` takes the chain
  # from the artifacts that own each link and says whether this number still
  # agrees with it. Every link is measured. `build_surface_albedo.py --mode
  # modelled` mixes the simulated cover into the surface albedo over the cells
  # BOTH models own, that reaches the top of the modelled atmosphere through the
  # measured surface-to-planetary attenuation, and it reaches kelvin through
  # lib/sensitivity.py.
  #
  # THE BAR IS READ RATHER THAN CHOSEN. A drift in the simulated cover is a
  # second error term in the same kelvin as the climate arm's own residual
  # offset, so the share it may take of that is `OFFSET_TOLERANCE_K` over
  # `RESOLVING_FACTOR` from exoplasim/scripts/assess_convergence.py, both fixed
  # before they were applied to any assessment. Giving the biosphere term the
  # whole offset tolerance would be a two-term budget at one term's size; the
  # standard error of a climatology mean and a paired A/B's smallest resolvable
  # difference are what the arm can SEE, and a bias below the noise floor is a
  # far stricter demand than a bias that changes no verdict.
  #
  # WHAT THE CHAIN CANNOT DO IS CHOOSE FINER THAN A FACTOR OF TWO, which is what
  # its own bracket spans, so this number is retained where the derivation sits
  # inside that factor rather than moved onto a central value the chain cannot
  # distinguish from it. On the record on disk it does: the drift this tolerance
  # permits is worth less than a tenth of a kelvin and the derived limit is
  # inside the registered factor. The script prints both, and the note carries
  # the argument. world-mqzk.
  #
  # IT IS THE TIGHTEST OF THE ASSESSED QUANTITIES' OWN LIMITS AND NOT A SEPARATE
  # NUMBER: the reader refuses when it is not, so the two cannot drift apart. It
  # is what a spin-up has to leave below, because a spin-up precedes every
  # quantity and has to satisfy the most demanding of them.
  relative_end_to_end_limit: 0.05
  # DECISION at the conventional level, AND IT IS THE RATE THIS CONTRACT ACTUALLY
  # CONTROLS: the probability that a field whose true end-to-end drift is AT the
  # limit is nonetheless accepted. An acceptance gate asserts that a run has
  # settled, so this is its error to control; the rate at which a settled run is
  # refused is the instrument's COST and is reported per field rather than
  # declared, because it is what sizes the retained record.
  #
  # The run-level rate is the same number and needs no multiplicity correction.
  # A run passes only when every assessed quantity passes, so by the
  # intersection-union principle the probability of accepting a run in which any
  # field truly drifts at the limit is bounded by this per-field rate. Contract 2
  # declared 0.05 per field and measured 0.34 per run over 64 fields; expressing
  # 0.05 through its empirical null would have needed about 7100 retained cycles.
  maximum_false_acceptance_rate: 0.05
  # DERIVED, not declared: the global half is an upper confidence bound on each
  # field's end-to-end relative drift over the WHOLE retained record, and a field
  # passes when that bound is inside the limit. A record too short to resolve the
  # limit gives a wide bound and is refused by the test itself, so there is no
  # separate span guard in front of it and nothing to be self-referential.
  drift_bound_estimator: lib/lpj_output.py:drift_bound
  memory_estimator: lib/autocorrelation.py:integrated_time
  # DECLARED, and it governs the PER-CELL half alone. That half is still a slope
  # over `complete_forcing_cycles`, so 2.0 standard errors is a two-sided 0.081 at
  # 8 degrees of freedom under independent samples and less than that under the
  # memory these series carry. Its size is absorbed into the measured limit below
  # rather than derived from this number, which is why the number is a shape
  # parameter of that half and not its level. world-4hlw holds the analytic
  # replacement for the per-cell half.
  slope_standard_errors: 2.0
  # IRREDUCIBLE, and provably without consequence. It exists so a field that is
  # absent from a cell divides by a scale rather than by zero. The assessed tables
  # are written quantized at 1e-4 or coarser, so the smallest window mean any of
  # them can express over 10 cycles is 1e-5; every floor in (0, 1e-5) therefore
  # gives identical results on every table this contract reads, and the floor binds
  # only where the mean is exactly zero, where the drift is exactly zero too.
  absolute_scale_floor: 1.0e-12
  cell_fraction:
    # DERIVED, per field, from the run being judged -- there is no number here to
    # declare. Measured at fixed forcing, the share of occupied cells a field's own
    # test flags when nothing is drifting spans 0.001 for the slow soil pools to
    # 0.40 for the patch-driven grass and vegetation fields, so no single declared
    # fraction can be a limit for both. Each field's limit is instead the largest
    # share it reaches over the detrended windows of this run's own record before
    # the acceptance window.
    null_statistic: maximum_over_detrended_windows_of_this_run
    # A CEILING ON A DERIVED RATE, and not a setting. A stationary quantity
    # exceeds the largest of N detrended null windows with probability 1/(N+1),
    # so the per-field rate is the RECORD's and not a number anyone picks; this
    # is the level above which the reducer refuses the record for being too
    # short to measure its own null. Declared at the conventional level.
    #
    # THE RATE A RUN PAYS IS THE FAMILY RATE AND IT IS NOT WRITTEN HERE. This
    # half refuses a run when ANY assessed quantity exceeds, so a settled run
    # pays the union of those events, bounded by `Q/(N+1)` over the assessed
    # count Q whatever the dependence between them. That moves with the record
    # AND with the assessed set, so `lib/lpj_output.py` derives it per run and
    # puts it on the acceptance artifact as `family_false_refusal_bound`, beside
    # the independent value and the record that would bring the bound to this
    # ceiling. A family rate written down beside a list that gains a row is a
    # number that stops being true: the 0.34 that used to sit here was measured
    # over the 64 columns of the seven stability tables and outlived them.
    #
    # The error is in the REFUSING direction either way, so a pass through this
    # half is evidence and a refusal through it has to be read against its own
    # bound. world-4hlw holds the analytic replacement, which is what removes
    # the 1/(N+1) resolution limit rather than a longer record.
    per_field_false_refusal_rate: 0.05
uncertainty:
  temporal_statistic: sample_standard_deviation_over_annual_values
  seed_statistic: sample_standard_deviation_of_window_means_at_fixed_patch_count
  patch_statistic: range_of_seed_ensemble_means_across_patch_counts
  missing_ensemble_status: not_measured
