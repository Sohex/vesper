# Every Earth-derived constant the replacement fire model needs, with its
# disposition.
#
# Worldbuilding. Vesper is an invented planet and this file is about the fire
# operator of the vegetation model that simulates it. Nothing here concerns
# fire on Earth except as a SOURCE DOMAIN to state the distance from.
#
# WHAT THIS FILE IS. `biosphere/notes/fire-model-audit.md` finding 2 divides
# fire into three separable decisions -- how fires start, how starts become
# burned area, and how burned area changes vegetation and material pools -- and
# fire-5 and fire-6 both require the same thing of the port: every Earth fuel,
# humidity, duration, spread, fire-size, combustion and mortality coefficient
# EXPOSED AS A PRIOR OR A BRACKET rather than accepted as a Vesper fact. This
# is that exposure, written before the code that consumes it, because a
# constant is cheapest to dispose of while nothing yet reads it.
#
# WHAT THIS FILE IS NOT. It is not `biosphere/config/fire.yaml`, which is a
# different concern in the same area: that file declares where this project's
# source DEPARTS from mainline LPJ-GUESS and is keyed on divergences. This file
# is keyed on CONSTANTS, most of which are mainline behaviour nobody has
# diverged from yet. A constant that acquires a divergence gets an entry there
# and keeps its entry here; the two are joined by `id`.
#
# NOTHING HERE IS A VESPER CALIBRATION AND NOTHING HERE MAY BECOME ONE. Under
# CLAUDE.md's "No tuned values" the disposition space is exactly four -- source
# it, derive it, declare it with a bracket that gets swept, or record it as
# irreducible with the argument -- and `disposition` on every entry below is
# one of those four. A value moves when its SOURCE moves. It does not move
# because a simulated burned area came out high.
#
# THE DEFECT CLASSES ARE THE PROJECT'S THREE and are not synonyms. `tuned` is a
# number that IS the residual of a fit; `opaque` is a derivation that exists
# somewhere a reader cannot reach; `implicit_earth` is a derivation that is
# sound and is for the WRONG PLANET. Three defects, three repairs, and
# implicit-earth is a DIAGNOSIS rather than an endorsement: establishing that a
# constant is Earth's is what proves it wrong here.
#
# HOW A VALUE WILL REACH THE MODEL, which is declared now because the answer
# shapes what may be written down. LPJ-GUESS compiles its constants in and
# reads none of this file, so a number here reaches the run by one of two
# routes and never by a third: through the generated instruction file, which is
# `biosphere/scripts/build_vesper_pfts.py`'s door for anything per-PFT; or as a
# literal in the compiled source UNDER A CHECK THAT THE RESTATEMENT AGREES,
# which is the arrangement `lib/snow.py` already runs for the two material
# relations of the modelled snow. `route` on each entry says which. A value
# with neither route is frozen in CLAUDE.md's sense -- written down, re-derived
# by nothing -- and `route: none` is therefore a defect and not a state.
#
# `biosphere/scripts/fire_parameter_gate.py` reads this file. The argument is
# `biosphere/notes/fire-model-audit.md`; `notes/audits/tuned-values.md` section
# 18 carries the dormant-knob half and is not restated here.

schema_version: 1

# COVERAGE, stated positively so a reader knows what the absence of an entry
# means. This register covers the constants of the three source models the
# audit selected -- GlobFIRM as the operator now live, BLAZE as the retained
# effects layer, and the Li (2012) and INFERNO occurrence forms the port takes
# -- PLUS the ignition priors, and only where the value was read in the source
# or in the paper rather than inferred from a description of it. SPITFIRE's
# Rothermel/Albini spread block and its four dead-fuel classes are deliberately
# out of scope: the audit defers that complexity unless the reduced form proves
# inadequate, and registering constants for a model this project has not chosen
# would be a list nothing can sweep. `unregistered_by_design` names what was
# looked at and left out, so an empty space in this file is a decision.
unregistered_by_design:
  - what: SPITFIRE fuel-class, Rothermel spread and Albini flame-geometry constants
    why: >
      biosphere/notes/fire-model-audit.md finding 2 defers SPITFIRE unless the
      reduced-complexity form proves inadequate. fire-5 is the row that would
      reopen it, and reopening it is what puts these here.
  - what: SIMFIRE's frequency-relation coefficients and its burned-area seasonality
    why: >
      fire-4 removes the SIMFIRE path rather than porting it, so its
      coefficients have no consumer to be a prior for. Finding 1 is the
      argument: the Earth satellite burned-area climatology and the HYDE
      population history are inputs this world does not have and must not be
      given an invented substitute for.
  - what: anthropogenic ignition and suppression coefficients in every source model
    why: >
      Absent for Vesper rather than set to zero. Finding 4. A population term
      set to zero still carries the Earth calibration around it, which is
      finding 1's whole point.

# THE FOUR DISPOSITIONS, named here so an entry can be read without CLAUDE.md
# open. A fifth is not available.
dispositions:
  sourced: >
    A primary source states the value for a domain this world is inside, and
    the citation reaches a reader.
  derived: >
    The value follows from something this project already declares -- the
    planet, the star, a measured artifact -- by arithmetic written down.
  bracketed: >
    The value cannot be pinned, so an interval is declared and SWEPT, and the
    result is reported as a spread rather than as a number. `bracket` carries
    the interval and `central` the value inside it that a single run takes.
  irreducible: >
    No derivation is reachable and the constant is kept anyway, with the
    argument for keeping it and for the form of the error it leaves.

defect_classes:
  tuned: the number IS the residual of a fit
  opaque: the derivation exists somewhere a reader cannot reach
  implicit_earth: the derivation is sound and is for the WRONG PLANET
  none: no defect; the entry records a constant that carries to this world

# THE CONSTANTS, keyed by id rather than listed, because a bracket inside a
# LIST contributes no path component to `smoke_test.py`'s discovery pass and
# every entry's bracket would collapse onto one path it could not dig into. A
# mapping gives each bracket a path, which is what lets the tree-wide check do
# the arithmetic -- central inside its own interval, ends the right way round --
# instead of this component reimplementing it.
#
# `seam` is the audit's three-way division plus the C-N-P destinations that
# cut across all of them. `route` is how the value reaches a run:
#   instruction_file  through biosphere/generated/vesper_pfts.ins
#   compiled_literal  a literal in the compiled source, under a restatement check
#   none              nothing reads it; a defect, not a state
# `source_file` and `literal` are what the gate holds the claim to: a value
# attributed to a line has to still be on it.
parameters:

  # ---------------------------------------------------------------- ignition
  cloud_to_ground_fraction:
    seam: ignition
    what: >
      Share of total lightning flashes that reach the ground. Not a fire start
      and not a flash rate: audit finding 4 is that all-flash rate,
      cloud-to-ground flashes and successful starts are three quantities, and
      collapsing any two of them is how a lightning field becomes an ignition
      count without an argument.
    unit: dimensionless
    central: 0.20
    bracket: [0.1366, 0.3333]
    disposition: bracketed
    defect: implicit_earth
    route: none
    consumed_by: fire-3
    source: >
      Thonicke et al. (2010) SPITFIRE section 2.2 takes 0.20 from Latham and
      Williams (2001). The bracket is the SAME QUANTITY from an independent
      Earth source with a different functional form: Li, Zeng and Levis (2012)
      Eqn 4 carries Prentice and Mackerras (1977) as
      psi = 1/(5.16 + 2.16*cos(3*lambda)), whose range over latitude is
      0.1366 at the equator to 0.3333 at 60 degrees. SPITFIRE's single number
      sits inside it, which is why the bracket is the two sources and not an
      invented interval around one of them.
    why_this_disposition: >
      Both sources are Earth's atmosphere and Earth's storm electrification,
      and neither derives the fraction from anything this project can restate
      for a different planet. The Li form additionally makes the fraction a
      function of LATITUDE, which under bio-29's latitude-use contract is a
      regime selector rather than a physical argument, so its curve is used
      here to bound the number and NOT as a form to port.

  lightning_ignition_efficiency:
    seam: ignition
    what: >
      Share of cloud-to-ground flashes that start a fire, under conditions
      already favourable for burning. It multiplies the flammability term
      rather than replacing it.
    unit: dimensionless
    central: 0.04
    bracket: [0.02, 0.10]
    disposition: bracketed
    defect: implicit_earth
    route: none
    consumed_by: fire-3
    source: >
      Thonicke et al. (2010) section 2.2, from Latham and Williams (2001) and
      Latham and Schlieter (1989): 0.04 under favourable conditions. INFERNO
      (Mangeon et al. 2016) takes the opposite end of the same question and
      assumes every ground strike ignites, which is efficiency 1.0 with the
      wet-lightning filter doing all the work instead.
    why_this_disposition: >
      The bracket is a HALF-DECADE either side of the one Earth measurement,
      declared as a sweep width rather than measured, because no second
      estimate of this quantity was found and a bracket has to be wide enough
      to contain the answer rather than tight enough to look settled. The
      structural alternative -- INFERNO's efficiency of 1 with suppression
      moved into flammability -- is not inside this bracket and is not meant to
      be: it is a different MODEL FORM and belongs in fire-9's comparison, not
      in this interval.
    control_that_must_fire: >
      A sweep over this bracket that moves burned area by less than the
      seed/patch ensemble spread has not tested the parameter, it has tested
      the instrument. lib/lpj_output.py carries the ensemble uncertainty
      report the comparison is against.

  # ------------------------------------------------------- occurrence to area
  fuel_threshold_lower:
    seam: occurrence_to_area
    what: >
      Aboveground fuel below which fire does not occur at all. GlobFIRM, which
      is the operator this project runs today, uses one threshold for both
      ends; the reduced-complexity forms separate them.
    unit: gC m-2
    central: 200.0
    bracket: [155.0, 200.0]
    disposition: bracketed
    defect: tuned
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/vegdynam.cpp
    literal: "MINFUEL=0.2"
    consumed_by: fire-5
    source: >
      Thonicke et al. (2001) p.664 states that "a fuel load of less than
      approximately 200 g/m2 reduces fire spread to zero (Schultz, 1988)", and
      vegdynam.cpp declares it as MINFUEL=0.2 kgC/m2 while blaze.cpp restates
      it as MIN_FUEL=200. Arora and Boer (2005) CTEM-FIRE adopts 200 as its
      lower end, which Li et al. (2012) section 2.1.2 describes as arbitrary.
      Li's own 155 is the low end of the bracket.
      THE 200 IS NOT A FIT AND NOT A FIRE MEASUREMENT. Thonicke's reference
      list resolves Schultz (1988) to "Die Oekozonen der Erde: die Oekologische
      Gliederung der Geosphaere, Ulmer, Stuttgart" -- a German-language
      physical-geography TEXTBOOK on the Earth's ecozones. So a round number
      travelled out of a general ecology text into a DGVM and then into two
      more, which is why the entry says two models state it without arguing
      for it. world-4xez holds the page this still needs.
    why_this_disposition: >
      Li's 155 is TUNED in the strict sense and the paper says so in its own
      words, while the 200 it is bracketed against is OPAQUE -- a chain with a
      reachable next link nobody has followed. Two different defects at the two
      ends is exactly why this is an interval and not a choice between them: 155 and 1050 "are estimated by maximizing the correlation between
      observed and simulated fire counts at 24 grid cells in the United
      States". A number that IS the residual of a fit against 24 Earth cells
      is not a Vesper fact, and neither is a round 200 that two other models
      state without arguing for. The bracket spans the disagreement so a sweep
      reports what the choice is worth instead of one arm inheriting it.

  fuel_threshold_upper:
    seam: occurrence_to_area
    what: >
      Aboveground fuel above which fuel stops constraining occurrence, so that
      the fuel term saturates instead of growing without limit.
    unit: gC m-2
    central: 1050.0
    bracket: [1000.0, 1050.0]
    disposition: bracketed
    defect: tuned
    route: none
    consumed_by: fire-5
    source: >
      Li et al. (2012) section 2.1.2, Bup = 1050 gC/m2, against Arora and Boer
      (2005) CTEM-FIRE's 1000. GlobFIRM has no upper threshold: it sets
      Blow = Bup = 200, which is the structural difference the port introduces
      rather than a value it changes.
    why_this_disposition: >
      The same 24-United-States-gridcell fit as fuel_threshold_lower, against
      one round number adopted without an argument. The interval is narrow
      because the two sources nearly agree, and a narrow bracket over two
      Earth fits is a statement about the SOURCES agreeing and not about this
      world.

  relative_humidity_lower:
    seam: occurrence_to_area
    what: >
      Relative humidity at or below which humidity stops constraining fire
      occurrence and spread.
    unit: per cent
    central: 30.0
    bracket: [20.0, 40.0]
    disposition: bracketed
    defect: implicit_earth
    route: none
    consumed_by: fire-5
    source: >
      Li et al. (2012) section 2.1.3, citing Zhou and Lu (2009): fires will not
      occur or spread at RH at or above 70 per cent, and humidity is no longer
      a constraint at or below 30 per cent.
    why_this_disposition: >
      The pair is an empirical Earth observation about fuel-air moisture
      exchange at Earth's surface pressure and Earth's atmospheric
      composition. Vesper's surface pressure is declared in
      config/planet.yaml and is not Earth's, and relative humidity is a ratio
      against a saturation vapour pressure that depends on temperature rather
      than on pressure, so the THRESHOLD does not carry even though the
      variable does. The bracket is 10 points either side, declared as a sweep
      width; it is not a measurement.

  relative_humidity_upper:
    seam: occurrence_to_area
    what: >
      Relative humidity at or above which fire neither occurs nor spreads.
    unit: per cent
    central: 70.0
    bracket: [60.0, 80.0]
    disposition: bracketed
    defect: implicit_earth
    route: none
    consumed_by: fire-5
    source: >
      Li et al. (2012) section 2.1.3, citing Zhou and Lu (2009). The companion
      of relative_humidity_lower and swept with it rather than independently:
      the two are one observation reported as an interval, and a sweep that
      crossed them would be reporting a humidity band that runs backwards.
    why_this_disposition: >
      As relative_humidity_lower. The ordering constraint is the gate's, not
      the bracket's: fire_parameter_gate.py refuses a sweep arm where lower
      exceeds upper.

  soil_wetness_extinction:
    seam: occurrence_to_area
    what: >
      Surface soil wetness, as volumetric moisture relative to saturation, at
      which the soil-moisture constraint on occurrence is more than 95 per
      cent complete.
    unit: dimensionless
    central: 0.69
    bracket: [0.50, 0.85]
    disposition: bracketed
    defect: tuned
    route: none
    consumed_by: fire-5
    source: >
      Li et al. (2012) section 2.1.3 and Appendix A: theta_e = 0.69, derived
      from the MODIS Active Fire Count product over a sample of 37 677
      gridcell-months.
    why_this_disposition: >
      A number read off an Earth satellite fire record against an Earth
      reanalysis soil moisture. It is a fit residual by construction and there
      is no second estimate, so the disposition is a declared sweep. The
      bracket is wide because the quantity is a soil property crossed with a
      fire-detection threshold, and neither half transports.

  average_fire_duration:
    seam: occurrence_to_area
    what: >
      How long one fire is taken to burn before it stops, which with the
      spread rate is what sets area per fire. It is the seam's whole
      time-dependence.
    unit: hours
    central: 30.0
    bracket: [15.0, 60.0]
    disposition: bracketed
    defect: implicit_earth
    route: none
    consumed_by: fire-5
    source: >
      Li et al. (2012) section 2.2.3 takes average fire duration as 1 day, and
      says why in its own words: there is no global grid data on barriers to
      fire spread or on suppression, so 1 day is adopted as the value at which
      Arora and Boer (2005) set extinguishing probability to 0.5, and as the
      expectation of the stochastic duration in Venevsky et al. (2002).
    why_this_disposition: >
      THE EARTH NUMBER IS NOT 1, IT IS 24 HOURS, and that is the whole entry.
      "One day" is a diurnal cycle, and what makes a fire stop overnight is the
      return of humidity and the fall of temperature after dark -- so the
      quantity is anchored to the planet's ROTATION and not to a count.
      config/planet.yaml declares rotation_hours 30.0, so the constant carried
      across as a numeral is 24 hours where the mechanism says about 30: a 25
      per cent error in the duration and, through a spread rate multiplied by
      it, in area per fire. This is the same class of defect as the GlobFIRM
      burn-probability floor that biosphere/config/fire.yaml records, found the
      same way, and it is why `unit` here is HOURS rather than days.
      `central` is the declared rotation period. Whether that declaration is
      the SIDEREAL period or the SOLAR day is not settled in the tree -- two
      consumers read it as each -- and the difference is 0.689 per cent, which
      is world-8bho's to resolve and is four hundred times smaller than this
      bracket. The bracket is half to two rotations, which is the spread the
      Earth sources themselves disagree over, not a confidence interval.
    control_that_must_fire: >
      A port that reproduces Li's number rather than Li's mechanism will write
      24. The gate holds `central` to one solar day computed from
      config/planet.yaml rather than to a literal, so a planet whose day
      changes moves the constant and a hardcoded 24 fails.

  fire_spread_calm_ratio:
    seam: occurrence_to_area
    what: >
      Ratio of the fire spread rate in still air to the average maximum spread
      rate; the g(0) of the wind-dependence function.
    unit: dimensionless
    central: 0.1
    bracket: [0.05, 0.2]
    disposition: bracketed
    defect: implicit_earth
    route: none
    consumed_by: fire-5
    source: >
      Arora and Boer (2005), JGR Biogeosciences 110 G02008, equation 12:
      g(Ws) = 1 - (1 - g0)*exp(-Ws^2/2500), "where g0 is value of g(Ws) at
      Ws = 0.0 km/h (assumed equal to 0.1) which governs fire growth rate in
      calm conditions". Li et al. (2012) section 2.2.2 reports the same
      assumption and then derives g(W) from its own elliptical geometry rather
      than adopting it.
    why_this_disposition: >
      NO LONGER OPAQUE: the chain is walked and Arora and Boer state g0 as an
      assumption in their own words, so the derivation is reachable and says
      there is nothing behind it. It is not tuned either -- no fit produced
      0.1, and the paper's only check on the wind dependence is against
      Vigilante et al. (2004) in the North Kimberley of northwest Australia,
      a 25 per cent observed increase in spread rate between 15 and 20 km/h
      against equation 12's 31 per cent. That single Earth check on a
      dimensionless ratio whose magnitude depends on the atmosphere the fire
      burns in is what makes it implicit_earth: this world's surface pressure
      and composition are declared in config/planet.yaml and are not Earth's.
      The bracket is a factor of two either way and is swept.

  average_fire_size_tree:
    seam: occurrence_to_area
    what: Fixed average burned area of one fire in tree-dominated vegetation.
    unit: km2
    central: 0.6
    bracket: [0.6, 1.4]
    disposition: bracketed
    defect: tuned
    route: none
    consumed_by: fire-5
    source: >
      Mangeon et al. (2016) INFERNO section 2.1.3: 0.6, 1.4 and 1.2 km2 for
      trees, grass and shrubs, so that grass and shrubs fuel larger fires than
      trees.
    why_this_disposition: >
      INFERNO fixes fire size per vegetation class instead of deriving it, and
      its own discussion says global fire size was mostly influenced by
      precipitation, aridity and human activity -- two of which this world has
      and one of which it does not. The bracket spans INFERNO's own three
      classes rather than an invented interval, which is the honest width: the
      paper demonstrates that the class assignment is worth that much, and a
      Vesper vegetation class does not map onto an Earth one.
    superseded_by: >
      This constant exists only for the arm that does NOT take the Li seam. Li
      et al. (2012) computes area per fire from spread rate and duration
      instead of fixing it, and audit finding 2 selects that seam. Kept as the
      declared alternative for fire-9's model-form comparison, where a fixed
      fire size is the reduced arm to compare the derived one against.

  # ----------------------------------------------------------------- effects
  pft_fire_resistance:
    seam: effects
    what: >
      The share of fire mortality each simulated plant type resists. It
      multiplies the burned fraction directly -- `mort_fire = fireprob *
      (1 - fireresist)` -- so it is a first-order control on what fire does to
      the vegetation, in the operator this project RUNS.
    unit: dimensionless
    central: {grass_and_polar: 0.5, mixed_woody: 0.3, fire_sensitive_woody: 0.1}
    disposition: irreducible
    defect: implicit_earth
    route: instruction_file
    source_file: biosphere/generated/vesper_pfts.ins
    literal: "fireresist"
    consumed_by: fire-6
    source: >
      Inherited verbatim from stock LPJ-GUESS `data/ins/global.ins`.
      `build_vesper_pfts.py` converts the parameters
      biosphere/notes/time-base-unit-contract.md classifies and passes
      everything else through, and this is correctly not converted -- it is a
      fraction and not a time quantity. Resolved through the group chain it is
      0.50 for C3G, C4G, VPE and VPP; 0.30 for BINE, BNE, BNS, TeBE, TeNE and
      TrBR; 0.10 for IBS, TeBS, TrBE and TrIBE. One source appears anywhere
      near it: a comment on the 0.30 line noting that Hickler et al. (2012)
      have 0.2 for one species and 0.4 for another.
    why_this_disposition: >
      Irreducible rather than bracketed, and the distinction is the point. A
      bracket implies a sweep, and what would be swept is fourteen numbers
      whose only stated source brackets ONE of them, for two Mediterranean
      species, on a parameter that is a per-plant-type Earth calibration
      throughout. Sweeping the other thirteen against an interval taken from
      that comment would be inventing thirteen brackets from one measurement.
      The repair is not an interval: it is that fire resistance should follow
      from something this world's plant types HAVE -- bark thickness, canopy
      height, tissue moisture -- which is fire-6's work and depends on grav-7,
      whose Earth-fixed height-diameter coefficient the same types carry.
    do_not: >
      Do not tune these to move a simulated burned area or a vegetation
      composition. They are the most directly available knob on what fire does
      and the least defensible one to turn.

  pft_moisture_of_extinction:
    seam: occurrence_to_area
    what: >
      Each plant type's litter moisture of extinction, weighted by litter mass
      into the patch mean the GLOBFIRM occurrence term reads. Higher means the
      litter carries fire at a higher soil moisture.
    unit: dimensionless
    central: {grass_and_polar: 0.2, woody: 0.3}
    disposition: irreducible
    defect: implicit_earth
    route: instruction_file
    source_file: biosphere/generated/vesper_pfts.ins
    literal: "litterme"
    consumed_by: fire-5
    source: >
      Inherited verbatim from stock `global.ins`, and through it from Thonicke
      et al. (2001), whose 30 and 20 per cent moistures of extinction are among
      the numbers that paper fits to observed area burnt in Portugal, southern
      California and Kakadu National Park. 0.20 for C3G, C4G, VPE and VPP;
      0.30 for the ten woody types.
    why_this_disposition: >
      The same argument as `pft_fire_resistance`: two numbers over fourteen
      plant types, fitted on three Earth fire regimes, with no derivation that
      transports. It enters the operator as a litter-mass-weighted patch mean,
      so a type's value matters in proportion to how much litter it holds --
      which is why the polar types' inheritance below is not a rounding.
    inherited_without_a_decision: >
      VPE AND VPP TOOK EARTH C3 GRASS'S FIRE BEHAVIOUR BY DEFAULT. They are the
      only plant types this project DERIVED rather than inherited, and they
      declare neither `fireresist` nor `litterme`:
      `biosphere/config/native_pfts.yaml` sets `inherits: C3G` and lists only
      what changes, so both fire parameters arrive as C3G's without appearing
      in that list. The mechanism is deliberate and the CHOICE was never made.
      world-ykhg.

  globfirm_burned_fraction_curve:
    seam: effects
    what: >
      The four coefficients of the denominator of Thonicke et al. (2001) Eqn 8,
      which turns the annual mean daily fire probability into the annual
      burned fraction. This is the curve the project KEEPS: it is the operator
      that runs today.
    unit: dimensionless
    central: [0.45, 2.83, 2.96, 1.04]
    disposition: sourced
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/vegdynam.cpp
    literal: "0.45*sm*sm*sm+2.83*sm*sm+2.96*sm+1.04"
    consumed_by: fire-5
    source: >
      Thonicke, Venevsky, Sitch and Cramer (2001) Eqn 8, fitted by non-linear
      least-mean-square regression against observed area burnt in Portugal,
      southern California and Kakadu National Park.
    why_this_disposition: >
      A PUBLISHED FIT WITH AN INSPECTABLE DOMAIN IS NOT A TUNING, which is the
      distinction biosphere/config/fire.yaml already turns on: the provenance
      reaches a reader, the domain is stated, and the number was not chosen to
      make this project's output come out anywhere. It is nonetheless
      implicit-earth, and the diagnosis is not an endorsement -- three Earth
      fire regimes is the domain, and this world is outside it. The repair is
      not a different quartic; it is fire-9's model-form comparison, where the
      distance between this curve and the Li seam is the reported spread.
    do_not: >
      Do not refit these four numbers against a Vesper burned area. There is
      no observed burned area on this world to fit against, so a refit would
      be a fit to a desired result, which is the definition the no-tuned-values
      rule exists to refuse.

  globfirm_annual_burned_fraction:
    seam: occurrence_to_area
    what: >
      The TIME BASE of GLOBFIRM's burned fraction, as distinct from the four
      coefficients of the curve that produces it. Registered separately from
      `globfirm_burned_fraction_curve` because the curve is a published fit
      this project keeps and the time base is a defect it does not.
    unit: fraction burned per year
    central: null
    disposition: irreducible
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/vegdynam.cpp
    literal: "fireprob=s*exp(sm/"
    row: world-drim
    consumed_by: fire-5
    source: >
      Thonicke et al. (2001) Eqn 9 returns the ANNUAL fractional area burnt,
      fitted against observed annual area burnt on a world whose year is 365
      days. vegdynam.cpp:1431 applies it to a year of 183 absolute days, and
      vegdynam.cpp:1466 now converts the result.
    why_this_disposition: >
      `central` is null because the defect is not a NUMBER: the curve's four
      coefficients are right and stay, and what is wrong is the unit its output
      carries. The argument going in is fine and that is what hides it --
      s = n/year_length() is a mean daily probability and is scale-invariant,
      so the same fire climate gives the same s on a 183-day year as on a
      365-day one. The output is not scale-invariant, and the same fraction
      burned over 183 days instead of 365.2569 is 1.9959 times the burning per
      unit absolute time.
      The same file already knows the conversion: vegdynam.cpp:1004-1005 applies
      1-pow(1-r, VESPER_EARTH_YEARS_PER_ORBIT) to the growth-efficiency
      mortality, and `distinterval` reaches the model as 199.594 against an
      Earth calibration of 100. The comment at :1459, written for the deleted
      burn-probability floor, names distinterval as the same class of quantity
      and converted for exactly this reason. The floor was diagnosed on that
      argument and deleted; the curve's own output, two lines above the
      comment, has the identical property.
    do_not: >
      Do not rescale Thonicke's four coefficients. They are a published fit
      with a stated Earth domain and they are not what is wrong; converting
      the output is, and the constant to convert it with is already imported
      in that file.

  fireline_intensity_heat_yield:
    seam: effects
    what: Energy released per unit mass of fuel burned.
    unit: MJ kg-1
    central: 20.0
    bracket: [16.0, 22.0]
    disposition: bracketed
    defect: none
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "HEAT_YIELD = 20."
    consumed_by: fire-6
    source: >
      blaze.cpp:225 cites Liedloff (2007) for 20 MJ/kg.
    why_this_disposition: >
      THIS ONE CARRIES AND THE DEFECT IS none, which is worth saying because
      most of this file's entries do not. Heat yield is a property of the
      CHEMISTRY of dried plant tissue -- the enthalpy of combustion of
      cellulose, lignin and their ash fraction -- and that chemistry is what
      the biosphere model simulates on this world too. What varies is
      composition and ash content, not the planet, so the bracket is the
      ordinary range of dry plant material rather than a statement about
      Vesper. It is bracketed rather than sourced only because Liedloff (2007)
      is not held in references/ and the single number has no stated spread.
    chain_walked_to: >
      Liedloff and Cook (2007), Ecological Modelling 201:269-282, section 2.8:
      the Byram fire-line intensity is the product of "the heat yield of the
      fuel (H: ASSUMED TO BE 20 MJ kg-1)", the fine fuel load and the rate of
      spread. So the citation terminates in an author's stated assumption and
      not in a measurement, which is the same shape as the GLOBFIRM floor and
      is why the bracket stays. What it no longer rests on is the source being
      unread. The bracket rests instead on the enthalpy of combustion of dry
      plant tissue, which is a chemistry this world's biosphere shares.
      blaze.cpp also applies H to a fuel that includes coarse woody debris,
      where Liedloff applies it to FINE fuel only.

  fireline_intensity_spread_coefficient:
    seam: effects
    what: >
      The constant of proportionality turning the McArthur forest fire danger
      index times available fuel into a rate of spread. It is not empirical: it
      is a folded unit conversion, and the conversion is wrong by a decade.
    unit: m s-1 per index-unit per g m-2
    central: 3.333333e-06
    disposition: sourced
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "NOBLE_ROS_KMH_PER_TONNE_HA / G_M2_PER_TONNE_HA / KMH_PER_M_S"
    derived_from: "0.0012 / 100.0 / 3.6"
    row: world-c15e
    consumed_by: fire-6
    source: >
      Noble, Gill and Bary (1980), Australian Journal of Ecology 5:201-203, the
      Mark 5 forest meter: R = 0.0012*F*W. Its Table 1 gives R in km/h, W in
      tonnes/ha and F dimensionless. blaze.cpp:1146 and :1151 compute F by
      Noble's own drought-factor and fire-danger equations verbatim, so F is on
      Noble's scale and nothing rescales between them.
    why_this_disposition: >
      SOURCED NOW, AND THE SOURCE IS WHAT CONVICTS THE IMPLEMENTED NUMBER. The
      entry was irreducible while the chain terminated at the comment
      "Empirical value"; Noble (1980) is held and the chain terminates in an
      equation. `central` is Noble's coefficient expressed in the units
      blaze.cpp uses -- 1 t/ha is 100 g/m2 and 1 km/h is 1/3.6 m/s, so
      0.0012/100/3.6 = 3.333333e-06 -- and `implemented_value` is what the
      source compiles. The ratio is ten, and the mantissa agreeing to five
      digits is what makes it a lost decimal rather than a different
      calibration: 1.2/3.6 is 0.33333, and 0.33333e-5 written as 3.3333e-05
      drops a decade.
      The defect is implicit_earth and not the decade: the decade is a bug with
      a row, while what stays wrong after it is fixed is that the index this
      scales was built for Australian eucalypt forest.
    repaired: >
      world-c15e is closed. blaze.cpp no longer declares a constant: it declares
      Noble's coefficient, the tonnes-per-hectare conversion and the km/h
      conversion as three named quantities and multiplies them, so the
      derivation is on the line rather than in this file. `implemented_value`
      is deleted, which is what stops the gate reporting the disagreement, and
      `literal` now names the expression rather than a number.
    control_that_must_fire: >
      `fire_parameter_gate.py` evaluates `derived_from` and compares it with
      `central`, so the arithmetic is redone on every run rather than trusted,
      and the restatement check holds the source to still carrying the
      expression. A future edit that replaced the three named factors with a
      corrected magic number would pass the arithmetic and fail the
      restatement, which is the intended asymmetry: the derivation has to stay
      visible in the source, not only be correct.

  keetch_byram_drought_index_domain:
    seam: effects
    what: >
      The drought index every McArthur fire-danger term is built on. Like
      `mcarthur_index_domain` this is a DOMAIN rather than a constant, and it
      is registered because the coefficients below it cannot be disposed of
      while the quantity they act on is the wrong one.
    unit: hundredths of an inch of soil moisture deficit
    central: 800.0
    disposition: sourced
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "800. - climate.kbdi"
    row: world-4iyz
    consumed_by: fire-6
    source: >
      Keetch and Byram (1968), implemented at blaze.cpp:1122-1140. The block
      is imperial throughout -- t*9./5.+32. converts to Fahrenheit, /25.4 to
      inches and *.254 back to millimetres -- and the ceiling of 800 is 800
      hundredths of an inch, which is 203.2 mm of soil moisture deficit.
    why_this_disposition: >
      `central` is the ceiling because that is the one number in the block
      with a physical meaning rather than a fitted one: it stands for the water
      capacity of a soil profile, and it is an EARTH soil profile. This
      project's pedology component derives this world's soil water capacity
      from its own build, so the index carries a soil assumption that
      contradicts an artifact the tree already produces.
      THE INDEX'S ARGUMENT IS ALSO THE WRONG QUANTITY, which is world-4iyz and
      is worse than the ceiling: the rainfall term is fed a 183-day model-year
      total against a coefficient fitted to Earth ANNUAL rainfall, and because
      the term is exponential the resulting bias depends on the climate --
      0.69 of the intended drought accumulation at 500 mm/yr, 0.53 at 1000 and
      0.46 at 1500. A bias that varies with the cell compresses the range of
      simulated fire weather and moves its spatial pattern, rather than
      scaling the field.
    do_not: >
      Do not rescale the 0.0441 coefficient to absorb the year-length error.
      That repairs the unit of one number inside a fitted index and leaves the
      index reading a quantity it was not fitted on; the conversion belongs at
      the point of read, where it can be seen.

  rainfall_averaging_span:
    seam: effects
    what: >
      How many years of past rainfall the drought index's running mean
      remembers.
    unit: model years
    central: 3.0
    bracket: [1.5, 3.0]
    disposition: bracketed
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "RAINFALL_AVERAGING_SPAN = 3"
    row: world-4iyz
    consumed_by: fire-6
    source: >
      blaze.cpp:92, uncited, used at :1175-1179 as a weighting on a running
      mean and compared against date.year, so it counts MODEL years.
    why_this_disposition: >
      Three model years is 1.5 Earth years of absolute time, and the question
      the bracket holds open is which of those the calibration meant. A
      memory length for a drought index is arguably a count of SEASONAL CYCLES,
      in which case three is right and carries unchanged; or it is a DURATION
      over which soil moisture anomalies persist, in which case three Earth
      years is 5.98 model years and the constant is a factor of two out. The
      bracket's ends are exactly those two readings -- 3.0 model years, and
      the 1.5 that three model years is worth in Earth years -- rather than a
      confidence interval, so a sweep reports what the ambiguity is worth
      instead of one arm inheriting it.
      Unlike `average_fire_duration` this one is NOT anchored to the planet,
      because the answer is not a rotation: it depends on which quantity the
      calibration was about, and no reading of config/planet.yaml settles that.

  mcarthur_drought_factor_limit:
    seam: effects
    what: >
      The ceiling on the McArthur drought factor before it enters the fire
      danger index. Registered because it is a published CORRECTION that this
      source implements and does not cite, which is the opposite of the usual
      finding in this file.
    unit: dimensionless
    central: 10.0
    disposition: sourced
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "min(10.0,mcarthur_d)"
    consumed_by: fire-6
    source: >
      Sirakoff (1985), Australian Journal of Ecology 10:481, a two-page
      correction to Noble, Gill and Bary (1980). McArthur (1973) sets the
      drought factor's upper limit to ten and Noble's equations carry no such
      limit, so the equations return a fire danger index that is too high
      whenever the drought factor exceeds it. Sirakoff's worked example: the
      unlimited Noble equations give D = 12.1 where the meter gives D = 10.
    why_this_disposition: >
      IT IS ALREADY RIGHT, and that is the entry. blaze.cpp:1148 applies
      max(0.0, min(10.0, mcarthur_d)) immediately before the index at :1081,
      which is exactly Sirakoff's repair, while the comment above it cites
      only "(Noble, 1980)" -- the paper that lacks the limit. So a reader
      checking the implementation against its stated source would find a
      constant the source does not contain and could remove it as unexplained.
      Registering it is what stops a correct line being deleted for looking
      wrong. The defect is implicit_earth for the same reason as
      `mcarthur_index_domain`: the ceiling is a property of an Australian
      meter's scale, and it travels with the index rather than apart from it.
    do_not: >
      Do not remove this clamp while the McArthur index remains. It is not a
      guard someone added against a numerical excursion; it is part of the
      published definition of the quantity, and Noble's equations are the
      approximation that omits it.

  mcarthur_index_domain:
    seam: effects
    what: >
      Not a constant but the DOMAIN of the index every BLAZE spread rate is
      proportional to, registered here because a coefficient's disposition is
      meaningless while the quantity it scales is out of domain.
    unit: dimensionless
    central: null
    disposition: irreducible
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "climate.mcarthur_forest_fire_index"
    consumed_by: fire-6
    source: >
      The McArthur Forest Fire Danger Index was constructed for Australian
      eucalypt forest. Mangeon et al. (2016) section 4 evaluates it against
      three other fire indices inside a global Earth model and reports that it
      "performs poorly at high latitudes (it was made for Australia)".
    why_this_disposition: >
      A published Earth evaluation says this index does not transport across
      Earth's own latitudes, which is a stronger statement against it than any
      single coefficient in this file carries. It is registered rather than
      repaired because repairing it means choosing a different fire-danger
      index, and that is a MODEL-FORM decision belonging to fire-9's
      comparison rather than a value this register can dispose of. What the
      entry buys is that a reader arming BLAZE meets the finding at the
      parameter rather than in a paper.

  tropical_survival_diameter_form:
    seam: effects
    what: >
      The diameter dependence of tropical broadleaf survival at 3000 kW/m,
      mortality = max(0.82 - 0.035*DBH_cm^0.7, 0). A DECLARED MODEL FORM and
      not a sourced relation, which is the whole entry: the paper it is
      attributed to contains no such equation.
    unit: dimensionless
    central: {ceiling: 0.82, coefficient: 0.035, exponent: 0.7}
    disposition: irreducible
    defect: tuned
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "0.82 - 0.035 * pow(diameter_at_breast_height,0.7)"
    row: world-g2e0
    consumed_by: fire-6
    source: >
      Attributed to van Nieuwstadt and Sheil (2005), which is held and read.
      That paper contains none of 0.82, 0.035 or the 0.7 exponent. What it
      reports is fire mortality by 10-cm diameter class in burned East
      Kalimantan plots, in a FIGURE rather than a table, so the fit cannot be
      recovered and refitted.
    why_this_disposition: >
      TUNED BY CONSTRUCTION AND NOT RECOVERABLE. The coefficients are the
      residual of a fit to a figure, and the fit is not written down anywhere:
      which points, what was minimised, what residual it left. A comment that
      reads as a citation to an equation, for a paper with no equation in it,
      is how a fitted coefficient passes for a sourced one.
      It is irreducible rather than bracketed because a bracket implies a
      sweep, and sweeping three coefficients of a form that MISSES ITS SOURCE'S
      HEADLINE RESULT would be pricing the wrong thing.
    disagrees_with_its_source: >
      The paper states two anchors in prose that need no digitising: on burned
      plots, mortality was above 80 per cent below 10 cm d.b.h. and approached
      100 per cent below 5 cm. This form gives 64.5 per cent at 10 cm and 71.2
      per cent at 5 cm, and its CEILING is 82 per cent as diameter goes to
      zero -- so it cannot reach the small-stem anchor at any diameter, whatever
      the diameter term does. Between 3000 and 7000 kW/m the function returns
      survival_3000 exactly, so the gap is intensity-independent there, and
      below 3000 it moves toward survival 1 and widens.
      THE CAVEAT IS REAL AND DOES NOT CLOSE IT. Those percentages are
      cumulative over 21 months and include the 1997-98 drought, not fire
      alone, so fire-attributable mortality is lower. Unburned cumulative
      mortality in that paper's Table 1 runs to about 22 per cent above 10 cm,
      so netting it out still leaves the small-stem figure near the top of the
      range, above a ceiling of 0.82.
    do_not: >
      Do not adjust 0.82 upward to meet the anchor. That would be fitting a
      Vesper coefficient to one Earth fire in Borneo, which is the tuning this
      register exists to refuse. The repair is to decide the form, with FIRE-6,
      against what this world's plant types have.

  savanna_survival_escape_height_form:
    seam: effects
    what: >
      The height-and-intensity form for savanna survival,
      1 - 1/(1 + exp(1.5*(height - 0.5*I_MW - 1))). A declared model form, for
      the same reason as the entry above.
    unit: dimensionless
    central: {slope: 1.5, height_per_MW: 0.5, base_escape_height_m: 1.0}
    disposition: irreducible
    defect: tuned
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "exp(1.5*(height - 0.5 * intensity - 1. ))"
    row: world-g2e0
    consumed_by: fire-6
    source: >
      Attributed to Bond (2008), which is held and read. That paper states no
      equation: it gives a FIGURE of topkill probability against stem height
      and fire intensity for an African savanna tree, whose caption puts escape
      height at "2-4 m in this example".
    why_this_disposition: >
      The same class as the tropical form -- a fit to a figure, undocumented as
      a fit -- and it agrees with its source rather than disagreeing. The
      implied escape height, where survival passes one half, is 1 + 0.5*I in
      MW/m: 1 m with no fire, 2 m at 2 MW/m and 4 m at 6 MW/m, which brackets
      Bond's stated 2 to 4. Right shape, right order, and no record that a fit
      produced it.
    note: >
      The function returns 0.182 for a zero-height plant at zero intensity,
      because height dominates the logit and intensity only shifts it. It is
      only ever called for a patch that burns, so a zero-intensity evaluation
      does not arise; recorded because the form does not reduce to survival 1
      as fire vanishes, which a reader would reasonably expect it to.

  tree_survival_parameterisation:
    seam: effects
    what: >
      WHICH survival curve a burning tree is judged by, as distinct from the
      coefficients inside any one of them. Four Earth region-specific
      parameterisations selected by absolute latitude and by the SIMFIRE biome
      label. Registered because a coefficient's disposition means nothing while
      the curve it belongs to is chosen by where the gridcell is.
    unit: dimensionless
    central: null
    disposition: irreducible
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "if ( fabs(lat) < 50.)"
    row: bio-29
    consumed_by: fire-6
    source: >
      blaze.cpp's survival_probability_indiv(). Four curves: Dalziel et al.
      (2008) for boreal, Kobziar (2006) for temperate needleleaf, Hickler et
      al. (2004) for temperate broadleaf, and Cook (2005) for savanna
      resprouters. In the COHORT branch this project runs, a needleleaf
      individual takes the temperate curve at absolute latitude below 50 and
      the boreal one at or above it, and a broadleaf individual takes the
      tropical curve between 30 south and 30 north and the temperate one
      outside that, after a first split on `gridcell.simfire_biome`.
    why_this_disposition: >
      `central` is null because the defect is not a NUMBER: it is that a
      simulated tree's chance of surviving a fire is decided by its latitude
      rather than by anything it has. This world's obliquity is 32 degrees and
      its orbit is 183 days, so the climate bands those thresholds stand in for
      do not sit where they sit on Earth, and a needleleaf individual at 50
      degrees here is not the boreal tree the curve was fitted to. The model
      already carries the traits the choice should turn on -- the curves
      themselves read diameter at breast height, height and coarse woody debris
      -- so the latitude branch is standing in for a thermal regime the model
      can measure directly.
      It is also entangled: the broadleaf branch reads `simfire_biome`, which
      only SIMFIRE's accounting writes, so this selection is one of the two
      things tying BLAZE to the archive that fire-4 removes.
    fallback_is_silent: >
      An unrecognised biome takes the else branch, prints "Biome %d not found
      in BLAZE" with dprintf and returns survival probability 1.0 -- no tree
      dies. A diagnostic on stdout is not a refusal, and the failure it reports
      is a fire that burns and kills nothing.
    do_not: >
      Do not replace the latitude thresholds with different latitude
      thresholds fitted to this world. bio-29's contract is that latitude is
      not a regime selector, and a Vesper-tuned band would satisfy the letter
      of the repair while keeping the thing that is wrong.

  survival_probability_boreal_scale:
    seam: effects
    what: >
      The fire-line intensity at which the modelled survival probability of a
