  woody_structural_fractions:
    seam: effects
    what: >
      The shares of a woody individual's live biomass treated as branch and as
      bark when its pools are apportioned between combustion and litter.
    unit: dimensionless
    central: {branch: 0.05, bark: 0.01}
    disposition: irreducible
    defect: implicit_earth
    route: compiled_literal
