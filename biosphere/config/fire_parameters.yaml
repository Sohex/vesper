      every pool, selected by a fire-line-intensity class. Registered as ONE
      entry because the table's columns and the index that selects them are
      one contract, and both ends of it are broken.
    unit: dimensionless
    central: null
    disposition: irreducible
    defect: tuned
    route: compiled_literal
    source_file: vendor/lpj-guess/modules/blaze.cpp
    literal: "TURNOVERFRACT[13][5]"
    row: world-sgtx
    consumed_by: fire-6
    source: >
      blaze.cpp:56-69, under the header comment
      "combustion rates depending on fire-line-intensities [kW/m]
      <750|<3000|<7000| >=7000 (Sprouters|Seeders)". Sixty-five numbers and no
      citation for any of them. The intensity class bounds 750, 3000 and 7000
      kW/m are at :158-164, and again at :293 and :325.
    why_this_disposition: >
      `central` is null and the disposition is irreducible because there is
      nothing to dispose OF yet: no source is named for any of the sixty-five
      values, so each would be its own opaque chain with no next link, and
      bracketing a table nobody can sweep in sixty-five dimensions would be a
      declaration with no consequence. What this entry carries instead is that
      the table is BROKEN AT BOTH ENDS AS A LOOKUP, which has to be settled
      before its values are worth arguing about.
      Low end: the index producer returns -1 for a patch below MIN_FUEL and
      nothing guards the lookup, so [0][-1] reads outside the array and
      [r][-1] aliases [r-1][4] -- the most intense column of the row above.
      A patch with too little fuel to carry a fire combusts all of its surface
      litter. High end: the index never returns 3, so the sprouter column at
      >=7000 kW/m is unreachable and every intense fire takes the seeder
      rates, which differ by a factor of four for stems and branches.
    do_not: >
      Do not source or bracket individual cells of this table while the index
      is wrong. The values selected today are not the values the table says
      are selected, so a disposition attached to a cell would describe a
      number the model does not use.

  earth_radius_in_gridcell_area:
    seam: effects
    what: >
      Earth's mean radius, 6371.2213 km, used to convert a latitude-longitude
      cell into an area in square kilometres inside the fire effects layer.
    unit: km
    central: 6371.2213
    disposition: sourced
    defect: implicit_earth
    route: none
    source_file: vendor/lpj-guess/framework/guessmath.h
    absent_from_source: "R_EARTH"
    consumed_by: fire-6
    source: >
      guessmath.h:61 declared it, commented "mean earth-radius[km]", and
      blaze.cpp's pixelsize() was its only consumer. Both are deleted; that
      line now carries the record of the deletion.
    why_this_disposition: >
      DEAD TODAY AND LIVE ON ACTIVATION, which is the only reason it is in a
      register rather than in an audit. pixelsize() has no callers anywhere in
      vendor/lpj-guess, so nothing computes a gridcell area from Earth's radius
      in any run this project has made. It is registered because fire-6 is the
      row that arms this layer, and burned AREA is what the function returns:
      the error is second order in the radius, and config/planet.yaml declares
      a super-Earth whose radius is not 6371 km, so a fire model that started
      reporting area would report it against the wrong planet with nothing
      objecting. It is absent from notes/audits/tuned-values.md and from
      world-4j27's list of dormant knobs, both of which enumerate blaze.cpp,
      so it is a new finding rather than a restatement of one.
    repair: >
      DONE, by deletion. world-pqk7 is closed. `pixelsize()` had no callers
      anywhere in the vendored tree and was the only consumer of `R_EARTH`, so
      both are gone and no number moved. Deleting was preferred over converting
      because fire-5's area per fire comes from a spread rate times a duration
      rather than from a cell's size, so nothing the port needs calls for it.
      If a gridcell area is wanted later it reaches the model the way every
      other planet constant does, through the header build_vesper_header.py
      generates; lib/nc_geometry.py owns the one expression turning
      config/planet.yaml's radius into metres, and world-gnvz routed the Python
      tree's Earth radii through it.
      The entry is KEPT rather than removed, with `route: none` and
      `absent_from_source` in place of `literal`, because a register that
      forgets a deleted constant cannot notice it coming back.
    row: world-pqk7
    do_not_defer_silently: >
      Registered as a row rather than left here: the entry is a finding, and
      what to do about it is tracked apart from it.

  fire_nitrogen_emission_ratios:
    seam: cnp_destinations
    what: >
      How nitrogen volatilised by fire is split between ammonia, nitrogen
      oxides, nitrous oxide and dinitrogen. The four shares sum to exactly 1,
      so this is a partition of the flux and not a set of yields.
    unit: dimensionless
    central: {NH3: 0.005, NOx: 0.237, N2O: 0.036, N2: 0.722}
    disposition: sourced
    defect: implicit_earth
    route: compiled_literal
    source_file: vendor/lpj-guess/framework/guess.cpp
    literal: "NH3_FIRERATIO = 0.005"
    consumed_by: fire-8
    source: >
      guess.cpp:60-65, commented "emission ratios from fire (NH3, NOx, N2O, N2)
      Delmas et al. 1995".
    why_this_disposition: >
      These are the ratios the measured tail in fire-8 is expressed through:
      the worst cell of the accepted run emits 600 kgN/ha/yr as N2 alone, and
      it does so because N2 carries 0.722 of whatever the fire nitrogen flux
      is. The partition is therefore NOT the defect -- it is a partition, it
      sums to 1, and it cannot manufacture nitrogen -- and registering it says
      so, which is what stops the tail being attributed here. What the tail
      measures is the flux being partitioned, which is the effects layer's.
    do_not: >
      Do not adjust these four shares to bring a simulated fire nitrogen flux
      into an Earth-like range. They conserve nitrogen by construction and
      changing them moves gas SPECIATION, not the total; a total that is wrong
      stays wrong and moves to a different molecule.

  fuel_currency:
    seam: cnp_destinations
    what: >
      What "fuel" MEANS on both sides of every fire equation in this register:
      the model carries carbon and the equations were calibrated on dry mass.
      Not a coefficient -- a units contract that three coefficients silently
      assume, which is why it is one entry rather than a note on each.
    unit: kg dry fuel per kgC
    central: null
    disposition: irreducible
    defect: implicit_earth
    route: none
    row: world-9zfv
    consumed_by: fire-6
    source: >
      LPJ-GUESS carries every pool as carbon -- guess.h documents cmass
      throughout as kgC/m2 -- and blaze.cpp's available_fuel() sums cmass
      members directly. Noble (1980) Table 1 defines W as "Fuel weight,
      tonnes ha-1"; Byram (1959), which blaze.cpp:272 cites through Pyne
      (1996), takes w as the fuel mass consumed. No carbon-to-dry-matter
      factor exists anywhere in the fire path: blaze.cpp, vegdynam.cpp and
      guess.h were searched and the ratio is silently 1.
    why_this_disposition: >
      IRREDUCIBLE WITH `central` NULL, for the same reason
      `phosphorus_volatilised_fraction` is: the defect is an ABSENCE, and
      writing a number here would be this file inventing the contract it
      exists to record. About 2 is the right order for dry biomass to carbon,
      and it is deliberately not written as a value, because a single factor
      entered here would immediately become the thing that gets adjusted until
      a burned area looks right -- which is a tuning, and the whole subject of
      this file.
      The defect is implicit_earth in its exact sense: the derivations on the
      other side are SOUND, and they are for fuel beds measured on Earth in a
      currency this model does not carry.
    do_not: >
      Do not repair this and world-c15e with one combined factor. The decade
      and the currency multiply, they have different right answers, and a
      product that came out somewhere plausible would conceal both. Price them
      separately; world-c15e says the same thing from its own side.

  phosphorus_volatilised_fraction:
    seam: cnp_destinations
    what: >
      Share of phosphorus in combusted material that leaves as smoke, against
      the share retained on site as ash and mineral soil. The C-N-P fork's
      missing fire term.
    unit: dimensionless
    central: null
    disposition: irreducible
    defect: none
    route: none
    consumed_by: fire-7
    source: >
      There is none, and that is the entry. blaze.cpp transfers and reports
      carbon and nitrogen during combustion and contains no phosphorus
      transfer at all; the older fire() path in vegdynam.cpp has its
      phosphorus block commented out with an unresolved note about the
      atmospheric fraction. Audit finding 6.
    why_this_disposition: >
      NOT IRREDUCIBLE AS A NUMBER -- irreducible as an ABSENCE, which is a
      different thing and is why `central` is null rather than a guess. No
      value may be entered here from an Earth ash chemistry until fire-7
      declares the partition, because the failure mode is not an inaccurate
      phosphorus flux: it is that enabling either fire path under phosphorus
      limitation updates carbon and nitrogen while leaving the corresponding
      phosphorus in place, which breaks tissue stoichiometry and the C-N-P
      budget silently.
    what_would_settle_it: >
      A LITERATURE QUESTION AND NOT A MEASUREMENT THIS PROJECT CAN MAKE. The
      three sources below are HELD AND READ, and between them they settle the
      mechanism, the magnitude and the form -- everything except one modelling
      decision, stated at the end, which is fire-7's.
    sources_held:
      mechanism: >
        Bodi et al. (2014) Earth-Science Reviews 130:103-127, the ash review's
        element-volatilisation figure, after Raison et al. (1985a): PHOSPHORUS
        VOLATILISES AT 774 C AND NITROGEN AT 500 C. Sulphur is 575, potassium
        760, sodium 880, magnesium 1107, calcium 1240. So phosphorus needs a
        substantially hotter fire than nitrogen to leave as gas, and the
        volatilised share is a FUNCTION OF FIRE TEMPERATURE rather than a
        constant. blaze.cpp already computes fire-line intensity and already
        selects combustion completeness by it, so the model carries the
        argument such a function would need.
      magnitude: >
        Kauffman, Cummings and Ward (1994) Journal of Ecology 82:519-531,
        Table 4, four Brazilian cerrado communities burned in 1990. Of the
        phosphorus LOST FROM THE SITE, the share that left as gas rather than
        as particulates was 67, 45, 34 and 22 per cent along the gradient from
        open grassland to woodland. The NITROGEN share in the same fires was
        96, 94, 58 and 32 per cent. Phosphorus is therefore 0.479 to 0.698 of
        nitrogen's volatilised share fire for fire, mean 0.613 -- which is the
        774-against-500 mechanism appearing in a field measurement, and is the
        strongest single result for this entry because it is a PAIRED
        comparison within one fire rather than two numbers from two studies.
      global_constraint: >
        Mahowald et al. (2008) Global Biogeochemical Cycles 22 GB4026, Table 4:
        biomass burning contributes 0.025 Tg P/yr to the atmosphere against a
        total atmospheric phosphorus source of 1.39 Tg P/yr, so fire is 1.8 per
        cent of it where mineral dust is 83 per cent. A distance to report
        from rather than a target, and the quantity a simulated global fire
        phosphorus flux would be compared against.
    what_is_still_undecided: >
      ONE MAPPING, AND IT IS WHY `central` IS STILL NULL. Kauffman's
      percentages are of the phosphorus LOST FROM THE SITE -- volatilised plus
      particulates blown off it -- while this register's quantity is of the
      phosphorus COMBUSTED, which also includes the ash that stayed on the
      ground. Combusted is the larger denominator, so KAUFFMAN'S 22 TO 67 PER
      CENT IS AN UPPER BOUND on what the model needs and not the value itself.
      Closing the gap needs the retained-ash fraction, which that paper reports
      for NITROGEN in prose -- 5.5 per cent remained as ash in campo limpo
      against 53.8 per cent in cerrado sensu stricto -- and not for phosphorus.
      Choosing how to close it is a decision about model form, fire-7 owns it,
      and entering a number here taken from the upper bound would be this file
      making that decision instead.
    fail_closed: >
      This is the register's one FAIL-CLOSED entry, and it is enforced in TWO
      places because a declaration the model does not share is a preference.
      `fire_parameter_gate.py --strict` refuses while `central` is null, and
      `parameters.cpp` refuses the run itself: `ifplim && firemodel != NOFIRE`
      aborts before any integration. A null here is a refusal and never a
      default of zero -- zero would be the claim that fire volatilises no
      phosphorus, which is a strong physical statement nobody has made.
    enforced_in: vendor/lpj-guess/framework/parameters.cpp
    enforced_by: "ifplim && firemodel != NOFIRE"
    why_a_second_refusal: >
      `parameters.cpp` ALREADY refuses `ifplim 1` unconditionally, on
      PFRAC_LEAFTOSAP, so the fire guard cannot fire today. It is stated as its
      own condition anyway, and the separation is the whole point: that refusal
      will be lifted by the change settling BIO-34 and WORLD-3E5N, which has
      nothing to do with fire, and folded into it the fire hazard would be
      armed by an unrelated repair with nothing objecting. Lifting one refusal
      must not silently lift the other.
