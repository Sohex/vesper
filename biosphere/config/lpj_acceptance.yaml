# BIO-14. A process exit is not an accepted biosphere run.
contract_version: vesper-lpj-acceptance/1

required_outputs:
  - anpp.out
  - lai.out
  - fpc.out
  - cmass.out
  - aaet.out
  - cpool.out
  - dens.out
  - agpp.out
  - nsources.out
  - cflux.out
  - firert.out
  - tot_runoff.out
  - awater.out
  - maet.out
  - mevap.out
  - mintercep.out
  - nmass.out
  - npool.out
  - nflux.out
  - ngases.out
  - soil_npool.out
  - soil_nflux.out

# Tables whose values are physical stocks, non-negative flux magnitudes or
# bounded fractions. Signed net-flux tables are deliberately absent.
nonnegative_outputs:
  - lai.out
  - fpc.out
  - cmass.out
  - aaet.out
  - cpool.out
  - dens.out
  - agpp.out
  - tot_runoff.out
  - awater.out
  - maet.out
  - mevap.out
  - mintercep.out
  - nmass.out
  - npool.out
  - ngases.out
  - soil_npool.out
negative_roundoff_tolerance: 1.0e-9
fraction_outputs:
  # fpc.out is deliberately absent: its columns and Total are additive sums of
  # overlapping cohort/PFT projective covers (`commonoutput.cpp` accumulates
  # `indiv.fpc`), so the table is non-negative but is not an area partition and
  # may exceed one.
  firert.out:
    BurntFr: [0.0, 1.001]

# BIO-12 owns the reducer and thresholds. These tables must each pass it; flux
# components near zero are excluded because a relative trend of a signed
# residual is not a stability statistic.
stability_outputs:
  - anpp.out
  - lai.out
  - fpc.out
  - cpool.out
  - npool.out
  - aaet.out
  - tot_runoff.out

closure:
  window_complete_forcing_cycles: 10
  # HOW FAR ABOVE ITS OWN QUANTISATION A TOLERANCE HAS TO SIT.
  #
  # Every residual below differences columns LPJ-GUESS writes at a compiled-in
  # fixed decimal precision, so a model that conserves exactly still reports a
  # residual of order the written quantum. Under that quantum an absolute floor
  # is not a tolerance at all: it fails cells for how they were written down,
  # and the failures it names are whichever cells rounded worst.
  #
  # Ten is one order of magnitude, which is what this project calls negligible
  # elsewhere in its numerics; at ten the instrument owns at most a tenth of the
  # tolerance and the rest is the simulation. It is applied identically to
  # carbon, nitrogen and water, and `assess_lpj_run.py:closure_resolution`
  # MEASURES the quantum from the output tables rather than reading it from the
  # model source, so raising a column's precision and forgetting to say so still
  # gives the honest margin, and dropping one back refuses.
  minimum_resolution_margin: 10.0
  carbon:
    pool_output: cpool.out
    pool_field: Total
    flux_output: cflux.out
    flux_field: NEE
    absolute_floor_kg_c_m2: 0.01
    relative_throughput_limit: 0.001
  nitrogen:
    pool_output: npool.out
    pool_field: Total
    # npool.out Total IS NOT THE COMPLETE NITROGEN STOCK, so the check adds the
    # part of it that column leaves out. `commonoutput.cpp` builds Total's
    # mineral term, availn, from NH4 and NO3 alone, while the soil nitrogen
    # operator's own conservation identity in `ntransform.cpp` is over SIX soil
    # pools: NH4, NO3, NO2, NO, N2O and N2. Nitrogen nitrified or denitrified
    # out of NH4/NO3 and still resident in the other four at the cycle boundary
    # has therefore left Total, and nflux.out NEE does not carry it either --
    # the gas fluxes are reported when the nitrogen LEAVES those pools, not
    # when it enters them. Differencing Total alone against NEE is not a
    # conservation law; the residual it leaves is the change in the four
    # omitted pools, which is why it is flat in window length rather than
    # accumulating. soil_npool.out writes those four on the same gridcell
    # average, in the same units as the flux, so the complete stock is the
    # pair. notes/audits/closure-tolerance-under-written-precision.md.
    # Each addend carries its OWN conversion into the flux's units rather than
    # inheriting pool_to_flux_units, because it does not share the pool
    # column's units: npool.out is kgN/m2 and soil_npool.out is already kgN/ha.
    # The column names are quoted because YAML 1.1 resolves a bare NO to the
    # boolean false, and a stock silently missing one of its four terms is
    # exactly the defect this addend exists to repair.
    pool_addends:
      - output: soil_npool.out
        fields: ["NO2", "NO", "N2O", "N2"]
        to_flux_units: 1.0
    flux_output: nflux.out
    flux_field: NEE
    pool_to_flux_units: 10000.0
    absolute_floor_kg_n_ha: 2.0
    relative_throughput_limit: 0.001
  water:
    precipitation_source: manifest-pinned VESPDRV8
    # WATER CLOSES STOCK AGAINST FLUX, exactly as carbon and nitrogen do. The
    # daily identity in soil.cpp:hydrology_lpjf is
    #     initial water in column + rain_melt
    #         = final water + evap + aet_total + runoff
    # and soilwater.cpp:initial_infiltration sets rain_melt to precipitation
    # less interception, less what the snowpack takes and plus what it
    # releases. So a gridcell year is
    #     precipitation = transpiration + soil evaporation + interception
    #                     + runoff + change in (soil water, soil ice, snowpack)
    # Four losses and one store, and nothing else.
    #
    # THE STORE IS READ AND NOT INFERRED. Differencing only the losses out of
    # precipitation leaves the store as the residual, and a residual that IS
    # the store cannot be held to a conservation tolerance: a soil that got
    # wetter and a model that leaks read alike, and the verdict then turns on
    # the declared window length rather than on the simulation. awater.out
    # carries the store itself -- soil water, soil ice and the snowpack, on the
    # same to_gridcell_average as tot_runoff.out -- so the residual below is a
    # conservation residual and its floor is a conservation tolerance.
    # notes/audits/closure-stocks-are-incomplete.md.
    storage_output: awater.out
    storage_field: Total
    #
    # aaet.out Total is NOT the transpiration this closure needs.
    # commonoutput.cpp builds it from indiv.aaet summed over the individuals
    # still in patch.vegetation, and framework.cpp runs vegetation_dynamics --
    # establishment, mortality and disturbance by fire -- on the last day of
    # the year BEFORE outannual. The column is therefore the transpiration of
    # the survivors, and the water an individual moved before it died is
    # missing from it. patch.maet is accumulated day by day alongside
    # patch.aaet and is unaffected, so maet.out is the column that reports what
    # left the soil.
    #
    # Soil evaporation and canopy interception reach no annual table at all:
    # commonoutput.cpp accumulates patch.aevap and patch.aintercep and sends
    # both only to the interactive plot(). mevap.out and mintercep.out are the
    # only route to them.
    #
    # `fields` is the column count each table must carry. The annual flux is
    # the sum of every column, so a table that changes shape has to refuse
    # rather than silently sum something else.
    evaporation_outputs:
      - output: maet.out
        fields: 12
      - output: mevap.out
        fields: 12
      - output: mintercep.out
        fields: 12
    runoff_output: tot_runoff.out
    runoff_field: Total
    absolute_floor_mm: 2.0
    relative_throughput_limit: 0.005
    interpretation: >-
      Over ten complete forcing cycles, the change in the gridcell water store
      less precipitation and plus transpiration, soil evaporation, canopy
      interception and runoff is zero if the model conserves water. Both sides
      are annual endpoints and annual sums of a daily budget, so this is a
      cycle-boundary closure and not a claim of bitwise daily hydrology
      closure.
