# One mineral-reactivity contract for soil organic matter protection and for
# phosphorus sorption in the simulated soil.
#
# Worldbuilding. Vesper is an invented planet and this file describes how its
# vegetation model decides what fraction of decomposing carbon becomes stable
# soil organic matter, and what fraction of released phosphorus is sorbed.
#
# There are two arms. The TEXTURE-ONLY arm is what the model runs today: linear
# functions of clay, or of clay plus silt, inherited from CENTURY. The
# MINERAL-AWARE arm is the alternative the literature supports, and it refuses,
# because the proxies it needs are not in any artifact this project produces.
# Neither arm may be retuned to a desired soil carbon or productivity: a
# coefficient here moves only when its source moves.
#
# `biosphere/scripts/mineral_reactivity_gate.py` reads this file.
# `biosphere/notes/mineral-reactivity-contract.md` is the argument.

active_arm: texture_only

# The equations the model runs, each checked against the source it lives in.
# `expression` is evaluated over the texture domain and held to `range`;
# `literals` must all still appear in `source_file`.
texture_only:
  source_file: vendor/lpj-guess/modules/somdynam.cpp
  citation: >
    Parton et al. (1993), Observations and Modeling of Biomass and Soil Organic
    Matter Dynamics for the Grassland Biome Worldwide, 10.1029/93GB02042. Read;
    references/INDEX.md carries the row. Its calibration is Earth grasslands and
    0-20 cm soil stocks, so these are Earth central tendencies over an Earth
    range of textures and not a law that carries to another planet's mineralogy.
  equations:
    - name: soil_microbe_decay_texture_modifier
      reads: "decayrates_century, Parton et al. (1993) eqn 5. Multiplies K_MAX for SOILMICRO"
      expression: "1.0 - 0.75*(clay + silt)"
      literals: [0.75]
      unit: dimensionless
      range: [0.0, 1.0]
    - name: slow_to_passive_fraction
      reads: "somfluxes, Parton et al. (1993) Fig 1. The SLOWSOM to PASSIVESOM transfer"
      expression: "max(0.0, 0.003 - 0.009*clay)"
      literals: [0.003, 0.009]
      unit: fraction of the decayed slow pool
      range: [0.0, 1.0]
    - name: soil_microbe_respired_fraction
      reads: "somfluxes, Parton et al. (1993) eqn 7"
      expression: "max(0.0, 0.85 - 0.68*(clay + silt))"
      literals: [0.85, 0.68]
      unit: fraction of the decayed microbial pool
      range: [0.0, 1.0]
    - name: microbe_to_passive_fraction
      reads: "somfluxes, Parton et al. (1993) eqn 9"
      expression: "0.003 + 0.032*clay"
      literals: [0.003, 0.032]
      unit: fraction of the decayed microbial pool
      range: [0.0, 1.0]
    - name: organic_leaching_fraction
      reads: "somfluxes, Parton et al. (1993) eqn 8 with OMLECH 1 to 3, at saturating percolation"
      expression: "0.03 + 0.12*sand"
      literals: [0.03, 0.12, 1.9]
      unit: fraction of the decayed microbial pool
      range: [0.0, 1.0]

  # The one closure the four microbial-pool fractions have to satisfy. What
  # leaves SOILMICRO is respiration plus leaching plus the passive share plus the
  # slow share, and the slow share is what is left over:
  #   csp = 1 - respfrac - orgleachfrac - cap
  # so a negative csp is a transfer running backwards, and the model has no
  # guard against it. The gate evaluates it over four texture domains, because
  # the answers differ: the whole simplex, the soil map's own textures, the LPJ
  # soil code table, and the simplex again under the leaching coefficients the
  # cited source prints rather than the ones the model runs.
  closure:
    name: microbe_partition_remainder
    expression: "1.0 - max(0.0, 0.85 - 0.68*(clay + silt)) - (0.03 + 0.12*sand) - (0.003 + 0.032*clay)"
    unit: fraction of the decayed microbial pool
    # Over the whole texture simplex this goes NEGATIVE, at pure sand, where the
    # respired share is at its 0.85 maximum and organic leaching at its 0.15.
    # The remainder form is the source's own eqn 10, unguarded there too, so the
    # missing sign check is not this fork's. What admits a negative value is the
    # CENTURY 5 leaching update below, and the range that reaches it is not on
    # this world: see `reachability` and `source_variant`. Registered rather
    # than repaired. The value is checked, so any coefficient change that moves
    # it fails this gate.
    simplex_minimum: -0.003
    simplex_tolerance: 1.0e-9
    # Over the textures the soil map actually carries it has to stay forwards.
    soilmap_minimum: 0.0

    # What the remainder needs in order to go backwards, solved from the
    # expression above at saturating percolation. Both conditions have to hold
    # at once, and neither is close on this world.
    reachability:
      # At saturating percolation the remainder is
      #   csp = -0.003 + 0.8*(clay + silt) - 0.032*clay
      # which for a fixed fine fraction is smallest when all of the fine
      # fraction is clay. So the LARGEST fine fraction at which any texture
      # reverses is the all-clay one, and below the all-silt one every texture
      # reverses whatever the split.
      max_fine_fraction: 0.00390625
      fine_fraction_all_reverse: 0.00375
      # Equivalently a sand fraction above this.
      min_sand_fraction: 0.99609375
      # And percolation at least this share of the leaching saturation point,
      # which is the min(1, dperc/(OMLECH_3*cmpermonth_to_mmperday)) factor.
      # Solved at pure sand, where the requirement is weakest.
      min_percolation_share: 0.98
      tolerance: 1.0e-9

    # Parton et al. (1993) eqn 8 as the paper prints it, before the CENTURY 5
    # parameter update `somdynam.cpp` applies: C_AL = (H2O_30/18)*(0.01 +
    # 0.04*sand), read off p. 788 of
    # `references/pdf/parton1993-century-soil-organic-matter.pdf`. With the source's
    # own coefficients the remainder is bounded BELOW ZERO nowhere on the
    # simplex; it bottoms out at pure sand, positive. So the source bounds what
    # the model does not, and the sign failure is entirely the coefficient
    # update, which is upstream LPJ-GUESS and arrived with the subtree.
    source_variant:
      expression: "1.0 - max(0.0, 0.85 - 0.68*(clay + silt)) - (0.01 + 0.04*sand) - (0.003 + 0.032*clay)"
      citation: "Parton et al. (1993) eqn 8, p. 788"
      simplex_minimum: 0.097
      simplex_tolerance: 1.0e-9

    # The other texture source in the model: `soilinput.h`'s LPJ soil code
    # table, used when no soil map is supplied. Every code is checked, because
    # the coarse code is the sandiest texture anything in the model can hand the
    # partition. sand, clay per code, silt taken as the remainder.
    soilcode_textures:
      source_file: vendor/lpj-guess/modules/soilinput.h
      minimum: 0.0754
      tolerance: 1.0e-9
      codes:
        0: [0.90, 0.05]
        1: [0.90, 0.05]
        2: [0.35, 0.15]
        3: [0.30, 0.45]
        4: [0.60, 0.15]
        5: [0.60, 0.30]
        6: [0.20, 0.30]
        7: [0.45, 0.25]
        8: [0.28, 0.12]
        9: [0.10, 0.80]

# The mineral-aware arm. Every proxy below carries the `undeclared` sentinel and
# names what would have to produce it. There is no default for any of them, and
# the gate refuses the arm while any is undeclared.
mineral_aware:
  citation: >
    Cotrufo et al. (2013) 10.1111/gcb.12113 and Lehmann and Kleber (2015)
    10.1038/nature16069, both read. Together they place microbial products,
    mineral association, aggregation and accessibility at the centre of stable
    SOM formation, and name phyllosilicates, metal oxides, polyvalent cations,
    allophane and aggregates as the associating surfaces. Neither supplies a
    parameterised transfer function, which is why this arm needs proxies rather
    than a coefficient swap.
  required_proxies:
    fe_al_oxide_content:
      declared: undeclared
      unit: kg/kg of the fine earth fraction
      produced_by: nothing
      why: >
        Oxalate- and dithionite-extractable Fe and Al are the standard measure of
        the reactive oxide surface that sorbs phosphorus and stabilises carbon.
        The pedology model derives lithology fractions and a weathering intensity
        but no oxide content, so this cannot be computed from what exists.
    allophane_content:
      declared: undeclared
      unit: kg/kg of the fine earth fraction
      produced_by: partially, as build_soil.py andisol_properties `andic`
      why: >
        `andic` is the fraction of a gridcell whose volcanic glass has weathered
        to allophane under sufficient leaching. It is an areal fraction of andic
        material, not an allophane concentration, so it cannot be substituted for
        one without a conversion nothing in this project supplies.
    aggregate_capacity:
      declared: undeclared
      unit: dimensionless
      produced_by: nothing
      why: >
        Occlusion inside aggregates is a physical protection mechanism separate
        from mineral association. Nothing in the pipeline resolves soil structure.
    polyvalent_cation_saturation:
      declared: undeclared
      unit: cmol(+)/kg
      produced_by: nothing
      why: >
        Ca, Fe and Al bridging is the cation half of the association mechanism.
        The soil map carries pH, from which base status can be argued but not
        derived, and the non-N/P adequacy screen already refuses the trace set
        for want of a release table.

# What the pedology artifact DOES carry across the interface today, and what it
# is allowed to be used for. Both are read into Soiltype::andic_frac and
# Soiltype::p_fixation_frac and neither is read by any equation while the arm
# above refuses. The gate checks the columns are present, in range, and that no
# equation reads them.
carried_state:
  soil_map_columns: [andic, pfixation]
  # Their range in the artifact, and the range they are declared to have.
  # `andic` and `pfixation` are both fractions, so both are in [0,1].
  range: [0.0, 1.0]
  read_into: [Soiltype::andic_frac, Soiltype::p_fixation_frac]
  # No line of the model may read these while `active_arm` is texture_only.
  # The gate greps the model source and fails on one that does.
  readers_permitted: []
