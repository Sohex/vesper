# Plant functional types NATIVE to Vesper.
#
# This is a worldbuilding declaration for a simulated world. Everything below is
# invented biology for Vesper, and it is kept in one file precisely so that it
# cannot be mistaken for something LPJ-GUESS shipped.
#
# WHY THIS FILE EXISTS SEPARATELY FROM THE CONVERSION. Every parameter in
# `vendor/lpj-guess/data/ins/global.ins` is an EARTH calibration, and
# `build_vesper_pfts.py` converts it into model units. A type declared here has
# no Earth calibration behind it: its values are stated in MODEL units already,
# derived from this world's own measurements. So these blocks are appended
# AFTER the conversion pass and are never rescaled. Rescaling them would apply
# the year-length factor to a number already in the target unit, which is the
# same trap the `nyear_spinup` DERIVED case in that script exists to avoid.
#
# THE HAZARD THIS ARRANGEMENT CREATES, and the guard for it. `leaflong` is a
# YEAR_COUNT parameter, so a native `leaflong 0.2392` sitting beside a converted
# `leaflong 5.98782` is indistinguishable by eye from an Earth value the
# conversion missed. Any parameter here whose name falls in a conversion class
# must therefore state `units: model` explicitly, and the generator refuses one
# that does not. The emitted line carries the same statement as a comment.
#
# A type states ONLY what its derivation changes; everything else is inherited
# from the type it names in `inherits`, so this file is the difference and not a
# second copy of a parameter set that would drift from the first.

contract: biosphere/notes/time-base-unit-contract.md

# The traits BOTH strategies derive from the same measurements. Held once,
# because a shared value stated twice is two declarations that drift.
groups:

  vesper_polar:
    title: traits common to the Vesperian polar strategies
    derivation: biosphere/notes/vesperian-polar-type.md
    issue: world-upm5
    # C3G and not the bare `grass` group: both strategies are modifications of
    # the cool grass, so naming it makes this file the list of changes.
    inherits: C3G
    parameters:

      pstemp_min:
        value: 0.0
        units: absolute
        basis: >-
          below the growing season's p5 of 8.46 degC and above the frozen
          months, which carry no liquid water to work with.

      pstemp_low:
        value: 15.0
        units: absolute
        basis: the plateau opens at the growing season's p25 of 15.30 degC.

      pstemp_high:
        value: 46.0
        units: absolute
        basis: >-
          the plateau closes at the growing season's p95 of 45.70 degC. C3G
          declares 30 and the cap spends 30.5% of its season above it.

      pstemp_max:
        value: 55.0
        units: absolute
        basis: >-
          above the season's measured maximum of 48.43 degC, so photosynthesis
          is not switched off inside the season. C3G declares 45 and the cap
          spends 7.6% of its season above it.

      ltor_max:
        units: absolute
        basis: >-
          BRACKETED, not derived. C3G's 0.5 encodes a long-season foraging
          strategy of at least two units of root per unit leaf, and growth.cpp
          scales it further down by water stress. Where the extractable water
          passes in fifteen days that investment cannot be recovered, but no
          measurement here fixes the replacement, so both ends are run.
          build_vesper_pfts.py refuses an end this bracket does not declare and
          writes the end it took into the generated header and the provenance.
        bracket:
          low: 1.0
          high: 2.0
          default: low

# TWO STRATEGIES, DECLARED TO COMPETE. A fifteen-day water pulse at the head of
# a 2.87-month season admits two coherent answers, and which one wins is a
# property of a loop rather than something the measurements settle. LPJ-GUESS is
# a competition model, so both are instantiated in the same run and the model
# places them; coexistence is a result and not a muddle.
types:

  VPE:
    title: Vesperian polar ephemeral
    derivation: biosphere/notes/vesperian-polar-type.md
    issue: world-upm5
    include: 1
    inherits: vesper_polar
    parameters:

      leaflong:
        value: 0.2392
        units: model
        basis: >-
          THE EPHEMERAL STRATEGY: the leaf lives the 2.87-month growing season
          and no longer, which buys leaf area through the leaf-economics
          spectrum. SLA follows through ifcalcsla and the Reich regression in
          guess.h:initsla() at 44.8 m2/kgC against C3G's 26.0, and is
          deliberately NOT stated here because stating it would override a
          derivation the model already performs.

      phengdd5ramp:
        value: 52.0
        units: absolute
        basis: >-
          the cost of the ephemeral strategy is that the canopy is absent when
          the pulse begins and has to ramp into it. The thaw month yields a
          median 202 growing degree-days but only 104.5 at p25, and its first
          half, when most of the water moves, yields 52.2 at p25. At 52 three
          quarters of polar cells reach full display by mid-pulse; C3G's
          inherited 100 leaves the coldest quarter at part display through it.

  VPP:
    title: Vesperian polar perennial
    derivation: biosphere/notes/vesperian-polar-type.md
    issue: world-upm5
    include: 1
    inherits: vesper_polar
    parameters:

      phenology:
        value: evergreen
        units: none
        basis: >-
          THE PERENNIAL STRATEGY, and the reason it is not obviously worse here.
          An evergreen canopy is already present when the melt arrives, which is
          what the storage organ would have bought and what LPJ-GUESS cannot
          express, having no plant carbon reserve. Its usual cost is maintenance
          respiration through the non-growing season, and on this world that
          cost is close to nil: driver.cpp:respiration_temperature_response
          clamps the Lloyd and Taylor response to exactly zero below -40 degC,
          and gives 0.0017 at -20 degC, so the nine months the cap spends below
          -40 bill the plant nothing. Earth's boreal winter at -20 degC does not
          subsidise this strategy; Vesper's at -68.75 degC does.

      phengdd5ramp:
        value: 0.0
        units: absolute
        basis: >-
          an evergreen holds leaf, so there is no ramp to accumulate. Stated
          rather than inherited because the inherited 52 would read as a ramp
          this strategy waits on.

      leaflong:
        value: 1.0
        units: model
        basis: >-
          THE COST OF THE PERENNIAL STRATEGY, and the reason the two are a fork
          rather than a ranking. A leaf carried through the dark season must
          last a full orbit, and the Reich regression turns that longevity into
          an SLA of 26.0 m2/kgC, no better than C3G and 1.72 times worse than
          the ephemeral. This strategy trades leaf area per unit carbon for
          having its leaf in the right fortnight.
