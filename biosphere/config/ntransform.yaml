# The simulated soil's nitrogen transformation operator, declared.
#
# Worldbuilding. Vesper is an invented planet and this file describes the
# vegetation model's soil nitrogen chemistry as it runs on the simulation of it.
#
# `biosphere/scripts/ntransform_gate.py` reads this file. Every constant below
# is checked against the place the model actually reads it from, and every
# response function is evaluated over its declared domain and held to the range
# its role allows. A value here that has drifted from the source is a failure of
# this declaration, not of the model.
#
# The argument, and what each number is calibrated against, is
# `biosphere/notes/soil-nitrogen-transformation-parameterisation.md`.

# EVERY DIVERGENCE FROM MAINLINE LPJ-GUESS 4.1.1, WITH ITS VERDICT.
#
# As it arrived, `vendor/lpj-guess/modules/ntransform.cpp` was byte-identical to
# guess_4.1/modules/ntransform.cpp (Zenodo record 8065737, SVN r10118) apart
# from a stripped MPL-2.0 licence header, and the operator is ON BY DEFAULT for
# global runs: `data/ins/global.ins` imports `global_soiln.ins`, which sets
# `ifntransform 1`. So every entry below is a change to default-on behaviour in
# a widely used community model, and none of them is a fork quirk this project
# inherited.
#
# NONE OF IT IS EXECUTION-VERIFIED. LPJ-GUESS does not build on this tree, so
# every verdict here is arithmetic on the declared forms and on the papers.
# `comparison_arm` names what would change that and cannot be run here.
#
# `verdict` is what this project decided about the change, not what the
# arithmetic says:
#   keep    the divergence stands and is declared. `mainline` records the line
#           the release runs, verbatim, beside the changed one in the source
#   gate    the divergence stands but is not settled, and `--strict` refuses
#           while it does. There is no such entry; the kind exists so the next
#           one has somewhere to go that is not `keep`
# A divergence that does not survive review is reverted and leaves this file;
# reverting is the null result, not a defeat.
#
# The gate checks BOTH halves of every `keep`. Each `mainline` string has to be
# in the operator source, so the record cannot go missing, and NOT in it once
# comments are stripped, so a silent revert fails; `live` has to be in the
# stripped source, so deleting the changed line fails too. An `instruction`
# entry is checked against the instruction file instead: the declared value has
# to differ from `mainline_value`, and `record` has to appear in that file.
mainline_divergences:
  release: "LPJ-GUESS 4.1.1, Zenodo record 8065737, SVN r10118, MPL-2.0"
  execution_verified: false
  why_not_verified: >
    LPJ-GUESS does not build on this tree. `framework/vesper.h` is generated,
    and the chain to it runs through a baseline run and a baseline climatology
    that do not exist. No divergence below has been run, in either direction.
  comparison_arm: >
    What would bound what these are worth, though not whether they are right:
    one stock-4.1.1 arm against one Vesper arm, the same build, the same
    climatology, the same instruction file except for the five constants, and
    ntransform.cpp reverted to the release in the stock arm. The port already
    exists, so the arm is a second compile and a second run and no new code.
    The quantities to compare are NET_NITRIF, NET_DENITRIF, NO_SOIL, N2O_SOIL,
    N2_SOIL, NH3_SOIL and the mineral nitrogen the simulated plants take up,
    because the by-hand numbers in `worth` are changes to COEFFICIENTS and the
    Michaelis-Menten terms and the min() against the pool stand between a
    coefficient and a flux. It cannot settle which Earth calibration is right,
    because both arms are Earth calibrations; it can say how far apart they put
    this world. `world-9f1v` owns it.
  entries:
    - id: soil_ph_fallback
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline: ["soil.pH = 3810 / (762 + (climate.aprec_lastyear)) + 3.5;"]
      live: 'fail("nh3_volatilization: ifntransform is set but the input path supplied "'
      settles: >
        Mainline falls back to Dawson (1977)'s regression of soil pH on annual
        precipitation when the input path supplies no pH; this refuses instead.
        The fallback is arithmetically dead in mainline as well as here: nothing
        in the model assigns `aprec_lastyear`, and `climate.aprec`, which would
        feed it, is reset at day 0 in driver.cpp and never accumulated. It
        therefore evaluates at zero precipitation and returns 8.5 on every
        gridcell of every day. Its constant is wrong too: Xu-Ri and Prentice
        (2008) table 5 eqn 5 gives 3.8 where the port has 3.5, and pH enters
        volatilisation as exp(2*(pH - 10)), so 0.3 pH units are a factor of 1.8.
        Nothing is being removed that ever computed anything.
      worth: >
        Nothing, on any input path that supplies pH, which is every Vesper path:
        the branch was unreachable once the soil map's pH reached the Soiltype.
        On a soil-code-only path the operator now refuses by name where it used
        to run at a constant pH 8.5 nobody chose.
    - id: nh3_max
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline:
        - "double nh3_max = 0.0, f_nit_T = 0.0, nh3_inc = 0.0;"
        - "nh3_max = 0.001;"
        - "nh3_max = 0.00001;"
        - "min(soil.NH4_mass, nh3_max * (min(1.0, wcont)"
      live: "nh3_inc = min(soil.NH4_mass, (min(1.0, wcont) * (1.0 - min(1.0, wcont)))"
      settles: >
        Forced by arithmetic, and the strongest of the set. Xu-Ri and Prentice
        (2008) table 5 has no nh3_max, and eqn 6's fpH = exp(2*(pH - 10)) alone
        returns 3.4e-4 at pH 6 and 1.0 at pH 10, which is exactly the ratio the
        paper's text states: the NH3/NH4+ ratio "is virtually zero (about 0.001)
        in solutions with pH below 6, but approaches unity (about 0.90) in
        solutions with pH above 10". nh3_max is 0.001 above pH 6 and 0.00001 at
        or below, keyed on the same pH 6, so it is that same ratio rendered as a
        step, and mainline applies it on top of fpH. Mainline's own comment names
        it "Maximum conversion ratio from NH4_mass to NH3 gas", which is what fpH
        is, so the two are the same quantity by the release's own description of
        them. The reading that would save it -- that nh3_max is a mass-transfer
        coefficient rather than an equilibrium ratio -- fails on the factor-100
        step at pH 6, which a transfer coefficient has no reason to have.
      worth: >
        The daily volatilised fraction of NH4 rises by 1e3 above pH 6 and 1e5 at
        or below. Its ceiling at pH 6.5 goes from 2.3e-7 to 2.3e-4 per day and at
        pH 8.5 from 1.2e-5 to 1.2e-2, so on an alkaline gridcell it is about a
        per cent of the ammonium pool a day where mainline's was arithmetically
        absent. It also makes pedology's pH clip load-bearing: the multiplier's
        margin below 1 falls from four orders to one.
    - id: substrate_partition_argument
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline: ["double wet = richards_curve(0.05,0.95,7.5,0.5,wcont);"]
      live: "double wet = richards_curve(0.05,0.95,7.5,0.5,wfps);"
      settles: >
        The curve is untouched and its argument is what moved, from
        get_soil_water_upper (a fraction of AVAILABLE capacity) to Soil::wfps(0).
        Xu-Ri and Prentice (2008) table 7 names DyN's aeration variable as "soil
        moisture as water-filled pore space (WFPS)" and the nitrification section
        as the WFPS of the top 50 cm, which is this layer. Mainline's own comment
        describes the curve in WFPS while reading something else, and
        nitrification and denitrification in the same file already read wfps(0).
      worth: >
        On the current Vesper soil map a gridcell at 0.50 WFPS got an anaerobic
        share anywhere from 0.071 to 0.874 on texture alone, where the curve asks
        for 0.500 everywhere; the median cell's aerobic share was 1.65 times what
        the curve asks at 0.50 WFPS. The largest single control the operator has
        on gaseous loss was a function of sand and clay.
    - id: nitrification_argument
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline: ["double act_dry = a*exp(wcont*b);"]
      live: "double act_dry = a*exp(wfps*b);"
      settles: >
        The same variable mismatch, in the same file, one function down: the
        curve is a water-filled pore space shape, whose origin is Linn and Doran
        (1984) fig. 1, and mainline evaluates it at a fraction of available
        capacity. That paper's stated objective is to replace per cent
        water-holding capacity with WFPS because WHC "depends on soil type, and
        the methods for its determination vary and are often poorly defined"
        (p.1268), and a fraction of available capacity is a third quantity again.
        Neither of the limb's constants moved.
      worth: >
        The optimum of a WFPS curve was landing at a texture-dependent wetness.
        It also changes what part of the curve a gridcell can reach: wfps(0) is
        bounded above by field capacity over saturation, a median of 0.81 on the
        current soil map, so a gridcell reaches the optimum only near field
        capacity and sits on the rising limb the rest of the time.
    - id: nitrification_wet_limb
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline:
        - "double act_wet = max(0.0,4.0-5.0*wcont);"
        - "double nit_act = min(act_dry,act_wet);"
      live: "double nit_act = min(1.0,act_dry);"
      settles: >
        Refused by the primary measurement and by a double count, argued in full
        at calibration entry form:nitrification_activity_wet_limb. Greaves and
        Carter (1920) is 9.6 per cent of the optimum at 80 per cent WHC where
        mainline is exactly zero, its only zero is at saturation, and no single
        linear map from its axis to WFPS gives mainline both its peak at 0.6 and
        its zero at 0.8. Separately, Linn and Doran attribute the decline above
        the optimum to aeration, and aeration is what substrate_partition already
        applies by handing nitrification only the aerobic share.
      worth: >
        Mainline stops nitrifying entirely on any gridcell above 0.8 WFPS. With
        the limb gone the whole wet-end decline is the partition's, which is
        shallower than the measurement: the partition's aerobic share at 0.7 and
        0.8 WFPS is 0.63 and 0.40 of its 0.6 WFPS value against Greaves and
        Carter's 0.395 and 0.096, where mainline's stacked pair gave 0.32 and
        exactly 0. The measurement sits between them, and that magnitude belongs
        to the partition's shape, which world-nga8 owns.
    - id: nitrification_gas_constant
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline: ["double ngas_inc = f_denitri_gas_max * no3_inc;"]
      live: "double ngas_inc = f_nitri_gas_max * no3_inc;"
      settles: >
        One half of a crossed pair. Mainline reads f_denitri_gas_max here and
        f_nitri_gas_max in denitrification, against its own names; the
        instruction file's comment, parameters.h's doc comment, parameters.cpp's
        inline comment and the declareitem help string all four agree with the
        names, so it is four declarations against two uses and the uses are the
        outlier. The values corroborate the names: uncrossed, the two steps of
        the reduction sequence carry the same ceiling, f_denitri_max and
        f_denitri_gas_max both 0.33, where crossed they carry 0.33 and 0.25 and
        the nitrification gas share happens to equal the eqn 3 ceiling. The
        option not taken was to leave the reads crossed and move the value on
        f_denitri_gas_max instead, which is the same behaviour with one fewer
        source line changed; it was refused because it puts a constant named for
        denitrification on a nitrification quantity and encodes the crossing in
        the numbers.
      worth: >
        Nothing by itself: it decides WHICH constant carries the nitrification
        gas share, and the nitrification_gas_share entry decides what that
        constant is. Paired with its other half below, its whole behavioural
        content is the denitrification NO2-to-gas ceiling, 0.25 to 0.33.
    - id: nitrification_gas_share
      owner: world-i2ch
      verdict: keep
      where: instruction
      key: f_nitri_gas_max
      mainline_value: 0.25
      record: "!     f_nitri_gas_max 0.25"
      settles: >
        The number, where the entry above settles which constant carries it.
        Mainline emits a third of every kilogram nitrified as NO plus N2O, since
        with the reads crossed the share is f_denitri_gas_max 0.33; uncrossed and
        unchanged it would be 0.25. Xu-Ri and Prentice (2008) table 11 gives RNON
        as 0.1 to 4 per cent with a stated mean of 2 and RN2ON as under 0.1 to
        0.2 per cent, applied by table 8 eqns 3 and 4, so the bracket on the sum
        is 0.2 to 4.2 per cent. Both mainline readings are outside it by a factor
        of 6 to 8 on the top and 11 to 15 on the mean. The reading that would
        save mainline -- that the constant is a ceiling the flux rarely reaches
        -- fails on the code: `ngas_inc = f * no3_inc` is a straight multiplier
        with no min() between it and the flux, so it is the share on every day of
        every gridcell.
      worth: >
        The largest of the set for what the simulated plants can reach. Of every
        kilogram nitrified, 978 grams return to NO3_mass_d where 670 did, so the
        mineral nitrogen a gridcell gets from a given gross nitrification rises
        by a factor of 1.46, and the nitrification part of NET_NITRIF, NO_SOIL
        and N2O_SOIL falls by 15.
    - id: denitrification_gas_constant
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline: ["soil.NO2_mass_w * f_nitri_gas_max * d_N_max * f_den_w * f_den_T"]
      live: "soil.NO2_mass_w * f_denitri_gas_max * d_N_max * f_den_w * f_den_T"
      settles: >
        The other half of the crossed pair, on the same evidence. Both ceilings
        stay unsourced whichever constant carries them: Xu-Ri and Prentice (2008)
        table 9 eqns 3 and 4 carry no maximum-rate constant and table 11 lists
        none, which is what calibration entries instruction:f_denitri_max and
        instruction:f_denitri_gas_max refuse on. This divergence claims
        consistency with mainline's own four declarations, not a source.
      worth: >
        The coefficient of the anaerobic NO2 pool rises by 1.32, from 0.25 to
        0.33, before the Michaelis-Menten term and the min() against the pool.
        That is the entire behavioural content of uncrossing the reads.
    - id: denitrification_temperature_clamp
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline: ["f_den_T = min(1.0, exp(308.56 * (1.0 / 68.02 - 1.0 / (soil_T + 46.02))));"]
      live: "f_den_T = exp(308.56 * (1.0 / 68.02 - 1.0 / (soil_T + 46.02)));"
      settles: >
        The exponential is untouched and the min{1, .} around it is what is gone.
        Xu-Ri and Prentice (2008) table 9 eqn 1 carries none, where table 5 eqn 7
        and table 10 eqn 1 both state one, so the port added it. That is
        typography; what refuses the clamp is arithmetic on the paper's own
        claim. The text gives the response an implied Q10 of about 2, and the
        unclamped function is 0.594 at 15 C and 1.211 at 25 C, a Q10 of 2.04.
        Clamped, the same interval gives 1.68. So the clamp contradicts the
        number the paper states about the function it is applied to. The premise
        that something had to bound it was wrong as well: both transformations
        the coefficient multiplies are written as min(pool, pool * coefficient),
        so neither can take more nitrogen from a pool than the pool holds. The
        -40 C guard stays, because the exponent diverges at -46.02 C.
      worth: >
        Both denitrification steps scale linearly in the response the clamp held
        at 1, so a 25 C soil denitrifies at 1.21 times the clamped rate, a 30 C
        soil at 1.61, a 35 C soil at 2.07 and a 45 C soil at 3.15. It is monotone
        in soil temperature and therefore not uniform across the map: warm wet
        gridcells lose nitrogen faster. On the warmest of them the NO3-to-NO2
        coefficient reaches the pool clamp, so the step becomes pool-limited
        rather than rate-limited, which mainline's clamp never allowed.
    - id: denitrification_gas_partition
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline:
        - "double f_n2o_no_w = max(0.0, min(1.0, 3.2092 * wfps_upper - 0.9210));"
        - "double f_n2_n2o_T = 1.0 / (1.0 + exp(-(soil_T - 5.0) / 10.0));"
        - "double f_n2o_n2_w = richards_curve(1.0, 0.0, 62.0, 0.875, wfps_upper);"
        - "if (wfps_upper < 0.7){"
      live: "no_inc  = R_NO_DENITRI * f_den_T * ngas_inc;"
      settles: >
        Four defects, three of them citation failures against papers this project
        now holds. Mainline produces no N2 at all below 0.7 WFPS, where Weier et
        al. (1993) tables 4 and 5 make N2 the majority product in 61 per cent of
        the 60 per cent WFPS observations and 80 per cent of the 75 per cent
        ones. f_n2o_no_w, an N2O:NO regression, is attributed to Weier, which
        measured N2 and N2O by acetylene block and never measured NO. f_n2_n2o_T
        is a logistic in soil temperature from a study incubated at one
        temperature. And no NO is produced above 0.7 WFPS at all. The replacement
        is table 9 eqns 5, 6 and 7 with table 11's RNODN and RN2ODN, so four
        unsourced calibration entries collapse into one that agrees with the
        source the rest of the operator is.
      worth: >
        Total denitrification does not move and all three gases leave the soil,
        so this changes what is reported and not what the simulated plants can
        reach. At 25 C the reduced nitrogen now leaves as 97.3 per cent N2, 2.42
        per cent N2O and 0.24 per cent NO at every water-filled pore space, where
        below 0.7 WFPS it left as no N2 and about 59 per cent NO and 41 per cent
        N2O at 0.50 WFPS, and at 0.90 WFPS as 84.6 per cent N2 and 15.4 per cent
        N2O with no NO. NET_DENITRIF falls by about 37 on the drier half of the
        old branch and by about 5.8 at the wet end, and N2_SOIL gains it. What
        this does NOT settle is the size of the N2 share, and it moves one point
        the wrong way: at 0.90 WFPS mainline's 0.846 is inside Weier's
        interquartile range and this operator's 0.978 is above all of it. That
        cost is declared, and refused, at form:denitrification_n2_share.
    - id: mass_balance_check
      owner: world-i2ch
      verdict: keep
      where: operator
      mainline: ["assert(fabs(n_budget_check) < EPS);"]
      live: "if (fabs(n_budget_check) > max(EPS, REL_EPS * n_total)) {"
      settles: >
        The identity is mainline's and is unchanged. What changed is that it is
        enforced in the binary this project builds: every Release build compiles
        an assert out under NDEBUG, so mainline's only check on the operator did
        not exist where it mattered. The bar is relative to the nitrogen present,
        floored at the absolute epsilon the assert used, and was fixed before any
        result because there is no result yet.
      worth: >
        Nothing while the operator conserves mass, which is the point. It cannot
        change a flux; it can only stop a run that has already gone wrong.

# The six operator constants that reach the model through the instruction file.
# `file` is checked verbatim: the gate parses it and refuses on any difference.
instruction_parameters:
  file: vendor/lpj-guess/data/ins/global_soiln.ins
  values:
    f_nitri_max: 0.1
    f_nitri_gas_max: 0.022
    f_denitri_max: 0.33
    f_denitri_gas_max: 0.33
    k_N: 0.083
    k_C: 0.017
  # plib's own bounds, from framework/parameters.cpp `declareitem`. A declared
  # value outside its parser bound would be refused by the model itself, so the
  # gate checks it here rather than discovering it at run time.
  parser_bounds:
    f_nitri_max: [0.01, 1.0]
    f_nitri_gas_max: [0.0001, 1.0]
    f_denitri_max: [0.0001, 1.0]
    f_denitri_gas_max: [0.00001, 1.0]
    k_N: [0.0001, 1.0]
    k_C: [0.00001, 1.0]

# The domains every response function is evaluated over. These are properties of
# the simulated soil, not of the functions, so they are declared once.
#   soil_temp_c   the model's 25 cm soil temperature. The lower end is the
#                 operator's own guard, `soil_T >= -40.0`; the upper end is
#                 above any soil temperature this world's climate produces.
#   water_upper   Soil::get_soil_water_upper, a fraction of available capacity.
#                 Sampled past 1.0 because three call sites clamp it with
#                 min(1.0, wcont), which is only meaningful if it can exceed 1.
#   wfps          Soil::wfps(0), water-filled pore space as a fraction. Declared
#                 over [0,1] because that is what the quantity means, but the
#                 model cannot reach all of it: wfps(0) is
#                 (wcont * gawc + gwp) / gwsats and wcont is a fraction of
#                 AVAILABLE capacity, refused outside [0,1] by
#                 Soil::get_soil_water. So each gridcell sees only the window
#                 from its wilting point over saturation to its field capacity
#                 over saturation. On the current Vesper soil map that window
#                 runs from 0.171-0.665 at the dry end to 0.573-0.948 at the
#                 wet end, and 2032 of 4105 gridcells are above 0.40 even at
#                 wilting point, which is where denitrification switches on.
#                 The missing quantity is water above field capacity.
#   soil_ph       the range pedology's build_soil.py clips its pH field to,
#                 `pedology/config/pedogenesis.yaml` ph.minimum and ph.maximum.
#                 Nothing else supplies a pH: the operator refuses without one.
domains:
  soil_temp_c: [-40.0, 80.0]
  water_upper: [0.0, 1.5]
  wfps: [0.0, 1.0]
  soil_ph: [3.8, 9.5]

# Every response function in modules/ntransform.cpp, with the role that decides
# what range it is held to.
#
#   pool_multiplier    multiplies a nitrogen pool mass directly, so it must lie
#                      in [0, 1] over the whole domain or the operator creates
#                      or destroys nitrogen.
#   partition_fraction splits a pool into two parts that are recombined later,
#                      so it must lie in [0, 1] for both parts to be masses.
#   factor             enters a product that is separately bounded; the gate
#                      holds it to `range` and the product to `products` below.
#
# `literals` are the numbers the form is built from. The gate checks each one
# appears in modules/ntransform.cpp, so an edit to the model that this file does
# not follow is a failure rather than a silent divergence.
response_functions:
  - name: f_volat_temperature
    reads: "nh3_volatilization, table 5 eqn 7 of Xu-Ri and Prentice (2008)"
    form: "min(1.0, exp(308.56 * (1.0/71.02 - 1.0/(T + 46.02))))"
    variables: {T: soil_temp_c}
    literals: [308.56, 71.02, 46.02]
    role: factor
    range: [0.0, 1.0]

  - name: nh3_multiplier
    reads: "nh3_volatilization, table 5 eqns 2,3,4,6. The whole coefficient of NH4_mass"
    # fpH alone carries the NH3/NH4 ratio. The port multiplied a further
    # nh3_max on top, 0.001 above pH 6 and 0.00001 at or below, which table 5
    # does not have; it is gone, and with it the factor-100 step at pH 6.
    form: "(min(1.0,w) * (1.0 - min(1.0,w))) * fT * fT * exp(2.0*(pH - 10.0))"
    variables: {pH: soil_ph, w: water_upper, fT: unit_interval}
    literals: [2.0, 10.0]
    role: pool_multiplier
    range: [0.0, 1.0]

  - name: wet_fraction
    reads: "substrate_partition, an S-curve on denitrifier activity from Pilegaard (2013)"
    form: "richards(0.05, 0.95, 7.5, 0.5, x)"
    variables: {x: wfps}
    literals: [0.05, 0.95, 7.5, 0.5]
    role: partition_fraction
    range: [0.0, 1.0]

  - name: nitrification_activity
    reads: "nitrification, the water response multiplying f_nitri_max"
    form: "min(1.0, exp(-log(3.0)*5.0*0.6) * exp(w * log(3.0)*5.0))"
    variables: {w: wfps}
    literals: [1.0, 3.0, 5.0]
    role: factor
    # Rises from 0.037 at zero water to 1.0 at 0.6 WFPS and is held there by the
    # min(), so the bound is an explicit clamp rather than a property of two
    # constants meeting. It reaches 1.0 and no more, which is what
    # gross_nitrification's product below is derived against.
    range: [0.0, 1.0]
    # The falling limb this function used to carry, and the argument it used to
    # be evaluated at, are both declared divergences from mainline LPJ-GUESS
    # 4.1.1 and are registered under `mainline_divergences` above, as
    # nitrification_wet_limb and nitrification_argument. The argument here is
    # what settles which of the two limbs the constants below belong to.

  - name: f_nitri_temperature
    reads: "nitrification, table 8 eqn 2"
    form: "min(1.0, pow((70.0 - T)/(70.0 - 38.0), 12.0) * exp(12.0*(T - 38.0)/(70.0 - 38.0))) if T < 70.0 else 0.0"
    variables: {T: soil_temp_c}
    literals: [70.0, 38.0, 12.0]
    role: factor
    range: [0.0, 1.0]

  - name: f_no_nitrification
    reads: "nitrification, the NO share of nitrification gas loss, Pilegaard (2013)"
    form: "richards(1.0, 0.5, 20.0, 0.375, x)"
    variables: {x: wfps}
    literals: [20.0, 0.375]
    role: partition_fraction
    range: [0.0, 1.0]

  - name: f_denitri_temperature
    reads: "denitrification, table 9 eqn 1"
    # Table 9 eqn 1 carries no min{1, .}. The function is 1 at 22 C and rises
    # past it, reaching 8.07 at the top of the declared temperature domain, so
    # the range here is the domain's and not a bound on the equation. What
    # keeps the two transformations it multiplies inside their pools is the
    # min() against the pool mass, declared as `clamped_by` on each product.
    form: "exp(308.56 * (1.0/68.02 - 1.0/(T + 46.02)))"
    variables: {T: soil_temp_c}
    literals: [308.56, 68.02, 46.02]
    role: factor
    range: [0.0, 8.1]

  - name: f_denitri_water
    reads: "denitrification, the moisture response of Weier et al. (1993)"
    form: "min(1.0, exp(13.0360*x - 11.6219))"
    variables: {x: wfps}
    literals: [13.0360, 11.6219]
    role: factor
    range: [0.0, 1.0]

  - name: denitrification_no_n2o_share
    reads: "denitrification, table 9 eqns 5 and 6. The NO plus N2O share of the reduced NO2, N2 being the rest"
    # RNODN + RN2ODN from table 11, times the table 9 eqn 1 temperature
    # response. This has to stay at or below 1 for eqn 7's remainder to be a
    # mass, which is what holds the partition together now that the branch at
    # 0.7 WFPS is gone. It reaches 0.178 at the top of the temperature domain.
    form: "(0.002 + 0.02) * exp(308.56 * (1.0/68.02 - 1.0/(T + 46.02)))"
    variables: {T: soil_temp_c}
    literals: [0.002, 0.02]
    role: partition_fraction
    range: [0.0, 1.0]

  - name: gas_emission_multiplier
    reads: "n_gas_emission, table 10 eqn 2. The coefficient of every gas pool"
    form: "fT * (1.0 - min(1.0, w))"
    variables: {fT: unit_interval, w: water_upper}
    literals: []
    role: pool_multiplier
    range: [0.0, 1.0]

# Products that have to stay inside [0,1] for the operator to be conservative.
# Each is a chain of factors that together multiply one pool mass. The gate
# evaluates the maximum of each factor over its domain and multiplies them.
#
# `clamped_by` is for a chain that CAN exceed its max and is held inside the
# pool by an explicit min() in the operator rather than by the size of its
# factors. The string is checked against modules/ntransform.cpp verbatim, so
# deleting that min() is a gate failure; without `clamped_by` a product above
# its max is a failure on its own. The two denitrification chains need it
# because table 9 eqn 1's temperature response has no min{1, .} and reaches
# 8.07 at the top of the declared temperature domain.
products:
  - name: gross_nitrification
    reads: "no3_inc = f_nitri_max * nit_act * f_nit_T * NH4_mass_d"
    factors: [instruction:f_nitri_max, nitrification_activity, f_nitri_temperature]
    max: 1.0
  - name: nitrification_gas_share
    reads: "ngas_inc = f_nitri_gas_max * no3_inc, then split by f_no"
    factors: [instruction:f_nitri_gas_max, f_no_nitrification]
    max: 1.0
  - name: denitrification_no3_to_no2
    reads: "no2_inc coefficient of NO3_mass_w, before its own min() clamp"
    factors: [instruction:f_denitri_max, f_denitri_temperature]
    max: 1.0
    clamped_by: "min(soil.NO3_mass_w,"
  - name: denitrification_no2_to_gas
    reads: "ngas_inc coefficient of NO2_mass_w, before its own min() clamp"
    factors: [instruction:f_denitri_gas_max, f_denitri_water, f_denitri_temperature]
    max: 1.0
    clamped_by: "min(soil.NO2_mass_w,"

# What this operator would need to be a Vesper result rather than an Earth
# operator run on Vesper's water and pH. Each carries the `undeclared` sentinel
# and the issue that owns it; `--strict` refuses while any of them is undeclared.
# There is no default value for any field here.
#
# The papers behind the calibration block settle none of these. Every one is
# Earth work at Earth's surface pressure and oxygen partial pressure, and none
# carries a water table: Xu-Ri and Prentice (2008) treats soil water in two
# sublayers of 0.5 and 1.0 m, Weier et al. (1993) incubated 60 g of repacked
# soil in a sealed jar, and Linn and Doran (1984) incubated 100 g subsamples
# compressed to a chosen bulk density in sealed jars.
vesper_preconditions:
  surface_pressure_response:
    declared: undeclared
    owner: sdec-8
    why: >
      Every response function above is a function of temperature, water or pH
      alone. None of them sees a pressure, so the operator gives the same
      nitrification and denitrification rates at this world's surface pressure
      as at Earth's.
  oxygen_partial_pressure_response:
    declared: undeclared
    owner: sdec-8
    why: >
      Nitrification is obligately aerobic and denitrification is what happens in
      its absence, so the aerobic and anaerobic split is a function of oxygen
      supply. The operator substitutes water-filled pore space for it through
      substrate_partition, which is what Xu-Ri and Prentice (2008) table 7 does
      too, at Earth's oxygen partial pressure. config/planet.yaml declares this
      world's pO2 and nothing in this operator reads it.
  soil_gas_diffusivity:
    declared: undeclared
    owner: sdec-8
    why: >
      The water-filled-pore-space responses stand in for gas diffusion through
      the pore network. Diffusivity depends on the gas, the pore geometry and
      the pressure, and the operator carries none of the three.
  water_table_redox_state:
    declared: undeclared
    owner: sdec-3
    why: >
      Every water term above is Soil::wfps(0) or get_soil_water_upper, the
      uppermost Gerten layer. A water table, and the reduced zone below it, has
      no representation here.
  nitrogen_gas_atmospheric_boundary:
    declared: undeclared
    owner: bio-23
    why: >
      The NO, N2O and N2 the operator emits leave the model at the soil surface
      and reach no atmospheric boundary. BIO-23 owns the handoff.

# Every constant and every response function above, against the calibration it
# came from. This is the Earth-calibrated response bracket the operator is held
# to. Where the source states a value, `paper_value` is that value; where it
# states a range, `bracket` is that range and nothing narrower is invented.
#
# `verdict` is what the arithmetic says, and the gate re-derives it:
#   agrees        the model's value is the paper's, or inside the paper's range
#   outside       the model's value is outside the range its own source gives
#   unsourced     no source states it. There is no bracket to be inside of,
#                 and no central value is fitted here to stand in for one
#
# A `verdict: agrees` entry whose value is not inside its bracket is a failure
# of this declaration, and so is an `outside` entry that has moved inside it.
# `--strict` refuses while any entry is `outside` or `unsourced`.
calibration:
  sources:
    xuri2008: >
      Xu-Ri and Prentice (2008), Terrestrial nitrogen cycle simulated with a
      dynamic global vegetation model, Global Change Biology 14(8) 1745-1764,
      10.1111/j.1365-2486.2008.01625.x.
      references/xuri2008-terrestrial-nitrogen-cycle-dgvm.pdf
    weier1993: >
      Weier, Doran, Power and Walters (1993), Denitrification and the
      dinitrogen/nitrous oxide ratio as affected by soil water, available carbon,
      and nitrate, Soil Science Society of America Journal 57(1) 66-72,
      10.2136/sssaj1993.03615995005700010013x.
      references/weier1993-denitrification-n2-n2o-ratio.pdf
    smith2014: >
      Smith, Warlind, Arneth, Hickler, Leadley, Siltberg and Zaehle (2014),
      Implications of incorporating N cycling and N limitations on primary
      production in an individual-based dynamic vegetation model,
      Biogeosciences 11, 2027-2054, 10.5194/bg-11-2027-2014.
      references/smith_2014_implications-of-incorporating-n-cycling-and-n-limitations-on-primary-p.pdf
    pilegaard2013: >
      Pilegaard (2013), Processes regulating nitric oxide emissions from soils,
      Phil. Trans. R. Soc. B 368(1621) 20130126, 10.1098/rstb.2013.0126.
      references/pilegaard_2013_processes-regulating-nitric-oxide-emissions-from-soils.pdf
    linn1984: >
      Linn and Doran (1984), Effect of water-filled pore space on carbon dioxide
      and nitrous oxide production in tilled and nontilled soils, Soil Science
      Society of America Journal 48(6) 1267-1272,
      10.2136/sssaj1984.03615995004800060013x.
      references/linn1984-water-filled-pore-space-co2-n2o.pdf
    stark1995: >
      Stark and Firestone (1995), Mechanisms for soil moisture effects on
      activity of nitrifying bacteria, Applied and Environmental Microbiology
      61(1) 218-221, 10.1128/aem.61.1.218-221.1995.
      references/stark1995-mechanisms-for-soil-moisture-effects-on-nitrifying-bacteria.pdf
      The only held source that measures nitrification against a dry-end
      moisture axis this model can reach. One silt loam.
    cosby1984: >
      Cosby, Hornberger, Clapp and Ginn (1984), A statistical exploration of the
      relationships of soil moisture characteristics to the physical properties
      of soils, Water Resources Research 20(6) 682-690, 10.1029/WR020i006p00682.
      references/cosby_1984_a-statistical-exploration-of-the-relationships-of-soil-moisture-charac.pdf
      Not a nitrogen source: the retention curve SoilInput::get_mineral builds
      the soil from, and therefore the only bridge between a water potential
      axis and this model's water-filled pore space one.
    greaves1920: >
      Greaves and Carter (1920), Influence of moisture on the bacterial
      activities of the soil, Soil Science 10(5) 361-387,
      10.1097/00010694-192011000-00004.
      references/greaves1920-influence-of-moisture-on-bacterial-activities.pdf
      The primary measurement behind linn1984 fig. 1's nitrification trace.

  entries:
    - what: instruction:f_nitri_max
      source: "xuri2008 table 11, Nmax, and the nitrification section on p.1752"
      paper_value: 0.1
      bracket: [0.1, 0.403]
      verdict: agrees
      why: >
        The paper gives Nmax = 0.1 per day from Khalil et al. (2004) and states
        it AT 20 C, while table 8 eqn 2's temperature response is normalised to
        1 at 38 C, where the model applies Nmax. That response is 0.248 at 20 C,
        so the operator rates 20 C nitrification at 0.0248 per day against the
        0.1 per day Khalil reports for 20 C. The bracket runs from the value as
        the paper writes it to the 0.403 per day peak that would honour Khalil
        at 20 C. The inconsistency is Xu-Ri's, carried faithfully into the port.

    - what: instruction:k_N
      source: "xuri2008 table 11, Kn, Michaelis-Menten constant for N oxides, from Li et al. (1992)"
      paper_value: 0.083
      verdict: agrees
      why: "0.083 kgN m-3, identical."

    - what: instruction:k_C
      source: "xuri2008 table 11, Kc, Michaelis-Menten constant for labile carbon, from Li et al. (1992)"
      paper_value: 0.017
      verdict: agrees
      why: "0.017 kgC m-3, identical."

    - what: instruction:f_denitri_gas_max
      source: "xuri2008 table 9 eqn 4"
      verdict: unsourced
      owner: world-nga4
      why: >
        The ceiling on the daily fraction of the anaerobic NO2 pool reduced to
        gas. Table 9 eqn 4 is DNmax * ftemp * NO2/(NO2 + Kn) with no
        maximum-rate constant beside it, and table 11 lists none; the port
        multiplies that expression by 0.33, which neither paper states. The
        constant is read in `denitrification`, which is what its name, the
        instruction file's comment, parameters.h, parameters.cpp and the
        declareitem help string all say it is. It used to be read in
        `nitrification` instead: four declarations agreed with the names and
        only the two reads disagreed, so world-nga4 moved the reads.

    - what: instruction:f_denitri_max
      source: "xuri2008 table 9 eqn 3"
      verdict: unsourced
      owner: world-nga4
      why: >
        Table 9 eqn 3 is DNmax * ftemp * NO3/(NO3 + Kn) with no maximum-rate
        constant beside it, and table 11 lists none. The port multiplies that
        expression by 0.33, a ceiling of a third of the anaerobic NO3 pool per
        day, which neither paper states.

    - what: instruction:f_nitri_gas_max
      source: "xuri2008 table 11, RNON and RN2ON, applied by table 8 eqns 3 and 4"
      bracket: [0.002, 0.042]
      verdict: agrees
      why: >
        The share of gross nitrification emitted as NO plus N2O. Table 8 eqn 3
        is NOinc = RNON * NO3inc and eqn 4 is N2Oinc = RN2ON * NO3inc, so the
        pair takes RNON + RN2ON of the flux and f_no_nitrification splits what
        leaves. Table 11 gives RNON as 0.1 to 4 per cent with a stated mean of
        2 per cent and RN2ON as under 0.1 to 0.2 per cent with no mean stated,
        and the bracket is the sum of those ranges. The declared 0.022 is the
        paper's stated mean where it states one and the top of the stated bound
        where it does not, which is the same rule the two denitrification gas
        fractions are taken by; RN2ON can move the total by at most 0.2
        percentage points, so the constant is RNON's mean to within a tenth of
        itself. The port ran the nitrification gas share at 0.33, 7.9 times the
        top of this bracket and 15 times its mean, and read it under the other
        gas constant's name.

    - what: form:michaelis_menten_divisor
      reads: "denitrification, water_cont_m3 = wcont * gawc[0] / 1000"
      source: "xuri2008 table 11 gives Kc and Kn in kg m-3, of an unstated volume"
      verdict: unsourced
      owner: world-nga5
      why: >
        Kc and Kn are half-saturation constants per cubic metre, and the paper
        does not say per cubic metre of what. The operator divides by the depth
        of AVAILABLE WATER in the upper layer, which makes the constants
        concentrations in the soil solution; per cubic metre of SOIL the divisor
        would be the 0.5 m layer depth instead. The two differ by a factor of
        6.7 to 30 over the reachable water contents of the LPJ soil codes, and a
        smaller divisor saturates the Michaelis-Menten terms sooner, so the
        soil-solution reading is the one that maximises denitrification. Li et
        al. (1992) is where the constants come from and is not held here.

    - what: function:f_volat_temperature
      source: "xuri2008 table 5 eqn 7"
      compared: form
      verdict: agrees
      why: >
        min{1, exp[308.56 * (1/71.02 - 1/(Tsoil + 46.02))]}, identical to the
        paper including the min, and equal to 1 at 25 C. The operator's extra
        guard at Tsoil below -40 C is a numerical necessity, since the argument
        diverges at -46.02 C; the function is already 4e-21 there.

    - what: function:gas_emission_multiplier
      source: "xuri2008 table 10 eqns 1 and 2"
      compared: form
      verdict: agrees
      why: >
        Gas released = pool * ftemp * (1 - Wcont), with table 10's ftemp the
        same function as table 5 eqn 7. Identical. The min(1, wcont) the code
        adds is a no-op, since Soil::get_soil_water refuses a wcont above 1.

    - what: function:f_nitri_temperature
      source: "xuri2008 table 8 eqn 2"
      compared: form
      verdict: agrees
      why: >
        pow((70 - T)/(70 - 38), 12) * exp(12 * (T - 38)/(70 - 38)), identical.
        The min{1, .} the port adds is a no-op: the function's maximum over all
        T is exactly 1, at 38 C.

    - what: function:f_denitri_temperature
      source: "xuri2008 table 9 eqn 1"
      compared: form
      verdict: agrees
      why: >
        exp[308.56 * (1/68.02 - 1/(T + 46.02))], identical, equal to 1 at 22 C
        with an implied Q10 of 2.04 over 15 to 25 C against the "about 2" the
        paper's text claims. The port added a min{1, .} that table 9 eqn 1 does
        not carry, unlike table 5 eqn 7 and table 10 eqn 1 which both state one,
        and it held denitrification in warm soil at the 22 C rate where the
        paper's function reaches 1.21 at 25 C, 1.61 at 30 C, 2.07 at 35 C and
        3.15 at 45 C. The clamp is gone. What keeps the operator conservative
        is not a bound on this coefficient but the min() against the pool mass
        on each of the two transformations it multiplies, which the
        denitrification products declare as `clamped_by`. The guard below -40 C
        stays a numerical necessity: the exponent diverges at -46.02 C and the
        function is 5e-21 there.

    - what: function:nh3_multiplier
      source: "xuri2008 table 5 eqns 2, 3, 4 and 6"
      compared: form
      verdict: agrees
      why: >
        Composing the paper's eqns 2, 3 and 4 gives NH3gas = NH4 * ftemp^2 *
        Wcont * (1 - Wcont) * fpH with fpH = exp(2 * (pH - 10)) from eqn 6,
        which is what the operator now computes. The port multiplied it by a
        further nh3_max, 0.001 above pH 6 and 0.00001 at or below. Table 5 has
        no such factor, and the paper's own text says why it needs none: "the
        NH3/NH4+ ratio ... is virtually zero (about 0.001) in solutions with pH
        below 6, but approaches unity (about 0.90) in solutions with pH above
        10", which is what fpH alone delivers, 3.4e-4 at pH 6 and 1.0 at pH 10.
        nh3_max applied that ratio a second time and put a factor-100
        discontinuity at pH 6 on top of a smooth exponential. Over the pH range
        pedology's soil map carries, the coefficient now reaches 9.2e-2 where
        it reached 9.2e-5, so NH3_SOIL rises by three orders of magnitude on
        the gridcells above pH 6 and five orders on the rest.

    - what: function:wet_fraction
      source: "xuri2008 table 7 and the nitrification section on p.1752, for the VARIABLE only"
      compared: value
      model_value: 0.5
      bracket: [0.50, 0.66]
      verdict: unsourced
      owner: world-nga8
      why: >
        This entry is the curve's MIDPOINT and nothing else. The paper settles
        the argument and only the argument: table 7 gives DyN's aeration
        variable as "soil moisture as water-filled pore space (WFPS)" and the
        nitrification section as the WFPS of the top 50 cm, which is the layer
        Soil::wfps(0) covers and which the operator reads. The functional form
        is the port's: Xu-Ri gives none, pointing instead at PnET-DNDC's
        anaerobic balloon. The bracket is the spread between the two numbers
        the operator's own comment asserts at once -- Pilegaard's crossover
        from nitrification- to denitrification-dominated emission at 0.60 WFPS,
        and the comment's own "steepest change around 66%" -- and the declared
        0.5 sits at its bottom edge. Neither paper states a midpoint, so none
        is fitted here to stand in for one.

    - what: form:wet_fraction_shape
      reads: "substrate_partition, richards_curve's shape parameter 7.5"
      source: "neither paper states a form for the aerobic and anaerobic split"
      verdict: unsourced
      owner: world-nga8
      why: >
        The shape parameter is a separate entry from the midpoint above because
        it is unsettled in a strictly worse way: the midpoint has two numbers
        the operator's own comment argues between, and this has none at all.
        The comment says the curve is complete by 0.75 WFPS and it reaches 0.83
        there. Nothing is fitted here to stand in for a source.

    - what: form:nitrification_activity_argument
      reads: "nitrification, the argument nit_act is evaluated at"
      source: "linn1984 fig. 1 and its objectives on p.1268"
      compared: form
      verdict: agrees
      why: >
        This entry is the curve's ARGUMENT and nothing else; its optimum, its
        removed wet limb and its remaining constants are the three entries
        below. A response rising to an optimum near 0.6 is the water-filled
        pore space shape, and linn1984 is where that shape enters the soil
        literature. Its fig. 1 plots relative nitrification against per cent
        WFPS, and the paper's stated objective is to replace per cent
        water-holding capacity with WFPS because WHC "depends on soil type, and
        the methods for its determination vary and are often poorly defined"
        (p.1268), which is the same objection world-b2i2 made to
        get_soil_water_upper in substrate_partition. This function read
        get_soil_water_upper, a fraction of AVAILABLE capacity, which is
        neither the axis the curve is drawn on nor the index its underlying
        data were measured in, so it put the peak of a WFPS curve at a
        texture-dependent wetness. It now reads Soil::wfps(0), as every other
        moisture response in the operator does. What that costs in reach is
        declared under the wfps domain above: wfps(0) tops out at field
        capacity over saturation, a median of 0.81 on the current soil map, so
        a gridcell reaches the optimum only near field capacity and sits on the
        rising limb the rest of the time. Since the wet limb is gone, nothing
        past the optimum is out of reach any more.

    - what: form:nitrification_activity_optimum
      reads: "nitrification, the wetness at which nit_act reaches 1.0"
      source: "greaves1920 table 5 and fig. 2, read against linn1984 fig. 1"
      compared: form
      verdict: agrees
      why: >
        The wetness the response tops out at, which is 0.6 WFPS. greaves1920 is
        the primary measurement: 22 soils incubated 21 days at 28 to 30 C with
        dried blood, moisture held at 10 to 100 per cent of each soil's
        water-holding capacity, nitric nitrogen determined at each. Table 5
        gives every soil, and 20 of the 22 form most nitrate at 50 or 60 per
        cent WHC, nine at 50 and eleven at 60; the paper states the optimum as
        "somewhere between 50 and 60 per cent of saturation" (p.373). The two
        exceptions are soil 20, a fine sand, and soil 22. linn1984 fig. 1
        replots the 22-soil mean of that table with per cent WHC read straight
        onto its per cent WFPS axis, so on the axis this function is evaluated
        at the measured optimum is 0.50 to 0.60 and the model's 0.6 sits at its
        top edge. What that relabelling is worth is the entry below.

    - what: form:nitrification_activity_wet_limb
      reads: "nitrification, the falling limb mainline multiplies nit_act by"
      source: "greaves1920 table 5 and the p.373 text, against linn1984 fig. 1"
      compared: form
      verdict: agrees
      why: >
        Mainline LPJ-GUESS 4.1.1 multiplies the rising limb by max(0, 4 - 5w),
        so nit_act is exactly zero at and above 0.8 and the operator stops
        nitrifying entirely on any gridcell wetter than that. That limb is
        gone, and the primary source is what removes it. greaves1920's mean at
        80 per cent WHC is 9.6 per cent of the optimum, not zero, and no soil
        of the 22 is at zero there; the paper's own zero is at 100 per cent
        WHC, which it calls saturation, with 90 per cent "very slight"
        (p.373). Neither table 5 nor fig. 2 carries any point past 80.
        So no single linear map from their axis to WFPS gives the mainline
        curve both of its anchors: the peak at 0.6 needs 100 per cent WHC to be
        1.0 WFPS, which is the identity relabelling linn1984 used, and the zero
        at 0.8 needs it to be 0.8. The 0.8 that does appear in linn1984 is
        Nommik (1956)'s threshold for significant DENITRIFICATION loss, a
        different process in the other direction. Removing the limb also
        removes a double count: fig. 1 labels the region above 60 per cent WFPS
        AERATION LIMITING and attributes the decline to "reduced aeration"
        (p.1267), and aeration is what substrate_partition already applies by
        handing this function only NH4_mass_d. The wet-end decline is now the
        partition's alone, and it is shallower than greaves1920: the partition
        leaves an aerobic share of 0.40 and 0.63 of its 0.6 WFPS value at 0.8
        and 0.7 WFPS against the measurement's 0.096 and 0.395. That magnitude
        belongs to the partition's shape, which world-nga8 owns, and is not
        recovered by applying the same control twice. The divergence is
        recorded on the response function above; world-i2ch owns it.

    - what: form:nitrification_activity_dry_limb
      reads: "nitrification, what the rising limb of nit_act produces between two stated water potentials"
      source: "stark1995 fig. 1 and the p.220 declines, placed on this model's axis by cosby1984"
      compared: derived
      bracket: [0.333, 0.430]
      verdict: agrees
      why: >
        The entry below is the limb's two CONSTANTS, which no source states.
        This is what they produce, which one does. stark1995 measured
        nitrification in a silt loam against soil WATER POTENTIAL, and this
        model carries a potential axis: SoilInput::get_mineral builds wilting
        point and field capacity by inverting cosby1984 eqn 1 at matric heads of
        10^4.2 and 10^2.0 cm, which are -1.554 and -0.0098 MPa, and Soil::wfps
        is (wcont*gawc + gwp)/gwsats, which is Theta/Theta_s exactly. So cosby
        eqn 1 makes potential a power law in water-filled pore space, per
        gridcell, from the sand and clay the model already reads. No relabelling
        is performed and none is needed, which is what separates this comparison
        from the one greaves1920 cannot support.
        Anchored where stark1995 anchors, at -0.1 MPa: their moist soil falls to
        0.51 at -0.5 MPa and 0.21 at -2.7 MPa, so log-linearly through their two
        reported points it is 0.333 at this model's wilting point; their shaken
        slurries, with NH4 supplied in excess so that only cell dehydration acts,
        fit k = 15.4*exp(0.58*psi) with r2 0.958, giving 0.430 at the same
        potential. Those two are the bracket, and they bracket a question rather
        than a scatter: how much of the dry-end decline nit_act should carry.
        The operator has no other term for substrate diffusion, and
        substrate_partition's aerobic share GROWS as the soil dries, so the
        moist-soil end is the one it should sit near.
        Evaluated at the water-filled pore space each of those potentials maps to
        on each of the current soil map's 4105 gridcells, this limb gives a
        median 0.526 at -0.5 MPa against their 0.510, and a median 0.364 at
        wilting point against their 0.333, inside the bracket and near its
        moist-soil end. THREE LIMITS ON CITING IT. It is one soil, so the bracket
        is between two treatments of the same silt loam and not between soils;
        stark1995's own discussion says the relationship "will undoubtedly change
        for different soil types and microbial communities" and that diffusional
        limitation should be more severe in coarse-textured soils, which is a
        spread it did not measure. Their -2.7 MPa point is drier than this
        model's wilting point, so it is outside the reachable window and only the
        -0.1 to -1.554 MPa span is compared. And their measurement is a 24 h
        incubation of a sieved, repacked soil at 23 C with ammonium supplied, so
        it is a laboratory potential response and not a field rate.

    - what: function:nitrification_activity
      source: "greaves1920 table 5 and stark1995, against xuri2008 table 8 eqn 1"
      compared: form
      verdict: unsourced
      owner: world-xmiq
      why: >
        The rising limb's own constants, everything else about this function
        being settled above. No source states either, and this entry is what
        --strict refuses on. TWO CONSTANTS, ONE NUMBER: the limb is
        exp(5*log(3)*(w - 0.6)) and only the product enters, so 5 and 3 are one
        slope of 5.493 per unit water-filled pore space written as two factors,
        and any pair with the same product is the same limb. No measurement can
        separate them, so a source for "base 3" and a source for "rate 5" do not
        exist to be found.
        The direction and the existence of a dry-end limit are settled by
        greaves1920: 19 of its 22 soils rise without a reversal to their own
        optimum and the other three dip by under 2 per cent of their maximum on
        the way, and nothing else in this operator limits nitrification as the
        soil dries, the partition's aerobic share GROWING as it does. xuri2008
        table 8 eqn 1 has no moisture term at all and smith2014 adds none -- its
        f(W) is the SOM decomposition scalar, a different function in a different
        place. greaves1920 cannot settle the SLOPE and this entry does not
        pretend it can: against its 22-soil mean the limb runs at 0.54 to 0.67 of
        the measurement over 0.1 to 0.5 WFPS, low by about a third, and against
        the scatter of the same table, each soil normalised to its own maximum,
        it is inside the measured range at every one of those points, but that
        range is 0.00 to 1.00 at 10 per cent WHC and 0.17 to 1.00 at 40, wide
        enough to admit almost any monotone limb.
        What the slope PRODUCES is bracketed, by stark1995 on this model's own
        retention curve, at form:nitrification_activity_dry_limb above, and the
        limb is inside that bracket. That is a check the slope passes and not a
        source for it: it is one soil, so it can refuse a slope and it cannot
        state one. Nothing is fitted here to stand in for a source -- a curve
        fitted to a 22-soil mean from a 1920 amended-soil incubation, on an axis
        that has to be relabelled to reach WFPS, would be another unsourced curve
        wearing a citation, and a slope fitted to one silt loam would be the same
        thing with a better axis.

    - what: function:f_no_nitrification
      source: "xuri2008 table 11 RNON against RN2ON, and pilegaard2013"
      compared: derived
      bracket: [0.33, 0.98]
      verdict: agrees
      why: >
        The NO share of the gas leaving nitrification. Table 11's RNON of 0.1 to
        4 per cent against RN2ON of under 0.1 to 0.2 per cent brackets the share
        at 0.33 to 0.98, and this curve gives 0.50 to 0.69 over the WFPS the
        model can reach, inside it. At 0.60 WFPS it gives 0.506, which is
        Pilegaard's NO:N2O ratio near 1 at that crossover. What the constant
        multiplying it is worth is a separate entry: see
        instruction:f_nitri_gas_max.

    - what: function:f_denitri_water
      source: "weier1993 table 2, denitrification rate at 60, 75 and 90 per cent WFPS"
      compared: value
      model_value: 13.0360
      bracket: [8.09, 14.06]
      verdict: agrees
      why: >
        min{1, exp(13.0360 * WFPS - 11.6219)} is log-linear in WFPS, so it
        asserts one constant factor per 15 WFPS points: exp(13.036 * 0.15) =
        7.07. Weier's table 2 covers four soils and nine carbon-by-nitrate
        treatments at each of 60, 75 and 90 per cent WFPS; its geometric means
        step by 6.35 and 8.23, its arithmetic means by 6.63 and 3.36. The
        bracket is those extremes expressed as the exponent, ln(3.36)/0.15 to
        ln(8.23)/0.15, and the declared 13.036 is inside it. The offset puts the
        function at 1 at 0.8915 WFPS, which normalises it to Weier's wettest
        treatment. The BRACKET IS ON THE EXPONENT, not on the function value.

    - what: function:denitrification_no_n2o_share
      source: "xuri2008 table 9 eqns 5, 6 and 7, with table 11's RNODN and RN2ODN"
      compared: derived
      bracket: [0.002, 0.049]
      verdict: agrees
      why: >
        The share of the reduced NO2 flux leaving as NO plus N2O, N2 being what
        table 9 eqn 7 leaves. Eqn 5 is NOinc = RNODN * ftemp * N2inc and eqn 6
        is N2Oinc = RN2ODN * ftemp * N2inc, with ftemp the table 9 eqn 1
        response. Table 11 gives RNODN as under 0.2 per cent with no mean
        stated and RN2ODN as 0.2 to 4.7 per cent with a stated mean of 2 per
        cent, so the sum brackets at 0.2 to 4.9 per cent. The operator's 0.002
        and 0.02 are the same rule as the nitrification gas share: the stated
        mean where the paper states one, the top of the stated bound where it
        does not. At 22 C the pair takes 2.2 per cent of the flux. This
        replaced three functions neither paper states -- an N2O:NO regression,
        an N2O:N2 curve and a logistic in soil temperature -- and the branch at
        0.7 WFPS between them.

    - what: form:denitrification_n2_share
      reads: "denitrification, n2_inc = ngas_inc - no_inc - n2o_inc"
      source: "weier1993 tables 4 and 5 against xuri2008 table 11"
      verdict: outside
      owner: world-bzqj
      why: >
        The two Earth calibrations disagree about how much of the reduced
        nitrogen leaves as N2, and the operator runs at the DyN end. Weier's
        tables 4 and 5 give N2/N2O for four soils, nine treatments and five
        days at 25 C; converted by the paper's own footnote the N2 share has a
        median of 0.565 over 109 observations at 60 per cent WFPS,
        interquartile 0.333 to 0.778; 0.744 over 129 at 75 per cent,
        interquartile 0.545 to 0.870; and 0.796 over 163 at 90 per cent,
        interquartile 0.630 to 0.938. The union of those interquartile ranges
        is 0.333 to 0.938. Xu-Ri table 9 eqns 5 to 7 with table 11's constants
        give 0.978 at 22 C, above all of it, and with no dependence on
        water-filled pore space at all. The operator is DyN and every other
        equation in it is DyN's, which is why it runs there; nothing here
        settles which Earth number this world's soil should carry.

    - what: form:denitrification_wfps_threshold
      reads: "denitrification, `if (water_cont_m3 > 0.0 && wfps_upper>0.4)`"
      source: "neither paper states a moisture threshold below which denitrification stops"
      verdict: unsourced
      owner: world-q4qy
      why: >
        Below 0.4 water-filled pore space the operator denitrifies nothing at
        all. Xu-Ri and Prentice (2008) has no such switch: table 9's rates fall
        with the moisture response and with substrate availability and never
        turn off. Weier et al. (1993) measured at 60, 75 and 90 per cent WFPS
        only and says nothing about the dry end. On the current Vesper soil map
        2032 of 4105 gridcells are above 0.4 WFPS even at wilting point, so on
        half the map the switch never closes and on the rest it decides whether
        denitrification happens at all.
