# The simulated snowpack's thermal properties, declared.
#
# Worldbuilding. Vesper is an invented planet and this file describes the
# vegetation model's snow as it runs on the simulation of it: the two thermal
# properties `update_snow_properties` derives from the modelled snowpack's
# density, and the places where this project's source departs from mainline
# LPJ-GUESS over them.
#
# The two are a CONDUCTIVITY, which is a material relation with a source and a
# published bracket, and a volumetric HEAT CAPACITY, which is a density times a
# specific heat and is settled by dimensional argument. They are different
# quantities with different arguments and neither settles the other, which is
# why they are two entries.
#
# `biosphere/scripts/snow_thermal_gate.py` reads this file. Each divergence is
# checked on both halves -- that the release's own lines are recorded beside the
# changed one, and that the changed one is what the model runs -- and the
# conductivity relation itself is checked against `lib/snow.py`, which is where
# it is DECLARED. This file records the divergences; it does not restate the
# polynomial, because a second copy of the coefficients is the defect the
# declaration exists to remove.
#
# The argument is `notes/audits/cryosphere-material-properties.md`, section
# "The snow conductivity: which relation, and why not Sturm" and the
# cross-component section under it. `analysis/ice_properties.py` evaluates all
# three relations across the density range the two components span.

# EVERY DIVERGENCE FROM MAINLINE LPJ-GUESS 4.1.1, WITH ITS VERDICT.
#
# `modules/soil.cpp`'s `update_snow_properties` arrived byte-identical to
# guess_4.1/modules/soil.cpp's (Zenodo record 8065737, SVN r10118) apart from a
# stripped MPL-2.0 licence header: the CNP fork never touched it, and the whole
# of the rest of that function is unchanged here. It is ON BY DEFAULT.
# `data/ins/global.ins` sets `iftwolayersoil 0`, which is what selects the
# multilayer soil temperature scheme, and `Ksnow` and `Csnow` become `Ki[]` and
# `Ci[]` for every active snow layer of that scheme's numerical solve whether
# `ifmultilayersnow` is 1 or 0. So every entry below is a change to default-on
# behaviour in a widely used community model, live in the configuration this
# project runs, and not a fork quirk inherited from the CNP tree.
#
# WHETHER A DIVERGENCE HAS BEEN EXECUTED IS A PROPERTY OF THE ENTRY AND NEVER
# OF THE REGISTER. `execution_arms` carries the matched arms that have run, each
# with the report it produced and the standing that report has; every entry
# names the arm that covers it or says `none` and why. One boolean over the
# whole register asserted something about entries appended after the arm ran,
# which is what a summary of a growing collection does.
#
# No LPJ-GUESS run this project has made has passed acceptance -- `world-qcse`
# has why -- so the arms block is empty and every statement here is arithmetic
# on the declared forms and on the papers. `comparison_arm` names what would
# change that.
#
# `verdict` is what this project decided about the change, not what the
# arithmetic says:
#   keep    the divergence stands and is declared. `mainline` records the lines
#           the release runs, verbatim, beside the changed one in the source
#   gate    the divergence stands but is not settled, and `--strict` refuses
#           while it does. There is no such entry; the kind exists so the next
#           one has somewhere to go that is not `keep`
# A divergence that does not survive review is reverted and leaves this file;
# reverting is the null result, not a defeat.
#
# The gate checks BOTH halves. Each `mainline` string has to be in the source,
# so the record cannot go missing, and NOT in it once comments are stripped, so
# a silent revert fails; `live` has to be in the stripped source, so deleting
# the changed line fails too.
mainline_divergences:
  release: "LPJ-GUESS 4.1.1, Zenodo record 8065737, SVN r10118, MPL-2.0"
  fork_reference: "LPJ-GUESS-CNP v1.0, mateusdp/LPJ-GUESS-NTD, subtree commit b368b893c4324840b43c56866e901c6916858afb, vendored at vendor/lpj-guess"
  # THE MATCHED ARMS THAT HAVE RUN, by name. An entry below claims one of these
  # by name or declares that none covers it. An arm no entry names is evidence
  # that has outlived what it was taken for, and the gate refuses it, so this
  # block cannot drift away from the register in either direction. Empty and
  # never absent, so a gate can tell an unwritten block from an empty one.
  execution_arms: {}
  comparison_arm: >
    What would bound what these are worth in a simulated soil temperature,
    which arithmetic on the declared forms cannot reach: one stock-4.1.1 arm
    against one Vesper arm, the same build, the same climatology and the same
    instruction file except that the stock arm restores mainline's whole
    `update_snow_properties` in modules/soil.cpp -- the Sturm conductivity block
    and the `ice_density` heat capacity together, since one arm bounds the
    combined effect of the entries naming it and does not attribute that effect
    to individual edits. The quantities to compare are the simulated soil
    temperature at 25 cm under snow-covered gridcells through the cold season,
    the thaw day, and the heterotrophic respiration and net mineralisation that
    follow from them, since decomposition reads the soil temperature and not
    the snow. Both divergences raise the modelled pack's thermal diffusivity, so
    they move the soil temperature the same way and the arm cannot separate
    them; separating them wants a third arm with one edit reverted, and nothing
    turns on that yet. It has to be run at `iftwolayersoil 0`, which is the
    default and the only configuration in which the multilayer scheme's snow
    layers exist at all.
  entries:
    - id: snow_conductivity_relation
      owner: world-gjov
      verdict: keep
      where: operator
      source_file: vendor/lpj-guess/modules/soil.cpp
      function: update_snow_properties
      mainline_form: line
      mainline:
        - "double snowdens_scaled = snowdens / rho_H2O;"
        - "if (snowdens > 156.0)"
        - "Ksnow = 0.138 - 1.01 * snowdens_scaled + 3.233 * snowdens_scaled * snowdens_scaled;"
        - "Ksnow = 0.023 + 0.234 * snowdens_scaled;"
      live: "Ksnow = 1.985 * snowdens_vf * snowdens_vf + 0.073 * snowdens_vf + 0.0336;"
      live_under: iftwolayersoil_0
      execution: none
      why_no_execution: >
        No LPJ-GUESS run this project has made has passed acceptance, so there
        is no run whose soil temperature could carry a comparison arm, and none
        could have (`world-qcse`: the trend statistic was fitted inside one
        memory time, and the spin-up is short of the derived 2318 cycles). The
        divergence has not been run in either direction. That is also what makes
        it cheap: nothing that has passed acceptance has consumed the superseded
        relation.
      settles: >
        Three things, and none of them is that the release disagreed with the
        climate model. Sturm et al. (1997) is a needle-probe regression; Riche
        and Schneebeli (2013) ran a long-heating needle probe, a guarded heat
        flux plate and a direct numerical simulation on IDENTICAL samples and
        concluded the simulation is the most reliable of the three, with a
        horizontally inserted needle probe wrong by up to a quarter either way
        through the anisotropy of the pack. Sturm's relation sits BELOW BOTH
        ARMS of the published kinetics bracket at every density the modelled
        snowpack reaches, so it is not a point inside the honest uncertainty but
        outside it. And Fourteau et al. (2021) computes the effective
        conductivity on tomographic microstructures INCLUDING the latent heat
        carried by water vapour diffusing through the pore space, which is a
        real term in a pack under a temperature gradient and which a
        conduction-only computation omits. Sturm's own stated uncertainty is 0.1
        W/m/K at 95 per cent confidence, which over the lower half of the
        modelled density range is comparable to the value being predicted.
      worth: >
        The modelled snow conducts between 1.50 and 2.30 times better than it
        did, over the whole density range the vegetation model reaches: the
        ratio is largest at the fresh-snow end of the compaction ramp and
        smallest at the settled end. The insulating resistance of a modelled
        pack, its thickness over its conductivity, therefore falls to between 44
        and 67 per cent of what it was at the same water equivalent, so the
        temperature drop across the pack per unit ground heat flux falls by the
        same factor. The snow's thermal diffusivity rises with the conductivity,
        so the modelled pack also tracks the simulated air temperature faster.
        Which way the simulated soil temperature moves is not settled by this,
        because it depends on the sign of the gradient across the pack: the
        change couples the modelled soil more tightly to the air above it in
        both directions. Decomposition reads the soil temperature, so
        `comparison_arm` is what prices it.
      also_changed: >
        `Csnow`, under `snow_heat_capacity_density` below, which is a different
        quantity with a different argument and is registered separately. The
        compaction ramp, the layer count and the numerical solve are the
        release's, unchanged, and nothing else in `update_snow_properties`
        moved.

    - id: snow_heat_capacity_density
      owner: world-2aij
      verdict: keep
      where: operator
      source_file: vendor/lpj-guess/modules/soil.cpp
      function: update_snow_properties
      mainline_form: line
      mainline:
        - "static const double ice_density = 917.0;"
        - "Csnow *= ice_density;"
      live: "Csnow *= snowdens;"
      live_under: iftwolayersoil_0
      execution: none
      why_no_execution: >
        The same reason the entry above carries: no LPJ-GUESS run this project
        has made has passed acceptance, so there is no run whose simulated soil
        temperature could carry a comparison arm. The divergence has not been
        run in either direction, and nothing that passed acceptance consumed the
        superseded line.
      settles: >
        That a volumetric heat capacity is the density of the substance
        occupying the volume times its specific heat, and the substance here is
        the modelled snowpack rather than solid ice. The release computes the
        specific heat from Fukusako's linear relation in absolute temperature,
        `(0.185 + 0.689 * T * 0.01)` kJ/kg/K, and then multiplies it by a local
        `ice_density` of 917 kg/m3 while the prognostic `snowdens` sits three
        lines above. THE SPECIFIC HEAT IS NOT WHAT IS WRONG: the modelled pack
        is ice Ih plus air and at every density it reaches the air carries under
        a thousandth of the mass, so a kilogram of pack stores what a kilogram
        of ice stores. Only the density is wrong, and the argument is
        dimensional rather than empirical, so no measurement is being preferred
        over another one. The climate model's `landmod.f90` had the identical
        defect in `snowcap` and GRAV-8 repaired it the identical way, by
        deriving it in `landini` from the density it was just given; this is the
        third instance of that one defect and the last of the three. The check
        that could have failed and did not: at the climate model's declared
        `rhosnow` of 330 the repaired line here gives 682,111 J/m3/K against
        that column's `snowcap` of 330 * 2090 = 689,700, 1.1 per cent apart,
        which is the two columns' specific heats disagreeing and not their
        construction.
      worth: >
        Snow reaches this model as a water equivalent and the thickness the
        numerical solve gets is `snowpack / (snowdens / water_density)`, which
        goes as 1/`snowdens`. A pack's thermal mass is that thickness times its
        volumetric heat capacity, so at fixed water equivalent it should not
        depend on the density at all: the two factors cancel. Pinning the
        capacity at solid ice's broke the cancellation, and the modelled pack's
        thermal mass per unit water equivalent was `ice_density`/`snowdens` too
        high -- 3.33 at `snowdens_start`, 1.83 at `snowdens_end`, 3.67 under
        `snowdensityconstant`. `Ci[]` takes `Csnow` directly for every active
        snow layer of the multilayer solve, so that factor was the capacity of
        the whole modelled pack. `Dsnow = Ksnow / Csnow` carries the reciprocal
        into the diffusivity: at 273.15 K the modelled pack's thermal
        diffusivity rises from 1.24e-7 to 4.12e-7 m2/s at `snowdens_start` and
        from 3.50e-7 to 6.42e-7 at `snowdens_end`, so the depth a temperature
        wave of a given period penetrates rises by 1.83 and 1.35. The modelled
        pack was both too slow to warm and too slow to cool; it now tracks the
        simulated air temperature above it faster in both directions. Which way
        the simulated soil temperature moves is not settled by this, for the
        same reason it is not settled for the conductivity: it depends on the
        sign of the gradient across the pack. Decomposition reads the soil
        temperature, so `comparison_arm` is what prices it.
      also_changed: >
        Nothing. `Ksnow` is the entry above's and moved for its own reasons; the
        specific heat, the compaction ramp, the layer count and the numerical
        solve are the release's. The local `ice_density` constant this line read
        is deleted with it and had no other reader. `modules/soil.h`'s
        `ice_density`, which is the density of the modelled SOIL ice, is
        untouched and is a different quantity; so is `lib/snow.py`'s
        `RHOICE_F2021`, which is part of Fourteau's fit. The three carry the same
        number and must not be deduplicated into one another.

# THE RELATION ITSELF IS NOT DECLARED HERE.
#
# `lib/snow.py` is the one statement of it, and both compiled models carry it as
# a literal because neither can import a Python module at runtime. That module's
# `check_restatements()` holds every literal to the one table, and this gate
# runs it, so the register cannot certify a divergence into a relation the
# climate column has since moved off. Restating the coefficients here would make
# a third copy with nothing above it.
#
# `densities` is the span the two components put through the relation, and the
# gate reads its two ends out of `modules/soil.h` rather than trusting this
# file: a compaction ramp that moves and a register that does not is the same
# drift in a different place.
relation:
  declared_in: lib/snow.py
  citation: >
    Fourteau, Domine, Hagenmuller (2021), Impact of water vapor diffusion and
    latent heat on the effective thermal conductivity of snow, The Cryosphere
    15, 2739-2755, 10.5194/tc-15-2739-2021, Eq. (18), the 263 K row of the
    vertical effective thermal conductivity. Read; references/INDEX.md carries
    the row.
  bracket: >
    The adopted row is the FAST kinetics limit, which is the UPPER endpoint of
    the bracket rather than a point inside it. Fourteau's Sect. 4.1 says which
    limit snow is in is unresolved. The slow limit is Calonne et al. (2011) Eq.
    (12) and lies below this line at every density carried, so the residual
    uncertainty is ONE-SIGNED: the modelled snow may conduct LESS than the model
    says and it cannot conduct more.
  densities:
    source_file: vendor/lpj-guess/modules/soil.h
    start: snowdens_start
    end: snowdens_end
    note: >
      The vegetation model's snow density is PROGNOSTIC, ramped from
      snowdens_start to snowdens_end by the Wania compaction scheme, where the
      climate model's is a single namelist key that sits inside this span. That
      is why the two could never have been reconciled by matching values: equal
      conductivities at one density would be a coincidence at one point of two
      curves that diverge everywhere else. It is the relation that is shared.
  no_other_relation:
    forbidden:
      - "3.233 * snowdens_scaled"
      - "0.234 * snowdens_scaled"
    why: >
      The superseded relation's own coefficients, which must appear nowhere in
      the vendored vegetation model outside the record of it. Checked over the
      whole subtree with comments stripped rather than over the one function, so
      a second snow conductivity growing somewhere else fails here.
