# `modules/somdynam.cpp`: where the simulated soil's decomposition operator
# leaves the fork it came from, and the phosphorus path it carries.
#
# Worldbuilding. Vesper is an invented planet and this file describes the
# vegetation model's soil organic matter dynamics as they run on the simulation
# of it: the saturation thresholds of the C:P ramps, the ramps themselves, the
# labile carbon the nitrogen transformation operator denitrifies on, and every
# place this project's source departs from the vendored LPJ-GUESS-CNP fork.
#
# THE SCOPE IS THE SOURCE FILE AND NOT THE ELEMENT. `biosphere/config/` carries
# one register per source file, because a gate reads a file: this one covers
# `modules/somdynam.cpp` and the `modules/soil.cpp` initialisation that pairs
# with it, and `ntransform.yaml` covers `modules/ntransform.cpp` and
# `data/ins/global_soiln.ins`. A divergence in somdynam.cpp whose constants
# arrive through the soil nitrogen instruction file is therefore split across
# the two, with each half naming the other.
#
# `biosphere/scripts/somdynam_gate.py` reads this file. Every constant is
# checked against the declaration the model reads it from, every ramp is
# evaluated over its whole driver domain and held to the P:C range its two
# endpoints allow, and every divergence is checked on both halves: that the
# fork's own line is recorded beside the changed one, and that the changed one
# is what the model runs. A value here that has drifted from the source is a
# failure of this declaration, not of the model.
#
# The argument, and what each number is calibrated against, is
# `biosphere/notes/phosphorus-cycle-parameterisation.md`.

# EVERY DIVERGENCE FROM THE VENDORED CNP FORK, WITH ITS VERDICT.
#
# THE REFERENCE POINT IS A SUBTREE COMMIT AND NOT A RELEASE, and that is the one
# structural difference from `biosphere/config/ntransform.yaml`. The soil
# nitrogen transformation operator is stock LPJ-GUESS 4.1.1, which can be named
# by Zenodo record and SVN revision, so its register carries a `release`. The
# phosphorus path does not exist in 4.1.1 at all: it is the CNP fork's own work,
# vendored as a git subtree, so the only thing a divergence here can be measured
# against is the commit that subtree was imported at. `reference` carries that
# commit, and the gate refuses a register that names no reference.
#
# The second difference follows from it. A divergence from a release is a change
# to default-on behaviour in a widely used community model. A divergence here is
# a change to a fork whose phosphorus arm this project does not yet run:
# `data/ins/global.ins` keeps `ifplim 0` and `framework/parameters.cpp` refuses
# `ifplim 1` outright. `bites_under` records which configuration each entry is
# live in, because an entry that is inert under `ifplim 0` is not thereby
# harmless -- it is waiting. Its vocabulary names the PHOSPHORUS switch, since
# that is the one the entries below turn on; an entry armed by a different
# switch says `both` and names its own in `settles`.
#
# `verdict` is what this project decided about the change, not what the
# arithmetic says:
#   keep    the divergence stands and is declared. `mainline` records the line
#           the fork runs, verbatim, beside the changed one in the source
#   gate    the divergence stands but is not settled, and `--strict` refuses
#           while it does. There is no such entry; the kind exists so the next
#           one has somewhere to go that is not `keep`
# A divergence that does not survive review is reverted and leaves this file;
# reverting is the null result, not a defeat.
#
# `mainline_form` says what shape the fork's own version has, because the two
# shapes are guarded differently:
#   line          the fork runs a DIFFERENT line. All three checks bite: the
#                 recorded form has to be in the source, absent from the source
#                 once comments are stripped, and the changed line present in it
#   commented_out the fork runs NOTHING there, and its version is a commented-out
#                 line. The recorded form then carries its own `//` and can never
#                 appear in the stripped source, so the second check is carried
#                 entirely by the third: the revert this entry guards against is
#                 the live line being commented out again, and `live` going
#                 missing from the stripped source is what catches it. The gate
#                 refuses a `commented_out` entry whose recorded form is not in
#                 fact commented, so the weaker guard cannot be claimed for a
#                 line that would support the stronger one
mainline_divergences:
  reference: "LPJ-GUESS-CNP v1.0, mateusdp/LPJ-GUESS-NTD, subtree commit b368b893c4324840b43c56866e901c6916858afb, vendored at vendor/lpj-guess"
  not_a_release: >
    LPJ-GUESS 4.1.1 has no phosphorus. The whole of this path -- pmass_labile,
    setptoc, the sorption isotherm, PMASS_SAT and PCONC_SAT -- arrived with the
    CNP fork, so there is no release form to compare against and no Zenodo
    record or SVN revision to name. The subtree commit is the reference point,
    and `docs/src/reference/vendored-upstreams.md` carries the pull command that
    reproduces it.
  # THE MATCHED ARMS THAT HAVE RUN, by name, and an entry below claims one of
  # these by name or declares that none covers it. WHETHER A DIVERGENCE HAS BEEN
  # EXECUTED IS A PROPERTY OF THE ENTRY: a boolean here would be one answer over
  # a register that is appended to, and would go on asserting it about entries
  # added after the last arm ran. No arm has run on this register, so the block
  # is empty and every entry says so for itself.
  execution_arms: {}
  comparison_arm: >
    What would bound what these are worth, though not whether they are right:
    one arm on the vendored CNP fork's own somdynam.cpp and soil.cpp against one
    Vesper arm, the same build, the same climatology and the same instruction
    file. It has to be run TWICE, once at ifplim 0 and once at ifplim 1, because
    an entry marked `bites_under: ifplim_1` is inert in the configuration this
    project runs and live in the one it does not. The quantities to compare are
    the soil organic C:P of SLOWSOM, PASSIVESOM, SOILMICRO and SURFHUMUS, the
    phosphorus riding carbon in transferdecomp's pinc, and the reported PO4_mass
    and availp. The ifplim 1 arm additionally needs framework/parameters.cpp's
    refusal lifted, which is BIO-34 and WORLD-PIDX and is not lifted here.
    An entry armed by a different switch is bounded by a different arm: the
    labile carbon path is live under `ifntransform` and the quantities it moves
    are the nitrogen transformation operator's, so its arm is the one
    `biosphere/config/ntransform.yaml` describes.
  entries:
    - id: pmass_sat_labile_currency
      owner: world-z01o
      execution: none
      why_no_execution: >
        No arm has restored the fork's PMASS_SAT under the same binary inputs.
        What this entry moves in the flows is live only under the ifplim 1 that
        `framework/parameters.cpp` refuses outright, so the arm that would cover
        it cannot be run on this tree until that refusal is lifted, which is
        `world-pidx` and BIO-34. What it moves under the ifplim 0 this project
        runs is the reported stock alone, and that is arithmetic on the pin.
      verdict: keep
      where: operator
      source_file: vendor/lpj-guess/modules/somdynam.cpp
      mainline_form: line
      mainline: ["static const double PMASS_SAT = 0.002;"]
      live: "static const double PMASS_SAT = 0.002 * 6.6;"
      bites_under: ifplim_1
      settles: >
        The constant is the fork's and the POOL it reads is what moved. Parton,
        Stewart and Cole (1988) Fig. 3 p. 115 saturates at 2.0 gP/m2 of labile
        P, and that paper's labile P is resin-extractable or isotopically
        exchangeable orthophosphate over 0 to 20 cm. This fork's
        soil.pmass_labile is the Hedley-labile pool of Wang et al. (2010) and
        Yang et al. (2013), labile inorganic plus labile organic, which Dantas
        de Paula et al. (2025) adopt deliberately to stand in for the
        biomineralisation pathway the model does not carry. Carried across
        unconverted, fac exceeds fmax nearly everywhere and the three ramped
        soil pools sit at their minimum C:P always. The scalar is 6.6, the
        fork's own simulated labile P of 2.11 PgP over Olsen-extractable 0.319
        PgP, and not the 11.3 the observational Hedley estimate gives, because
        setptoc consumes the simulated pool and 11.3 would carry the model's 41
        per cent under-prediction of its own target as well as the definitional
        conversion. The threshold and not the driver, because PMASS_SAT does a
        second job: somfluxes pins soil.pmass_labile to it whenever !ifplim, and
        that pin is DEFINED as holding labile P where the ramp stops responding,
        so converting the threshold and letting the pin follow is one definition
        propagating rather than a side effect.
      worth: >
        Under ifplim 0, the configuration this project runs, nothing in the
        carbon and phosphorus flows: the pin moves with the threshold, fac still
        arrives at fmax, and every soil organic C:P is where it was. What moves
        is the reported stock, because commonoutput.cpp writes the pinned
        pmass_labile into PO4_mass and availp, so the reported labile P lands on
        the same order as the fork's own simulated pool instead of an order
        below it. It is still a constant meaning "not limiting" and still not a
        simulated stock. Under ifplim 1 it bites: the emergent labile P has a
        threshold it can sit below, so the slow, passive and soil microbial
        pools ramp instead of saturating, and moving each from its minimum to
        the midpoint of its own range multiplies its C:P by 5.5, 1.61 and 1.83.
    - id: surfhumus_ptoc_ramp
      owner: world-shcp
      execution: none
      why_no_execution: >
        An arm covering this one is runnable today, since it is live under the
        ifplim 0 this project runs, and none has been run: no arm has restored
        the fork's commented-out call under the same binary inputs. The ifplim 1
        half of it waits on the same refusal as the entry above.
      verdict: keep
      where: operator
      source_file: vendor/lpj-guess/modules/somdynam.cpp
      mainline_form: commented_out
      mainline: ["//setptoc(soil, pmin_mass, SURFHUMUS, 200.0, 90.0, 0.0, PMASS_SAT);"]
      live: "setptoc(soil, pmin_mass, SURFHUMUS, 200.0, 90.0, 0.0, PMASS_SAT);"
      bites_under: both
      settles: >
        The fork leaves this call commented out, so the surface humus pool alone
        among the ramped pools has no phosphorus ramp and holds the C:P soil.cpp
        initialises it to for the whole of a run. The objection that kept it
        commented is that Parton, Stewart and Cole (1988) has no humus pool, so
        200 and 90 would be SLOWSOM's pair imported without a source. They are
        not imported: the PAIR is Fig. 3's slow line, and the IDENTIFICATION of
        surface humus with the slow pool is the model's own, stated twice in
        this fork. setntoc gives SURFHUMUS exactly SLOWSOM's (30, 15) off
        exactly SLOWSOM's driver, and soil.cpp's own alternative P
        initialisation, commented out beside the live one, sets SURFHUMUS and
        SLOWSOM to the same 1/90. The alternative was a measured surface humus
        C:P, which is the wrong KIND of quantity: setptoc sets the P:C at which
        a pool RECEIVES carbon, a stoichiometric target that moves with labile P
        by the phosphatase mechanism of McGill and Cole (1981), where a measured
        forest-floor C:P is an emergent bulk ratio. This line is also what
        re-derives a pool the P immobilisation branch flexes down, so the set
        that branch flexes and the set this block re-derives are one set again.
      worth: >
        Under ifplim 0 the pin holds fac at fmax, so the surface humus pool's
        C:P goes from a fixed 150 to a fixed 90 and the phosphorus riding carbon
        into it out of SURFSTRUCT, SURFFWD, SURFCWD and SURFMICRO rises by 1.67.
        Under ifplim 1 it ramps between 200 and 90 with labile P like the other
        three. transferdecomp reads sompool[receiver].ptoc with no ifplim guard,
        so this is the one entry of the three that is live in both.
    - id: surfhumus_ptoc_init
      owner: world-shcp
      execution: none
      why_no_execution: >
        There is nothing for an arm to measure while the ramp above runs, since
        setptoc overwrites this on the first call to somfluxes. It becomes
        measurable only if the ramp is reverted, which is what that entry's
        third check refuses, so an arm on this one alone would be an arm on a
        configuration this tree does not have.
      verdict: keep
      where: operator
      source_file: vendor/lpj-guess/modules/soil.cpp
      mainline_form: line
      mainline: ["sompool[SURFHUMUS].ptoc = 1.0 / 150.0;"]
      live: "sompool[SURFHUMUS].ptoc = 1.0 / 200.0;"
      bites_under: neither
      settles: >
        150 has no source for a humus pool. The block cited Fig. 2 of Parton,
        Stewart and Cole (1988), which is the P submodel's flow diagram and
        carries no C:P values; 150 appears in that paper only as the lower bound
        on the C:P of new plant material for wheat (p. 112) and as the
        structural litter C:N. Its three neighbours in the block are Fig. 3's
        ctop_max ends. 1/200 is the slow line's ctop_max end, under the same
        identification of surface humus with the slow pool that the ramp entry
        above runs on, which puts the block back on its own pattern.
      worth: >
        Nothing, and that is the point of pairing it with the ramp. With the
        ramp running, setptoc overwrites this on the first call to somfluxes, so
        the initial value is no longer load-bearing in either configuration. It
        was load-bearing for the whole of a run in the fork, where nothing
        overwrote it. Reverting the ramp alone would make it load-bearing again,
        which is what the ramp entry's third check refuses.
    - id: labile_carbon_paths
      owner: world-vyvn
      execution: none
      why_no_execution: >
        No arm has run the fork's single-coefficient form under the same binary
        inputs. The matched stock-4.1.1 arm in `biosphere/config/ntransform.yaml`
        predates this form -- its Vesper arm ran mainline's single
        frac_labile_carbon on summed respiration -- so it covers neither this
        half nor the instruction-file half, `labile_carbon_microbial_share`,
        which says `execution: none` there for the same reason. Re-taking that
        arm on a pair that passes acceptance is owed under `world-qcse`.
      verdict: keep
      where: operator
      source_file: vendor/lpj-guess/modules/somdynam.cpp
      mainline_form: line
      mainline: ["soil.labile_carbon = respsum * frac_labile_carbon;"]
      live: "soil.labile_carbon = labile_from_microbes + labile_from_humus;"
      bites_under: both
      settles: >
        Not a phosphorus entry, and its arming switch is `ifntransform`, which
        `data/ins/global_soiln.ins` sets to 1; `both` above is the phosphorus
        axis, on which it is live either way.
        The fork and stock LPJ-GUESS 4.1.1 both run one coefficient on the
        summed respiration of every CENTURY pool, and that coefficient is one of
        DNDC's two. Li, Frolking and Frolking (1992) p. 9765 states the soluble
        carbon pool per path: 60 per cent of the carbon leaving microbial
        biomass and 20 per cent of the carbon leaving humads, both being the
        share recycled into microbial biomass, against CO2 shares of 20 and 40
        per cent on the same paths. So DNDC's soluble-to-respired ratio is 3.0
        on the biomass path and 0.5 on the humads path, and the fork's 0.5 is
        0.2/0.4 exactly -- the humads path's ratio, applied to the biomass path
        as well.
        THE COEFFICIENTS CROSS AS FRACTIONS OF DECOMPOSITION AND NOT AS RATIOS
        TO RESPIRATION. DNDC respires 20 per cent of the carbon leaving
        microbial biomass; CENTURY respires 0.6 on every SURFMICRO call and
        0.85 - 0.68*(clay + silt) on SOILMICRO. Carrying 3.0 onto CENTURY's
        respiration would set labile carbon to 3.0*respfrac of the carbon that
        decomposed, which is 1.8 for every SURFMICRO call and above 1 for every
        SOILMICRO texture with clay plus silt below 0.76, so the ratio form
        cannot be transcribed. The recycled fraction can, and it is bounded by
        cdec by construction.
        THE POOL CORRESPONDENCE is the judgement, and it is one of kind rather
        than of number. DNDC's four pools are residues, microbial biomass,
        humads and passive humus; CENTURY's eleven are six litter pools, two
        microbial, two humified and one passive. SURFMICRO and SOILMICRO take
        DNDC's microbial biomass fraction, 0.6. SURFHUMUS and SLOWSOM take
        humads' 0.2: both receive from a microbial pool and both hand on to a
        more humified one, which is the position humads occupies in DNDC's
        figure 3, and the fork's own nitrogen ramp already identifies SURFHUMUS
        with SLOWSOM. The six litter pools contribute nothing, which is DNDC's
        own structure and not an omission: its soluble carbon draws from biomass
        and humads decomposition alone, and residue carbon reaches it one step
        later, after passing through microbial biomass, exactly as litter carbon
        does here.
        WHERE IT IS IMPERFECT, in three places. PASSIVESOM has no counterpart,
        because DNDC's stable humus does not decompose and so forms no fraction;
        it is given the humified coefficient as CENTURY's terminal humified
        pool. SLOWSOM returns csa = 1 - csp - 0.55 of its decomposition to
        SOILMICRO, 0.447 to 0.450 over the whole clay range, where DNDC's humads
        returns 0.2, so the two models disagree by a factor of 2.2 about the
        same quantity; DNDC's number is taken because the parameter exists to
        import DNDC's definition, and the disagreement is carried as the bracket
        [0.2, 0.447] on instruction:frac_labile_carbon_humus in
        `biosphere/config/ntransform.yaml`. And SOILMICRO's cdec includes the
        organic leaching share, which DNDC has no path for, so 0.6 is applied to
        a little carbon that leaves as DOC.
        The two coefficients arrive through `data/ins/global_soiln.ins` as
        `frac_labile_carbon` and `frac_labile_carbon_humus`; the
        instruction-file half of this divergence is
        `labile_carbon_microbial_share` in `biosphere/config/ntransform.yaml`,
        which is also where each number is checked against the paper.
        `framework/parameters.cpp` and `parameters.h` declare the second key and
        both help strings now say decomposition rather than respiration, which
        is what the operator reads.
      worth: >
        Bounded by hand, because somfluxes' steady state fixes each pool class's
        share of decomposition from the transfer coefficients alone: every unit
        of litter carbon leaves as CO2 or as DOC, so the shares do not depend on
        the decay rates, only on the network. Solved for unit input, the paired
        form gives 0.70 of mainline's labile carbon on a leaf-and-root litter
        mix, 0.62 to 0.74 across the texture simplex, 0.49 on a woody mix and
        0.26 on coarse woody debris alone; lignin moves it by under 0.01 and
        organic leaching by under 0.05. So the repair LOWERS the substrate term
        rather than raising it, which the row that opened it did not expect: the
        litter pools carry 48 to 76 per cent of respiration and DNDC gives them
        nothing.
        d_N_max is that carbon over k_C * water plus that carbon. k_C * water is
        of order 0.0026 kgC/m2 for a 150 mm available capacity and the labile
        pool is of the same order or below, so the operator sits on the roughly
        linear limb and 0.7 to 1.0 of the fall reaches d_N_max, hence both
        denitrification steps. Against the span this file's constants already
        cover -- the stock-versus-Vesper arms put gross denitrification 209
        times apart -- a factor between 0.26 and 0.88 is a small share, and
        plant mineral-N uptake moved 0.343 per cent over that 209-fold span, so
        no visible change in what the simulated plants take up is expected.
        None of this is execution-verified and it cannot be until an LPJ run
        reaches acceptance: `world-qcse`.

# The two saturation constants, checked against the source that declares them.
# `declaration` is matched verbatim against modules/somdynam.cpp with comments
# stripped, and `value` is re-derived by evaluating that line's own initialiser,
# so neither this file nor the source can move the number without the other.
#
# `sourced` is whether a phosphorus source states the quantity. `--strict`
# refuses while one is false, which is the same refusal
# framework/parameters.cpp already makes on ifplim 1.
constants:
  source_file: vendor/lpj-guess/modules/somdynam.cpp
  values:
    - name: PMASS_SAT
      declaration: "static const double PMASS_SAT = 0.002 * 6.6;"
      value: 0.0132
      unit: kgP/m2 of labile P
      sourced: true
      source: >
        Parton, Stewart and Cole (1988) Fig. 3 p. 115, whose labile-P axis runs
        0 to 2.0 gP/m2 and every line of which reaches its minimum C:P at the
        right-hand end, converted into this fork's Hedley-labile currency by
        6.6. Register entry pmass_sat_labile_currency.
      owner: world-z01o
    - name: PCONC_SAT
      declaration: "static const double PCONC_SAT = 0.02;"
      value: 0.02
      unit: phosphorus fraction of litter dry mass
      sourced: false
      source: >
        None. It carries NCONC_SAT's 0.02 exactly, and Parton, Stewart and Cole
        (1988) has no counterpart to the ramp it drives: that model has no
        surface microbial pool and no C:P ramp driven by a litter concentration,
        and its litter P is set by a fixed structural C:P of 500 with the
        remainder going to the metabolic pool (p. 115). It is compared against
        litter_pmass / (litter_cmass * 2), whose whole attainable range is
        3.1e-4 to 7.6e-4 for senesced-litter C:P of 1596 to 660 by mass
        (McGroddy et al. 2004, Table 1), so 0.02 is 26 to 64 times above the
        richest litter the model can make and the surface microbial pool sits at
        its maximum C:P always. That bounds a replacement from above and nothing
        anchors it from below.
      owner: world-pidx

# Every C:P ramp the model runs, as a call the source has to contain and as a
# function the gate re-derives.
#
# The gate BUILDS the call string from the fields below and requires it in
# modules/somdynam.cpp with comments stripped, so a pair changed in the source
# and a pair changed here fail the same check. `occurrences` is how many times
# that call appears; a ramp called from two places fails if one of them goes.
#
# `ptoc_range` is what setptoc can return over the whole driver domain:
# 1/ctop_max at or below fmin, 1/ctop_min at or above fmax, and the linear
# interpolation between. A ramp leaving it sets a receiving pool's P:C to
# something neither endpoint allows, which is a stoichiometry the figure does
# not contain.
ramps:
  source_file: vendor/lpj-guess/modules/somdynam.cpp
  citation: >
    Parton, Stewart and Cole (1988), Dynamics of C, N, P and S in grassland
    soils: a model, 10.1007/BF02180320. Fig. 3, p. 115. Read; references/INDEX.md
    carries the row. Its three lines are the three soil pairs below; the surface
    microbial pair is the active soil line applied to a pool that paper does not
    have, which is what PCONC_SAT's `sourced: false` records.
  entries:
    - name: slowsom_ptoc
      pool: SLOWSOM
      driver: pmin_mass
      ctop_max: 200.0
      ctop_min: 90.0
      fmin: 0.0
      saturates_at: PMASS_SAT
      occurrences: 1
      ptoc_range: [0.005, 0.011111111111111112]
      reads: "Fig. 3's slow soil P line"
    - name: passivesom_ptoc
      pool: PASSIVESOM
      driver: pmin_mass
      ctop_max: 200.0
      ctop_min: 20.0
      fmin: 0.0
      saturates_at: PMASS_SAT
      occurrences: 1
      ptoc_range: [0.005, 0.05]
      reads: "Fig. 3's passive soil P line"
    - name: soilmicro_ptoc
      pool: SOILMICRO
      driver: pmin_mass
      ctop_max: 80.0
      ctop_min: 30.0
      fmin: 0.0
      saturates_at: PMASS_SAT
      occurrences: 1
      ptoc_range: [0.0125, 0.03333333333333333]
      reads: >
        Fig. 3's active soil P line, and this fork's soil microbial pool is
        CENTURY's active pool. The paper's conclusions (p. 128) give the active
        range as 20 to 80 where its model description (p. 115) and Fig. 3 give
        30 to 80; the code follows the figure.
    - name: surfhumus_ptoc
      pool: SURFHUMUS
      driver: pmin_mass
      ctop_max: 200.0
      ctop_min: 90.0
      fmin: 0.0
      saturates_at: PMASS_SAT
      occurrences: 1
      ptoc_range: [0.005, 0.011111111111111112]
      reads: >
        Fig. 3's slow soil P line again, under the identification of surface
        humus with the slow pool the fork's own nitrogen ramp makes. Register
        entry surfhumus_ptoc_ramp; the fork leaves this call commented out.
    - name: surfmicro_ptoc
      pool: SURFMICRO
      driver: "litter_pmass / (litter_cmass * 2.0)"
      ctop_max: 80.0
      ctop_min: 30.0
      fmin: 0.0
      saturates_at: PCONC_SAT
      occurrences: 2
      ptoc_range: [0.0125, 0.03333333333333333]
      reads: >
        Fig. 3's active soil P line applied to a surface pool the paper does not
        have, off a litter concentration it does not ramp on. Called from
        transfer_litter and from the crop harvest path. The driver's whole
        attainable range is three orders of magnitude below PCONC_SAT, so this
        ramp returns 1/80 everywhere until PCONC_SAT is settled.

# Lines the phosphorus argument rests on, which the model has to still contain.
# Each is matched against modules/somdynam.cpp with comments stripped: a claim
# in the register that names an invariant the source no longer has is a silent
# revert of the argument rather than of a line.
invariants:
  source_file: vendor/lpj-guess/modules/somdynam.cpp
  entries:
    - name: labile_p_pin_reads_the_threshold
      line: "soil.pmass_labile = PMASS_SAT;"
      why: >
        The conversion entry rests on the pin and the ramp threshold being one
        number rather than two that coincide. Splitting them into separate
        constants would invent a second number with no independent derivation
        and let the pair drift, so the pin reading the symbol is what makes
        converting the threshold one definition propagating.
    - name: labile_carbon_microbial_path
      line: "double labile_from_microbes = frac_labile_carbon * (soil.sompool[SURFMICRO].cdec + soil.sompool[SOILMICRO].cdec);"
      why: >
        The labile_carbon_paths entry's `live` line is the sum of the two paths
        and would still be there if either path's pool set or coefficient moved.
        This is the microbial half: which pools carry DNDC's 0.6, and that it is
        applied to cdec rather than to a respiration term. Changing either
        without changing the register is the silent fork the entry exists to
        prevent.
    - name: labile_carbon_humified_path
      line: "double labile_from_humus = frac_labile_carbon_humus * (soil.sompool[SURFHUMUS].cdec + soil.sompool[SLOWSOM].cdec + soil.sompool[PASSIVESOM].cdec);"
      why: >
        The humified half, and the one carrying a bracket: SURFHUMUS, SLOWSOM
        and PASSIVESOM take DNDC's humads fraction where CENTURY's own
        SLOWSOM-to-SOILMICRO share is 2.2 times it. Dropping a pool from this
        set or moving it to the microbial line changes the quantity the bracket
        is declared on.
    - name: ptoc_is_set_on_the_receiving_pool
      line: "soil.sompool[pool].ptoc = 1.0 / ctop_max;"
      why: >
        setptoc sets the P:C of the pool RECEIVING carbon, which is the paper's
        own statement of how the organic P flows are computed (p. 115) and is
        what makes a stoichiometric target the right KIND of quantity where a
        measured bulk C:P is not. The surfhumus_ptoc_ramp entry's argument fails
        if this becomes a ratio of the donating pool.

# SDEC-1: the 40,000-year monthly accelerator must be the sampled daily
# operator, not a second nutrient model. `century_acceleration_gate.py` checks
# these source forms and exercises the reduced operator on deterministic C-N-P
# fixtures without launching LPJ-GUESS.
century_acceleration:
  contract_version: vesper-century-acceleration/1
  source_file: vendor/lpj-guess/modules/somdynam.cpp
  state_file: vendor/lpj-guess/framework/guess.h
  initialization_file: vendor/lpj-guess/modules/soil.cpp
  sampled_operator:
    uptake_and_mineral_leaching: multiplicative_daily_survival
    across_sample_years: geometric_mean_monthly_survival
    organic_leaching: decay_weighted_monthly_transfer_coefficient
    phosphorus_forcing: daily_flux_sum_per_sample_year
    phosphorus_mutation: pmass_add_labile_sorbed_isotherm
  restored_after_acceleration:
    - pmass_labile
    - pmass_sorbed
    - pmass_strongly_sorbed
    - pmass_occluded
  required_source:
    - "soil.mminleach_survival[date.month] *= (1.0 - minleachfrac);"
    - "soil.mminpleach_survival[date.month] *= (1.0 - minleachfrac);"
    - "soil.morgleach_cmass[date.month] += leachsum_cmass;"
    - "soil.msoilmicro_cdec[date.month] += soil.sompool[SOILMICRO].cdec;"
    - "soil.morgleach_cmass[m] / soil.msoilmicro_cdec[m]"
    - "soil.fnuptake_survival[date.month] *="
    - "soil.fpuptake_survival[date.month] *="
    - "pow(soil.fnuptake_survival[m], 1.0 / nyear)"
    - "pow(soil.fpuptake_survival[m], 1.0 / nyear)"
    - "pow(soil.mminleach_survival[m], 1.0 / nyear)"
    - "pow(soil.mminpleach_survival[m], 1.0 / nyear)"
    - "soil.apwtr_mean += daily_pwtr;"
    - "soil.apdep_mean += soil.pmass_labile_input;"
    - "soil.apwtr_mean /= nyear;"
    - "soil.apdep_mean /= nyear;"
    - "pmass_apply_survival(soil, soil.fpuptake_survival[m]);"
    - "pmass_apply_survival(soil, soil.mminpleach_survival[m]);"
    - "pmass_add(soil, (soil.apwtr_mean + soil.apdep_mean) / 12.0);"
  forbidden_source:
    - "soil.apwtr_mean += soil.apwtr;"
    - "soil.apdep_mean += soil.apdep;"
    - "nmass * (1.0 - soil.mminleach_mean[m])"
    - "soil.pmass_labile *= (1.0 - soil.fpuptake_mean[m]);"
    - "soil.pmass_labile += (soil.apwtr_mean + soil.apdep_mean) / 12.0;"
