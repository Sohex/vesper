# THE WETLAND, PEAT AND METHANE ACTIVATION DECLARATION.
# Read by biosphere/scripts/wetland_gate.py.
#
# Turning the simulated biosphere's peatland and methane modules on is not two
# switches. It is the point where four models get collapsed into one -- where
# wetlands are, how water reaches and leaves them, how peat carbon and redox
# make and consume CH4, and what an atmosphere does with the flux -- and this
# file is where each of them is either DECLARED or refused. The argument is in
# biosphere/notes/wetland-activation-contract.md; the finding it rests on is
# biosphere/notes/wetlands-peat-methane-audit.md.
#
# THE SENTINEL IS `undeclared`, AND IT REFUSES. There is no default value for
# any field here, deliberately: a default is how an Earth number becomes this
# world's number without anyone deciding it should. Replacing `undeclared` with
# a value is a DECISION and takes the bd issue named beside it.
#
# The gate is fail-closed in one direction only. With `requested: false` it
# reports what is undeclared and exits 0, because a biosphere run with peat and
# methane off is a correct run. With `requested: true` it refuses, by name, for
# every unmet precondition.

version: 1

# The only switch a caller sets. `true` REQUESTS activation; it does not grant
# it. `biosphere/scripts/run_lpj_guess.py` asks the gate and writes
# `run_peatland 0`, `ifmethane 0`, `ifsaturatewetlands 0` and `wetland_runon 0`
# into the instruction file whenever the gate has not granted activation. All
# four are written rather than inherited, because an inherited zero cannot be
# told apart from nobody having decided.
requested: false

# WET-3. The hydrology repair. Every field here names the artifact that closes
# one defect the audit found in the vendored source, and the gate ALSO probes
# the source for that defect on every invocation. A probe that stops matching
# grants nothing on its own: the declaration still has to be made. A probe that
# still matches while the declaration says the defect is closed is a
# contradiction, and the gate reports it as one.
hydrology:
  # The infiltration path bounded by the water that actually arrived.
  # Saturation is an outcome of the ledger, never a source term. WET-3.
  free_water_repair: >-
    modules/soilwater.cpp bounds the mineral-wetland infiltration by
    min(soil.rain_melt, total_potential) and distributes it in proportion to
    each layer's remaining deficit, on the same terms as the peatland and
    upland branches beside it. ifsaturatewetlands selected the path that added
    the full deficit regardless, and the module now fails on it rather than
    creating the water.
  # The single daily exchange that closes precipitation, snow, routed surface
  # water, groundwater recharge and discharge, PLHY uptake and ET, storage and
  # runoff. PLHY-4 owns the exchange; the wetland consumes it and may not make a
  # second withdrawal. WET-3.
  water_ledger: undeclared
  # What supplies runon, once the fixed wetland_runon scalar is gone. WET-3.
  runon_source: >-
    hydrography/config/land_water_ledger.yaml, the `capillary_rise` and
    `drainage` terms, whose flux PLHY-4 owns and has not declared. Until it
    does, the term is ABSENT from modules/soil.cpp rather than approximated:
    the wetland_runon scalar and the soiltype.runon read are both gone, and an
    absent term is one this ledger can name where a constant is a second
    account of where the water came from.
  # The annual water-table average, on an ordinal the calendar reaches. WET-3.
  annual_water_table_update: >-
    modules/soil.cpp guards it on date.day == Date::MAX_YEAR_LENGTH - 1, the
    last ordinal Date::next() reaches on this world's calendar and on Earth's.
    Guarded on MAX_YEAR_LENGTH the block never ran, awtp held its initial 0.0
    across the whole run and across restarts because it IS serialized, and
    update_acrotelm_co2 pinned the simulated acrotelm CO2 to the pore-water
    value everywhere and always.
  # A fixture that stops a run, resumes it, and requires the resumed state to
  # reproduce the uninterrupted one exactly. WET-3.
  restart_continuity_fixture: >-
    biosphere/scripts/verify_lpj_restart_continuity.py, in three modes. The
    default compares a whole run against one split at a simulated year boundary,
    table for table and row for row, over every year from the restart point.
    --one-day splits at an arbitrary simulated DAY and compares the two runs'
    state files one day later, so state the serializer drops shows up as bytes
    that differ after a single day rather than as a year of divergence.
    --round-trip writes the state again with no day in between, which names what
    the write and read of a state file does not carry. The last two exist
    because WORLD-FUJ4 gave framework/framework.cpp a save point the caller can
    place on any simulated day, and a restart that resumes on it; before that it
    serialized exactly once, at the end of year state_year - 1, a restarted run
    resumed at day 0 of state_year and could never reach that save point again,
    and no run could both restart and save. No mode has been RUN, because no
    compiled model or built forcing exists until a baseline climatology does,
    and each exits saying so rather than reporting a pass it did not earn.

  # The prognostic peat-hydrology members the serializer must carry before an
  # arbitrary-day restart means anything. The gate reads Soil::serialize and
  # refuses for each one still absent. Adding a name here adds a requirement;
  # it does not assert the member exists.
  required_restart_members:
    - Wtot
    - wtd
    - stand_water
    - mwtp
    - Frac_ice
    - rootfrac
    # The three quantities canopy_exchange reads on the day BEFORE the one that
    # writes them: simulate_day runs it ahead of soilwater, so the simulated
    # moss and graminoid photosynthesis of any day uses the water-table limits
    # and the acrotelm CO2 hydrology_peat left yesterday. acro_co2 became a live
    # difference rather than a latent one when WORLD-C4J8 unpinned awtp.
    - acro_co2
    - dmoss_wtp_limit
    - dgraminoid_wtp_limit
    # The annual accumulators. A restart at day 0 rebuilds all four before
    # anything reads them; at any other day dec_snowdepth bars establishment,
    # dthaw shortens GLOBFIRM's fire season, and mthaw and
    # maxthawdepththisyear report a partial year as a whole one. WORLD-FUJ4
    # made that restart expressible.
    - dec_snowdepth
    - dthaw
    - mthaw
    - maxthawdepththisyear

# WET-2. The classification is a PARTITION of a cell's land, so every class in
# it needs a source and a class with none is land the partition cannot account
# for. Four of the five are resolved on the native mesh by
# `hydrography/scripts/build_wetness.py`; the saturated non-inundated mineral
# class has NO source at any support, because the saturated-area closure that
# would have supplied a saturated fraction is withdrawn in
# `hydrography/config/topographic_index.yaml` on its declared score's verdict.
# What reopens it is a score whose SUPPORT can resolve a gain of a few
# thousandths of an AUC, never a narrower criterion;
# `hydrography/notes/subgrid-water-table.md` section 7 has the route and
# `docs/src/reference/external-data.md` has the observations that route would
# need. The alternative, and what this declaration TAKES, is the reduced form
# WET-12 declares in `biosphere/notes/reduced-wetland-form.md`, together with
# what dropping the class costs in claims; the gate refuses a class dropped
# without both the reason and the row that licensed it.
extent:
  # The mutually exclusive classification: persistent peat-forming land,
  # saturated non-inundated mineral soil, seasonal inundation, open
  # lake/river/playa water, dry mineral soil. Fractions, not thresholds, and
  # closing against BIO-11's rootable surface without double counting. WET-2.
  classification: >-
    one label per mesh region and, per climate-grid cell, the AREA share of each
    class over the cell's land, from `lib/gridding.py`'s CATEGORICAL reduction
    and never a majority label. The partition is cut against the PERIODIC lake
    cycle rather than the annual equilibrium: a region under the solved lake in
    every time bin is open water, one under it in some bins is seasonal
    inundation, one inside a closed depression's footprint that neither takes is
    playa, and the rest is dry mineral soil. Peat-forming land is the simulated
    peatland stand's own state. The saturated non-inundated mineral class is
    ABSENT under WET-12's reduced form, so the land it would have taken stays in
    the residual and a dry mineral share is an upper bound by exactly that area.
    `hydrography/scripts/build_wetness.py` enforces exclusivity rather than
    assuming it -- a region two classes claim is refused, land no class claims is
    refused unless a residual is named, and the shares must partition the cell or
    nothing is written -- and it re-measures the two lake paints against each
    other on every run. Fractions throughout: no threshold on a cell mean, and
    no absolute compound-topographic-index cut.
  # One source per class, each from the closed set in
  # `biosphere/scripts/wetland_gate.py:EXTENT_SOURCES`, which is where each
  # source's artifact, field and licence are stated. The set is closed because
  # a source named in prose cannot be checked against what hydrography
  # publishes, and the gate checks each named artifact against the builds under
  # `hydrography/data`. A class with no source is declared absent as a mapping
  # carrying `absent_because` and `licensed_by`, never left blank. WET-2.
  class_sources:
    peat_forming: lpj_guess:peatland_stand
    # THE ONE CLASS THIS DECLARATION DROPS, and it is dropped with a reason and
    # a licence rather than left blank. WET-12's reduced form and the ledger of
    # what taking it costs are `biosphere/notes/reduced-wetland-form.md`.
    saturated_mineral:
      absent_because: >-
        no saturated fraction is published at any support. The saturated-area
        closure that would have supplied one is withdrawn in
        `hydrography/config/topographic_index.yaml` on the verdict of a score
        that config declared before any fraction was computed, and
        `hydrography/notes/subgrid-water-table.md` section 7 measures why no
        narrower criterion can license one: on every arm of both Earth bore sets
        the gain the terrain half carries over the cell-mean depth is at or
        below the scatter its own support puts on it, and a narrower criterion
        has less support rather than more. PALADYN, the published design that is
        the floor for the other two parts of this component, keys its wetland
        extent on the same TOPMODEL saturated fraction, so there is no reduced
        form of this class to fall back to either.
      licensed_by: >-
        WET-12 and WORLD-4FR6. `biosphere/notes/reduced-wetland-form.md` section
        2 is the reduced extent and its cost ledger: dropping this class costs
        the claim that this world's simulated land carries any wetland that is
        not standing water, makes the modelled wetland extent a LOWER bound and
        the dry mineral share an UPPER bound by the same area, and leaves the
        `extent_high_end` arm unreachable by widening any number.
    seasonal_inundation: wetness:class_shares
    open_water: wetness:class_shares
    dry_mineral: wetness:class_shares
  # The support any REVIVED saturated-area closure would have to live at, and
  # the same reading as `hydrography/config/wetness.yaml`'s
  # `refusals.saturated_fraction_support`. It is a standing refusal rather than
  # a precondition of activation: declaring it supplies no fraction, because
  # none is published at any support. A saturated fraction is a fraction of a
  # POPULATION, the only population this project holds is the mesh regions
  # inside a climate-grid cell, and GW-6 established that the sub-region
  # hypsometry a native-mesh one would need does not exist and is not
  # recoverable by a finer generation. The gate refuses every other value BY
  # NAME. WORLD-D9U4.
  saturated_fraction_support: climate_grid
  # How a climate-grid fraction reaches a consumer that wants finer. WORLD-D9U4
  # names three routes -- a stated downscaling rule, a parameterised sub-region
  # hypsometry declared as a parameterisation rather than a measurement, or a
  # consumer that changes quantity -- and the choice is a decision. WORLD-D9U4.
  downscaling_rule: >-
    NOT REACHED under WET-12's reduced form, and kept rather than deleted. Every
    class this declaration names is resolved on the native mesh and crosses
    UPWARD to the climate grid as an area share, so no fraction travels from a
    coarser support to a finer one and there is nothing to downscale. The one
    class that could only ever have arrived at the climate grid is the saturated
    non-inundated mineral class, and it is absent. A revived saturated-area
    closure brings the second support back with it, and WORLD-D9U4's three
    routes are then the choice again, to be made before any share is read.

  # WHAT A DOWNSTREAM LEDGER DOES WITH A BRACKETED CLASS, stated before any
  # share is written, which is the constraint WORLD-4FR6 puts on both of its
  # routes. The saturated-area closure's `f_grad` is a CONVENTION bracket rather
  # than a spread around a central value: at one end of it the closure's ranking
  # is the depth's ranking exactly, so that arm carries no terrain information
  # at all and a consumer taking it alone is reporting the depth under another
  # name. The gate refuses a rule that admits a single arm.
  convention_arm_rule: >-
    a class whose share is a convention bracket propagates through every
    downstream ledger as BOTH arms or as neither, never as one. A ledger that
    can carry only one number does not carry the class.
  # What selects the wetland process regime. Latitude may locate a cell for
  # geometry and diagnostics and may not select physics; the vendored fork's
  # PEATLAND_WETLAND_LATITUDE_LIMIT of 40.0 does exactly that, and does it on
  # signed latitude, so a cell at 60 S takes the low-latitude path. WET-2.
  regime_selector: >-
    the wetness class the region carries and the persistence of its wetting over
    the climatology's own time bins, which is what
    `hydrography/scripts/build_wetness.py` resolves and what
    `surface_water.nc`'s per-region wet-bin count measures. A simulated cell's
    position on the globe locates it and does not select its hydrology,
    decomposition or methane model. The vendored fork's own selector is a
    defect the gate reports separately and this declaration does not close.
  # Whether extent may be keyed on an absolute compound-topographic-index
  # threshold. It may not: `a` carries a length, the distribution shifts with
  # the mesh by about ln 2 between this project's own two builds, and an
  # absolute cut calibrated on Earth at about a kilometre is a statement about
  # two indices' scales. The gate refuses a declared model naming one. WET-2.
  absolute_index_threshold: forbidden

# WET-4, under docs/src/reference/no-time-axis.md. Peat depth is a rate over a
# duration and a duration is undefined here, so both of these are TWO-ENDED
# brackets whose ends must differ. The gate refuses a scalar: a scalar peat age
# is a claim to a history this project does not keep.
peat:
  # Where an accumulation rate comes from, given no time axis. An expected-value
  # argument over a stationary population, or a declared bracket. Never a
  # single number and never the terrain. WET-4.
  accumulation_rate_source: undeclared
  # Both ends, in orbits.
  age_bracket: undeclared
  # Both ends, in metres.
  depth_bracket: undeclared
  # The methane-active column, kept separate from the total inventory. The
  # vendored fork's fixed three 0.1 m acrotelm layers over twelve 0.1 m catotelm
  # layers is admissible as the active process domain under a declared bracket
  # and is not a prediction of this world's peat depth. WET-4.
  methane_active_column: undeclared

# WET-5. The traits themselves, and where they live. PCAR-5 owns the covarying
# provenance-stamped registry and it does not exist yet, so the placement is
# blocked rather than improvised: a second registry beside PCAR-5's would break
# the covariance that is the whole reason for having one.
traits:
  # PCAR-5's registry, with its provenance stamp.
  registry: undeclared
  # The strategies the registry must distinguish, which is a requirement rather
  # than an assertion that any of them exists yet. `non_vegetated_inundation` is
  # a state with an area and no plants; it is in the list because leaving it out
  # is how inundated area gets assigned a vegetation type by default.
  required_strategies:
    - bog_nutrient_strategy
    - fen_nutrient_strategy
    - peat_moss
    - aerenchymatous_emergent
    - wet_mineral_soil_vegetation
    - non_vegetated_inundation
  # Roots, water-table tolerance, exudation, litter quality and gas transport,
  # coupled to PLHY and SDEC through the registry rather than a second copy.
  coupled_traits: undeclared
  # data/ins/wetlandpfts.ins retained as ONE named transplanted-Earth bracket.
  # Keeping it is the honest central case; keeping it silently is not.
  transplanted_earth_bracket: undeclared
  # The aerenchyma, tiller-geometry and phenology traits gas transport reads.
  # WET-7 needs these and PCAR-5 supplies them.
  gas_transport_traits: undeclared

# WET-6 and WET-7. Production separated from oxidation and transport.
process:
  # Vertically resolved substrate, temperature, saturation and redox from
  # SDEC-3/SDEC-8, rather than bulk CENTURY respiration times a fixed root
  # profile times a constant. WET-6.
  substrate_interface: undeclared
  # Oxidation exposed as its own flux, not folded into an emission factor.
  # WET-6.
  oxidation_separate: undeclared
  # Local gravity, local pressure and the declared atmospheric gas state, in
  # place of the fork's 9.81 m s-2, 101325 Pa, 1.7 micro-atm CH4, 209000
  # micro-atm O2 and zero 10 m wind. BIO-28 and ExoPlaSim forcing supply them.
  # WET-7.
  planet_gas_boundary: undeclared
  # Winter and thaw pulses, dead-tiller venting, pressure- and wind-driven
  # ebullition, and oxidation of bubbles crossing an unsaturated layer. WET-7.
  transport_bracket: undeclared

# WET-8. The complete labelled surface ledger. Mutually exclusive, on the same
# fractions as `extent`, with anything omitted carried as a named uncertainty
# rather than silently zeroed.
ledger:
  surfaces: undeclared
  # The near-surface aerobic sink, which the current module does not have at
  # all. Curry's diffusion-reaction model names its state variables. WET-8.
  dry_soil_sink: undeclared
  # Lakes, rivers, reservoirs and playas, as broad area, temperature,
  # productivity and transport brackets, on the same fractions. WET-8.
  aquatic_sources: undeclared

# WET-10. The atmosphere the flux would be used in.
atmosphere:
  # The reduced oxidant and lifetime bracket the surface ledger closes through.
  # BVOC-6 owns the seam. WET-10.
  oxidant_interface: undeclared
  # Set true only by BVOC-6 or WET-10, when the simulated atmosphere's methane
  # is derived from this world's own surface fluxes rather than prescribed from
  # a fixed-modern-Earth-biogenic-flux photochemical calculation. While it is
  # false, a biosphere-derived methane source combined with that prescribed
  # abundance is not one atmospheric state, and the gate says so.
  trace_gas_state_closed: false

# WET-11. What an accepted run retains, and the arms fixed before any of them
# runs. A plausible global total can arise from compensating area, production,
# oxidation and transport errors, so acceptance is never a total.
acceptance:
  # Retained together, or the run is not interpretable. The gate's --check-run
  # rejects a run directory missing any of these output tables.
  #
  # Four have a quantity behind them in the fork today -- the water table and
  # the three transport pathways -- and their table parameters are named for
  # these files. The other eleven wait on a MODEL, not on an output routine, and
  # the contract's section 6 names which one each waits on. A table emitted
  # before its quantity exists reports a zero that cannot be told apart from a
  # measured one.
  retained_outputs:
    - mwtp.out                 # daily-to-monthly water table
    - mwetland_exchange.out    # routed and groundwater exchange
    - awetland_area.out        # aggregated surface fractions, per class
    - awetland_area_native.out # native-mesh fractions, before aggregation
    - apeat_stock.out          # peat C-N-P stocks and the depth bracket
    - mch4_production.out
    - mch4_oxidation.out
    - mch4_diffusion.out
    - mch4_plant.out
    - mch4_ebullition.out
    - mch4_drysoil_uptake.out
    - mch4_aquatic.out
    - aresidual_water.out      # water closure residual
    - aresidual_cnp.out        # C, N and P closure residuals
    - aresidual_ch4.out        # atmospheric methane budget imbalance
  # WHAT THE VENDORED FORK CAN ACTUALLY EMIT, PER RETAINED TABLE.
  #
  # `run_lpj_guess.py` derives one instruction row from each retained filename's
  # stem, so `mwtp.out` becomes `file_mwtp "mwtp.out"`, and plib rejects an
  # instruction file naming a parameter nothing declared. A retained table with
  # no emitter therefore does not produce an empty file; it produces a run that
  # aborts while parsing its own instruction file, naming one unknown parameter
  # and nothing about why it is unknown. This block is what turns that into a
  # refusal at activation that names every missing table and what each waits on.
  #
  # `wetland_gate.py` checks BOTH halves of every entry against
  # modules/commonoutput.cpp: an `emitted: true` whose parameter the source does
  # not declare, and an `emitted: false` whose parameter it now does. The second
  # matters as much as the first, because a table that has become available and
  # is still recorded as waiting is one nobody will think to ask for.
  #
  # Every `waits_on` here is a MODEL and not an output routine. The argument for
  # each is biosphere/notes/wetland-activation-contract.md section 6.
  retained_output_status:
    mwtp.out:
      emitted: true
      quantity: patch.soil.mwtp, the monthly water-table position
    mch4_diffusion.out:
      emitted: true
      quantity: Fluxes::CH4C_DIFF
    mch4_plant.out:
      emitted: true
      quantity: Fluxes::CH4C_PLAN
    mch4_ebullition.out:
      emitted: true
      quantity: Fluxes::CH4C_EBUL
    mch4_production.out:
      emitted: false
      waits_on: WET-6
      why: >-
        Soil::CH4_prod is computed per layer in the detailed peat path and
        accumulated nowhere, and the simplified inundated path has no production
        term at all: its CH4:CO2 constant is an emission factor with oxidation
        already folded in. A table emitted now would carry a real number over
        one path and a zero over the other beside a non-zero emission.
    mch4_oxidation.out:
      emitted: false
      waits_on: WET-6
      why: >-
        Soil::CH4_oxid, the same shape as production and the same two paths.
        process.oxidation_separate is the declaration that has to land first.
    mch4_drysoil_uptake.out:
      emitted: false
      waits_on: WET-8
      why: the module has no near-surface aerobic methane sink
    mch4_aquatic.out:
      emitted: false
      waits_on: WET-8
      why: the module has no inland-water methane source
    mwetland_exchange.out:
      emitted: false
      waits_on: PLHY-4
      why: >-
        the routed and groundwater exchange, which is the same absence
        hydrology.water_ledger refuses on
    awetland_area.out:
      emitted: false
      waits_on: WET-1
      why: >-
        the classification exists and the fork has no way to be given it.
        `extent.class_sources` names four resolved classes and
        `hydrography/scripts/build_wetness.py` publishes their per-cell area
        shares, but `run_lpj_guess.py` writes no per-class stand fraction into
        the instruction file and the module has one PEATLAND stand type, so
        there is nothing inside the simulated cell for this table to aggregate.
        WET-1 owns the source contract that would reject a missing or
        fallback-equal fraction rather than run on one
    awetland_area_native.out:
      emitted: false
      waits_on: WET-1
      why: >-
        the native-mesh classification exists -- `wetness_<grid>.nc` carries one
        class per mesh region -- and the simulated stand does not run there. A
        native-mesh table out of this model is a pass-through of the forcing,
        and the fork holds no mapping from a simulated cell back to the mesh
        regions inside it. WET-1 owns that half of the source contract. The
        table is retained rather than dropped because the whole reason for
        keeping it beside the aggregated one is that a reduction is where a
        minority surface disappears
    apeat_stock.out:
      emitted: false
      waits_on: WET-4
      why: WET-4 owns the depth bracket a peat stock has to be reported against
    aresidual_water.out:
      emitted: false
      waits_on: PLHY-4
      why: >-
        the water ledger itself, and a residual computed over a graph with
        undeclared terms is not a residual
    aresidual_cnp.out:
      emitted: false
      waits_on: WET-8
      why: >-
        the labelled surface ledger the C-N-P closure would be taken over, which
        ledger.surfaces refuses on
    aresidual_ch4.out:
      emitted: false
      waits_on: WET-10
      why: >-
        the atmospheric methane budget closes through an oxidant and lifetime
        boundary that atmosphere.oxidant_interface refuses on

  # The residual a closed ledger is allowed, as a fraction of the corresponding
  # gross flux. Fixed here, before any run exists, so it cannot be widened to
  # admit a result.
  residual_tolerance: 1.0e-6
  # The matched arms, registered before any is run. An arm chosen after its
  # result is seen is not an arm.
  registered_arms:
    - no_methane
    - source_only_no_atmospheric_feedback
    - extent_low_end
    - extent_high_end
    - redox_and_production
    - transport_partition
    - atmospheric_feedback

  # MINIMUM bracket widths, as multiplicative factors. These are a FLOOR on
  # declared uncertainty and the gate refuses anything narrower: a narrower
  # bracket is a claim to know this world better than the read Earth studies
  # know Earth. They are not central values and nothing is computed from them.
  #
  # Each is the ratio of the two ends of a range in the literature recorded in
  # references/INDEX.md and argued in the audit. The production ratio's floor is
  # the spread between the two constants the vendored fork itself carries.
  minimum_bracket_factor:
    # WETCHIMP: 8.6 to 26.9 million km2 across models sharing climate forcing.
    wetland_extent: 3.12
    # WETCHIMP: 141 to 264 Tg CH4 per year, same models.
    wetland_methane_flux: 1.87
    # Curry: 9 to 47 Tg CH4 per year around a central 28.
    dry_soil_sink: 5.22
    # The fork's own CH4:CO2 constants, 0.085 after Wania et al. for the
    # detailed northern path against 0.027 for the simplified inundated path,
    # whose source comment says it was changed to match global emissions.
    production_ratio: 3.14
  # The declared brackets themselves, once the rows above supply them.
  declared_bracket_factor: undeclared
