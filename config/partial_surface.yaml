# SPAT-5 decision record. The author selected measurement before model change.
contract_version: vesper-partial-surface/1
atmosphere_boundary:
  implemented_representation: binary_land_ocean_with_restart_safe_tile_channels
  threshold: 0.5
  threshold_verdict: retain
  reason: >-
    ExoPlaSim hard-binarises yls at 0.5. Alternative builder thresholds add a
    second rounding and worsen the below-datum land-volume closure.
  cost_land_side: >-
    analysis/coastline_threshold_cost.json, candidate_rules: the land dropped
    into the slab ocean and the water promoted to dry land, each as a share of
    the land, plus the below-datum land-volume closure the reason above rests
    on. Five rules priced in the same terms on every ladder rung.
  cost_ocean_side: >-
    The same rules in the same artifact under ocean_side and the per-rule
    ocean_area_gap_over_bar, against ocean/config/transport_loop.yaml's
    sea_ice_area criterion, this project's one declared bar on a planetary area
    fraction. The retained rule sits over that bar at every rung and barely
    falls along the ladder, because a mask error is a coastline-length quantity
    and a coastline does not get shorter. The area-conserving alternative is the
    only one of the five under the bar, and it is worse on the land-volume
    closure the reason above rests on: the two sides of this boundary do not
    select the same rule and the record now says so rather than pricing one.
  cost_ocean_side_does_not_reopen_this: >-
    The tile model is selected, so the binary mask's role is topology and legacy
    output only and the atmosphere reads the fractional land area rather than
    the mask. What the ocean-side cost still bears on is TOPOLOGY, which is what
    a connectivity criterion reads, and that is OCN-11's to take rather than
    this record's. notes/audits/ocean-support-nonlinear-reductions.md section 3
    is the measurement of why.
surface_partition:
  top_level: [ocean, inherited_inland_water, subaerial, solved_lake]
  subaerial_partition: [rootable, dry_barren]
  overlap_rule: solved water owns water over barren; deduct it once
selection:
  strategy: cost_bracket_first_decide_after
  tile_model_selected: true
  model_form_bracket_selected: false
  tile_model_status: selected_restart_safe_tile_channels_dual_evaluation_pending
  area_store_measurement: analysis/coastline_threshold_cost.json
  flux_measurement: analysis/coastline_flux_bracket.json
  materiality_test: accepted_baseline_state_storage_tolerance
  decision_gate: >-
    Select a tile model if the absolute accepted-baseline surface-energy bracket
    exceeds that same run's already-declared state-storage tolerance; otherwise
    retain the binary model with the bracket as model-form error. The criterion
    predates the bracket and is read from the run's convergence report rather
    than chosen after seeing the result.
  decision: >-
    Selected: the measured bracket reaches +0.125294 W m-2 against the accepted
    run's 0.12 W m-2 state-storage tolerance. The component turbulent and
    radiative terms also span 1.3 to 2.9 W m-2. SPAT-5 remains open until the
    conservative tile implementation carries separate land/ocean state and
    closes its extensive flux identities.
tile_model:
  operator: one_atmosphere_column_two_surface_tiles
  support:
    land_fraction_source: native_mesh_subaerial_area_fraction
    ocean_fraction: 1 - land_fraction
    ownership_mask_role: topology_and_legacy_output_only
  state:
    land: [surface_temperature, soil_water, soil_ice, land_snow]
    ocean: [sea_surface_temperature, mixed_layer_heat, sea_ice, sea_ice_snow]
    rule: >-
      A tile state advances wherever its fraction is positive. Neither tile may
      overwrite the other's temperature, water or snow store in a partial cell.
    initial_state:
      contract_version: vesper-partial-surface-initial-state/1
      rule: >-
        A tile that begins advancing on a cell it did not own must start from a
        DECLARED value, and the declaration names the source. Read against the
        source on 2026-08-30; notes/audits/partial-cell-tile-state.md carries
        the evidence. The disposition below is what world-cp27 implements and
        what world-uiq7 is then an execution-gate change against.
      staged_field_rule: >-
        `staged_surface_codes` names the surface codes a field reaches the
        model through, and an empty list says the field is a model constant or
        a cold-start profile rather than a staged one. The decision gate reads
        those codes off the staged `.sra` and refuses a field declared
        available whose value is UNIFORM over the cells the binary ownership
        mask gives to the ocean while the land fraction is positive. A field
        derived from the mesh varies over coastlines on every continent; a
        single value there is the ownership mask's placeholder and is what the
        land tile would otherwise start from. This makes the status below a
        claim the gate can refuse rather than a string it trusts.
      ocean_tile_on_land_owned_cells: available
      land_tile_on_ocean_owned_cells: blocked_on_world-qcse
      fields:
        ocean_surface_temperature:
          status: available
          staged_surface_codes: []
          source: >-
            icemod ice_cold_start computes the declared analytic profile
            tsst_pol + (tsst_eq - tsst_pol) * cos(latitude)^2 across the whole
            latitude band with no mask, and assigns xcoldsst unmasked. Surface
            code 169 is not staged on this world, so xclsst holds its -999
            sentinel and the analytic profile is what a cold start uses. The
            value on a land-owned cell is therefore declared, not fabricated.
        ocean_mixed_layer_depth:
          status: available
          staged_surface_codes: []
          source: >-
            oceanmod mldepth is a scalar namelist value assigned to
            dlayer(NLEV_OCE), not a field, so the slab carries one depth
            everywhere and a land-owned cell needs no per-cell value.
        sea_ice:
          status: available
          staged_surface_codes: []
          source: >-
            ice_cold_start sets hice_ini below TFREEZE. The branch is masked on
            xls < 0.5 today and widens with the ocean tile's own gate.
        land_surface_temperature:
          status: available
          staged_surface_codes: []
          source: >-
            landmod initialises dtclsoil, dsoilt and dtclim to tmelt with no
            mask, and reads staged dtclsoil through mpsurfgp with no mask.
            Surface code 209 is not staged on this world, so tmelt is the
            declared cold-start value and it is defined on every cell.
        land_roughness:
          status: available
          staged_surface_codes: [173]
          source: >-
            build_surface_roughness.py works from mesh.surface_class rather
            than the gridded ownership mask, so code 173 already carries a
            land roughness on every cell containing land. Measured at T21:
            0.3446 to 3.581 m over the 620 sea-owned partial cells, against
            0.00015 m over pure ocean.
        land_field_capacity:
          status: available
          staged_surface_codes: [229]
          source: >-
            build_surface_soil_water.py now follows the states file's
            population rather than the climatology's binary lsm, and pedology
            writes a column for every cell with a positive land fraction. Code
            229 over the 620 sea-owned partial cells goes from the uniform
            0.5 m placeholder to a derived 0.0165 to 0.2655 m, against
            0.0199 to 0.2591 over binary land. Cells with genuinely no ground
            keep 0.5, which is where ExoPlaSim's default belongs.
        land_background_albedo:
          status: blocked
          staged_surface_codes: [174, 175, 176]
          blocked_by: world-qcse
          source: >-
            build_surface_albedo.py no longer re-applies
            geography_land_threshold, which belongs to code 172 in
            build_boundary_conditions.py; the land albedo it had already
            integrated from the mesh is emitted instead of the flat water
            value 0.06 the 620 sea-owned partial cells carried. The builder
            cannot RUN until an LPJ run passes acceptance, because it calls
            require_lpj_acceptance, so the field is blocked behind world-qcse
            rather than behind anything of its own.
        land_vegetation_cover:
          status: blocked
          staged_surface_codes: [212]
          blocked_by: world-qcse
          source: >-
            build_lpj_driver.py selected `land & (rootable > 0.0)` against the
            BINARY ownership mask and now selects `rootable > 0.0`, which adds
            exactly the 620 sea-owned partial cells and takes the simulated set
            from 997 to 1617. Every one of them now has a pedology soil column,
            so none falls back to LPJ's own soil codes. The resulting run is
            REFUSED by vesper-lpj-acceptance/1 for the same ecological
            equilibrium failure every LPJ run on this project has had, which is
            world-qcse. The time base is NOT the reason: vesper_pfts.ins sets
            nyear_spinup 998 and freenyears 200, deliberately doubled from
            LPJ-GUESS's 500 and 100, which at 0.5010172 Earth years per orbit
            is 500.0 and 100.2 Earth years and matches the convention exactly.
            The cause is not established.
      orography_is_not_in_this_class: >-
        One atmosphere column carries one orography, so doro stays the cell's
        single elevation and is not split per tile. The land tile's elevation
        within a partial cell is a sub-grid lapse-rate question and is outside
        a conservative tile model.
  exchange:
    atmosphere_state: shared above both tiles
    compiled_combine: spat5_tile_combine
    endpoint_rule: pure endpoints bypass absent tile arithmetic
    channel_status: separate_land_ocean_channels_seeded_from_binary_evaluation
    turbulent_fluxes: [sensible_heat, latent_heat, evaporation, momentum]
    radiative_fluxes: [absorbed_shortwave_band_1, absorbed_shortwave_band_2,
      net_longwave]
    aggregation: land_fraction * land_tile + ocean_fraction * ocean_tile
    accumulation_rule: weight each tile exactly once at the atmosphere boundary
    precipitation_rule: >-
      Atmospheric precipitation depth is applied to each tile over its own area;
      land runoff is routed to ocean after the land ledger closes and is not an
      additional atmospheric freshwater sink.
  diagnostics:
    retained_per_tile: [surface_temperature, water_and_snow_stores,
      sensible_heat, latent_heat, evaporation, momentum, absorbed_shortwave,
      net_longwave]
    retained_aggregate: [surface_temperature, water_and_snow_stores,
      sensible_heat, latent_heat, evaporation, momentum, absorbed_shortwave,
      net_longwave]
  acceptance:
    pure_land_reduction: bit_identical_to_binary_land_at_fraction_1
    pure_ocean_reduction: bit_identical_to_binary_ocean_at_fraction_0
    fraction_bounds: [0.0, 1.0]
    extensive_closure: weighted_tiles_equal_atmosphere_exchange
    storage_closure: weighted_tile_storage_change_equals_weighted_flux_plus_transfer
    restart: every_separate_tile_state_is_serialized
flux_bracket:
  contract_version: vesper-partial-surface-flux-bracket/1
  climatology: accepted_baseline_only
  fields: [evap, hfss, hfls, rss, rls, surface_energy]
  surface_energy_identity: rss + rls + hfss + hfls
  missing_tile_estimator: >-
    For each partial cell, bound the unrepresented tile's annual-mean flux by
    the minimum and maximum accepted-baseline values over cells of that surface
    class in the same Gaussian row. Expand symmetrically to adjacent rows only
    until four references exist, and inventory every expansion.
  minimum_reference_cells: 4
  interpretation: >-
    This is a same-climate model-form bracket, not a tiled-model prediction. It
    holds circulation and tile temperatures fixed and therefore cannot measure
    their coupled response.
