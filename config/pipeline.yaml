# THE PIPELINE GRAPH. Single source of truth for what steps exist, what each
# generates, and what must precede it.
#
# The pipeline chapters (docs/src/pipeline/) own the REASONING -- why the order is what it is, what each stage
# is for, why the loops close, and the traps. They reference step ids from here
# and does not restate them. This file owns the graph and nothing else: no
# rationale, no narrative, no current values. Two representations of one thing in
# two files is the duplication both documents exist to prevent.
#
# The graph is directed and CYCLIC by design. Each loop carries an exit predicate
# rather than a topological order, and `scripts/pipeline.py` plans one pass at a
# time rather than solving the cycle.
#
# consumers are NOT declared: they are derived from `needs`. Declaring both would
# be the same duplication one level down.

version: 1

loops:
  A:
    name: the terrain loop
    exit: >
      Successive verdicts bracket rather than converge, because the map is
      antitone: a larger carve set produces a smaller next verdict. Exit by
      carving the INTERSECTION of the verdicts taken at the two bounding
      climates, which makes the BRACKETED set a construction rather than a
      tolerance. That bracket is over the VEGETATION state and it does not
      cover the carve's own antitone feedback: both arms run on pre-carve
      terrain, and an overshooting basin is one both arms cut, so it is never
      in the bracketed set. So the exit carries a second number, measured once
      the carved build has its own baseline: re-take the verdict on the
      PRE-CARVE basins under the POST-CARVE climatology and report how many of
      the applied carves would no longer carve. That is the OVERSHOOT,
      `hydrography/scripts/carve_overshoot.py` computes it, and it is reported
      beside the bracket width rather than inside it.
      `notes/audits/carve-overshoot.md` has the argument and the route.
  B:
    name: the soil and biosphere loop
    exit: the criteria in pedology/config/pedogenesis.yaml
  C:
    name: the vegetation-climate loop
    exit: re-take the verdict on modelled vegetation; if basins flip, re-enter A
  D:
    name: the declared escalation to T85
    exit: >
      T85 is the OPERATING SUPPORT and is declared, not discovered. The route
      alternates resolution and timestep and never moves both at once: T21 at
      dt 45, converge; reconverge T21 at dt 30 if the conversion needs it;
      convert to T42 at dt 30, converge; reconverge T42 at dt 22.5 if needed;
      convert to T85 at dt 22.5, converge; then continue at NLOWIO = 0 with
      high-cadence orbits for dust. Every conversion therefore happens at
      constant dt, so exactly one variable moves per step and a surprise after
      a conversion is attributable to the support alone. A reconvergence is TEN
      orbits, then THREE-orbit increments until the convergence criteria are
      met. Advance only after the current support has settled, replaying A, B
      and C on it. There is no between-rung convergence comparison: choosing
      T85 by decision removed the question one would answer, and nothing finer
      is being run to difference it against. The three
      timesteps are the highest each rung can carry and are PROVISIONAL on
      WORLD-37TN re-measuring the stability grid; they are declared intent,
      not a measured ceiling. `docs/src/pipeline/sequencing.md` section D.

# writes: the COMPLETE set of artifacts a step produces, not a marker for them.
#       `--purge` deletes exactly this, so a row that names only its report
#       leaves the bulk behind and reports success. Three forms are accepted:
#       a file path; a directory, written with a trailing slash, meaning the
#       step owns the whole directory; and a glob, for a family of outputs
#       whose exact names a step decides at run time (per-projection renders,
#       per-label plots).
#
# reads_export: the step consumes `source/{build}/` directly. This is NOT a
#       `needs` edge and must not become one. `needs` is the order WITHIN one
#       pass of a loop, and loop A closes by `orogen` consuming a carve list
#       produced from the previous pass -- so making the export a `need` would
#       put every step upstream of `carve_list` and collapse the carve gate to
#       "everything". The export edge crosses a pass boundary and `needs` does
#       not, which is why it is a separate key. `--purge orogen` seeds from it.
#
# cost: seconds | minutes | hours. `hours` is what must never run by accident.
# loop: which loop the step belongs to, or a LIST where it belongs to more than
#       one. A step in two loops is one that is re-run on a different input by
#       the later one, not two steps: one artifact, one row.
# gate: a condition that must hold before the step is meaningful. Absent means
#       none. A gate is NOT a request for a preference -- it is a statement that
#       the recorded procedure does not yet cover this case.

steps:

  - id: stellar_spectrum
    script: exoplasim/scripts/build_stellar_spectrum.py
    cost: minutes
    needs: []
    writes: ["exoplasim/inputs/stellarspectra/{name}.dat", "exoplasim/inputs/stellarspectra/{name}_hr.dat", "exoplasim/inputs/stellarspectra/{name}_provenance.json"]

  - id: rebuild_binaries
    script: exoplasim/scripts/rebuild_binaries.py
    cost: minutes
    needs: []
    writes: [exoplasim/binary_manifest.json]

  - id: hydrography
    reads_export: true
    script: hydrography/scripts/build_hydrography.py
    loop: A
    cost: minutes
    needs: []
    writes: ["hydrography/data/{build}/regions.nc", "hydrography/data/{build}/basins.nc", "hydrography/data/{build}/hydrography_report.json", "hydrography/data/{build}/coupling_exoplasim-{res}.nc", "hydrography/data/{build}/coupling_exoplasim-*.nc"]
    # One coupling matrix per grid in --grids, which defaults to the configured
    # rung. TWO ENTRIES, because presence and purge ask different questions of
    # the same family. The {res} entry is the one the configured rung needs, so
    # --status calls this step done only when THAT grid's matrix is there; the
    # glob alone answered "present" for a T21 matrix while the config asked for
    # T42. The glob stays beside it so --purge still reaches every rung this
    # step has been asked for, not only the one the config names today.
    # They are the interface every mesh-to-grid consumer integrates catchments
    # over, and they were generated by this step but declared by no row, so
    # nothing downstream could name what it was reading.

  - id: boundary_conditions
    reads_export: true
    script: exoplasim/scripts/build_boundary_conditions.py
    loop: A
    cost: minutes
    needs: []
    writes: ["exoplasim/inputs/{res_lower}/boundary_conditions_report.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0129.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0172.sra"]

  - id: surface_albedo
    reads_export: true
    script: exoplasim/scripts/build_surface_albedo.py
    loop: [A, C]
    cost: minutes
    needs: [lpj_run, rock_albedo_bands, vegetation_albedo]
    writes: ["exoplasim/inputs/{res_lower}/albedo_report.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0174.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0175.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0176.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0212.sra"]
    gate: >
      the `lpj_run` edge is loop C and is a BACK edge: the first pass of an
      iteration runs --mode vegetated on terrain alone, before any biosphere
      exists, and the mode this project should end up in is --mode modelled
      --vegetation <run>/fpc.out, which raises without it. One artifact, one
      row, so the mode is the state of albedo_report.json rather than a second
      step. Adopting modelled requires the flux to be re-derived: the two land
      endmembers are 15-19 W/m2 apart in absorbed flux (`docs/src/pipeline/sequencing.md` A3).

  - id: surface_roughness
    reads_export: true
    script: exoplasim/scripts/build_surface_roughness.py
    loop: A
    cost: minutes
    needs: []
    writes: ["exoplasim/inputs/{res_lower}/roughness_{res_lower}_report.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0173.sra"]

  - id: bootstrap_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [rebuild_binaries, boundary_conditions, surface_albedo, surface_roughness]
    writes: []
    presence: by_index   # UUID-named; ask exoplasim/runs/INDEX.json, not the path

  - id: bootstrap_convergence
    script: exoplasim/scripts/assess_convergence.py
    loop: A
    cost: minutes
    needs: [bootstrap_run, state_energy]
    writes: [exoplasim/analysis/convergence/]
    presence: by_index   # per-RUN, and the run is UUID-named; it writes the status

  - id: state_energy
    script: exoplasim/scripts/close_state_energy.py
    loop: A
    cost: minutes
    needs: [bootstrap_run]
    writes: [exoplasim/analysis/energy/]

  - id: bootstrap_climatology
    script: exoplasim/scripts/build_climatology.py
    loop: A
    cost: minutes
    needs: [bootstrap_convergence]
    writes: [exoplasim/analysis/climatology/bootstrap_regular_climatology.nc, exoplasim/analysis/climatology/bootstrap_snapshot_climatology.nc, exoplasim/analysis/climatology/bootstrap_climate_series.json]
    gate: >
      every orbit in the window ran NLOWIO = 0. A segment with low_io set, or
      with no low_io key at all, is refused without --allow-low-io.

  - id: baseline_convergence
    script: exoplasim/scripts/assess_convergence.py
    loop: A
    cost: minutes
    needs: [baseline_run, state_energy]
    writes: [exoplasim/analysis/convergence/]
    presence: by_index   # as bootstrap_convergence: the artifact is named by run

  - id: baseline_climatology
    script: exoplasim/scripts/build_climatology.py
    loop: A
    cost: minutes
    needs: [baseline_convergence]
    writes: [exoplasim/analysis/climatology/baseline_regular_climatology.nc, exoplasim/analysis/climatology/baseline_snapshot_climatology.nc, exoplasim/analysis/climatology/baseline_climate_series.json]
    gate: >
      every orbit in the window ran NLOWIO = 0, and config/planet.yaml's
      baseline_climatology is repointed here once it exists, so that nothing
      downstream keeps reading the bootstrap.

  - id: bracket_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [boundary_conditions, surface_albedo, surface_roughness, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      the SECOND flux point, on the vegetated branch, which is the only branch
      the design flux is defined against. It has to span more than 5 K of global
      mean against the other point or derive_design_flux refuses it, which at
      about 202 K per unit flux means the two fluxes differ by roughly 0.025 or
      more -- a point chosen close to the first satisfies "two converged runs"
      and fails the span check. Independent of the other point, so the two can
      run concurrently

  - id: design_flux
    script: exoplasim/scripts/derive_design_flux.py
    cost: minutes
    needs: [baseline_climatology, bracket_run]
    writes: [exoplasim/analysis/design_flux.json]
    gate: >
      the flux is re-derived on every new terrain (`docs/src/pipeline/state.md`
      section 5b and `docs/src/pipeline/sequencing.md` loop C), and the
      thresholds are declared in the script before it runs, never fitted to the
      answer. The cap on extreme-cold land fraction must be DECLARED in advance
      by this re-derivation: the purged artifact inferred it at 0.0642, which
      reproduced 0.945 from an unconstrained winner of 0.8725, and a threshold
      fitted to its own answer is what CLIM-30 exists to undo

  - id: analyze_climatology
    script: exoplasim/scripts/analyze_climatology.py
    loop: A
    cost: minutes
    needs: [baseline_climatology]
    writes: [exoplasim/analysis/climatology/baseline_climate_report.json, exoplasim/analysis/climatology/baseline_classification.nc, "exoplasim/analysis/climatology/baseline_*.png"]

  - id: index_runs
    script: exoplasim/scripts/index_runs.py
    cost: seconds
    needs: [bootstrap_run]
    writes: [exoplasim/runs/INDEX.json]

  - id: land_water_ledger
    script: hydrography/scripts/land_water_ledger.py
    cost: seconds
    needs: [land_column_properties]
    writes: [hydrography/analysis/land_water_ledger_report.json]
    gate: >
      the one ledger every terrestrial water store and flux books into, from
      precipitation leaving the air column over a land cell to a named terminal
      boundary at the coast. It reads hydrography/config/land_water_ledger.yaml,
      fails on a graph that does not close, on a phase change with no process
      named, on a phase term carrying the wrong latent heat and on one
      evaporative component debited from two stores; exercises the mass
      identity on fixtures built to be wrong; and exercises the graph check
      itself on declarations built to be wrong. With every term still
      undeclared it reports and exits 0, because the ledger is the artifact
      LSHY-1, LSHY-3, LSHY-4, LSHY-5 and PLHY-4 deliver INTO rather than a
      result about the world; `--strict` is the arm that refuses, and it
      refuses while any store still has a shadow copy in a second component.
      surface_water and groundwater need it so the ownership contract sits on
      the path rather than beside it.

  - id: surface_water
    script: hydrography/scripts/surface_water.py
    loop: A
    cost: minutes
    needs: [hydrography, bootstrap_climatology, land_water_ledger]
    writes: ["hydrography/data/{build}/surface_water.nc", hydrography/analysis/surface_water_report.json]

  - id: topographic_index
    reads_export: true
    script: hydrography/scripts/build_topographic_index.py
    loop: A
    cost: minutes
    needs: []
    writes: ["hydrography/data/{build}/topographic_index_exoplasim-{res}.nc", "hydrography/data/{build}/topographic_index_exoplasim-*.nc", hydrography/analysis/topographic_index_report.json]
    gate: >
      GW-26. Terrain only: `ln(a / tan beta)` per region from the export's own
      upslope contributing area and a local slope, and per GRID CELL the share
      of that cell's land AREA whose index exceeds the cell's area-weighted mean
      index. AREA and not region count: `f_sat_max` multiplies into a fraction
      of a CELL, this mesh's regions are not equal-area, and the mean is the
      class boundary. `lib/gridding.py` owns the operators -- `cell_moments` for
      the mean and the within-cell spread, `cell_fraction` for the categorical
      area share -- and the report names which was used for which field beside
      `transfer_ledger`'s account of what the reduction dropped. That share is
      the terrain half of TOPMODEL's saturated-fraction closure,
      `f_sat = min(f_sat_max exp(-f_grad z_wt), 1)`, and it is the answer GW-6
      leaves reachable: the valley-to-ridge gradient is below this mesh and
      stays below it, so the terrain control is carried STATISTICALLY and what
      comes back is a FRACTION rather than a depth.
      A SATURATED FRACTION IS A FRACTION OF A POPULATION, and the only
      population here is the land AREA of the regions inside a climate-grid
      cell. So this artifact is one per (build, grid) on the coupling matrices'
      precedent,
      `f_sat_max` lives at the GRID and not at a region, and there is no
      per-region saturated fraction to take.
      NO CONSUMER GETS `f_sat` FROM THIS STEP: the closure is WITHDRAWN and
      this artifact carries no saturated fraction. The score was declared in
      `hydrography/config/topographic_index.yaml` before any fraction was
      computed, together with the disposition of a miss, which is withdrawal
      rather than a caveat. It was run on both Earth sets and missed. The
      closure is strictly monotone in the water table depth for a fixed
      `f_sat_max`, so any discrimination it gains over the depth alone is
      attributable to the terrain half and to nothing else -- which is what
      makes the score a test rather than a comparison, and the gain it measured
      is at or below the scatter its own support puts on it on every arm, so a
      criterion restricted to the regime the depth works in would run on fewer
      cells and resolve it less. `hydrography/notes/subgrid-water-table.md`
      section 7 is the measurement.
      WHAT THE STEP STILL WRITES is the terrain half on its own, which stands
      without the closure: most of the index's variance is WITHIN a cell rather
      than between cells, and that is the case for computing it. WET-2, SURF-7
      and LSHY-6 were the rows waiting on the fraction and section 5 settled
      what each takes instead: LSHY-6 asked for a climate-grid area already;
      SURF-7's discharge mask is a statement about the RESOLVED water table and
      takes `at_surface` from `water_table.nc`; WET-2 wanted the fraction and
      loses that class rather than gaining a second support.
      `f_grad` was DECLARED AND BRACKETED, never fitted, and the bracket is a
      convention ambiguity: CLIMBER-X's `exp(-f_wtab z)` and ClimaLand's
      `exp(-f_over/2 z)` differ by exactly a factor of two; it is kept as what a
      revived closure would have to bracket. ABSOLUTE THRESHOLDS
      ARE REFUSED and no product keys on one: this index carries a length in
      `a`, so it shifts with the mesh -- measured at about 0.8 between this
      project's own two builds -- and it sits far above the range published
      thresholds are calibrated on.

  - id: wetness
    reads_export: true
    script: hydrography/scripts/build_wetness.py
    loop: A
    cost: minutes
    needs: [hydrography, surface_water]
    writes: ["hydrography/data/{build}/wetness_exoplasim-{res}.nc", "hydrography/data/{build}/wetness_exoplasim-*.nc", hydrography/analysis/wetness_report.json]
    gate: >
      WET-2 and LSHY-6. One wetness class per REGION, and per GRID CELL the AREA
      share of each class over the cell's land. MUTUAL EXCLUSIVITY IS THE
      PRODUCT: overlapping wetness classes double-count area and every ledger
      downstream inherits the double count with no way to see it, so a region
      gets one label rather than a set of masks that happen not to overlap, the
      shares are required to partition the cell, and `--selftest` hands each
      rule a case built to violate it that the check must refuse -- a playa mask
      that forgot to exclude the lake, land in no class with no residual named,
      and the saturated share added beside the resolved classes instead of taken
      out of them.
      A CLASS IS CATEGORICAL, so what crosses is `lib/gridding.py`'s
      `cell_fraction` and never a majority label: a majority discards every
      minority surface however much leverage it has, and a narrow strip of open
      water in a dry cell is the surface these rows exist to keep. Land comes
      from `surface_class`.
      BOTH DENOMINATORS ARE EMITTED. Each class carries its AREA from
      `cell_sum`, the EXTENSIVE operator, beside its share from the categorical
      one, because a lake evaporation is a depth over the open-water area and a
      catchment runoff is a depth over the land cell. Computing them
      independently makes the pair a check the artifact refuses on: the same
      population reduced two ways has to agree, and a population mismatch is
      what that catches.
      THREE OF THE AUDIT'S FIVE CLASSES HAVE NO SOURCE HERE and are declared
      absent with the reason rather than estimated. The saturated non-inundated
      mineral class is unresolved on this mesh -- `hydrography/notes/subgrid-
      water-table.md` section 5 -- and would have arrived as a climate-grid area
      share taken OUT of the mineral class, making exclusivity a constraint at
      two supports; the closure it needed is WITHDRAWN, section 7, so that class
      is absent permanently rather than pending and the resolved classes
      partition the cell on one support. This step refuses to run if that
      status ever says otherwise, because a class formed by the first plausible
      reading of a revived bracketed closure is worse than an absent one.
      Seasonal
      inundation and peat need a season, and nothing in this component carries
      one: the lake solve is an annual equilibrium, the groundwater solve is a
      steady state, and every term reaching those stores in
      `hydrography/config/land_water_ledger.yaml` has an annual interval floor.
      River water needs a channel width the project does not hold, so a
      discharge stays a rank and a mask rather than becoming an area.

  - id: groundwater
    script: hydrography/scripts/build_groundwater.py
    loop: A
    cost: minutes
    needs: [hydrography, bootstrap_climatology, surface_water, land_water_ledger]
    writes: ["hydrography/data/{build}/water_table.nc", hydrography/analysis/groundwater_report.json, hydrography/analysis/groundwater_reduction_test.json, hydrography/analysis/groundwater_divide_test.json, "hydrography/analysis/groundwater_report_sigma*.json", "hydrography/analysis/groundwater_report_noise*.json", "hydrography/analysis/groundwater_report_et*.json"]
    gate: >
      the steady-state water table, and a MEASUREMENT of the net groundwater
      exchange per basin. `carve_verdict` TAKES the term when handed one, under
      GW-14, and is bit-identical to the surface-only criterion when it is not;
      supplying it is a loop A decision and no carve list has been regenerated
      from it. Permeability carries 1.5 to 2.5 orders of Gleeson spread, so the
      DEPTH field is a bracket and `--sigma -1` and `+1` are its arms; the carve
      count is not, moving by three across the whole bracket.
      `--operator-noise` is a sensitivity harness for GW-8, not a model
      parameter. GW-15's sink and GW-17's river and lake fixed heads are BOTH
      ON, from `config/groundwater.yaml`, because neither is optional physics:
      without the sink the table pins at the surface over most of the land, and
      without local baselevels the sea is the only boundary and the depth range
      collapses. `--no-groundwater-et` and `--no-baselevels` turn them off, for
      reproducing pre-GW-15 runs; `--reduction-test` sets both itself, because
      the surface-only balance it reduces to carries neither and a reduction
      keeping one is not an identity. The baselevels
      are why this step needs `surface_water`: that artifact is the only thing
      that knows where the rivers and lakes are.
      READ `hydrography/README.md` BEFORE CONSUMING THE DEPTH FIELD. The
      solver's skill is REGIME-DEPENDENT, scored on two continents against a bar
      declared first, and the README owns the scores. Where the
      evapotranspiration sink takes the recharge locally, the steady state
      collapses to that local balance and the flow solve contributes almost no
      spatial variance; where recharge is large and the aquifers transmissive,
      lateral flow sets the head and the solve does real work. There is per-cell
      skill in the second case and none in the first, so `sink_fraction` and
      `at_surface` in `water_table.nc` are the unit of certification rather than
      the field as a whole. What survives in BOTH regimes is the per-basin
      exchange direction. MIN-6 cannot use a per-cell depth, and SURF-7's mask
      gets AUC 0.52 to 0.57; both were measured over ALL cells, and re-measuring
      them restricted to cells where the sink did not set the depth is what
      those rows now ask for. This planet's own regime is NOT known and moves
      with loop A, so re-read the flag after each accepted baseline rather than
      transporting either continent's result.

  - id: groundwater_access
    reads_export: true
    script: hydrography/scripts/build_groundwater_access.py
    loop: A
    cost: minutes
    needs: [groundwater]
    writes: ["hydrography/data/{build}/groundwater_access_exoplasim-{res}.nc", hydrography/analysis/groundwater_access_report.json]
    gate: >
      PLHY-5. `water_table.nc` is per REGION and LPJ is driven per climate-grid
      CELL, and the reduction that suggests itself -- average the depth --
      destroys what groundwater is in the model for. Root access and discharge
      vegetation depend on the FRACTION of a cell with a shallow table: a mean
      erases a narrow riparian strip and manufactures a broad one. So the
      criterion is evaluated ON THE NATIVE REGIONS and what crosses is an AREA.
      NO HYPSOMETRY IS USED and none is needed: the within-cell depth
      distribution is in hand, and reconstructing it would be an inference where
      there is a measurement. A fraction is a fraction of a POPULATION and the
      only one is the regions inside a cell, so every fraction lives at the grid
      and there is no per-region access fraction -- GW-6, and the same
      constraint `topographic_index` states for `f_sat_max`.
      ACCESS DEPTHS ARE SWEPT, NEVER CHOSEN. 1.5 m is the vendored LPJ-GUESS
      soil column and is sourced; 5 and 20 m are declared model-form brackets
      for a phreatophytic access that model cannot represent. `sink_fraction`,
      `at_surface`, the excluded lithologies and the undefined cells all cross
      as their own area shares, and `--water-table` repeated once per
      permeability member writes every fraction along a member axis, so the
      Gleeson bracket survives the reduction instead of being averaged inside
      it. `--selftest` runs six invariants with right answers on synthetic
      input, including the negative control this step exists for: a narrow
      shallow strip in a deep cell must survive.

  - id: soil
    script: pedology/scripts/build_soil.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, hydrography, lpj_run]
    writes: [pedology/analysis/soil_report.json, "pedology/data/{build}/soilmap_{res}.txt"]

  - id: land_column_properties
    script: pedology/scripts/land_column_properties.py
    cost: seconds
    needs: [soil]
    writes: [pedology/analysis/land_column_properties_report.json, "pedology/data/{build}/land_column_states_{res}.txt"]
    gate: >
      the one vertically explicit hydraulic and thermal description of the land
      column, and the only place its retention states are derived. It emits
      them per cell -- saturation, field capacity, the wilting point, the
      closure's exponent, the plant-available capacity of the declared column
      and the weathered-bedrock usable share per physical layer -- and
      surface_soil_water and lpj_driver READ that file. It reads
      pedology/config/land_column_properties.yaml and fails on a contract that
      does not hang together -- layers that do not reach the declared base, a
      root below the column, a state silent on whether it depends on gravity, a
      drainage length that is not the one Cosby's field-capacity suction was
      measured at, a retention closure with no family named, uncertainty
      declared per layer rather than correlated, or an aquifer property shared
      with the vadose zone -- and exercises that check against ten contracts
      built wrong. It also fails when the states differ between two consistent
      unit frames, which they cannot: the closure reads its two invariant
      pressures only through their ratio, and a frame change cancels. It runs no
      model. With properties still undeclared it reports and exits 0;
      `--strict` is the arm that refuses.

  - id: surface_soil_water
    script: exoplasim/scripts/build_surface_soil_water.py
    loop: A
    cost: minutes
    needs: [land_column_properties]
    writes: ["exoplasim/inputs/{res_lower}/orogen_{res}_surf_0229_provenance.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0229.sra"]

  - id: dust
    script: aeolian/scripts/build_dust.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, surface_water]
    writes: [aeolian/analysis/dust_baseline.nc, aeolian/analysis/dust_baseline.json]

  - id: dust_optics
    script: exoplasim/scripts/dust_optics.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [analysis/dust_optics.json]

  - id: dust_aerofile
    script: exoplasim/scripts/dust_aerofile.py
    cost: seconds
    needs: [dust_optics]
    writes: [exoplasim/data/dust/vesper_dust_aerosol.dat, exoplasim/data/dust/vesper_dust_aerosol.provenance.json]

  - id: surface_dust
    script: exoplasim/scripts/build_surface_dust.py
    loop: A
    cost: minutes
    needs: [dust, dust_aerofile]
    writes: ["exoplasim/inputs/{res_lower}/orogen_{res}_surf_1811_provenance.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1811.sra"]
    gate: only when model.dust_source is set; a no-op at ndustrad = 0

  - id: dust_source_fields
    script: aeolian/scripts/build_dust_source_fields.py
    loop: A
    cost: minutes
    needs: [dust, surface_water, soil]
    writes: ["exoplasim/inputs/{res_lower}/orogen_{res}_surf_1801_provenance.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1801.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1802.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1803.sra"]
    gate: only when model.dust_emission is set; a no-op at ldustemit = 0

  - id: dust_forcing
    script: exoplasim/scripts/dust_forcing.py
    cost: minutes
    needs: [dust, dust_optics, surface_albedo]
    writes: [analysis/dust_forcing.json, analysis/dust_surface_forcing.nc]

  - id: sea_salt_optics
    script: aeolian/scripts/sea_salt_optics.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [analysis/sea_salt_optics.json]

  - id: sea_salt
    script: aeolian/scripts/build_sea_salt.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, sea_salt_optics]
    writes: [aeolian/analysis/sea_salt_baseline.nc, aeolian/analysis/sea_salt_baseline.json]

  - id: volcanic_sulfate
    script: aeolian/scripts/build_volcanic_sulfate.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, sea_salt_optics, weathering_fluxes]
    writes: [aeolian/analysis/volcanic_sulfate.nc, aeolian/analysis/volcanic_sulfate.json]

  - id: vegetation_albedo
    script: analysis/vegetation_albedo.py
    cost: seconds
    needs: [stellar_spectrum]
    writes: [analysis/vegetation_albedo.json]

  - id: rock_albedo_bands
    script: analysis/rock_albedo_bands.py
    cost: seconds
    needs: [stellar_spectrum]
    writes: [analysis/rock_albedo_bands.json]
    gate: >
      the two-band shape per rock class, which `surface_albedo` multiplies into
      whatever level each material carries. It depends on the star and on the
      lithology table, not on a build, so it sits outside every loop; a new rock
      class in `vendor/orogen/js/lithology.js` makes it raise rather than
      writing that class spectrally flat.

  - id: ice_albedo
    script: analysis/ice_albedo.py
    cost: seconds
    needs: [stellar_spectrum]
    writes: [analysis/ice_albedo.json]

  - id: snow_albedo_zenith
    script: analysis/snow_albedo_zenith.py
    cost: seconds
    needs: [stellar_spectrum, ice_albedo]
    writes: [analysis/snow_albedo_zenith.json]
    gate: >
      What a solar zenith term is worth to the snow albedo, which `landmod` has
      no predictor for while `radmod` applies one to ice-free ocean by default.
      EXPLORATION: nothing consumes it and no model term rests on it. It reads
      the model's own star-weighted `dsnowalb*` rather than deriving a second
      set, so it moves when the spectrum does. `notes/audits/snow-albedo-zenith.md`
      is the finding and world-spd the row.

  - id: rock_emissivity
    script: analysis/rock_emissivity.py
    cost: seconds
    needs: []
    writes: [analysis/rock_emissivity.json]
    gate: >
      Broadband thermal emissivity per rock class, one minus the
      directional-hemispherical reflectance of the ECOSTRESS spectra weighted
      by a Planck function. Unlike the albedo derivations it does NOT need the
      stellar spectrum: what weights a thermal emissivity is the surface's own
      emission, not the light falling on it, so this step depends on the
      library and on a declared weighting temperature alone and sits outside
      every loop. Each class carries a solid-to-particulate preparation
      bracket, and `model.land_longwave_emissivity` is its land-area-weighted
      mean. `notes/audits/surface-longwave.md` is the finding.

  - id: soil_thermal_inertia
    script: analysis/soil_thermal_inertia.py
    cost: seconds
    needs: []
    writes: [analysis/soil_thermal_inertia.json]
    gate: >
      Which term controls the modelled soil column's thermal inertia: moisture,
      texture or parent material. Johansen's interpolation as Farouki
      tabulates it, on a declared column, with the model's own scalar pair read
      out of `landmod.f90` rather than copied. It needs no build and no run --
      what it compares is two spreads of one published relation -- so it sits
      outside every loop. The answer ranks moisture first and mineralogy last,
      and last means exactly zero at the dry end, which is why there is no
      per-cell lithology thermal field. `notes/audits/soil-thermal-inertia.md`
      is the finding.

  - id: emissivity_contrast
    reads_export: true
    script: analysis/emissivity_contrast.py
    cost: seconds
    needs: [rock_emissivity]
    writes: [analysis/emissivity_contrast.json]
    gate: >
      Does a per-cell land emissivity buy more than the surface energy balance
      can distinguish, over a scalar set at its own land mean. The criterion is
      1.4 W/m2 of surface net longwave, the top of the model's own dry adiabatic
      energy sink, fixed in the script and not to be moved. It needs a
      climatology for the loss scale and takes one explicitly, because a flux
      scale belongs to one run on one terrain. The answer at T21 is no, which
      is why there is no per-cell emissivity field and no surface code for one;
      `world-vhhs` re-runs it at a finer rung, where cell averaging removes
      less of the contrast.

  - id: spatial_reduction_gap
    reads_export: true
    script: analysis/spatial_reduction_gap.py
    cost: minutes
    needs: []
    writes: [analysis/spatial_reduction_gap.json]
    gate: >
      SPAT-7. Which mesh-to-grid reductions does the ORDER of the operation
      change enough to matter, measured rather than argued. Terrain only: no
      climate run, no soil solve, no biosphere, so it sits outside every loop
      and depends on the export alone. Each arm reports its gap in the units
      the CONSUMING step reports and against that step's own instrument -- the
      roughness builder's `z_ref` bracket, Dunne's scatter on the weathering
      exponent, the pedogenesis model's minimum depth -- because one percentage
      across six quantities would be a preference and not a criterion. Arms
      that need a climate field SWEEP it, since `baseline_climatology` is null
      and `water_table.nc` does not exist, and an arm that crosses its bar
      inside its bracket is reported as crossing rather than resolved.
      `notes/audits/nonlinear-spatial-reductions.md` is the finding; SPAT-4's
      operators in `lib/gridding.py` are what a material gap is corrected with,
      and a gap inside its instrument is a reason NOT to carry an expectation.

  - id: shortwave_band_weights
    script: exoplasim/scripts/shortwave_band_weights.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [exoplasim/analysis/shortwave_band_weights.json]

  - id: cloud_band_weight
    script: exoplasim/scripts/cloud_band_weight.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [exoplasim/analysis/cloud_band_weight.json]
    gate: >
      the CLOUD half of what shortwave_band_weights does for the gases. Lacis
      and Hansen's absorptances are fractions of solar flux and every one has to
      be re-weighted for this host (`config/planet.yaml`); `tswr3` is the one
      that never was. Derived from liquid water's k(lambda), which
      carries no spectrum, flux-weighted over range 2 per star. Lands on
      `model.cloud_absorption_scale`, which scales `tswr3` alone: the
      prescribed-cloud key `acl2` has no reader at `nswrcl = 1`. PHYS-11,
      clim-68

  - id: baseline_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [surface_water, surface_albedo, surface_soil_water, rebuild_binaries]
    writes: []
    presence: by_index

  - id: stellar_cycle_run
    script: exoplasim/scripts/run_stellar_cycle.py
    loop: A
    cost: hours
    needs: [baseline_run, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      requires a FINAL baseline, not merely a converged one: anything still
      outstanding that moves the mean has to land first (`docs/src/pipeline/sequencing.md` A2)

  - id: carve_verdict
    script: hydrography/scripts/carve_verdict.py
    loop: A
    cost: minutes
    needs: [baseline_climatology, hydrography, surface_water, stellar_cycle_run, dust_forcing]
    writes: [hydrography/analysis/carve_verdict.json]

  - id: endmember_bootstrap_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [design_flux, boundary_conditions, surface_roughness, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      the COLD END of section 4's intersection bracket: same design flux, same
      terrain, model.land_albedo_source lithology instead of vegetated. It needs
      its own bootstrap because its lakes, albedo compositing and soil water must
      be built from a bare-rock climatology and cannot inherit the vegetated
      ones. Seed it with --restart-from off the vegetated baseline rather than
      cold-starting. This arm is a BOUND, NOT A WORLD; nobody claims Vesper is at
      this flux without a biosphere, and its numbers should never be quoted as a
      description of the planet

  - id: endmember_baseline_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [endmember_bootstrap_run, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      run on the surface fields rebuilt from the bare-rock bootstrap's own
      climatology. Everything between the two runs is minutes, so the cost of
      this arm is exactly two climate runs and nothing else

  - id: carve_verdict_endmember
    script: hydrography/scripts/carve_verdict.py
    loop: A
    cost: minutes
    needs: [endmember_baseline_run, hydrography]
    writes: [hydrography/analysis/carve_verdict_endmember.json]
    gate: >
      the cold-end verdict. Its own lakes and its own climatology, from the
      bare-rock arm, never the vegetated ones

  - id: carve_list
    script: hydrography/scripts/export_carve_list.py
    loop: A
    cost: seconds
    needs: [carve_verdict, carve_verdict_endmember]
    writes: ["hydrography/data/{build}/carve_list.txt", "hydrography/data/{build}/carve_list.json"]
    gate: >
      carves the INTERSECTION, per `docs/src/pipeline/loops.md`: retain is the larger of
      the two arms', so a rim survives wherever either climate would have kept
      it, and the disagreement is the BRACKETED set by construction rather than
      by a tolerance chosen afterwards. Pass the cold arm's climatology as
      --endmember-climatology; without it this is ONE arm of the bracket and the
      sidecar's `intersection.single_climate` says so rather than letting a
      reader mistake it for two

  # Where ice can persist, at the MESH's resolution rather than the model's. The
  # model forms no permanent land ice at any truncation this project will run --
  # a cell's temperature is evaluated at its mean elevation and the ground inside
  # it is kilometres higher -- so `glac` is a fact about the grid and cannot be
  # the instrument. The warmest-bin surface temperature is smooth and genuinely
  # resolved; lapse-correcting it to each region's own elevation is what locates
  # ice. Consumed AT GENERATION like the carve list, because glacial, hydraulic
  # and thermal erosion share one iteration loop. PHYS-13.
  - id: ice_mask
    script: analysis/ice_mask_freezing_height.py
    loop: A
    cost: minutes
    needs: [baseline_climatology]
    writes: [analysis/ice_mask_freezing_height.json]
    gate: >
      --write-mask emits what Orogen reads and its sidecar; without the sidecar the
      mask has no mesh identity and the generator refuses it. Only the T42 export
      keeps raw/, so a climatology at another truncation needs --grid-export to name
      the export whose GRID it was run on while --build names the mesh

  - id: orogen
    script: vendor/orogen
    loop: A
    cost: hours
    needs: [carve_list, ice_mask]
    writes: ["source/{build}/"]
    first_pass: >
      TWO PASSES, AND THE FIRST ONE HAS NO ICE. `ice_mask` needs
      `baseline_climatology`, which needs a build, which is this step -- so on
      the first pass through loop A neither of this step's `needs` can be
      satisfied and the edge is not a cycle but a PASS BOUNDARY, the same one
      `reads_export` exists to keep out of `needs`. Generate the first build
      with `--glacial 0`, which is an honest null rather than an
      Earth-calibrated guess; commission it to a baseline; write the mask from
      that climatology with `ice_mask_freezing_height.py --write-mask`; then
      regenerate with `--ice-mask`. The commissioning is therefore PART of the
      regeneration and does not follow it.
      It cannot be collapsed into one pass, because Orogen has no climate to
      place ice from before it makes the terrain. It cannot be bolted on
      afterwards either: glacial, hydraulic and thermal erosion share one
      iteration loop and a mid-loop priority flood cuts outlets through the
      depressions glaciation makes, so a later glacial pass would leave them
      undrained and move the drainage network. WORLD-Q5IG carries the run.
    gate: >
      the carve gate: nothing outstanding may still move an artifact the verdict
      is computed from. READ THE OPEN ISSUES AND DECIDE. Deliberately not computed,
      and not because a filter over `step:` labels performed badly -- because
      it answers a different question. Whether an issue still moves the verdict
      is a fact about what closing it would CHANGE, which is its prose; a label
      records where the work is filed. An issue can name an upstream step and move
      nothing, being deferred, a bound, or blocked on something after the carve.

  # Whether the prescribed pCO2 is backed by a plausible outgassing rate. The
  # comparison lives in weathering_fluxes.py; the CONCLUSION lives here, because
  # a verdict that is a constant string is not a check. Needs nothing: with the
  # requirement artifact absent it refuses for exactly that reason, which is the
  # state config/planet.yaml already records in prose.
  - id: outgassing_gate
    script: pedology/scripts/outgassing_gate.py
    cost: seconds
    needs: []
    writes: [pedology/analysis/outgassing_gate_report.json]
    gate: |
      With `requested: false` in pedology/config/outgassing.yaml it reports what
      is undeclared and exits 0. With `requested: true` -- which is what claiming
      anywhere that the prescribed CO2 is SUPPORTED by outgassing means -- it
      refuses by name for every unmet precondition. It refuses on two kinds of
      defect: a field left undeclared, and a field declared and WRONG -- a
      disordered bracket, a value its own bracket does not contain, fractions
      that do not sum to 1, and fractions that disagree with the fluxes they
      were assembled from.

  - id: weathering_fluxes
    script: pedology/scripts/weathering_fluxes.py
    cost: minutes
    needs: [soil, hydrography, outgassing_gate]
    writes: [pedology/analysis/weathering_fluxes.json]

  - id: thermostat_efficiency
    script: pedology/scripts/thermostat_efficiency.py
    cost: minutes
    needs: [weathering_fluxes]
    writes: [pedology/analysis/thermostat_efficiency.json]

  # What CHOOSING a weathering scheme costs the thermostat, as opposed to what a
  # parameter inside one costs it. Needs the export and nothing else: the three
  # schemes are all separable into a power law in runoff and an exponential in
  # temperature, so the comparison is analytic and no climatology enters it.
  - id: weathering_scheme_bracket
    script: pedology/scripts/weathering_scheme_bracket.py
    cost: seconds
    needs: []
    writes: [pedology/analysis/weathering_scheme_bracket.json]

  - id: brine_paths
    script: pedology/scripts/brine_paths.py
    cost: minutes
    needs: [hydrography, baseline_climatology]
    writes: [pedology/analysis/brine_paths.json]

  - id: surface_classes
    script: pedology/scripts/build_surface_classes.py
    cost: minutes
    needs: [soil, brine_paths, dust, surface_water]
    writes: [pedology/analysis/surface_classes.nc, pedology/analysis/surface_classes_report.json]

  - id: phosphorus_budget
    script: pedology/scripts/phosphorus_budget.py
    cost: minutes
    needs: [soil, dust, surface_water]
    writes: [pedology/analysis/phosphorus_budget.json]

  - id: vesper_header
    script: biosphere/scripts/build_vesper_header.py
    loop: B
    cost: minutes
    needs: [bootstrap_climatology]
    writes: [biosphere/generated/vesper_provenance.json, biosphere/generated/vesper.h]
    gate: >
      declared `needs: []` until 2026-08-19, which read as "compiles from
      config/planet.yaml alone". It does not: it fits the LPJ-GUESS solstice
      offset against the solar declination an ExoPlaSim climatology actually
      reports, so day 0 of the biosphere year is pinned to the first
      climatology bin. The bootstrap's is enough, because the phase is a
      property of the model calendar rather than of the climate state -- but a
      climatology has to exist, and with none named the script exits.

  - id: vesper_pfts
    script: biosphere/scripts/build_vesper_pfts.py
    loop: B
    cost: minutes
    needs: [vesper_header]
    writes: [biosphere/generated/vesper_pfts_provenance.json, biosphere/generated/vesper_pfts.ins]

  - id: lpj_driver
    script: biosphere/scripts/build_lpj_driver.py
    loop: B
    cost: minutes
    needs: [baseline_climatology, land_column_properties, vesper_pfts]
    writes: [biosphere/generated/vesper_driver_provenance.json, biosphere/generated/vesper_driver.bin]

  - id: bvoc_gate
    script: biosphere/scripts/bvoc_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/bvoc_gate_report.json]
    gate: >
      the activation contract for the simulated biosphere's volatile organic
      source. It reads biosphere/config/bvoc.yaml and REFUSES activation, by
      name, for every precondition still undeclared; with no request it reports
      and exits 0, because a biosphere run with that source off is a correct
      run. `lpj_run` needs it so the refusal sits on the path rather than
      beside it.

  - id: wetland_gate
    script: biosphere/scripts/wetland_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/wetland_gate_report.json]
    gate: >
      the activation contract for the simulated biosphere's wetlands, peat and
      methane. It reads biosphere/config/wetlands.yaml and refuses, by name, for
      every precondition still undeclared, and it ALSO reads the vendored source
      and refuses for every hydrology defect still there: water added to a
      wetland stand that the simulated world never received, a constant runon
      carrying no catchment, an annual water-table average guarded on an ordinal
      the calendar never reaches, and prognostic peat hydrology absent from the
      serializer. A declaration claiming a defect is closed while the probe
      still finds it is reported as a contradiction rather than believed.
      It also holds every retained acceptance table against the emitter that
      would have to write it: run_lpj_guess.py derives an instruction row from
      each retained filename's stem, so a table with no declared parameter in
      modules/commonoutput.cpp would abort the run while plib parsed the
      instruction file, naming one unknown parameter and nothing about why.
      Both halves are checked, so neither a table that lost its emitter nor one
      that quietly gained one can sit in the declaration unnoticed.
      A fixture set runs on every invocation: mutations of the declaration built
      to be wrong in a named way, the live declaration which must be refused,
      three mutations of the EVIDENCE so that the contradiction branch stays
      checkable after the repair that made the source agree, and a met
      declaration against a repaired source which must be GRANTED, because a
      gate nothing can satisfy is a wall. With no request it reports and exits
      0, because a biosphere run with peat and methane off is a correct run.
      `lpj_run` needs it so the refusal sits on the path rather than beside it.

  - id: soil_restart_state_gate
    script: biosphere/scripts/soil_restart_state_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/soil_restart_state_report.json]
    gate: >
      what a restarted soil column inherits. Soil::serialize is the whole of it,
      and a member of the Soil class absent from that block is either state the
      restart drops or something the model rebuilds before it reads it -- the
      two are indistinguishable in a diff. It parses the class body in
      framework/guess.h and the serialize block in modules/soil.cpp against
      biosphere/config/soil_restart_state.yaml, which classifies every absent
      member with the file:line that settles it, and refuses on a member nothing
      accounts for, on a classification the serializer now contradicts, on a
      name the class has dropped, on a classification carrying no evidence, and
      on a non-empty `lost` block. Six fixtures built to be wrong in a named way
      run on every invocation, plus the live declaration, which must be granted.
      A member added to the Soil class lands unclassified and stays there, which
      is what keeps the sweep from having to be argued again. `lpj_run` needs it
      so the refusal sits on the path rather than beside it.

  - id: ntransform_gate
    script: biosphere/scripts/ntransform_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/ntransform_gate_report.json]
    gate: >
      the declaration of the simulated soil's nitrogen transformation operator,
      checked against the source the model reads. It reads
      biosphere/config/ntransform.yaml and fails on a constant that has drifted
      from global_soiln.ins, on a literal no longer in modules/ntransform.cpp,
      on a response function that leaves the range its role allows over the
      declared domain, and on a chain of factors whose product would take more
      nitrogen out of a pool than the pool holds. Seven reduced fixtures run on
      every invocation, six built to be wrong in a named way. With every Vesper
      precondition still undeclared it reports and exits 0, because a run on the
      declared Earth-calibrated operator is a correct run of a declared model
      boundary; `--strict` is the arm that refuses. `lpj_run` needs it so the
      boundary sits on the path rather than beside it.

  - id: somdynam_gate
    script: biosphere/scripts/somdynam_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/somdynam_gate_report.json]
    gate: >
      the declaration of the simulated soil's phosphorus path, checked against
      the source the model reads. Its reference point is a SUBTREE COMMIT and
      not a release: LPJ-GUESS 4.1.1 has no phosphorus, so nothing here can be
      compared against one, and the register names the commit the CNP fork was
      vendored at instead. It reads biosphere/config/somdynam.yaml and fails on
      a saturation constant whose line modules/somdynam.cpp no longer runs or
      whose value is not what that line's own initialiser evaluates to, on a C:P
      ramp whose setptoc call the source no longer contains or contains a
      different number of times, on a ramp leaving the P:C range its two
      endpoints allow, on a line the phosphorus argument rests on that the model
      no longer runs, and on any of the three halves of a declared divergence
      from the fork. Sixteen fixtures run on every invocation, fifteen built to
      be wrong in a named way. With PCONC_SAT still unsourced it reports and
      exits 0, because this project runs ifplim 0 and parameters.cpp already
      refuses ifplim 1 on that same constant; `--strict` is the arm that
      refuses. `lpj_run` needs it so the refusal sits on the path rather than
      beside it.

  - id: mineral_reactivity_gate
    script: biosphere/scripts/mineral_reactivity_gate.py
    loop: B
    cost: seconds
    needs: [soil]
    writes: [biosphere/generated/mineral_reactivity_gate_report.json]
    gate: >
      one contract for how the simulated soil protects carbon and sorbs
      phosphorus. It reads biosphere/config/mineral_reactivity.yaml and fails on
      a coefficient whose literal is no longer in modules/somdynam.cpp, on a
      declared equation that leaves its range over the texture simplex, on the
      microbial partition's remainder moving off its registered minimum, on a
      soil map missing a carried column or carrying one out of range, and on any
      model file reading the carried andic state while the arm that would use it
      refuses. Six reduced fixtures run on every invocation, five built to be
      wrong in a named way. With every mineral-aware proxy still undeclared it
      reports and exits 0, because a run on the declared texture-only arm is a
      correct run of a declared model boundary; `--strict` is the arm that
      refuses.

  - id: abiotic_nutrient_ledger
    script: biosphere/scripts/abiotic_nutrient_ledger.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/abiotic_nutrient_ledger_report.json]
    gate: >
      the one ledger every abiotic nutrient source books into, from source
      material to the terrestrial root zone and on to a named terminal
      boundary. It reads biosphere/config/abiotic_nutrients.yaml, fails on a
      graph that does not close, exercises the mass balance on fixtures built
      to be wrong, refuses any source screen carried on an aerosol optical
      depth, and reports the non-N/P adequacy screen's critical runoff per
      element and per lithology. With every term still undeclared it reports
      and exits 0, because a biosphere run on the declared nitrogen scalar is
      a correct run; `--strict` is the arm that refuses. `lpj_run` needs it so
      the declared C-N-P model boundary sits on the path rather than beside it.

  - id: acclimation_gate
    script: biosphere/scripts/acclimation_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/acclimation_gate_report.json]
    gate: >
      the memory the simulated plants' basal respiration rate carries. Acclimated
      respiration replaces each plant functional type's respcoeff with a function
      of the GROWTH temperature the tissue has adjusted to, and that growth
      temperature is a running mean whose e-folding time this project cannot
      derive and so brackets. It reads
      biosphere/config/respiration_acclimation.yaml and fails on the acclimation
      multiplier reading an instantaneous temperature again, on a growth
      temperature missing from a serialize list, on a default appearing for
      acclim_resp_tau or its refusal going missing, on the state being seeded
      from a constant rather than from the forcing, on a declaration that
      disagrees with itself, and on a run instruction naming a memory the
      declaration does not carry. Sixteen fixtures run on every invocation, six
      built to be wrong in a named way, and the declaration fixtures drive a
      reference declaration rather than the live file so a fixture verdict is
      never a statement about the tree. It executes the one-factor sensitivity
      registered over the bracket and reports its response, which carries no
      pass/fail bar and is propagated as model-form uncertainty; `--strict`
      refuses an acclimated path with no declared memory length.

  - id: phenology_gate
    script: biosphere/scripts/phenology_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/phenology_gate_report.json]
    gate: >
      where the simulated vegetation's seasonal landmarks come from. The coldest
      and warmest day of the simulation year decide when the summergreen
      degree-day sum, the annual leaf-on sum and chilling detection reset, and
      they are derived per gridcell from the temperature forcing rather than
      taken from an Earth calendar. It fails on an Earth ordinal date back in any
      compiled source, on a reader no longer keyed on the derived pair, on a
      chill-day count able to leave the lookup table it indexes, and on a
      landmark field missing from Climate::serialize. Eleven fixtures run on
      every invocation, four built to be wrong in a named way, over northern,
      southern, equatorial, flat and sixteen-orbit forcings. `--strict` refuses
      on the one natural-vegetation event still on an Earth calendar, BIO-31.

  - id: lpj_run
    script: biosphere/scripts/run_lpj_guess.py
    loop: B
    cost: hours
    needs: [lpj_driver, bvoc_gate, abiotic_nutrient_ledger, ntransform_gate, somdynam_gate, mineral_reactivity_gate, phenology_gate, acclimation_gate, wetland_gate, soil_restart_state_gate]
    writes: [biosphere/runs/]

  - id: prospectivity
    script: minerals/scripts/build_prospectivity.py
    cost: minutes
    needs: [hydrography]
    writes: ["minerals/data/{build}/prospectivity.nc", "minerals/data/{build}/prospectivity_report.json"]

  - id: downstream_prospectivity
    script: minerals/scripts/build_downstream_prospectivity.py
    cost: minutes
    needs: [prospectivity, brine_paths, surface_classes, soil]
    writes: ["minerals/data/{build}/downstream_prospectivity.nc", "minerals/data/{build}/downstream_prospectivity_report.json"]

  - id: trace_gas_forcing
    script: analysis/trace_gas_forcing.py
    cost: seconds
    needs: []
    writes: [analysis/trace_gas_forcing.json]
    gate: >
      needs references/rugheimer_2013_spectral-fingerprints-of-earth-like-planets-around-fgk-stars.pdf,
      which is untracked; references/INDEX.md carries the DOI

  - id: error_budget
    script: scripts/error_budget.py
    cost: seconds
    needs: [carve_list, baseline_climatology, surface_albedo]
    reads_export: true
    writes: [analysis/error_budget.json]

  - id: basemap
    reads_export: true
    script: maps/build_basemap.py
    cost: minutes
    needs: [analyze_climatology, surface_water]
    writes: [maps/build/basemap_provenance.json, maps/build/basemap.npy, maps/build/land.npy, maps/build/basemap_equirectangular.png, "maps/build/region_index_*.npy"]
    # `reads_export` was absent while the terrain was read all the same, through
    # `builds.mesh_export()`. It is what makes the map reachable from `orogen`,
    # and so what makes the set of steps a frame is taken after derivable rather
    # than listed.

  - id: projections
    script: maps/render_projections.py
    cost: minutes
    needs: [basemap]
    writes: ["maps/data/{build}/INDEX.json", "maps/data/{build}/*/*.png", "maps/data/{build}/*/provenance.json"]
    # One UUID-named frame per state of the world, namespaced by build like
    # every other component's data. INDEX.json says what each frame is and is
    # the only record once a frame is deleted, so it is tracked and they are
    # not. The authagraph is the default output and the other six are behind
    # flags; `maps/snapshot.py` is what the plan runs after each step.

  - id: world_state
    script: scripts/world_state.py
    cost: seconds
    needs: [index_runs, analyze_climatology, carve_list, hydrography, stellar_spectrum]
    reads_export: true
    writes: [world_state.json]

# Run, never generate an artifact, and gate the expensive steps.
checks:
  - id: check_consistency
    script: scripts/check_consistency.py
  - id: smoke_test
    script: scripts/smoke_test.py
  # Does the model SOURCE compile: gfortran -fsyntax-only over every translation
  # unit `plasim/CMakeLists.txt` names, in `use` order, under the flag line
  # config/planet.yaml declares. Not whether a binary is current, which is rule
  # 4's question and check_consistency's row above. smoke_test runs it, and it
  # is registered here as well because it is a gate a caller can run alone --
  # after a Fortran edit, before paying for a build.
  - id: verify_model_compiles
    script: exoplasim/scripts/verify_model_compiles.py
  # Does any domain-sensitive intrinsic sit inside a masked `where` block whose
  # complement can hold an out-of-domain argument? A `where` masks the
  # ASSIGNMENT and not the evaluation, so the compiler may evaluate the
  # right-hand side on every lane, and the declared `-ffpe-trap` turns a lane
  # that was going to be discarded into SIGFPE. That is world-bhs, and it is why
  # the flag line is -O2 rather than -O3.
  #
  # A pure text parse of plasim/src, no build and no run. It OVER-reports by
  # construction -- it clears its where-stack only on an explicit `end where`,
  # recognises only a literal set of guard shapes, and knows nothing about the
  # physics of a mask -- so a clean run is evidence and a dirty one is a work
  # list. The sites it cannot guard carry their argument in the script's
  # CLASSIFIED table, keyed on the argument text, so a changed argument is
  # reported again. Exit 1 on anything neither guarded nor classified.
  - id: lint_masked_domains
    script: exoplasim/scripts/lint_masked_domains.py
  # Which declarations in plasim/src acquire SAVE inside a procedure body? A
  # local with an initialiser is SAVEd, SAVE is static storage, and under
  # -fopenmp static storage is one copy for the whole thread team -- which is
  # the defect the Stage 1 thread port tripped over in glacierini. Under the
  # deleted MPI arm each rank was a process and the same source was correct, so
  # this class is reachable only since world-38b made every build threaded, and
  # gfortran reports nothing about it at any warning level.
  #
  # A pure text parse, no build and no run. It over-reports the same way
  # lint_masked_domains does, and each site's verdict lives either in an
  # !$omp threadprivate directive beside the declaration or in the script's
  # CLASSIFIED table, keyed on the variable name. Exit 1 on anything with
  # neither.
  - id: lint_implicit_save
    script: exoplasim/scripts/lint_implicit_save.py
  # Does anything uninitialised reach a stored value, at the optimisation level
  # this project ships? The trapping form of that question does not arm at -O2
  # -- world-5rs measured the positive control -- and `-finit-real=zero` was
  # removed because it hid the answer rather than reporting it. This is the
  # PROPAGATING form, which needs no trap: the declared flag line plus
  # `-finit-real=snan` with FE_INVALID masked, on one bed, restart compared bit
  # for bit against the shipped build's, with a deliberate uninitialised read as
  # the control. It is the evidence the 26.03% trade in
  # exoplasim/notes/the-zeroing-is-an-init-flag.md rests on.
  #
  # UNLIKE THE THREE ABOVE it takes arguments -- a bed, a rung, a thread count --
  # and it is not run by smoke_test. It costs four builds at the rung it is asked
  # for (two flag lines, twice, once with the control patched in) and six runs of
  # the bed; nothing else, and it writes no artifact.
  - id: verify_uninitialised_reads
    script: exoplasim/scripts/verify_uninitialised_reads.sh
  # Is a continued LPJ-GUESS run the same experiment as the run it continues?
  # Three modes over the same forcing. The default takes two runs of the same
  # length, one whole and one split, and compares their output tables from the
  # restart point on. `--one-day` splits at an arbitrary simulated DAY and
  # compares the two runs' STATE FILES one day later, so lost state shows up as
  # bytes that differ after one day rather than as a year of divergence.
  # `--round-trip` restarts and writes the state again with no day in between,
  # which names what the write-and-read of a state file does not carry. All
  # three are wrong answers rather than merely different ones. It is the
  # behavioural half of the WET-3 restart repair, where the wetland_gate probe
  # and soil_restart_state_gate over Soil::serialize are the static half.
  #
  # LIKE the row above it takes arguments -- a run length, a restart year, a
  # rank count -- and it is not run by smoke_test. It needs a compiled model and
  # a built forcing, neither of which exists until a baseline climatology does,
  # and it exits naming what is missing rather than reporting a pass.
  - id: verify_lpj_restart_continuity
    script: biosphere/scripts/verify_lpj_restart_continuity.py

# Present, deliberately outside the graph: no step row runs them (some are
# imported as modules by step scripts).
one_offs:
  # Runs the `basemap` and `projections` steps at a point in a pass and writes
  # nothing of its own, which is why it is here rather than a step: two rows
  # naming one artifact would give `--purge` two answers. `--plan` names it
  # after every step the map is reachable from.
  - maps/snapshot.py
  # Reports the host's load and who has claimed it, and writes only a claim file
  # OUTSIDE the repository. It is not a step because it produces nothing the
  # pipeline reads and nothing `--purge` should ever delete; it is here so the
  # generator gate can see that its absence from the graph is deliberate.
