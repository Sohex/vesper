# THE PIPELINE GRAPH. Single source of truth for what steps exist, what each
# generates, and what must precede it.
#
# The pipeline chapters (docs/src/pipeline/) own the REASONING -- why the order is what it is, what each stage
# is for, why the loops close, and the traps. They reference step ids from here
# and does not restate them. This file owns the graph and nothing else: no
# rationale, no narrative, no current values. Two representations of one thing in
# two files is the duplication both documents exist to prevent.
#
# The graph is directed and CYCLIC by design. Each loop carries an exit predicate
# rather than a topological order, and `scripts/pipeline.py` plans one pass at a
# time rather than solving the cycle.
#
# consumers are NOT declared: they are derived from `needs`. Declaring both would
# be the same duplication one level down.

version: 1

loops:
  A:
    name: the terrain loop
    exit: >
      Successive verdicts bracket rather than converge, because the map is
      antitone: a larger carve set produces a smaller next verdict. Exit by
      carving the INTERSECTION of the verdicts taken at the two bounding
      climates, which makes the BRACKETED set a construction rather than a
      tolerance. That bracket is over the VEGETATION state and it does not
      cover the carve's own antitone feedback: both arms run on pre-carve
      terrain, and an overshooting basin is one both arms cut, so it is never
      in the bracketed set. So the exit carries a second number, measured once
      the carved build has its own baseline: re-take the verdict on the
      PRE-CARVE basins under the POST-CARVE climatology and report how many of
      the applied carves would no longer carve. That is the OVERSHOOT,
      `hydrography/scripts/carve_overshoot.py` computes it, and it is reported
      beside the bracket width rather than inside it.
      `notes/audits/carve-overshoot.md` has the argument and the route.
  O:
    name: the offline ocean-transport loop
    exit: >
      The declaration in ocean/config/transport_loop.yaml. Each pass hands a
      chronologically complete atmosphere/land/ice forcing bundle to cGENIE,
      returns GOLDSTEIN heat convergence and surface velocity to ExoPlaSim,
      and requires two consecutive pass pairs to satisfy every declared axis:
      transport change, ocean heat inventory, SST and sea-ice change,
      atmospheric storage, freshwater/salt closure, and stability of the
      carve-driving basin classification. Temperature restoring is forbidden;
      salinity restoring is off unless a later declaration names its target,
      strength, and salt-budget treatment. The loop refuses after the finite
      pass budget rather than silently accepting a non-converged ocean.
  B:
    name: the soil and biosphere loop
    exit: >
      the criteria in pedology/config/pedogenesis.yaml: a relative tolerance on
      land-mean soil organic carbon and a cap on the fraction of land cells
      whose clay content moves, both between successive iterations of THIS
      loop, plus a maximum iteration count.

      WHAT THAT EXIT DOES AND DOES NOT BOUND, because the two are easy to
      merge. This loop runs AT A FIXED CLIMATE by construction
      (`docs/src/pipeline/sequencing.md` section B: "for a given climate"), so
      the climatology is a constant across the iterations these criteria
      compare and both quantities move only under the soil-biosphere exchange.
      That is what they bound.

      The soil-climate exchange is a different circuit and it closes through
      loop A, not here: `soil` feeds `land_column_properties`, which feeds
      `surface_soil_water`, which is an input to `baseline_run`, whose
      climatology `soil` then reads. It is traversed once per loop A
      iteration, and loop A's exit is the carve bracket and its overshoot,
      which are measured in basins. So neither loop's exit predicate observes
      the soil-climate fixed point, and a claim that the soil has converged is
      a claim about this loop's two criteria at one climate.
  C:
    name: the vegetation-climate loop
    exit: re-take the verdict on modelled vegetation; if basins flip, re-enter A
  D:
    name: the declared escalation to T85
    exit: >
      T85 is the OPERATING SUPPORT and is declared, not discovered. The route
      moves resolution and timestep one at a time and never both at once, and
      THIS route never moves the timestep at all: T21 at dt 45, converge;
      convert to T42 at dt 45, converge; convert to T85 at dt 45, converge;
      then continue at NLOWIO = 0 with high-cadence orbits for dust. Every
      conversion therefore happens at constant dt, so exactly one variable moves
      per step and a surprise after a conversion is attributable to the support
      alone. It carries NO SETTLING BLOCK, because dt 45 is at or below every
      rung's measured ceiling and a settling block exists only to change dt
      before a conversion; `lib/run_lengths.py:settling_orbits` still prices one
      for the fallback. It is an ATTEMPT: the ceilings license each rung to
      START clean at 45 and endurance there is established only for T21, so a
      rung that will not hold 45 for a commissioning span drops the route back
      to the four-entry form that reconverges T21 at 30 and runs both
      conversions there, which reinstates one settling block at T21 and none
      above it. All three steps are COMMISSIONING: ONE CONVERGENCE WINDOW, then THREE-orbit
      increments until the convergence criteria are met; the criteria cannot be
      evaluated on fewer orbits than they are taken over, and
      `assess_convergence.py` derives that window rather than carrying a
      literal. Advance only after the current support has settled, replaying A, B
      and C on it. There is no between-rung convergence comparison: choosing
      T85 by decision removed the question one would answer, and nothing finer
      is being run to difference it against. The one
      timestep is at or below every rung's MEASURED ceiling, re-taken by
      WORLD-37TN: the grid now carries a refusing cell above each, at 150 for
      T21, 90 for T42 and 60 for T85, so these are boundaries rather than
      declared intent. A ceiling bounds the route and does not set it, and it
      qualifies a step against REFUSAL and nothing else; endurance lives in
      `lib/rungs.py:COMMISSIONING_EVIDENCE`.
      `docs/src/pipeline/sequencing.md` section D.

# writes: the COMPLETE set of artifacts a step produces, not a marker for them.
#       `--purge` deletes exactly this, so a row that names only its report
#       leaves the bulk behind and reports success. Three forms are accepted:
#       a file path; a directory, written with a trailing slash, meaning the
#       step owns the whole directory; and a glob, for a family of outputs
#       whose exact names a step decides at run time (per-projection renders,
#       per-label plots).
#
# reads_export: the step consumes `source/{build}/` directly. This is NOT a
#       `needs` edge and must not become one. `needs` is the order WITHIN one
#       pass of a loop, and loop A closes by `orogen` consuming a carve list
#       produced from the previous pass -- so making the export a `need` would
#       put every step upstream of `carve_list` and collapse the carve gate to
#       "everything". The export edge crosses a pass boundary and `needs` does
#       not, which is why it is a separate key. `--purge orogen` seeds from it.
#
# A climatology `need` says WHICH CLIMATOLOGY MUST EXIST, not which one the
#       step reads. The two are different statements and conflating them is what
#       pinned ten steps to a first-pass artifact forever. A step declaring
#       `bootstrap_climatology` runs on a first pass, when no baseline exists at
#       all, so the bootstrap is what its edge requires; what it READS is decided
#       by whether its answer depends on the climate STATE. Where it does, the
#       script calls `lib/paths.py:best_available_climatology`, which returns the
#       baseline once `config/planet.yaml` names one and stamps `climatology_stage`
#       on the product; where the answer depends only on the model calendar or the
#       grid, it calls `bootstrap_climatology_path` and a baseline would tell it
#       nothing. `scripts/smoke_test.py:check_climatology_needs_match_call_sites`
#       holds every step to the resolvers its declaration permits, and
#       `docs/src/pipeline/loops.md` carries the argument.
#
# cost: seconds | minutes | hours. `hours` is what must never run by accident.
# loop: which loop the step belongs to, or a LIST where it belongs to more than
#       one. A step in two loops is one that is re-run on a different input by
#       the later one, not two steps: one artifact, one row.
# gate: a condition that must hold before the step is meaningful. Absent means
#       none. A gate is NOT a request for a preference -- it is a statement that
#       the recorded procedure does not yet cover this case.

steps:

  - id: spatial_support_gate
    script: scripts/spatial_support_gate.py
    cost: seconds
    needs: []
    writes: [analysis/spatial_support_gate_report.json]
    gate: >
      SPAT-1's versioned vocabulary and malformed-contract fixtures. It makes
      geometry and coordinate identity, native/effective measure, field and
      time semantics, operator order and provenance prerequisites of a spatial
      artifact. It runs no model; SPAT-10 applies the contract to crossings and
      production outputs.

  - id: spatial_conversion_gate
    script: scripts/spatial_conversion_gate.py
    cost: seconds
    needs: [spatial_support_gate]
    writes: [analysis/spatial_conversion_gate_report.json]
    gate: >
      SPAT-10's assessed-conversion envelope and no-simulation fixtures. It
      binds source and destination contract identities, shapes and coordinates;
      closes every applicable conserved ledger; requires constant, identity,
      reduction, round-trip, operator-order and common-support tests; and keeps
      fallbacks, ownership/connectivity changes, spectral loss and unmapped
      stores as machine-readable inventories.

  - id: stellar_spectrum
    script: exoplasim/scripts/build_stellar_spectrum.py
    cost: minutes
    needs: []
    writes: ["exoplasim/inputs/stellarspectra/{name}.dat", "exoplasim/inputs/stellarspectra/{name}_hr.dat", "exoplasim/inputs/stellarspectra/{name}_provenance.json"]

  - id: rebuild_binaries
    script: exoplasim/scripts/rebuild_binaries.py
    cost: minutes
    needs: []
    writes: [exoplasim/binary_manifest.json]

  - id: hydrography
    reads_export: true
    script: hydrography/scripts/build_hydrography.py
    loop: A
    cost: minutes
    needs: [spatial_support_gate]
    writes: ["hydrography/data/{build}/regions.nc", "hydrography/data/{build}/basins.nc", "hydrography/data/{build}/hydrography_report.json", "hydrography/data/{build}/coupling_exoplasim-{res}.nc", "hydrography/data/{build}/coupling_exoplasim-*.nc"]
    # One coupling matrix per grid in --grids, which defaults to the configured
    # rung. TWO ENTRIES, because presence and purge ask different questions of
    # the same family. The {res} entry is the one the configured rung needs, so
    # --status calls this step done only when THAT grid's matrix is there; the
    # glob alone answered "present" for a T21 matrix while the config asked for
    # T42. The glob stays beside it so --purge still reaches every rung this
    # step has been asked for, not only the one the config names today.
    # They are the interface every mesh-to-grid consumer integrates catchments
    # over, and they were generated by this step but declared by no row, so
    # nothing downstream could name what it was reading.

  - id: boundary_conditions
    reads_export: true
    script: exoplasim/scripts/build_boundary_conditions.py
    loop: A
    cost: minutes
    needs: [spatial_support_gate]
    writes: ["exoplasim/inputs/{res_lower}/boundary_conditions_report.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0129.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0172.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1720.sra"]

  - id: coastline_threshold_cost
    reads_export: true
    script: analysis/coastline_threshold_cost.py
    loop: A
    cost: minutes
    needs: [spatial_support_gate]
    writes: [analysis/coastline_threshold_cost.json]
    gate: >
      SPAT-5's area and store half, measured independently on every exported
      rung. It reports both one-signed coastline errors, below-datum land loss,
      extensive land-volume closure, partial-cell support and mesh fallbacks;
      a cancelling net is never accepted as the size of the rounding.

  - id: partial_surface_gate
    script: analysis/partial_surface_gate.py
    loop: A
    cost: seconds
    needs: [coastline_threshold_cost]
    writes: [analysis/partial_surface_gate_report.json]
    gate: >
      SPAT-5's partition, decision-state and no-simulation fixtures. It checks
      the full active-build ladder, exact absence rather than smallness of the
      inherited-water third class, ExoPlaSim's hard binary boundary, exact
      extensive closure and explicit same-row reference expansion.

  - id: coastline_flux_bracket
    reads_export: true
    script: analysis/coastline_flux_bracket.py
    loop: A
    cost: seconds
    needs: [baseline_climatology, partial_surface_gate]
    writes: [analysis/coastline_flux_bracket.json]
    gate: >
      SPAT-5's flux half requires the accepted baseline on the active build and
      has deliberately no bootstrap or stale-file fallback. It bounds the
      missing land or ocean share with observed same-class annual-mean fluxes
      along the same Gaussian row, inventories every adjacent-row expansion,
      and is a fixed-climate model-form bracket rather than a tile prediction.

  - id: partial_surface_decision_gate
    script: analysis/partial_surface_decision_gate.py
    loop: A
    cost: seconds
    needs: [coastline_flux_bracket]
    writes: [analysis/partial_surface_decision_gate_report.json]
    gate: >
      SPAT-5's post-measurement choice. It re-reads the accepted baseline's
      pre-existing state-storage tolerance, reproduces the materiality
      inequality, holds the declaration to the measured result, verifies the
      code-1720 fractional support carrier from native mesh through every model
      start, and refuses while tile exchange is still hard-binarised in source.

  - id: rootable_albedo_gate
    script: exoplasim/scripts/rootable_albedo_gate.py
    loop: C
    cost: seconds
    needs: [equilibrium_window_gate]
    writes: [exoplasim/analysis/rootable_albedo_gate_report.json]
    gate: >
      BIO-17's extensive-share compositing identity. LPJ cover is conditional
      on BIO-11 rootable ground, so canopy replaces only the rootable substrate
      contribution; solved water and dry barren contributions never receive
      the `(1-cover)` factor. Seven fixtures cover ordinary, wholly barren,
      partial-lake and pure persistent-lake cells, exact code-212 forest share,
      and two-band recombination.

  - id: surface_albedo
    reads_export: true
    script: exoplasim/scripts/build_surface_albedo.py
    loop: [A, C]
    cost: minutes
    needs: [lpj_acceptance, rootable_fraction, rootable_albedo_gate, rock_albedo_bands, soil_albedo_wetting, vegetation_albedo]
    writes: ["exoplasim/inputs/{res_lower}/albedo_report.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0174.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0175.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0176.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0212.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1742.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1750.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1760.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1743.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1751.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1761.sra"]
    gate: >
      THREE POINTS AND NOT TWO. The mixing landmod applies between the staged
      dry and saturated pairs is concave in the albedo, so a cell's own mixture
      of rocks is reproduced at the two ends and nowhere between them, at a
      measured 0.147 W m-2 of global-mean absorbed shortwave against a
      0.12 W m-2 storage tolerance. Codes 1743, 1751 and 1761 carry the cell's
      area mean of the per-region mixings at the evaporation limiter's knee,
      which brings it to 0.042 and inside the bar. The mixing is applied per
      REGION and reduced afterwards; reducing first and mixing after reproduces
      the defect. `--mode scaled` refuses to stage them and says so, because a
      per-cell factor applied after the reduction is not a mixing.
      `notes/audits/nonlinear-spatial-reductions.md` section 7 is the finding.
      the `lpj_acceptance` edge is loop C and is a BACK edge: the first pass of an
      iteration runs --mode vegetated on terrain alone, before any biosphere
      exists, and the mode this project should end up in is --mode modelled
      --vegetation <run>/fpc.out, which raises without it. One artifact, one
      row, so the mode is the state of albedo_report.json rather than a second
      step. Adopting modelled requires the flux to be re-derived. LPJ cover is
      conditional on BIO-11 rootable ground: modelled mode
      replaces only that substrate contribution, so persistent water and dry
      barren shares remain exactly what the native-mesh composite supplied and
      code 212 is f_rootable times conditional tree FPC. The size
      of that is BOUNDED rather than known: `modelled` is brighter than
      `vegetated` because it leaves the deserts bare, so it sits strictly
      inside the lithology-to-vegetated span, and the endmember bracket
      measures that whole span at 4.40 W/m2 absorbed at TOA and 2.924 K
      (`docs/src/pipeline/sequencing.md` A3). That is 7 steps of the design
      flux candidate grid, so the re-derivation is real; it is not the largest
      forcing this project varies, being a fifth of the stellar sweep's.

      1742, 1750 and 1760 are the SATURATED end of the moisture mixing, one per
      surface 174, 175 and 176 already carries, and this step writes them from
      `analysis/soil_albedo_wetting.json` unless `--flat-bands` is passed, which
      leaves no band pair for a wet pair to be a pair with. They are required
      inputs to a run only under `surface.soil_albedo_moisture.enabled`; at the
      switch off the model never opens them. PHYS-15.

  - id: surface_roughness
    reads_export: true
    script: exoplasim/scripts/build_surface_roughness.py
    loop: A
    cost: minutes
    needs: []
    writes: ["exoplasim/inputs/{res_lower}/roughness_{res_lower}_report.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0173.sra"]

  - id: ocean_tier_gate
    script: exoplasim/scripts/ocean_tier_gate.py
    loop: A
    cost: seconds
    needs: []
    writes: [exoplasim/analysis/ocean_tier_gate_report.json]
    gate: >
      the declaration of the adopted ocean tier, checked against the source the
      model compiles. ExoPlaSim's surface tier remains its slab -- oceanmod,
      icemod and seamod -- while the adopted offline circulation tier is
      cGENIE/GOLDSTEIN and enters through the explicitly declared transport
      loop. This gate reads exoplasim/config/ocean_tier.yaml and fails on a
      quantity two modules act on that is no longer stated once and handed on,
      on a constant whose declaration line the source no longer runs or whose
      value is not what that line's own initialiser evaluates to, on a constant
      whose declared reachability its module's namelist block contradicts, on
      the sea-ice albedo ramp leaving the hull of its own endpoints over any
      corner of the endpoint bracket a run can produce, on a line the tier's
      argument rests on that the model no longer runs, and on a fail-closed
      guard that has gone from the source. Nineteen fixtures run on every
      invocation, eighteen built to be wrong in a named way. With Earth
      constants of the modelled sea still unsourced it reports and exits 0,
      because a run on the declared tier is a correct run of a declared model
      boundary; --strict is the arm that refuses. bootstrap_run and
      baseline_run need it so the boundary sits on the path rather than beside
      it. Nothing here is verified by execution; what the slab DELIVERS is
      verified by running the model, in verify_ocean_flux_channel.py.

  - id: ocean_column_response
    script: analysis/ocean_column_response.py
    cost: seconds
    needs: []
    writes: [analysis/ocean_column_response.json]
    gate: >
      OCN-1's no-run viability and seasonal-response verdict for oceanmod's
      dormant multilayer vertical diffuser. It reproduces vdiffo's discrete
      elimination, checks heat-content closure and the one-layer analytic
      response, and records the source seams that reject activation in the
      adopted cGENIE/GOLDSTEIN tier.

  - id: ocean_shortwave_penetration
    script: analysis/ocean_shortwave_penetration.py
    cost: seconds
    needs: [ocean_column_response]
    writes: [analysis/ocean_shortwave_penetration.json]
    gate: >
      OCN-6's no-run clear-water Beer-Lambert operator and bound. Absorption by
      hypothetical layer plus transmission below the column closes exactly,
      infinite opacity recovers oceanmod's surface-deposition reduction, and
      pigment/particle absorption remains excluded behind OCN-14 rather than
      becoming an isolated chlorophyll scalar.

  - id: ocean_carbon_gate
    script: ocean/scripts/carbon_feedback_gate.py
    loop: [A, O]
    cost: seconds
    needs: []
    writes: [ocean/analysis/carbon_feedback_gate_report.json]
    gate: >
      OCN-16's prescribed-CO2 boundary. Every ExoPlaSim run entry point pins
      carbon weathering and CO2 evolution off, the ocean return carries no
      carbon term, and activating air-sea exchange without the declared
      atmospheric debit, prerequisites, new loop, permission, and convergence
      predicate is a refusal. No model is run.

  - id: ocean_loop_gate
    script: ocean/scripts/transport_loop_gate.py
    loop: [A, O]
    cost: seconds
    needs: [ocean_carbon_gate]
    writes: [ocean/analysis/transport_loop_gate_report.json]
    gate: >
      OCN-5's fail-closed declaration of the offline forcing procedure,
      restoration policy, return fields, convergence axes, finite refusal
      budget, and provenance chain. It also checks the cGENIE source seams on
      which the declaration relies. No climate or ocean model is run.

  - id: ocean_flux_channel
    script: exoplasim/scripts/verify_ocean_flux_channel.py
    loop: [A, O]
    cost: minutes
    needs: [rebuild_binaries, ocean_loop_gate]
    writes: [exoplasim/analysis/ocean_flux_channel_report.json]
    gate: >
      The executable OCN-2 code-903 return-channel proof. It must be re-run on
      the active build; source inspection alone does not establish that the
      staged convergence reaches the model with the declared sign and scale.

  - id: bootstrap_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [rebuild_binaries, boundary_conditions, surface_albedo, surface_roughness, ocean_tier_gate, ocean_loop_gate]
    writes: []
    presence: by_index   # UUID-named; ask exoplasim/runs/INDEX.json, not the path
    gate: >
      the orbit count is DERIVED and not typed:
      `lib/run_lengths.py:commissioning_bracket`, the approach plus the span a
      window mean's interval needs. It is a floor, so the run is not finished
      when it is reached and the convergence criteria still refuse.
      `docs/src/pipeline/sequencing.md` section A has the argument and why
      running until the instrument stops refusing does not substitute.

  - id: bootstrap_convergence
    script: exoplasim/scripts/assess_convergence.py
    loop: A
    cost: minutes
    needs: [bootstrap_run, state_energy]
    writes: [exoplasim/analysis/convergence/]
    presence: by_index   # per-RUN, and the run is UUID-named; it writes the status

  - id: state_energy
    script: exoplasim/scripts/close_state_energy.py
    loop: A
    cost: minutes
    needs: [bootstrap_run]
    writes: [exoplasim/analysis/energy/]

  - id: bootstrap_climatology
    script: exoplasim/scripts/build_climatology.py
    loop: A
    cost: minutes
    needs: [bootstrap_convergence]
    writes: [exoplasim/analysis/climatology/bootstrap_regular_climatology.nc, exoplasim/analysis/climatology/bootstrap_snapshot_climatology.nc, exoplasim/analysis/climatology/bootstrap_climate_series.json]
    gate: >
      every orbit in the window ran NLOWIO = 0. A segment with low_io set, or
      with no low_io key at all, is refused without --allow-low-io.

  - id: baseline_convergence
    script: exoplasim/scripts/assess_convergence.py
    loop: A
    cost: minutes
    needs: [baseline_run, state_energy]
    writes: [exoplasim/analysis/convergence/]
    presence: by_index   # as bootstrap_convergence: the artifact is named by run

  - id: relaxation_ceiling
    script: exoplasim/scripts/check_relaxation_ceiling.py
    loop: A
    cost: seconds
    needs: [baseline_convergence]
    writes: [exoplasim/analysis/convergence/relaxation_ceiling.json]
    gate: >
      the offset criterion's fallback holds the relaxation time FIXED at the
      derived value, and that is conservative only while the derived value is a
      CEILING on the fitted one. This reads every convergence report and says
      whether any of them falsifies that. It accumulates: a run whose fit has
      grip is evidence and a settled run is not, so the answer sharpens with the
      number of approaches on record rather than with any one run.

  - id: baseline_climatology
    script: exoplasim/scripts/build_climatology.py
    loop: A
    cost: minutes
    needs: [baseline_convergence]
    writes: [exoplasim/analysis/climatology/baseline_regular_climatology.nc, exoplasim/analysis/climatology/baseline_snapshot_climatology.nc, exoplasim/analysis/climatology/baseline_climate_series.json]
    gate: >
      every orbit in the window ran NLOWIO = 0, and config/planet.yaml's
      baseline_climatology is repointed here once it exists, so that nothing
      downstream keeps reading the bootstrap.

  - id: ocean_support
    reads_export: true
    script: ocean/scripts/build_spatial_support.py
    loop: [A, O]
    cost: minutes
    needs: [hydrography, ocean_remap, ocean_loop_gate, spatial_support_gate, partial_surface_decision_gate]
    writes: ["ocean/data/{build}/spatial_support.nc", "ocean/data/{build}/cgenie_bathymetry.nc", "ocean/data/{build}/remap_weights.npz", "ocean/data/{build}/spatial_support_report.json"]
    gate: >
      OCN-11's single wet-mask and bathymetry contract. Catchments, coasts,
      bathymetry, cGENIE topology and both remap directions must derive from the
      active canonical export and preserve extensive quantities on their
      declared wet support. A report is not acceptance unless every support
      identity and conservation check passes.
      CONSERVATION IS NOT SUFFICIENT AND THE MEASUREMENT SAYS SO. Ocean volume
      is affine in depth, so a support built entirely on cell-mean depths
      preserves it exactly and still misplaces the ocean area on either side of
      a depth horizon by 12 to 49 times the loop's own planetary-area bar, at
      every rung including T170 and worst on the 36 x 36 GOLDSTEIN candidate.
      The support therefore carries a per-cell depth DISTRIBUTION, declared in
      the contract as a `distribution_quantiles` field under the
      `area_weighted_distribution` operator with the probability vector it is
      resolved at, which `lib/gridding.py:cell_quantiles` computes and
      `lib/spatial_support.py` refuses without those probabilities. It reports
      the horizon at which this world's deep water separates and the bodies it
      separates into, which no cell depth carries at any resolution measured.
      `notes/audits/ocean-support-nonlinear-reductions.md` is the finding.

  - id: ocean_forcing
    script: ocean/scripts/build_forcing.py
    loop: [A, O]
    cost: minutes
    needs: [baseline_climatology, hydrography, surface_water, groundwater, ocean_support, ocean_loop_gate]
    writes: ["ocean/data/{build}/forcing.nc", "ocean/data/{build}/forcing_report.json"]
    gate: >
      OCN-10's chronological atmosphere/land/ice-to-ocean contract. Flux
      accumulations are differenced on their native chronology before remap;
      transfer coefficients and downward radiation are replayed while the
      SST-dependent turbulent and longwave terms are recomputed inside the
      ocean coupling. Moisture forcing is handed over, not independently
      recomputed, so freshwater and salt retain one budget.

  - id: ocean_run
    script: ocean/scripts/run_cgenie.py
    loop: [A, O]
    cost: hours
    needs: [ocean_flux_channel, ocean_support, ocean_forcing, ocean_loop_gate]
    writes: [ocean/runs/]
    presence: by_index
    gate: >
      Runs the adopted cGENIE/GOLDSTEIN circulation with the declared forcing
      bundle and restoration policy. The run is not accepted merely because it
      exits successfully; ocean_convergence owns the physical closure tests.

  - id: ocean_convergence
    script: ocean/scripts/assess_convergence.py
    loop: [A, O]
    cost: minutes
    needs: [ocean_run]
    writes: [ocean/analysis/convergence/]
    gate: >
      Tests ocean heat inventory and freshwater/salt closure over the declared
      terminal window. A missing diagnostic or ambiguous sign convention is a
      refusal, not a zero residual.

  - id: ocean_transport
    script: ocean/scripts/build_transport_return.py
    loop: [A, O]
    cost: minutes
    needs: [ocean_convergence, ocean_support]
    writes: [ocean/analysis/heat_transport.nc, ocean/analysis/surface_velocity.nc, ocean/analysis/transport_return_report.json, "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0903.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0903_provenance.json"]
    gate: >
      Conservatively returns GOLDSTEIN heat convergence and surface velocity to
      ExoPlaSim support. Code 903 is positive downward into the surface, so the
      staged heat-convergence sign is checked against the executable channel
      proof before the next atmospheric pass can consume it.

  - id: ocean_loop_convergence
    script: ocean/scripts/assess_transport_loop.py
    loop: [A, O]
    cost: minutes
    needs: [ocean_transport, baseline_climatology, state_energy, hydrography]
    writes: [ocean/analysis/transport_loop_convergence.json]
    gate: >
      Applies every OCN-5 exit axis to consecutive pass pairs and accepts only
      after all axes pass twice in succession. The finite pass budget and
      carve-classification criterion make non-convergence and terrain feedback
      visible rather than allowing a numerically quiet ocean to terminate the
      enclosing terrain loop.

  - id: bracket_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [boundary_conditions, surface_albedo, surface_roughness, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      the SECOND flux point, on the vegetated branch, which is the only branch
      the design flux is defined against. It has to span more than 5 K of global
      mean against the other point or derive_design_flux refuses it, and the
      flux separation that implies is 5 K divided by `lib/sensitivity.py`'s
      slope rather than a number restated here -- a point chosen close to the
      first satisfies "two converged runs" and fails the span check. The
      separation this rule asked for was computed once at a slope since
      retired, and it asked for less than a fifth too little, which is how a
      restated conversion goes wrong: it does not fail, it quietly admits a
      bracket that is too narrow. Independent of the other point, so the two can
      run concurrently

  - id: design_flux
    script: exoplasim/scripts/derive_design_flux.py
    cost: minutes
    needs: [bootstrap_climatology, bracket_run]
    writes: [exoplasim/analysis/design_flux.json]
    gate: >
      THE BOOTSTRAP CLIMATOLOGY MUST EXIST AND THE BASELINE IS NOT REQUIRED,
      because requiring the baseline makes this circular. The design flux IS the
      mean flux target, and a baseline run is by this project's vocabulary the
      run on the full surface fields -- which still has to be run at SOME flux.
      Ordering the baseline first therefore means buying hours of model time at
      a provisional number and buying them again at the derived one. What the
      method needs is two converged climatologies ON THE VEGETATED BRANCH,
      which is a statement about model.land_albedo_source and not about having
      soil and lakes; the script refuses a bracket run whose manifest says
      otherwise, and refuses its first point on the same ground, reading the
      branch off that climatology's own run manifest. So the branch is the
      condition and the stage is not: the script READS the best available
      vegetated climatology, which is the bootstrap until a baseline exists and
      the baseline after. The order on a first pass is bootstrap_run,
      bootstrap_climatology, bracket_run, design_flux, adopt the flux into
      config/planet.yaml, derived surface fields, baseline_run --
      `check_consistency.py` is what says the adoption happened.
      --bracket-run is REQUIRED and has no default: runs are named by UUID
      (rule 6), so a default is the id of one historical run and nothing else,
      and the one that used to sit here named a run archived to identity.
      Beyond that, the flux is re-derived on every new terrain (`docs/src/pipeline/state.md`
      section 5b and `docs/src/pipeline/sequencing.md` loop C), and the
      thresholds are declared in the script before it runs, never fitted to the
      answer. The cap on extreme-cold land fraction must be DECLARED in advance
      by this re-derivation: the purged artifact inferred it at 0.0642, which
      reproduced 0.945 from an unconstrained winner of 0.8725, and a threshold
      fitted to its own answer is what CLIM-30 exists to undo. The script
      refuses on an undeclared cap before it reads a field, and refuses again if
      the winner lands on either end of the candidate range, because a search
      that cannot reach its own answer returns an edge rather than a result.
      THE ARTIFACT CAN ALSO RECORD A FLUX THAT WAS CHOSEN, and it is this step
      and this script that write it, because a second generator for one artifact
      would be a route around the derivation by construction. Every artifact
      carries `basis`, `derived` or `chosen`. A chosen one is written by
      `--chosen FLUX --evidence notes/...` and ONLY after the script has run the
      whole derivation and caught a refusal whose ground it declares in
      CHOOSABLE_REFUSALS: a derivation that answers is adopted rather than
      overridden, and a refusal about a missing or unsuitable input is fixed by
      supplying the input. The record carries the refusal, the finding, and what
      would reopen the derivation, and `check_consistency.py` refuses one short
      of any of the three. What makes a refusal choosable is that no run at any
      flux would lift it

  - id: analyze_climatology
    script: exoplasim/scripts/analyze_climatology.py
    loop: A
    cost: minutes
    needs: [baseline_climatology]
    writes: [exoplasim/analysis/climatology/baseline_climate_report.json, exoplasim/analysis/climatology/baseline_classification.nc, "exoplasim/analysis/climatology/baseline_*.png"]

  - id: index_runs
    script: exoplasim/scripts/index_runs.py
    cost: seconds
    needs: [bootstrap_run]
    writes: [exoplasim/runs/INDEX.json, archive/runs/RECORDLESS.json]
    gate: >
      the LEDGER of every run that has existed, not a listing of what is on
      disk. `run_exoplasim.py` and `continue_exoplasim.py` call
      `index_runs.register` at creation and after every segment, and a rescan
      merges over the ledger rather than replacing it, so a run whose payload
      has gone keeps its row and is marked. That is what makes CLAUDE.md rule
      6 true: a run id is a UUID, and this is the only thing that says what it
      was. `--recordless` writes the enumeration of the ids that got neither,
      which measures the remaining damage from before the ledger existed;
      `notes/audits/run-identity.md` is the finding.

  - id: land_water_ledger
    script: hydrography/scripts/land_water_ledger.py
    cost: seconds
    needs: [land_column_properties]
    writes: [hydrography/analysis/land_water_ledger_report.json]
    gate: >
      the one ledger every terrestrial water store and flux books into, from
      precipitation leaving the air column over a land cell to a named terminal
      boundary at the coast. It reads hydrography/config/land_water_ledger.yaml,
      fails on a graph that does not close, on a phase change with no process
      named, on a phase term carrying the wrong latent heat and on one
      evaporative component debited from two stores; exercises the mass
      identity on fixtures built to be wrong; and exercises the graph check
      itself on declarations built to be wrong. With every term still
      undeclared it reports and exits 0, because the ledger is the artifact
      LSHY-1, LSHY-3, LSHY-4, LSHY-5 and PLHY-4 deliver INTO rather than a
      result about the world; `--strict` is the arm that refuses, and it
      refuses while any store still has a shadow copy in a second component.
      surface_water and groundwater need it so the ownership contract sits on
      the path rather than beside it.

  - id: surface_water
    script: hydrography/scripts/surface_water.py
    loop: A
    cost: minutes
    needs: [hydrography, bootstrap_climatology, land_water_ledger]
    writes: ["hydrography/data/{build}/surface_water.nc", hydrography/analysis/surface_water_report.json]
    gate: >
      solves the lake balance twice, as an annual equilibrium and as a periodic
      steady state through the climatology's own time bins, and paints both onto
      regions. `basin_cycle_closed` and `lake_cycle_decided` are read BEFORE the
      per-bin fields they qualify: a refused basin is not painted, so a zero is
      otherwise ambiguous between dry all year and never solved. `--selftest`
      runs the crossing's identity checks against the annual paint and needs no
      build and no climatology

  - id: spatial_support
    reads_export: true
    script: hydrography/scripts/build_spatial_support.py
    loop: A
    cost: minutes
    needs: [hydrography, surface_water]
    writes: ["hydrography/data/{build}/support_exoplasim-{res}.nc", "hydrography/data/{build}/support_exoplasim-*.nc", "hydrography/data/{build}/support_checkpoint.json", hydrography/analysis/spatial_support_report.json]
    gate: >
      SPAT-3, extending GRID-2. The 10M native mesh UNDER every cell of every
      requested ladder rung, one file per (build, rung) on the coupling
      matrices' precedent: exact cell, land and ocean area against the native
      region count; the surface-class partition and the barren, nonbarren and
      solved-lake shares of the cell's land; land elevation and ocean depth
      moments and HYPSOMETRY; co-located lithology and drainage class shares;
      and explicit empty-cell accounting. Terrain and the solved lake only: no
      climate run, no ocean, no biosphere.
      THE HYPSOMETRY IS WHY THE ROW EXISTS. GRID-2 found the distribution of
      mesh elevations inside a cell computed three times and persisted nowhere,
      on a criterion that decides where ice can sit: a cell is evaluated at its
      MEAN elevation and its high ground stands well above that.
      `lib/gridding.py`'s DISTRIBUTION operator is what that quantity is, and
      `area_fraction_above` reads a share back out of it, so the criterion is
      one expression in the module that already owns mesh-to-grid.
      EVERY STATISTIC NAMES ITS POPULATION, because the export's own
      `orog_mean/std/min/max` do not: they are taken over every region in the
      cell, so a coastal cell's mean is dragged toward the seabed and a peak
      excess measured against it is inflated by ocean floor rather than by
      terrain. Land is `surface_class` and never `land_mask`, CLAUDE.md rule 1,
      or the dry closed-basin floors drop out of the distribution this exists to
      hold. The binning is `region_cells`, by index and never by longitude, rule
      3. The export's own fields are compared against this artifact's ALL-region
      moments and reported as a diagnostic, which is what says the two binnings
      are one binning.
      THREE RESERVATIONS ARE ENFORCED RATHER THAN NOTED. It manufactures no
      below-mesh terrain: `cell_quantiles` returns values the mesh has and
      interpolates between none of them, so GW-6's relief inside a region stays
      GW-6's. It is not a second land or bathymetry product: the mask the model
      reads is `boundary_conditions`' and the bathymetry contract is OCN-11's,
      and what is here is the support underneath both -- the CLIMBER-X
      precedent's 90th-percentile bed elevation is a quantile this SUPPLIES and
      a choice it does not make. And it treats no coarse grid as truth: where a
      rung is finer than the mesh the cells holding no region are counted and
      left empty, with NO nearest-region fallback applied at all, so a consumer
      that wants one chooses it and records it.
      EVERY CHECK HAS A RIGHT ANSWER: the constructed cell areas sum to the
      sphere, the binned mesh and land areas close against the mesh's own, each
      partition sums to one in every covered cell, every categorical share times
      its denominator equals its own extensive area, each quantile table's ends
      are the population's true extremes computed a second way, and this
      binning and the exporter's own place the same region total. `--selftest`
      hands five of those a case built to violate them.
      AND THE ONE THAT TESTS WHAT THE ARTIFACT IS FOR: a consumer reads a SHARE
      out of the hypsometry, not the table, so the share above each cell's own
      mean-plus-one-sd is read back and compared against the exact answer
      computed on the 10M mesh. The bar is the widest step in the quantile
      vector and it is a THEOREM rather than a tolerance -- the interpolated
      cumulative curve and the true one both lie between the two bracketing
      probabilities -- so exceeding it is a defect in the operator and is
      refused. Cells whose land is a single repeated elevation have no
      distribution and are counted rather than averaged in.
      THE CHUNK IS THE RUNG, `docs/src/reference/large-data.md`: each rung is
      written as it finishes and recorded in `support_checkpoint.json` against
      the hashes of the inputs it was built from, so a killed run resumes at the
      cost of one rung.

  - id: topographic_index
    reads_export: true
    script: hydrography/scripts/build_topographic_index.py
    loop: A
    cost: minutes
    needs: []
    writes: ["hydrography/data/{build}/topographic_index_exoplasim-{res}.nc", "hydrography/data/{build}/topographic_index_exoplasim-*.nc", hydrography/analysis/topographic_index_report.json]
    gate: >
      GW-26. Terrain only: `ln(a / tan beta)` per region from the export's own
      upslope contributing area and a local slope, and per GRID CELL the share
      of that cell's land AREA whose index exceeds the cell's area-weighted mean
      index. AREA and not region count: `f_sat_max` multiplies into a fraction
      of a CELL, this mesh's regions are not equal-area, and the mean is the
      class boundary. `lib/gridding.py` owns the operators -- `cell_moments` for
      the mean and the within-cell spread, `cell_fraction` for the categorical
      area share -- and the report names which was used for which field beside
      `transfer_ledger`'s account of what the reduction dropped. That share is
      the terrain half of TOPMODEL's saturated-fraction closure,
      `f_sat = min(f_sat_max exp(-f_grad z_wt), 1)`, and it is the answer GW-6
      leaves reachable: the valley-to-ridge gradient is below this mesh and
      stays below it, so the terrain control is carried STATISTICALLY and what
      comes back is a FRACTION rather than a depth.
      A SATURATED FRACTION IS A FRACTION OF A POPULATION, and the only
      population here is the land AREA of the regions inside a climate-grid
      cell. So this artifact is one per (build, grid) on the coupling matrices'
      precedent,
      `f_sat_max` lives at the GRID and not at a region, and there is no
      per-region saturated fraction to take.
      NO CONSUMER GETS `f_sat` FROM THIS STEP: the closure is WITHDRAWN and
      this artifact carries no saturated fraction. The score was declared in
      `hydrography/config/topographic_index.yaml` before any fraction was
      computed, together with the disposition of a miss, which is withdrawal
      rather than a caveat. It was run on both Earth sets and missed. The
      closure is strictly monotone in the water table depth for a fixed
      `f_sat_max`, so any discrimination it gains over the depth alone is
      attributable to the terrain half and to nothing else -- which is what
      makes the score a test rather than a comparison, and the gain it measured
      is at or below the scatter its own support puts on it on every arm, so a
      criterion restricted to the regime the depth works in would run on fewer
      cells and resolve it less. `hydrography/notes/subgrid-water-table.md`
      section 7 is the measurement.
      WHAT THE STEP STILL WRITES is the terrain half on its own, which stands
      without the closure: most of the index's variance is WITHIN a cell rather
      than between cells, and that is the case for computing it. WET-2, SURF-7
      and LSHY-6 were the rows waiting on the fraction and section 5 settled
      what each takes instead: LSHY-6 asked for a climate-grid area already;
      SURF-7's discharge mask is a statement about the RESOLVED water table and
      takes `at_surface` from `water_table.nc`; WET-2 wanted the fraction and
      loses that class rather than gaining a second support.
      `f_grad` was DECLARED AND BRACKETED, never fitted, and the bracket is a
      convention ambiguity: CLIMBER-X's `exp(-f_wtab z)` and ClimaLand's
      `exp(-f_over/2 z)` differ by exactly a factor of two; it is kept as what a
      revived closure would have to bracket. ABSOLUTE THRESHOLDS
      ARE REFUSED and no product keys on one: this index carries a length in
      `a`, so it shifts with the mesh -- measured at about 0.8 between this
      project's own two builds -- and it sits far above the range published
      thresholds are calibrated on.

  - id: lake_mosaic_cost
    script: hydrography/scripts/lake_mosaic_cost.py
    loop: A
    cost: seconds
    needs: [spatial_support, baseline_climatology, surface_soil_water]
    writes: [hydrography/analysis/lake_mosaic_cost.json]
    gate: >
      HYD-21 and LSHY-6, on one instrument because both read the same three
      artifacts. Closes the freezing term the closed-form bound in
      notes/audits/lake-energy-omission-bound.md had to leave open, which is a
      threshold on the climate STATE and therefore needs a BASELINE climatology
      rather than a bootstrap; and prices what the hydrologic mosaic costs at
      the consumer, where the two-tile capacity distribution is collapsed to one
      scalar. Reads only, and refuses rather than substituting: no baseline
      climatology, no staged 0229 whose bytes match its own provenance record,
      or a support file from another rung and it exits. THE POTENTIAL LATENT
      HEAT FLUX IS CAPPED AT THE AVAILABLE SURFACE ENERGY AND NEVER RECOVERED
      AS hfls / beta: the wetness factor is under 0.05 on nearly half this
      planet's land bins and that quotient reaches 1e17 W m-2, so the result is
      a bracket whose upper end gives every cell its whole net radiation.
      `--selftest` runs eight identities with no build and no climatology,
      including the one that failed and changed a finding: the wetness factor
      is NOT convex in the capacity, because min(1, .) is flat below the
      saturation knee and convex above it, so a cell whose soil and lake tiles
      straddle the knee carries the opposite sign.

  - id: wetness
    reads_export: true
    script: hydrography/scripts/build_wetness.py
    loop: A
    cost: minutes
    needs: [hydrography, surface_water]
    writes: ["hydrography/data/{build}/wetness_exoplasim-{res}.nc", "hydrography/data/{build}/wetness_exoplasim-*.nc", hydrography/analysis/wetness_report.json]
    gate: >
      WET-2 and LSHY-6. One wetness class per REGION, and per GRID CELL the AREA
      share of each class over the cell's land. MUTUAL EXCLUSIVITY IS THE
      PRODUCT: overlapping wetness classes double-count area and every ledger
      downstream inherits the double count with no way to see it, so a region
      gets one label rather than a set of masks that happen not to overlap, the
      shares are required to partition the cell, and `--selftest` hands each
      rule a case built to violate it that the check must refuse -- a playa mask
      that forgot to exclude the lake, land in no class with no residual named,
      and the saturated share added beside the resolved classes instead of taken
      out of them.
      A CLASS IS CATEGORICAL, so what crosses is `lib/gridding.py`'s
      `cell_fraction` and never a majority label: a majority discards every
      minority surface however much leverage it has, and a narrow strip of open
      water in a dry cell is the surface these rows exist to keep. Land comes
      from `surface_class`.
      BOTH DENOMINATORS ARE EMITTED. Each class carries its AREA from
      `cell_sum`, the EXTENSIVE operator, beside its share from the categorical
      one, because a lake evaporation is a depth over the open-water area and a
      catchment runoff is a depth over the land cell. Computing them
      independently makes the pair a check the artifact refuses on: the same
      population reduced two ways has to agree, and a population mismatch is
      what that catches.
      THREE OF THE AUDIT'S FIVE CLASSES HAVE NO SOURCE HERE and are declared
      absent with the reason rather than estimated. The saturated non-inundated
      mineral class is unresolved on this mesh -- `hydrography/notes/subgrid-
      water-table.md` section 5 -- and would have arrived as a climate-grid area
      share taken OUT of the mineral class, making exclusivity a constraint at
      two supports; the closure it needed is WITHDRAWN, section 7, so that class
      is absent permanently rather than pending and the resolved classes
      partition the cell on one support. This step refuses to run if that
      status ever says otherwise, because a class formed by the first plausible
      reading of a revived bracketed closure is worse than an absent one.
      Seasonal
      inundation and peat need a season, and nothing in this component carries
      one: the lake solve is an annual equilibrium, the groundwater solve is a
      steady state, and every term reaching those stores in
      `hydrography/config/land_water_ledger.yaml` has an annual interval floor.
      River water needs a channel width the project does not hold, so a
      discharge stays a rank and a mask rather than becoming an area.

  - id: groundwater
    script: hydrography/scripts/build_groundwater.py
    loop: A
    # MEASURED 2026-08-31 on canonical-10m-carve2, not estimated: the confined
    # arm ran alone under the host lock at 2600 per cent CPU and 16 GB, passed
    # 40 minutes without writing, and was killed. It was declared `minutes`,
    # which is what made a five-solve sweep look affordable when it is not.
    # world-wfge carries the cost and the lever the solver file already names.
    cost: hours
    needs: [hydrography, bootstrap_climatology, surface_water, land_water_ledger]
    writes: ["hydrography/data/{build}/water_table.nc", hydrography/analysis/groundwater_report.json, hydrography/analysis/groundwater_reduction_test.json, hydrography/analysis/groundwater_divide_test.json, "hydrography/analysis/groundwater_report_sigma*.json", "hydrography/analysis/groundwater_report_noise*.json", "hydrography/analysis/groundwater_report_et*.json"]
    gate: >
      the steady-state water table, and a MEASUREMENT of the net groundwater
      exchange per basin. `carve_verdict` TAKES the term when handed one, under
      GW-14, and is bit-identical to the surface-only criterion when it is not;
      supplying it is a loop A decision and no carve list has been regenerated
      from it. Permeability carries 1.5 to 2.5 orders of Gleeson spread, so the
      DEPTH field is a bracket and `--sigma -1` and `+1` are its arms; the carve
      count is not, moving by three across the whole bracket.
      `--operator-noise` is a sensitivity harness for GW-8, not a model
      parameter. GW-15's sink and GW-17's river and lake fixed heads are BOTH
      ON, from `config/groundwater.yaml`, because neither is optional physics:
      without the sink the table pins at the surface over most of the land, and
      without local baselevels the sea is the only boundary and the depth range
      collapses. `--no-groundwater-et` and `--no-baselevels` turn them off, for
      reproducing pre-GW-15 runs; `--reduction-test` sets both itself, because
      the surface-only balance it reduces to carries neither and a reduction
      keeping one is not an identity. The baselevels
      are why this step needs `surface_water`: that artifact is the only thing
      that knows where the rivers and lakes are.
      READ `hydrography/README.md` BEFORE CONSUMING THE DEPTH FIELD. The
      solver's skill is REGIME-DEPENDENT, scored on two continents against a bar
      declared first, and the README owns the scores. Where the
      evapotranspiration sink takes the recharge locally, the steady state
      collapses to that local balance and the flow solve contributes almost no
      spatial variance; where recharge is large and the aquifers transmissive,
      lateral flow sets the head and the solve does real work. There is per-cell
      skill in the second case and none in the first, so `sink_fraction` and
      `at_surface` in `water_table.nc` are the unit of certification rather than
      the field as a whole. What survives in BOTH regimes is the per-basin
      exchange direction. MIN-6 is CLOSED against this field and not waiting on
      it: the mechanism's control is a depth two orders of magnitude above
      anything this solver produces, and the vadose-zone flag that would survive
      the range problem fires on 1 of 10,146 bore-carrying cells across both
      scored continents, so it has no group to be scored against.
      SURF-7's mask gets AUC 0.52 to 0.57; that was measured over ALL cells, and
      re-measuring it restricted to cells where the sink did not set the depth
      is what that row still asks for. This planet's own regime is NOT known and moves
      with loop A, so re-read the flag after each accepted baseline rather than
      transporting either continent's result.

  - id: groundwater_access
    reads_export: true
    script: hydrography/scripts/build_groundwater_access.py
    loop: A
    cost: minutes
    needs: [groundwater]
    writes: ["hydrography/data/{build}/groundwater_access_exoplasim-{res}.nc", hydrography/analysis/groundwater_access_report.json]
    gate: >
      PLHY-5. `water_table.nc` is per REGION and LPJ is driven per climate-grid
      CELL, and the reduction that suggests itself -- average the depth --
      destroys what groundwater is in the model for. Root access and discharge
      vegetation depend on the FRACTION of a cell with a shallow table: a mean
      erases a narrow riparian strip and manufactures a broad one. So the
      criterion is evaluated ON THE NATIVE REGIONS and what crosses is an AREA.
      NO HYPSOMETRY IS USED and none is needed: the within-cell depth
      distribution is in hand, and reconstructing it would be an inference where
      there is a measurement. A fraction is a fraction of a POPULATION and the
      only one is the regions inside a cell, so every fraction lives at the grid
      and there is no per-region access fraction -- GW-6, and the same
      constraint `topographic_index` states for `f_sat_max`.
      ACCESS DEPTHS ARE SWEPT, NEVER CHOSEN. 1.5 m is the vendored LPJ-GUESS
      soil column and is sourced; 5 and 20 m are declared model-form brackets
      for a phreatophytic access that model cannot represent. `sink_fraction`,
      `at_surface`, the excluded lithologies and the undefined cells all cross
      as their own area shares, and `--water-table` repeated once per
      permeability member writes every fraction along a member axis, so the
      Gleeson bracket survives the reduction instead of being averaged inside
      it. `--selftest` runs six invariants with right answers on synthetic
      input, including the negative control this step exists for: a narrow
      shallow strip in a deep cell must survive.

  - id: soil
    script: pedology/scripts/build_soil.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, hydrography, rootable_fraction]
    writes: [pedology/analysis/soil_report.json, "pedology/data/{build}/soilmap_{res}.txt"]
    gate: >
      BIO-19's mode-bearing soil artifact. The caller must state --state and
      --iteration: bootstrap/0 builds the baseline surface input; baseline/0
      builds the first LPJ soil with no biosphere; positive baseline iterations
      require carbon from a BIO-14-accepted LPJ run. The report records both
      axes plus climate and soil-map hashes; LPJ preparation accepts only a
      baseline-state soil and refuses a soil/driver climate mismatch. BIO-14 is
      a conditional back edge enforced at the read for positive iterations,
      not a hard graph edge: making it a static need would deadlock bootstrap/0
      and baseline/0, the two modes that deliberately have no biosphere input.
      IT ALSO EMITS THE EXCHANGE COMPLEX, the soil map's `cec` column plus base
      saturation and the exchangeable base pool in the report, and refuses on
      three things: a coefficient pair whose implied organic share leaves the
      band a second continent measured, a capacity outside the envelope those
      measurements span, and an ANUT-8
      `belowground_and_exchangeable_multiplier` declared below what this soil
      implies. The last is the loop edge back to
      biosphere/config/abiotic_nutrients.yaml: that key is a declared upper
      bound on a quantity this step derives, and soil carbon grows it through
      loop A, so the check fires on the iteration that outgrows the
      declaration.
      THE RUNG IS CONFIG'S, AND IT IS THE CLIMATE THAT MAKES THAT A REAL EDGE
      rather than a carrier defect to route around. This step reads a
      climatology for temperature, precipitation, runoff, evaporation and
      elevation -- content, not a grid -- so a soil at a rung needs a CLIMATE at
      that rung, which is the `bootstrap_climatology` edge above. `--climatology`
      is a cross-check pinned to the declared file and never an override, and
      the two climatology keys carry no rung in their names, so building at a
      second rung moves `model.resolution` and the climatology declaration
      together. WORLD-CCX6 is the `--grid` this step lacks;
      `exoplasim/notes/route-step-criteria.md` carries why the soil waits for a
      climate at its rung instead of being built on one remapped onto it.

  - id: land_column_properties
    script: pedology/scripts/land_column_properties.py
    cost: seconds
    needs: [soil]
    writes: [pedology/analysis/land_column_properties_report.json, "pedology/data/{build}/land_column_states_{res}.txt"]
    gate: >
      the one vertically explicit hydraulic and thermal description of the land
      column, and the only place its retention states are derived. It emits
      them per cell -- saturation, field capacity, the wilting point, the
      closure's exponent, the plant-available capacity of the declared column
      and the weathered-bedrock usable share per physical layer -- and
      surface_soil_water and lpj_driver READ that file. It reads
      pedology/config/land_column_properties.yaml and fails on a contract that
      does not hang together -- layers that do not reach the declared base, a
      root below the column, a state silent on whether it depends on gravity, a
      drainage length that is not the one Cosby's field-capacity suction was
      measured at, a retention closure with no family named, uncertainty
      declared per layer rather than correlated, or an aquifer property shared
      with the vadose zone -- and exercises that check against ten contracts
      built wrong. It also fails when the states differ between two consistent
      unit frames, which they cannot: the closure reads its two invariant
      pressures only through their ratio, and a frame change cancels. It runs no
      model. With properties still undeclared it reports and exits 0;
      `--strict` is the arm that refuses.
      IT IS A PURE CARRIER: the states come from the soil map's rows and no
      climate, so `--soil-map` and `--states` run it at any rung a soil map
      exists at. Both files are per build AND per rung and both names carry
      theirs, so it refuses a pair naming two different rungs -- writing one
      rung's rows under another's name hands ExoPlaSim and LPJ-GUESS a column
      count that is not their grid's.

  - id: surface_soil_water
    script: exoplasim/scripts/build_surface_soil_water.py
    loop: A
    cost: minutes
    needs: [boundary_conditions, land_column_properties]
    writes: ["exoplasim/inputs/{res_lower}/orogen_{res}_surf_0229_provenance.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_0229.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_2290_provenance.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_2290.sra"]
    gate: >
      TAKES A `--grid` LIKE THE REST OF THE FAMILY, and the grid is the rung.
      Its three rung-dependent inputs are the grid export, the ownership mask
      surface code 0172 that boundary_conditions writes at every exported rung,
      and land_column_properties' states file at that rung. None of them is a
      climate. It read the grid and the mask off `bootstrap_climatology` until
      WORLD-QGB6, which made the one rung a run had reached the only rung code
      0229 could be cut at -- alone among the thirteen staged surface fields,
      and with `model.soil_water_source: pedology` making that a refusal at
      launch above T21.
      THE DETERMINATION ARGUMENT IS UNCHANGED AND IS ENFORCED UPSTREAM. A
      staged surface field is an INPUT to the baseline run, so nothing in this
      chain may read the baseline's own output; the climate enters at `soil`,
      which names its stage and refuses a pairing it did not declare. Passing
      `--climatology` here is a CROSS-CHECK -- its axes and its `lsm` must be
      the grid and the mask this step already has -- and never a carrier.
      WHAT PINS THE RUNG NOW IS THE STATES FILE, which is per build and per rung
      and exists only where `soil` has run, which is only where a climatology of
      that rung exists. WORLD-QGB6 records the measurement.

  - id: dust
    script: aeolian/scripts/build_dust.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, surface_water]
    writes: [aeolian/analysis/dust_baseline.nc, aeolian/analysis/dust_baseline.json]

  - id: ocean_remap
    reads_export: true
    script: analysis/ocean_remap.py
    cost: seconds
    needs: [spatial_conversion_gate]
    writes: [analysis/ocean_remap.json, analysis/ocean_remap_weights.npz]
    gate: >
      The grid-to-grid crossing the offline ocean under OCN-3 needs, and the
      integral that says whether it works. ExoPlaSim's Gaussian grid and
      GOLDSTEIN's are different in kind, so the weights are built from cell
      BOUNDARIES constructed in lib/gridding.py and applied by lib/remap.py,
      never from a longitude label matched across the boundary. The acceptance
      test is a field whose integral over the sphere is known analytically and
      which Gauss-Legendre quadrature returns exactly, so a crossing whose row
      areas are not the model's quadrature weights misses it; the midpoint
      construction runs beside it as the negative control that has to miss the
      same bar by three orders. Terrain only: no climate run and no ocean run.
      Its report embeds SPAT-1 source/destination contracts and a SPAT-10
      conversion assessment, and its weight file carries those identities.
      The masked arm is a DEMONSTRATION of the coast rule on the export's own
      surface_class; the ocean's real wet mask, volume and topology arrive with
      OCN-11, which is why the candidate GOLDSTEIN geometry is labelled a
      comparison support here rather than an accepted ocean support.

  - id: dust_optics
    script: exoplasim/scripts/dust_optics.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [analysis/dust_optics.json]

  - id: dust_aerofile
    script: exoplasim/scripts/dust_aerofile.py
    cost: seconds
    needs: [dust_optics]
    writes: [exoplasim/data/dust/vesper_dust_aerosol.dat, exoplasim/data/dust/vesper_dust_aerosol.provenance.json]

  - id: surface_dust
    script: exoplasim/scripts/build_surface_dust.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, dust, dust_aerofile]
    writes: ["exoplasim/inputs/{res_lower}/orogen_{res}_surf_1811_provenance.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1811.sra"]
    gate: >
      NEEDS THE BOOTSTRAP CLIMATOLOGY, settled by the graph rather than by
      judgment: this writes a staged `.sra` surface field, and a staged surface
      field is an INPUT to the baseline run. Reading the baseline here would
      build an input to a run out of that run's own output, and on a first pass
      there is no baseline at all.
      The climatology supplies the grid and the mean surface temperature.
      Runs only when model.dust_source is set; a no-op at ndustrad = 0.

  - id: dust_source_fields
    script: aeolian/scripts/build_dust_source_fields.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, dust, surface_water, soil]
    writes: ["exoplasim/inputs/{res_lower}/orogen_{res}_surf_1801_provenance.json", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1801.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1802.sra", "exoplasim/inputs/{res_lower}/orogen_{res}_surf_1803.sra"]
    gate: >
      NEEDS THE BOOTSTRAP CLIMATOLOGY, settled by the graph rather than by
      judgment: this writes a staged `.sra` surface field, and a staged surface
      field is an INPUT to the baseline run. Reading the baseline here would
      build an input to a run out of that run's own output, and on a first pass
      there is no baseline at all.
      The climatology supplies the grid. Runs only when model.dust_emission is
      set; a no-op at ldustemit = 0.

  - id: dust_forcing
    script: exoplasim/scripts/dust_forcing.py
    cost: minutes
    needs: [dust, dust_optics, surface_albedo, baseline_climatology]
    writes: [analysis/dust_forcing.json, analysis/dust_surface_forcing.nc]

  - id: sea_salt_optics
    script: aeolian/scripts/sea_salt_optics.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [analysis/sea_salt_optics.json]

  - id: sea_salt
    script: aeolian/scripts/build_sea_salt.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, sea_salt_optics]
    writes: [aeolian/analysis/sea_salt_baseline.nc, aeolian/analysis/sea_salt_baseline.json, aeolian/analysis/sea_salt_deposition.nc, aeolian/analysis/sea_salt_deposition.json]

  - id: volcanic_sulfate
    script: aeolian/scripts/build_volcanic_sulfate.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, sea_salt_optics, weathering_fluxes]
    writes: [aeolian/analysis/volcanic_sulfate.nc, aeolian/analysis/volcanic_sulfate.json, aeolian/analysis/volcanic_sulfate_deposition.nc, aeolian/analysis/volcanic_sulfate_deposition.json]

  - id: vegetation_albedo
    script: analysis/vegetation_albedo.py
    cost: seconds
    needs: [stellar_spectrum]
    writes: [analysis/vegetation_albedo.json]

  - id: rock_albedo_bands
    script: analysis/rock_albedo_bands.py
    cost: seconds
    needs: [stellar_spectrum]
    writes: [analysis/rock_albedo_bands.json]
    gate: >
      the two-band shape per rock class, which `surface_albedo` multiplies into
      whatever level each material carries. It depends on the star and on the
      lithology table, not on a build, so it sits outside every loop; a new rock
      class in `vendor/orogen/js/lithology.js` makes it raise rather than
      writing that class spectrally flat.

  - id: soil_albedo_wetting
    script: analysis/soil_albedo_wetting.py
    cost: minutes
    needs: [stellar_spectrum, rock_albedo_bands]
    writes: [analysis/soil_albedo_wetting.json]
    gate: >
      the WET endmember per rock class and per band, which `surface_albedo`
      stages beside the dry pair so the modelled soil albedo can move between
      them as the modelled skin wets and dries. Two closed-form mechanisms --
      Lekner and Dorf's water film, Twomey, Bohren and Mergenthaler's
      interstitial scattering -- applied per wavelength to the same spectra
      `rock_albedo_bands` reads, so band 2 is closed from band-2 dry data
      rather than from a broadband ratio. It depends on the star and the
      lithology table and not on a build, so it sits outside every loop; the
      two arms are a bracket and never an average, and the run refuses if
      either arm brightens a class on wetting.

  - id: ice_albedo
    script: analysis/ice_albedo.py
    cost: seconds
    needs: [stellar_spectrum]
    writes: [analysis/ice_albedo.json]

  - id: ice_properties
    script: analysis/ice_properties.py
    cost: seconds
    writes: [analysis/ice_properties.json]
    gate: >
      What the modelled sea ice and its snow are MADE of, from IAPWS-06 rather
      than quoted: the density, specific heat and melting enthalpy of ice Ih
      over the temperature range the model's ice occupies, and the overburden
      calculation that shows this world's gravity cancels out of all three. It
      depends on no build, no run and no star, so it sits outside every loop.
      The declarations in `config/planet.yaml` under `surface.cryosphere` rest
      on it. `notes/audits/cryosphere-material-properties.md`

  - id: snow_albedo_grain
    script: analysis/snow_albedo_grain.py
    cost: seconds
    needs: [stellar_spectrum, ice_albedo]
    writes: [analysis/snow_albedo_grain.json]
    gate: >
      A two-band snow albedo on a grain-radius axis for this star, from the
      three grain-resolved spectra `specblock.f90` compiles and no code path
      selects among. EXPLORATION: no model term rests on it yet. It is the half
      a dust darkening coefficient needs in order to mean what its source
      measured, which is what blocks `dust-14`.
      `notes/audits/snow-albedo-grain.md`

  - id: snow_albedo_zenith
    script: analysis/snow_albedo_zenith.py
    cost: seconds
    needs: [stellar_spectrum, ice_albedo]
    writes: [analysis/snow_albedo_zenith.json]
    gate: >
      What a solar zenith term is worth to the snow albedo, which `landmod` has
      no predictor for while `radmod` applies one to ice-free ocean by default.
      EXPLORATION: nothing consumes it and no model term rests on it. It reads
      the model's own star-weighted `dsnowalb*` rather than deriving a second
      set, so it moves when the spectrum does. `notes/audits/snow-albedo-zenith.md`
      is the finding and world-spd the row.

  - id: rock_emissivity
    script: analysis/rock_emissivity.py
    cost: seconds
    needs: []
    writes: [analysis/rock_emissivity.json]
    gate: >
      Broadband thermal emissivity per rock class, one minus the
      directional-hemispherical reflectance of the ECOSTRESS spectra weighted
      by a Planck function. Unlike the albedo derivations it does NOT need the
      stellar spectrum: what weights a thermal emissivity is the surface's own
      emission, not the light falling on it, so this step depends on the
      library and on a declared weighting temperature alone and sits outside
      every loop. Each class carries a solid-to-particulate preparation
      bracket, and `model.land_longwave_emissivity` is its land-area-weighted
      mean. `notes/audits/surface-longwave.md` is the finding.

  - id: land_emissivity
    script: analysis/emissivity_contrast.py
    loop: A
    cost: seconds
    needs: [rock_emissivity]
    writes: [analysis/land_emissivity.json]
    gate: >
      `model.land_longwave_emissivity` itself, written by
      `analysis/emissivity_contrast.py --land-mean`: the area weighting of
      `rock_emissivity`'s per-class values over this build's own land, on the
      mesh. It is in loop A because it is a weighting over ONE BUILD'S LAND and
      every terrain change moves it; it needs no climatology and no run, so it
      is answerable the moment a build exists. `check_consistency.py` refuses an
      artifact whose terrain hash is not the configured build's.
      `notes/audits/surface-longwave.md` is the finding.

  - id: emissivity_contrast
    script: analysis/emissivity_contrast.py
    loop: A
    cost: seconds
    needs: [bootstrap_climatology, land_emissivity]
    writes: [analysis/emissivity_contrast.json]
    gate: >
      Whether a PER-CELL land emissivity is worth carrying over the scalar
      `land_emissivity` produces. A different question from the scalar and it
      needs a climatology, because what a field buys is priced in the model's
      own surface longwave loss. The criterion is fixed in the script, in the
      units the surface energy balance reports, and the answer is the weaker of
      two out-of-band bounds. `notes/audits/surface-longwave.md`

  - id: playa_albedo
    script: analysis/playa_albedo.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [analysis/playa_albedo.json]
    gate: >
      `model.lithology_albedo_overrides.playa_clastic.albedo`: Post et al.
      (2000)'s all-soils field level corrected by how much brighter saline
      desert soils are than the ECOSTRESS soil population, measured in one
      library so the laboratory-over-field offset cancels, and re-weighted to
      this star. Playa mud is about a quarter of this world's land and the
      largest single lever on its energy balance. It depends on the star and the
      library and not on a build, so it sits outside every loop.
      `notes/audits/orogen-lithology.md` is the argument.

  - id: soil_thermal_inertia
    script: analysis/soil_thermal_inertia.py
    cost: seconds
    needs: []
    writes: [analysis/soil_thermal_inertia.json]
    gate: >
      Which term controls the modelled soil column's thermal inertia: moisture,
      texture or parent material. Johansen's interpolation as Farouki
      tabulates it, on a declared column, with the model's own scalar pair read
      out of `landmod.f90` rather than copied. It needs no build and no run --
      what it compares is two spreads of one published relation -- so it sits
      outside every loop. The answer ranks moisture first and mineralogy last,
      and last means exactly zero at the dry end, which is why there is no
      per-cell lithology thermal field. `notes/audits/soil-thermal-inertia.md`
      is the finding.

  - id: emissivity_contrast
    reads_export: true
    script: analysis/emissivity_contrast.py
    cost: seconds
    needs: [rock_emissivity]
    writes: [analysis/emissivity_contrast.json]
    gate: >
      Does a per-cell land emissivity buy more than the surface energy balance
      can distinguish, over a scalar set at its own land mean. The criterion is
      1.4 W/m2 of surface net longwave, the top of the model's own dry adiabatic
      energy sink, fixed in the script and not to be moved. It needs a
      climatology for the loss scale and takes one explicitly, because a flux
      scale belongs to one run on one terrain. The answer at T21 is no, which
      is why there is no per-cell emissivity field and no surface code for one;
      `world-vhhs` re-runs it at a finer rung, where cell averaging removes
      less of the contrast.

  - id: spatial_reduction_gap
    reads_export: true
    script: analysis/spatial_reduction_gap.py
    cost: minutes
    needs: []
    writes: [analysis/spatial_reduction_gap.json]
    gate: >
      SPAT-7. Which mesh-to-grid reductions does the ORDER of the operation
      change enough to matter, measured rather than argued. Terrain only: no
      climate run, no soil solve, no biosphere, so it sits outside every loop
      and depends on the export alone. Each arm reports its gap in the units
      the CONSUMING step reports and against that step's own instrument -- the
      roughness builder's `z_ref` bracket, Dunne's scatter on the weathering
      exponent, the pedogenesis model's minimum depth -- because one percentage
      across six quantities would be a preference and not a criterion. An arm
      whose input has no sub-grid population SWEEPS it rather than reading a
      climatology, and an arm that crosses its bar inside its bracket is
      reported as crossing rather than resolved. The wet-albedo arm is the one
      that converts to watts, and it does so only on the rung the accepted
      climatology carries, with no fallback onto another.
      `notes/audits/nonlinear-spatial-reductions.md` is the finding; SPAT-4's
      operators in `lib/gridding.py` are what a material gap is corrected with,
      and a gap inside its instrument is a reason NOT to carry an expectation.

  - id: ocean_support_reduction
    reads_export: true
    script: analysis/ocean_support_reduction.py
    cost: minutes
    needs: []
    writes: [analysis/ocean_support_reduction.json]
    gate: >
      SPAT-7's ocean half, and the sizing OCN-11 is owed before a wet support
      can be called adequate. Bathymetry and coastline are TERRAIN, so this
      needs no climate run and no ocean run and sits outside every loop.
      Three quantities are asked of the same cell distribution and they behave
      differently: volume is affine in depth and the cell mean reproduces it
      exactly, which is the arm that can FAIL; the area on either side of a
      depth horizon is a threshold the mean does not carry; and connectivity is
      a property of the graph the cells form, which coarsening moves in two
      directions at once, deepening bottlenecks while binarising narrow
      passages away. The bars are the consuming loop's own --
      `lib/remap.py:CLOSURE_TOLERANCE` for the volume control,
      `ocean/config/transport_loop.yaml`'s `sea_ice_area` for a planetary area
      fraction, and its `heat_transport_change` for passage capacity, published
      as the critical fractional error against a transport the first accepted
      ocean run supplies. `notes/audits/ocean-support-nonlinear-reductions.md`
      is the finding and carries the pre-registration.

  - id: shortwave_band_weights
    script: exoplasim/scripts/shortwave_band_weights.py
    cost: minutes
    needs: [stellar_spectrum, baseline_climatology]
    writes: [exoplasim/analysis/shortwave_band_weights.json, exoplasim/analysis/h2o_sw_level.json]
    gate: >
      two artifacts from one script because they are one subject reached at two
      costs. The full report re-weights the Lacis and Hansen gas absorptances
      for this star and prices the result on a climatology, so it cannot be
      written while `baseline_climatology` is null. `--level` writes
      `h2o_sw_level.json` from the correlated-k ratio and the water vapour
      continuum fraction alone, with no spectrum, no climatology and no
      network, which is what lets `scripts/check_consistency.py` hold
      `model.h2o_sw_level` against a generator instead of against nothing.
      world-o3t1.

  - id: cloud_band_weight
    script: exoplasim/scripts/cloud_band_weight.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [exoplasim/analysis/cloud_band_weight.json]
    gate: >
      the CLOUD half of what shortwave_band_weights does for the gases. Lacis
      and Hansen's absorptances are fractions of solar flux and every one has to
      be re-weighted for this host (`config/planet.yaml`); the range-2 cloud
      co-albedo is the one that never was. Derived from liquid water's
      k(lambda), which carries no spectrum, flux-weighted over range 2 per star.
      Lands on `model.cloud_absorption_scale`, which reaches the model as
      `cloudabs` and scales the tabulated co-albedo alone: the prescribed-cloud
      key `acl2` has no reader at `nswrcl = 1`. PHYS-11, clim-68, world-f9ig

  - id: baseline_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [design_flux, surface_water, surface_albedo, surface_soil_water, rebuild_binaries, ocean_tier_gate, ocean_loop_gate, ocean_transport]
    writes: []
    presence: by_index
    gate: >
      as bootstrap_run: the orbit count is `lib/run_lengths.py:commissioning_bracket`
      and not a typed number. This is the run downstream components read a
      climatology from, so the production span is what its interval is bought
      with.
      IT NEEDS design_flux, and that edge is the expensive half of the
      circularity the design_flux step describes. Without it the graph permits
      buying this run -- hours, and the one every downstream component reads --
      at the provisional orbit.baseline_flux_earth and then buying it again once
      the flux is derived. The edge says the ARTIFACT exists; adopting its
      winner into config/planet.yaml is a separate human act, because the flux
      fixes the semi-major axis and that orbit is compiled into LPJ-GUESS.
      `check_consistency.py` is what refuses to let the two drift apart.
      The first ocean-loop pass is the declared zero-transport seed; subsequent
      passes require ocean_transport from the preceding pass. This is a loop
      boundary, not permission to omit the return once it exists.

  - id: stellar_cycle_run
    script: exoplasim/scripts/run_stellar_cycle.py
    loop: A
    cost: hours
    needs: [baseline_run, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      requires a FINAL baseline, not merely a converged one: anything still
      outstanding that moves the mean has to land first (`docs/src/pipeline/sequencing.md` A2)

  - id: carve_verdict
    script: hydrography/scripts/carve_verdict.py
    loop: A
    cost: minutes
    needs: [baseline_climatology, hydrography, surface_water, stellar_cycle_run, dust_forcing, ocean_loop_convergence]
    writes: [hydrography/analysis/carve_verdict.json]

  - id: endmember_bootstrap_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [design_flux, boundary_conditions, surface_roughness, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      the COLD END of section 4's intersection bracket: same design flux, same
      terrain, model.land_albedo_source lithology instead of vegetated. It needs
      its own bootstrap because its lakes, albedo compositing and soil water must
      be built from a bare-rock climatology and cannot inherit the vegetated
      ones. IT COLD-STARTS, and cannot be seeded with --restart-from: landmod's
      landini reads dalbcl, dalbcl1 and dalbcl2 with mpgetgp when nrestart is
      nonzero and only reads the staged .sra files inside its `nrestart == 0`
      branch, so a seeded arm would integrate the DONOR'S albedo and the bracket
      would be one climate compared with itself. run_exoplasim.py refuses the
      seed for that reason -- the albedo codes' content differs -- and the
      refusal must not be waived with --superseded-surface-ok, which exists for
      an A/B where every arm inherits the same surface. This arm is a BOUND, NOT
      A WORLD; nobody claims Vesper is at this flux without a biosphere, and its
      numbers should never be quoted as a description of the planet

  - id: endmember_baseline_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [endmember_bootstrap_run, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      run on the surface fields rebuilt from the bare-rock bootstrap's own
      climatology. Everything between the two runs is minutes, so the cost of
      this arm is exactly two climate runs and nothing else

  - id: carve_verdict_endmember
    script: hydrography/scripts/carve_verdict.py
    loop: A
    cost: minutes
    needs: [endmember_baseline_run, hydrography, baseline_climatology]
    writes: [hydrography/analysis/carve_verdict_endmember.json]
    gate: >
      the cold-end verdict. Its own lakes and its own climatology, from the
      bare-rock arm, never the vegetated ones

  - id: carve_list
    script: hydrography/scripts/export_carve_list.py
    loop: A
    cost: seconds
    needs: [carve_verdict, carve_verdict_endmember, baseline_climatology]
    writes: ["hydrography/data/{build}/carve_list.txt", "hydrography/data/{build}/carve_list.json"]
    gate: >
      carves the INTERSECTION, per `docs/src/pipeline/loops.md`: retain is the larger of
      the two arms', so a rim survives wherever either climate would have kept
      it, and the disagreement is the BRACKETED set by construction rather than
      by a tolerance chosen afterwards. Pass the cold arm's climatology as
      --endmember-climatology; without it this is ONE arm of the bracket and the
      sidecar's `intersection.single_climate` says so rather than letting a
      reader mistake it for two. The list is written in the basis Orogen spends
      it against -- a fraction of the depression's NATURAL relief in model
      units, not of the finished one in metres -- and `method.carve_list_basis`
      declares the conversion, its two assumptions and the residual bracket on
      the ratio it uses. `--selftest` holds the conversion to the identity that
      the permitted incision equals the intended one, and needs no build

  # Where ice can persist, at the MESH's resolution rather than the model's. The
  # model forms no permanent land ice at any truncation this project will run --
  # a cell's temperature is evaluated at its mean elevation and the ground inside
  # it is kilometres higher -- so `glac` is a fact about the grid and cannot be
  # the instrument. The warmest-bin surface temperature is smooth and genuinely
  # resolved; lapse-correcting it to each region's own elevation is what locates
  # ice. Consumed AT GENERATION like the carve list, because glacial, hydraulic
  # and thermal erosion share one iteration loop. PHYS-13.
  - id: ice_mask
    script: analysis/ice_mask_freezing_height.py
    loop: A
    cost: minutes
    needs: [baseline_climatology]
    writes: [analysis/ice_mask_freezing_height.json]
    gate: >
      --write-mask emits what Orogen reads and its sidecar; without the sidecar the
      mask has no mesh identity and the generator refuses it. Only the T42 export
      keeps raw/, so a climatology at another truncation needs --grid-export to name
      the export whose GRID it was run on while --build names the mesh

  - id: orogen
    script: vendor/orogen
    loop: A
    cost: hours
    needs: [carve_list, ice_mask]
    writes: ["source/{build}/"]
    first_pass: >
      TWO PASSES, AND THE FIRST ONE HAS NO ICE. `ice_mask` needs
      `baseline_climatology`, which needs a build, which is this step -- so on
      the first pass through loop A neither of this step's `needs` can be
      satisfied and the edge is not a cycle but a PASS BOUNDARY, the same one
      `reads_export` exists to keep out of `needs`. Generate the first build
      with `--glacial 0`, which is an honest null rather than an
      Earth-calibrated guess; commission it to a baseline; write the mask from
      that climatology with `ice_mask_freezing_height.py --write-mask`; then
      regenerate with `--ice-mask`. The commissioning is therefore PART of the
      regeneration and does not follow it.
      It cannot be collapsed into one pass, because Orogen has no climate to
      place ice from before it makes the terrain. It cannot be bolted on
      afterwards either: glacial, hydraulic and thermal erosion share one
      iteration loop and a mid-loop priority flood cuts outlets through the
      depressions glaciation makes, so a later glacial pass would leave them
      undrained and move the drainage network. WORLD-Q5IG carries the run.
    gate: >
      the carve gate: nothing outstanding may still move an artifact the verdict
      is computed from. READ THE OPEN ISSUES AND DECIDE. Deliberately not computed,
      and not because a filter over `step:` labels performed badly -- because
      it answers a different question. Whether an issue still moves the verdict
      is a fact about what closing it would CHANGE, which is its prose; a label
      records where the work is filed. An issue can name an upstream step and move
      nothing, being deferred, a bound, or blocked on something after the carve.

  # Whether the prescribed pCO2 is backed by a plausible outgassing rate. The
  # comparison lives in weathering_fluxes.py; the CONCLUSION lives here, because
  # a verdict that is a constant string is not a check. Needs nothing: with the
  # requirement artifact absent it refuses for exactly that reason, which is the
  # state config/planet.yaml already records in prose.
  - id: outgassing_gate
    script: pedology/scripts/outgassing_gate.py
    cost: seconds
    needs: []
    writes: [pedology/analysis/outgassing_gate_report.json]
    gate: |
      With `requested: false` in pedology/config/outgassing.yaml it reports what
      is undeclared and exits 0. With `requested: true` -- which is what claiming
      anywhere that the prescribed CO2 is SUPPORTED by outgassing means -- it
      refuses by name for every unmet precondition. It refuses on two kinds of
      defect: a field left undeclared, and a field declared and WRONG -- a
      disordered bracket, a value its own bracket does not contain, fractions
      that do not sum to 1, and fractions that disagree with the fluxes they
      were assembled from.

  - id: weathering_fluxes
    script: pedology/scripts/weathering_fluxes.py
    cost: minutes
    needs: [soil, hydrography, outgassing_gate, bootstrap_climatology]
    writes: [pedology/analysis/weathering_fluxes.json]

  - id: thermostat_efficiency
    script: pedology/scripts/thermostat_efficiency.py
    cost: minutes
    needs: [weathering_fluxes, baseline_climatology]
    writes: [pedology/analysis/thermostat_efficiency.json]

  # What CHOOSING a weathering scheme costs the thermostat, as opposed to what a
  # parameter inside one costs it. Needs the export and nothing else: the three
  # schemes are all separable into a power law in runoff and an exponential in
  # temperature, so the comparison is analytic and no climatology enters it.
  - id: weathering_scheme_bracket
    script: pedology/scripts/weathering_scheme_bracket.py
    cost: seconds
    needs: []
    writes: [pedology/analysis/weathering_scheme_bracket.json]

  - id: brine_paths
    script: pedology/scripts/brine_paths.py
    cost: minutes
    needs: [hydrography, baseline_climatology]
    writes: [pedology/analysis/brine_paths.json]

  - id: surface_classes
    script: pedology/scripts/build_surface_classes.py
    cost: minutes
    needs: [soil, brine_paths, dust, surface_water, baseline_climatology]
    writes: [pedology/analysis/surface_classes.nc, pedology/analysis/surface_classes_report.json]

  - id: rootable_fraction
    reads_export: true
    script: biosphere/scripts/build_rootable_fraction.py
    loop: [A, B, C]
    cost: minutes
    needs: [surface_water, spatial_support]
    writes: ["biosphere/data/{build}/rootable_fraction_{res}.nc", "biosphere/data/{build}/rootable_fraction_{res}_report.json"]
    gate: >
      BIO-11's one provenance-stamped effective plant area. It partitions
      native-mesh land into rootable, solved-water and dry-barren populations,
      reading the solved lake mask directly from surface_water so iteration-0
      soil does not depend cyclically on post-soil surface classes. Water over
      salt/playa is deducted once. The older spatial_support field is named
      nonbarren because it lacks the lake half and cannot be consumed as this
      artifact.

  - id: phosphorus_budget
    script: pedology/scripts/phosphorus_budget.py
    cost: minutes
    needs: [soil, dust, surface_water, baseline_climatology]
    writes: [pedology/analysis/phosphorus_budget.json]
    gate: >
      two arms in one artifact and they are not interchangeable. The ABSOLUTE
      arm is Hartmann et al. (2014)'s law, P release as a fixed percentage of
      the Ca+Mg+Na+K+SiO2 export, with that export as Meybeck (1987) Table 2C
      concentrations times this world's runoff, plus the root-zone total-P stock
      cut at the land column property contract's rootable base. It needs the
      climatology directly, for runoff and temperature, and the soil map, for
      depth and bulk density. The RANK arm carries no mass and no time and must
      not be converted into a flux. Two criteria are declared in the script
      before it runs: the land yield stays below Hartmann and Moosdorf (2011)'s
      Japanese maximum, and the two configured phosphorus rows must imply a
      major-element rock content inside a declared range, which is the check
      that the pair confused twice in this file's history is still the pair it
      claims to be.

  - id: vesper_header
    script: biosphere/scripts/build_vesper_header.py
    loop: B
    cost: minutes
    needs: [bootstrap_climatology]
    writes: [biosphere/generated/vesper_provenance.json, biosphere/generated/vesper.h]
    gate: >
      declared `needs: []` until 2026-08-19, which read as "compiles from
      config/planet.yaml alone". It does not: it fits the LPJ-GUESS solstice
      offset against the solar declination an ExoPlaSim climatology actually
      reports, so day 0 of the biosphere year is pinned to the first
      climatology bin. The bootstrap's is enough, because the phase is a
      property of the model calendar rather than of the climate state -- but a
      climatology has to exist, and with none named the script exits.

  - id: build_lpj_guess
    script: biosphere/scripts/build_lpj_guess.py
    loop: B
    cost: minutes
    needs: [vesper_header]
    writes: [vendor/lpj-guess/build/guess, vendor/lpj-guess/build/guess.provenance.json]
    gate: >
      Rule 4 for the biosphere. LPJ-GUESS compiles one executable and reads
      none of its source at run time, so a binary built before an edit
      integrates the code it was built from and reports nothing. This records
      the sha of every file the executable was compiled from, `--verify`
      compares that record against the tree without building anything, and
      `run_lpj_guess.py` refuses a binary that does not match. It needs
      `vesper_header` because the configured orbital year sizes arrays at
      compile time. CPU-heavy: run it under `scripts/lock_and_run`, and check
      `pgrep -x guess` first, because it replaces the executable a run in
      flight has already hashed. world-w62x.

  - id: vesper_pfts
    script: biosphere/scripts/build_vesper_pfts.py
    loop: B
    cost: minutes
    needs: [vesper_header]
    writes: [biosphere/generated/vesper_pfts_provenance.json, biosphere/generated/vesper_pfts.ins]

  - id: lpj_driver
    script: biosphere/scripts/build_lpj_driver.py
    loop: B
    cost: minutes
    needs: [baseline_climatology, land_column_properties, vesper_pfts, rootable_fraction]
    writes: [biosphere/generated/vesper_driver_provenance.json, biosphere/generated/vesper_driver.bin]

  - id: bvoc_gate
    script: biosphere/scripts/bvoc_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/bvoc_gate_report.json]
    gate: >
      the activation contract for the simulated biosphere's volatile organic
      source. It reads biosphere/config/bvoc.yaml and REFUSES activation, by
      name, for every precondition still undeclared; with no request it reports
      and exits 0, because a biosphere run with that source off is a correct
      run. `lpj_run` needs it so the refusal sits on the path rather than
      beside it.

  - id: wetland_gate
    script: biosphere/scripts/wetland_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/wetland_gate_report.json]
    gate: >
      the activation contract for the simulated biosphere's wetlands, peat and
      methane. It reads biosphere/config/wetlands.yaml and refuses, by name, for
      every precondition still undeclared, and it ALSO reads the vendored source
      and refuses for every hydrology defect still there: water added to a
      wetland stand that the simulated world never received, a constant runon
      carrying no catchment, an annual water-table average guarded on an ordinal
      the calendar never reaches, and prognostic peat hydrology absent from the
      serializer. A declaration claiming a defect is closed while the probe
      still finds it is reported as a contradiction rather than believed.
      It also holds every retained acceptance table against the emitter that
      would have to write it: run_lpj_guess.py derives an instruction row from
      each retained filename's stem, so a table with no declared parameter in
      modules/commonoutput.cpp would abort the run while plib parsed the
      instruction file, naming one unknown parameter and nothing about why.
      Both halves are checked, so neither a table that lost its emitter nor one
      that quietly gained one can sit in the declaration unnoticed.
      A fixture set runs on every invocation: mutations of the declaration built
      to be wrong in a named way, the live declaration which must be refused,
      three mutations of the EVIDENCE so that the contradiction branch stays
      checkable after the repair that made the source agree, and a met
      declaration against a repaired source which must be GRANTED, because a
      gate nothing can satisfy is a wall. With no request it reports and exits
      0, because a biosphere run with peat and methane off is a correct run.
      `lpj_run` needs it so the refusal sits on the path rather than beside it.

  - id: soil_restart_state_gate
    script: biosphere/scripts/soil_restart_state_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/soil_restart_state_report.json]
    gate: >
      what a restarted soil column inherits. Soil::serialize is the whole of it,
      and a member of the Soil class absent from that block is either state the
      restart drops or something the model rebuilds before it reads it -- the
      two are indistinguishable in a diff. It parses the class body in
      framework/guess.h and the serialize block in modules/soil.cpp against
      biosphere/config/soil_restart_state.yaml, which classifies every absent
      member with the file:line that settles it, and refuses on a member nothing
      accounts for, on a classification the serializer now contradicts, on a
      name the class has dropped, on a classification carrying no evidence, and
      on a non-empty `lost` block. Six fixtures built to be wrong in a named way
      run on every invocation, plus the live declaration, which must be granted.
      A member added to the Soil class lands unclassified and stays there, which
      is what keeps the sweep from having to be argued again. `lpj_run` needs it
      so the refusal sits on the path rather than beside it.

  - id: ntransform_gate
    script: biosphere/scripts/ntransform_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/ntransform_gate_report.json]
    gate: >
      the declaration of the simulated soil's nitrogen transformation operator,
      checked against the source the model reads. It reads
      biosphere/config/ntransform.yaml and fails on a constant that has drifted
      from global_soiln.ins, on a literal no longer in modules/ntransform.cpp,
      on a response function that leaves the range its role allows over the
      declared domain, and on a chain of factors whose product would take more
      nitrogen out of a pool than the pool holds. Seven reduced fixtures run on
      every invocation, six built to be wrong in a named way. With every Vesper
      precondition still undeclared it reports and exits 0, because a run on the
      declared Earth-calibrated operator is a correct run of a declared model
      boundary; `--strict` is the arm that refuses. `lpj_run` needs it so the
      boundary sits on the path rather than beside it.

  - id: fire_gate
    script: biosphere/scripts/fire_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/fire_gate_report.json]
    gate: >
      the declaration of the simulated vegetation's fire operators, checked
      against the source the model reads. Its scope is the OPERATORS and not one
      source file: GLOBFIRM's burned fraction, its mortality and the BLAZE
      effects path live in different translation units, so each entry in
      biosphere/config/fire.yaml names its own source_file and the gate reads
      the union. It carries the one shape the other register gates have no case
      for, mainline_form: deleted_line -- a line the release runs that this
      project's source does not run at all, so there is no changed line to find
      and the third check those gates make has nothing to look at. Its work is
      done by absent_from_stripped, the fragments a reformatted revert would
      reintroduce, and by the recorded form with its own trailing comment
      removed, because a recorded line carrying a // can never survive comment
      stripping and searching for it verbatim is a check that cannot fail. It
      fails on a mainline form the source no longer records beside the change,
      on one the source has gone back to running, on a deletion whose forbidden
      fragments are live in code, on a deletion that also names a changed line,
      on an entry naming a function the source no longer runs, on an unknown
      mainline_form, live_under or constant classification, and on the four
      execution refusals the per-entry shape exists to make: an entry claiming
      no arm, an entry claiming an arm the register does not carry, an
      unexecuted entry saying nothing about why none covers it, and an arm no
      entry claims. Eighteen fixtures run on every invocation, seventeen built
      to be wrong in a named way. It reports and exits 0; `--strict` refuses on
      a divergence whose verdict is `gate` and there is none. `lpj_run` needs it
      so the declaration sits on the path rather than beside it.

  - id: snow_thermal_gate
    script: biosphere/scripts/snow_thermal_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/snow_thermal_gate_report.json]
    gate: >
      the relation that turns the simulated snowpack's density into a thermal
      conductivity, checked against the source both models read. THE RELATION
      IS DECLARED IN lib/snow.py AND NOWHERE ELSE: the climate model's landmod
      and the vegetation model's soil.cpp each restate the adopted row as a
      literal, because neither can import a Python module at runtime, and
      lib/snow.py's check_restatements holds both to the one table.
      scripts/smoke_test.py runs that half too. This gate reads
      biosphere/config/snow_thermal.yaml and fails on a restatement that has
      drifted from the declaration or normalises the ice volume fraction by
      something other than the density the fit was made against, on any of the
      three halves of the declared divergence from LPJ-GUESS 4.1.1, on a
      compaction ramp whose ends modules/soil.h does not declare, and on a
      coefficient of the superseded relation live anywhere in the vendored
      vegetation model, and on the four execution refusals the per-entry claim
      exists to make: an entry claiming no arm, an entry claiming an arm the
      register does not carry, an unexecuted entry saying nothing about why none
      covers it, and an arm no entry claims. Sixteen fixtures run on every
      invocation, fifteen built to
      be wrong in a named way. It reports and exits 0: the residual is the
      kinetics bracket, which is one-signed and which the literature holds
      open, so `--strict` refuses only on a divergence whose verdict is `gate`
      and there is none. `lpj_run` needs it so the declaration sits on the path
      rather than beside it.

  - id: somdynam_gate
    script: biosphere/scripts/somdynam_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/somdynam_gate_report.json]
    gate: >
      the declaration of the simulated soil's phosphorus path, checked against
      the source the model reads. Its reference point is a SUBTREE COMMIT and
      not a release: LPJ-GUESS 4.1.1 has no phosphorus, so nothing here can be
      compared against one, and the register names the commit the CNP fork was
      vendored at instead. It reads biosphere/config/somdynam.yaml and fails on
      a saturation constant whose line modules/somdynam.cpp no longer runs or
      whose value is not what that line's own initialiser evaluates to, on a C:P
      ramp whose setptoc call the source no longer contains or contains a
      different number of times, on a ramp leaving the P:C range its two
      endpoints allow, on a line the phosphorus argument rests on that the model
      no longer runs, and on any of the three halves of a declared divergence
      from the fork. Sixteen fixtures run on every invocation, fifteen built to
      be wrong in a named way. With PCONC_SAT still unsourced it reports and
      exits 0, because this project runs ifplim 0 and parameters.cpp already
      refuses ifplim 1 on that same constant; `--strict` is the arm that
      refuses. `lpj_run` needs it so the refusal sits on the path rather than
      beside it.

  - id: century_acceleration_gate
    script: biosphere/scripts/century_acceleration_gate.py
    loop: B
    cost: seconds
    needs: [somdynam_gate]
    writes: [biosphere/generated/century_acceleration_gate_report.json]
    gate: >
      SDEC-1's no-simulation proof that the 40,000-year CENTURY accelerator is
      the sampled daily nutrient operator rather than a second model. Daily
      uptake and mineral-leaching survival fractions compose
      multiplicatively; multiple sample years reduce by their geometric monthly
      mean; phosphorus weathering and deposition are sampled as fluxes rather
      than repeated year-to-date totals; and every accelerated P mutation goes
      through the same labile--sorbed isotherm as the daily path. Deterministic
      fixtures exercise daily/monthly parity, C-N-P closure and deliberately
      broken source forms. The gate also requires all mineral-P pools changed
      during the hidden acceleration to be restored afterward.

  - id: mineral_reactivity_gate
    script: biosphere/scripts/mineral_reactivity_gate.py
    loop: B
    cost: seconds
    needs: [soil]
    writes: [biosphere/generated/mineral_reactivity_gate_report.json]
    gate: >
      one contract for how the simulated soil protects carbon and sorbs
      phosphorus. It reads biosphere/config/mineral_reactivity.yaml and fails on
      a coefficient whose literal is no longer in modules/somdynam.cpp, on a
      declared equation that leaves its range over the texture simplex, on the
      microbial partition's remainder moving off its registered minimum, on a
      soil map missing a carried column or carrying one out of range, and on any
      model file reading the carried andic state while the arm that would use it
      refuses. Six reduced fixtures run on every invocation, five built to be
      wrong in a named way. With every mineral-aware proxy still undeclared it
      reports and exits 0, because a run on the declared texture-only arm is a
      correct run of a declared model boundary; `--strict` is the arm that
      refuses.

  - id: abiotic_nutrient_ledger
    script: biosphere/scripts/abiotic_nutrient_ledger.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/abiotic_nutrient_ledger_report.json]
    gate: >
      the one ledger every abiotic nutrient source books into, from source
      material to the terrestrial root zone and on to a named terminal
      boundary. It reads biosphere/config/abiotic_nutrients.yaml, fails on a
      graph that does not close, exercises the mass balance on fixtures built
      to be wrong, refuses any source screen carried on an aerosol optical
      depth, and reports the non-N/P adequacy screen's critical runoff per
      element and per lithology. With every term still undeclared it reports
      and exits 0, because a biosphere run on the declared nitrogen scalar is
      a correct run; `--strict` is the arm that refuses. `lpj_run` needs it so
      the declared C-N-P model boundary sits on the path rather than beside it.

  - id: acclimation_gate
    script: biosphere/scripts/acclimation_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/acclimation_gate_report.json]
    gate: >
      the memory the simulated plants' basal respiration rate carries. Acclimated
      respiration replaces each plant functional type's respcoeff with a function
      of the GROWTH temperature the tissue has adjusted to, and that growth
      temperature is a running mean whose e-folding time this project cannot
      derive and so brackets. It reads
      biosphere/config/respiration_acclimation.yaml and fails on the acclimation
      multiplier reading an instantaneous temperature again, on a growth
      temperature missing from a serialize list, on a default appearing for
      acclim_resp_tau or its refusal going missing, on the state being seeded
      from a constant rather than from the forcing, on a declaration that
      disagrees with itself, and on a run instruction naming a memory the
      declaration does not carry. Sixteen fixtures run on every invocation, six
      built to be wrong in a named way, and the declaration fixtures drive a
      reference declaration rather than the live file so a fixture verdict is
      never a statement about the tree. It executes the one-factor sensitivity
      registered over the bracket and reports its response, which carries no
      pass/fail bar and is propagated as model-form uncertainty; `--strict`
      refuses an acclimated path with no declared memory length.

  - id: phenology_gate
    script: biosphere/scripts/phenology_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/phenology_gate_report.json]
    gate: >
      where the simulated vegetation's seasonal landmarks come from. The coldest
      and warmest day of the simulation year decide when the summergreen
      degree-day sum, the annual leaf-on sum and chilling detection reset, and
      they are derived per gridcell from the temperature forcing rather than
      taken from an Earth calendar. It fails on an Earth ordinal date back in any
      compiled source, on a reader no longer keyed on the derived pair, on a
      chill-day count able to leave the lookup table it indexes, and on a
      landmark field missing from Climate::serialize. Eleven fixtures run on
      every invocation, four built to be wrong in a named way, over northern,
      southern, equatorial, flat and sixteen-orbit forcings. `--strict` refuses
      on the one natural-vegetation event still on an Earth calendar, BIO-31.

  - id: stochastic_seed_gate
    script: biosphere/scripts/stochastic_seed_gate.py
    loop: B
    cost: seconds
    needs: []
    writes: [biosphere/generated/stochastic_seed_report.json]
    gate: >
      DEMO-5's one manifest-recorded random root and stable independent
      substreams. The FNV key is physical cell coordinates, stand, replicate
      patch and named process, never MPI rank or traversal position. The gate
      checks a fixed cross-language vector, stream and replicate separation,
      rank/order invariance, draw-count isolation, every source call site, and
      restart serialization. `lpj_run` needs it so no run can fall back to the
      old literal shared Stand seed.

  - id: equilibrium_window_gate
    script: biosphere/scripts/equilibrium_window_gate.py
    loop: B
    cost: seconds
    needs: [stochastic_seed_gate]
    writes: [biosphere/generated/equilibrium_window_report.json]
    gate: >
      BIO-12's one statistic for every LPJ output consumer. It bounds the
      end-to-end relative drift of THE QUANTITIES A CONSUMER READS -- the sums
      `equilibrium_window.yaml`'s `assessed` block declares, each at the
      tolerance its own consumer's chain gives -- rather than of a table's
      columns, reduces the annual rows to cycle means, refuses incomplete
      cell-year output, and reports temporal spread separately from root-seed
      and patch-count ensemble spread. Missing ensemble members are
      `not_measured`, never zero uncertainty. Fixtures cover a stationary
      multi-year phase, trend and truncation refusals, seed/patch ensembles, and
      the pair that says what the assessed set is FOR: one record whose two
      columns drift in opposite directions is accepted when the sum a consumer
      forms is the claim and refused when the columns are, and a record whose
      columns drift together is refused either way. Source probes hold albedo,
      scoring and soil carbon to this shared reader, and the spin-up floor's
      minimax over the unmeasured relaxation time is checked across five decades
      of relaxation time rather than reported.

  - id: lpj_run
    script: biosphere/scripts/run_lpj_guess.py
    loop: B
    cost: hours
    needs: [lpj_driver, build_lpj_guess, bvoc_gate, abiotic_nutrient_ledger, ntransform_gate, somdynam_gate, century_acceleration_gate, fire_gate, snow_thermal_gate, mineral_reactivity_gate, phenology_gate, acclimation_gate, wetland_gate, soil_restart_state_gate, stochastic_seed_gate, equilibrium_window_gate]
    writes: [biosphere/runs/]
    gate: >
      Completion includes BIO-14 assessment inside the run harness: every
      required rank/output/cell/year must be present and identical to the
      merged tables, all values must be finite and physically valid, the
      retained equilibrium windows must be stationary, and carbon, nitrogen
      and water closure must pass. Exit status alone never produces a usable
      run; PASS or FAIL is recorded in acceptance.json.

      `--save-state` writes the simulated state of the last year into
      `runs/<run_id>/state/`, and `--continue-from <run_id>` resumes from it and
      integrates `--nyear` more years, all retained, so a refused run is
      answered by more record rather than by re-buying the spin-up in front of
      it. Every instant in that state is a `date.year`, which counts from zero
      THROUGH `nyear_spinup`: a run ends at `nyear_spinup + nyear - 1`, the
      runner writes the spin-up it read from the PFT file into the instruction
      file so its arithmetic and the model's agree, and a continuation declares
      its parent's total as its own spin-up so its output covers its own years.
      The continuation is a new run with a new id whose manifest and acceptance
      artifact name the parent and the chain back to bare ground. What may be
      continued is guarded by `run_lpj_guess.py:continuation_refusals` against
      the parent's pinned inputs, its physical settings and the hashes of the
      state files it wrote.

      `--continue-from` is additionally REFUSED unless
      `verify_lpj_restart_continuity.py` has reported that this binary
      reproduces the run it continues; an absent report is a refusal, because an
      absent measurement is not a pass. It refuses today: world-glu7 records
      every retained table differing after a year-boundary restart, at around
      1e-04 relative in the pools and grossly in `tot_runoff.out`'s components
      for the first resumed year (world-lus4). `--save-state` is not gated,
      since writing a state file changes no number in the run that writes it.

  - id: lpj_acceptance
    script: biosphere/scripts/assess_lpj_run.py
    loop: B
    cost: seconds
    needs: [lpj_run]
    writes: ["biosphere/analysis/lpj_*/acceptance.json"]
    gate: >
      BIO-14's independently repeatable assessment of a completed run. The
      run harness invokes the same assessor before returning success, while
      this graph row gives the accepted artifact its own dependency edge.

  - id: prospectivity
    script: minerals/scripts/build_prospectivity.py
    cost: minutes
    needs: [hydrography]
    writes: ["minerals/data/{build}/prospectivity.nc", "minerals/data/{build}/prospectivity_report.json"]

  - id: downstream_prospectivity
    script: minerals/scripts/build_downstream_prospectivity.py
    cost: minutes
    needs: [prospectivity, brine_paths, surface_classes, soil, baseline_climatology]
    writes: ["minerals/data/{build}/downstream_prospectivity.nc", "minerals/data/{build}/downstream_prospectivity_report.json"]

  - id: trace_gas_forcing
    script: analysis/trace_gas_forcing.py
    cost: seconds
    needs: []
    writes: [analysis/trace_gas_forcing.json]
    gate: >
      needs references/pdf/rugheimer_2013_spectral-fingerprints-of-earth-like-planets-around-fgk-stars.pdf,
      which is untracked; references/INDEX.md carries the DOI

  - id: error_budget
    script: scripts/error_budget.py
    cost: seconds
    needs: [carve_list, baseline_climatology, surface_albedo]
    reads_export: true
    writes: [analysis/error_budget.json]

  - id: basemap
    reads_export: true
    script: maps/build_basemap.py
    cost: minutes
    needs: [analyze_climatology, surface_water, baseline_climatology]
    writes: [maps/build/basemap_provenance.json, maps/build/basemap.npy, maps/build/land.npy, maps/build/basemap_equirectangular.png, "maps/build/region_index_*.npy"]
    # `reads_export` was absent while the terrain was read all the same, through
    # `builds.mesh_export()`. It is what makes the map reachable from `orogen`,
    # and so what makes the set of steps a frame is taken after derivable rather
    # than listed.

  - id: projections
    script: maps/render_projections.py
    cost: minutes
    needs: [basemap]
    writes: ["maps/data/{build}/INDEX.json", "maps/data/{build}/*/*.png", "maps/data/{build}/*/provenance.json"]
    # One UUID-named frame per state of the world, namespaced by build like
    # every other component's data. INDEX.json says what each frame is and is
    # the only record once a frame is deleted, so it is tracked and they are
    # not. The authagraph is the default output and the other six are behind
    # flags; `maps/snapshot.py` is what the plan runs after each step.

  - id: world_state
    script: scripts/world_state.py
    cost: seconds
    needs: [index_runs, analyze_climatology, carve_list, hydrography, stellar_spectrum]
    reads_export: true
    writes: [world_state.json]

# Run, never generate an artifact, and gate the expensive steps.
checks:
  # THE FINALIZER, and it is not a gate on a commit: it runs ONCE, after the
  # ladder. Loop D advances only after replaying A, B and C on the new support,
  # and the ladder's cost argument does not buy that replay, so the final state
  # carries terrain carved at T21, soil and vegetation converged at T21 and a
  # climate merely settled at the operating support. Each loop exited; none
  # exited against the others' final state. This re-evaluates each loop's OWN
  # exit predicate there. It reports NOT EVALUABLE distinctly from pass and fail
  # -- exit 2 -- and never substitutes a coarser artifact for the operating
  # support's, because a finalizer that passes on what it could not test is
  # worse than one that refuses. Nothing iterates on its verdict:
  # docs/src/pipeline/loops.md says why the decision to re-enter is the
  # author's.
  - id: verify_joint_convergence
    script: scripts/verify_joint_convergence.py
  - id: check_consistency
    script: scripts/check_consistency.py
  # The FAST static gate, and the only one of these rows that is a per-commit
  # check. Every pass in it is a parse, a text read, a config comparison or a
  # small synthetic fixture, because its cost is multiplied by every commit in
  # the project and this host runs several sessions at once. The two rows below
  # it are the passes that spawn a process per unit of the tree; smoke_test used
  # to run both behind opt-out flags and no longer runs either.
  - id: smoke_test
    script: scripts/smoke_test.py
  # Does every script START: does it import on this interpreter, and does its
  # argparse parser build without raising? One fresh interpreter per entry
  # point, because a single process would let one script's sys.path edit make
  # the next one's import succeed for the wrong reason. Nothing static answers
  # this -- smoke_test's parse, pyflakes and symtable passes are all about name
  # binding inside a source text, and an import is a dynamic act. Parallel,
  # bounded to a quarter of the cores.
  #
  # STARTING IS NOT RUNNING. `--help` short-circuits only where there is a
  # parser to short-circuit it, so a script that builds none does its whole job
  # when started that way, and the ones that do are gates writing tracked
  # reports. The probe is picked per script from the source: `--help` where it
  # constructs an ArgumentParser, executing the module body under a `__name__`
  # that is not `__main__` where it does not. And the child reports the CLASS of
  # what happened rather than an exit status, so a gate that started and refused
  # on purpose is not read as an import graph that no longer resolves.
  #
  # Run before a build or a push, not per commit: CLAUDE.md rule 8.
  - id: verify_entry_points
    script: scripts/verify_entry_points.py
  # Does the model SOURCE compile: gfortran -fsyntax-only over every translation
  # unit `plasim/CMakeLists.txt` names, in `use` order, under the flag line
  # config/planet.yaml declares. Not whether a binary is current, which is rule
  # 4's question and check_consistency's row above.
  #
  # Run after a Fortran edit and before paying for a build, with the row above
  # it; smoke_test does NOT run it. What smoke_test keeps of the Fortran is the
  # dropped-continuation text check, which catches the one class that has cost a
  # build and catches it in the commit that makes it.
  - id: verify_model_compiles
    script: exoplasim/scripts/verify_model_compiles.py
  # Does any domain-sensitive intrinsic sit inside a masked `where` block whose
  # complement can hold an out-of-domain argument? A `where` masks the
  # ASSIGNMENT and not the evaluation, so the compiler may evaluate the
  # right-hand side on every lane, and the declared `-ffpe-trap` turns a lane
  # that was going to be discarded into SIGFPE. That is world-bhs, and it is why
  # the flag line is -O2 rather than -O3.
  #
  # A pure text parse of plasim/src, no build and no run. It OVER-reports by
  # construction -- it clears its where-stack only on an explicit `end where`,
  # recognises only a literal set of guard shapes, and knows nothing about the
  # physics of a mask -- so a clean run is evidence and a dirty one is a work
  # list. The sites it cannot guard carry their argument in the script's
  # CLASSIFIED table, keyed on the argument text, so a changed argument is
  # reported again. Exit 1 on anything neither guarded nor classified.
  #
  # `--kind any` is the default and is what this row runs: the intrinsics, the
  # divisions in all three spellings, and the merges together. It was
  # `--kind intrinsic` while radmod.f90's 45 divisor keys were unread, and
  # world-px61 read them.
  - id: lint_masked_domains
    script: exoplasim/scripts/lint_masked_domains.py
  # Which declarations in plasim/src acquire SAVE inside a procedure body? A
  # local with an initialiser is SAVEd, SAVE is static storage, and under
  # -fopenmp static storage is one copy for the whole thread team -- which is
  # the defect the Stage 1 thread port tripped over in glacierini. Under the
  # deleted MPI arm each rank was a process and the same source was correct, so
  # this class is reachable only since world-38b made every build threaded, and
  # gfortran reports nothing about it at any warning level.
  #
  # A pure text parse, no build and no run. It over-reports the same way
  # lint_masked_domains does, and each site's verdict lives either in an
  # !$omp threadprivate directive beside the declaration or in the script's
  # CLASSIFIED table, keyed on the variable name. Exit 1 on anything with
  # neither.
  - id: lint_implicit_save
    script: exoplasim/scripts/lint_implicit_save.py
  # Which procedure locals have ALL their definitions inside a `where`? A
  # `where` selects which elements the assignment STORES and not which the
  # compiler EVALUATES, so an automatic local with no initialiser, written only
  # inside a mask and then read, is read on every discarded lane as whatever the
  # stack held -- and the declared -ffpe-trap turns that into SIGFPE. Where the
  # read sits under a different mask or none, the indeterminate lane is stored
  # rather than discarded. world-d016 found the class in tands, mktsoil and
  # mkdca and left it unenumerated; this is the enumeration.
  #
  # Adjacent to lint_implicit_save and its exact complement: that pass fires on
  # the PRESENCE of an initialiser, which confers SAVE and under -fopenmp is one
  # copy for the whole thread team, and this one on its ABSENCE. The module says
  # why they cannot be one pass.
  #
  # A pure text parse, no build and no run, over-reporting in five declared
  # directions. It answers twenty reduced fixtures on every invocation before it
  # reports on the tree, and its positive control is the pre-d016 tree, where it
  # returns exactly the seventeen locals that work found. Each site's verdict is
  # a row in the script's CLASSIFIED table keyed on the variable name; exit 1 on
  # anything with neither a fix nor a row. smoke_test runs it. Its DEFERRED
  # table, which reports a file without gating it, is empty: radmod.f90 was its
  # one entry and world-px61 read it.
  - id: lint_masked_locals
    script: exoplasim/scripts/lint_masked_locals.py
  # Which writes to the shared diagnostics unit can a thread other than 0
  # reach? nud is unit 6, opendiag opens it once under a root guard, and a
  # Fortran unit belongs to the process -- so that one open makes it the
  # diagnostics file for the whole thread team, write(*,...) included. The run
  # is one !$omp parallel region, so an unguarded write(nud,...) is NPRO
  # interleaved copies in plasim_diag and the file stops being the same twice.
  # world-0ihs read all 928 sites by hand and closed thirteen holes; this is
  # the two passes that reading used, written down.
  #
  # A pure text parse, no build and no run. It permits four answers and nothing
  # else: an enclosing mypid == NROOT, an enclosing npro == 1, an enclosing
  # !$omp critical, or an enclosing procedure the call graph shows is reached
  # only through those. It over-reports the same way the two lints above do,
  # and it answers reduced fixtures on every invocation before it reports on
  # the tree. Exit 1 on anything unanswered; smoke_test runs it.
  - id: lint_diag_writes
    script: exoplasim/scripts/lint_diag_writes.py
  # Do the optional diagnostic blocks still have code bands of their own, and
  # does the model still refuse to fill more arrays than it allocates? outdiag
  # and snapshotdiag number four optional blocks off the LOOP INDEX into the
  # same unit the ordinary output goes to; off the bases they carried,
  # ndiagsp2d = 1 wrote code 51 twice per output step, once as the ecliptic
  # longitude and once as a spectral array, and pyburn reshaped the joined
  # array by the first header it saw. The bases moved into free space, which is
  # a boundary only while the bands stay disjoint from each other and from
  # every code anything else writes.
  #
  # It also holds the second pairing in the same block: ndiaggp and ndiagsp
  # WRITE dgp3d and dsp3d, ndiaggp3d and ndiagsp3d ALLOCATE them, and nothing
  # in the namelist ties the two together. The counts the model's own guard
  # demands are derived here from the writes rather than remembered.
  #
  # A pure text parse, no build and no run, and it answers reduced fixtures on
  # every invocation before it reports on the tree. Exit 1 on any problem.
  # world-2v9z.
  - id: lint_diag_arrays
    script: exoplasim/scripts/lint_diag_arrays.py
  # What timestep the NCONVTIME term is stable at, which is not the explicit
  # gravity-wave limit the model's guard used to test. The term takes the
  # reference conversion's divergence half off `sdt` -- the centred mean of
  # t-dt and t+dt -- and puts it on the divergence at t, and `sdt - sd` is the
  # second time difference: O(dt^2) for a smooth mode and exactly -2 sd for the
  # LEAPFROG COMPUTATIONAL MODE. So the term feeds that mode, the only thing
  # damping it is the Robert-Asselin filter, and the boundary is a function of
  # PNU -- at PNU = 0 there is none at any step. A gravity-wave CFL cannot say
  # that.
  #
  # It rebuilds the model's own linearised adiabatic step from
  # config/planet.yaml through initpm's, initsi's and makebm's arithmetic and
  # takes the spectral radius of the one-step map. `--against <run>/plasim_diag`
  # compares it with the amplification plasim.f90 prints at startup, which is
  # the check with a right answer: two implementations of one map.
  #
  # No build and no run of the model; it writes
  # exoplasim/analysis/conversion_time_stability.json with its provenance.
  # world-bt3b.
  - id: conversion_time_stability
    script: exoplasim/scripts/conversion_time_stability.py
    writes:
      - exoplasim/analysis/conversion_time_stability.json
      - exoplasim/analysis/conversion_time_stability_sweep.json
  # Does anything uninitialised reach a stored value, at the optimisation level
  # this project ships? The trapping form of that question does not arm at -O2
  # -- world-5rs measured the positive control -- and `-finit-real=zero` was
  # removed because it hid the answer rather than reporting it. This is the
  # PROPAGATING form, which needs no trap: the declared flag line plus
  # `-finit-real=snan` with FE_INVALID masked, on one bed, restart compared bit
  # for bit against the shipped build's, with a deliberate uninitialised read as
  # the control. It is the evidence the 26.03% trade in
  # exoplasim/notes/the-zeroing-is-an-init-flag.md rests on.
  #
  # UNLIKE THE THREE ABOVE it takes arguments -- a bed, a rung, a thread count --
  # and it is not run by smoke_test. It costs four builds at the rung it is asked
  # for (two flag lines, twice, once with the control patched in) and six runs of
  # the bed; nothing else, and it writes no artifact.
  - id: verify_uninitialised_reads
    script: exoplasim/scripts/verify_uninitialised_reads.sh
  # Is a continued LPJ-GUESS run the same experiment as the run it continues?
  # Three modes over the same forcing. The default takes two runs of the same
  # length, one whole and one split, and compares their output tables from the
  # restart point on. `--one-day` splits at an arbitrary simulated DAY and
  # compares the two runs' STATE FILES one day later, so lost state shows up as
  # bytes that differ after one day rather than as a year of divergence.
  # `--round-trip` restarts and writes the state again with no day in between,
  # which names what the write-and-read of a state file does not carry. All
  # three are wrong answers rather than merely different ones. It is the
  # behavioural half of the WET-3 restart repair, where the wetland_gate probe
  # and soil_restart_state_gate over Soil::serialize are the static half.
  #
  # LIKE the row above it takes arguments -- a run length, a restart year, a
  # rank count -- and it is not run by smoke_test. It needs a compiled model and
  # a built forcing, neither of which exists until a baseline climatology does,
  # and it exits naming what is missing rather than reporting a pass.
  #
  # `--self-test` is the exception and needs neither: it checks the two integers
  # run_lpj_guess.py's --save-state and --continue-from decide against the
  # arithmetic framework/framework.cpp performs on them, so a continuation that
  # would silently skip or repeat a simulated year is refused before the run is
  # bought. The three model modes test the serializer; that tests the runner. It
  # reads the spin-up out of the PFT file the runs import rather than carrying a
  # copy, because the failure it was built for was a save point computed from
  # `nyear` alone and thousands of simulated years early.
  #
  # Its own `--nyear-spinup` defaults to ZERO. The PFT file declares the DERIVED
  # spin-up floor, and inheriting it turns a twelve-year bed into a
  # twelve-thousand-year one; zero also puts every simulated year into the
  # output tables the annual mode compares.
  - id: verify_lpj_restart_continuity
    script: biosphere/scripts/verify_lpj_restart_continuity.py
  # Is the executable a function of the model source, or of where the checkout
  # sits? Stages the driver, the declaration and plasim/src into two roots that
  # differ in depth and in length, shows the two stagings byte-identical, builds
  # each through build_model.py itself and compares the two shas. Different shas
  # is the failure, and the report then names the strings that carry a root.
  # The manifest identifies a binary by its sha, so a build whose sha moves with
  # the path is a build no other checkout can register -- which is what stopped
  # a worktree running anything it had compiled. world-ynpx.
  #
  # It costs two builds at the rung it is asked for, publishes nothing, and each
  # arm's run directory is inside its own staging, so the registry is not
  # reachable from it. Not run by smoke_test for that cost.
  - id: verify_build_path_independence
    script: exoplasim/scripts/verify_build_path_independence.py

  # A high-cadence orbit's raw stream is the expensive, irreplaceable half of
  # the segment that made it: 2 GB at T21, 15 GB at T42, kept out of git on
  # purpose, and remade only by running the model again. This asserts on
  # fixtures that it is found and stamped wherever the model or `_crash()` left
  # it, and that a conversion which silently substituted the regular output's
  # twelve bins under the high-cadence name is refused. No model, no process,
  # milliseconds. world-xm1t.
  - id: verify_high_cadence_rescue
    script: exoplasim/scripts/verify_high_cadence_rescue.py

  # The design flux's per-band projection, on synthetic bands whose answer is
  # known before it runs: the line passes through both of its own measured
  # points, a negative warm-season response is projected rather than refused,
  # and a positive one does not certify a projection whose seasonal range
  # closes inside the candidate set. Its anchor case carries the superseded
  # arithmetic as a control, so the identity is known to be able to fail.
  # No model, no run. world-m61p.
  - id: verify_design_flux_projection
    script: exoplasim/scripts/verify_design_flux_projection.py

# Present, deliberately outside the graph: no step row runs them (some are
# imported as modules by step scripts).
one_offs:
  # Runs the `basemap` and `projections` steps at a point in a pass and writes
  # nothing of its own, which is why it is here rather than a step: two rows
  # naming one artifact would give `--purge` two answers. `--plan` names it
  # after every step the map is reachable from.
  - maps/snapshot.py
  # Per-worktree tooling, outside the graph in both directions: neither reads
  # anything a step writes and neither writes anything a step reads. The linker
  # makes symlinks and one ledger of what those links pointed at, in the
  # worktree's own `.git/worktrees/<name>/`, which `--purge` must never reach
  # and `git worktree remove` deletes anyway. The checker writes nothing outside
  # the temporary repository its `--self-test` builds and removes. world-ov4u.
  - scripts/link_worktree.py
  - scripts/check_worktree_links.py
  # Reports the host's load and who has claimed it, and writes only a claim file
  # OUTSIDE the repository. It is not a step because it produces nothing the
  # pipeline reads and nothing `--purge` should ever delete; it is here so the
  # generator gate can see that its absence from the graph is deliberate.
  # Not a step and not a gate: the compiler launcher CMake puts in front of
  # every Fortran compile of the model. It applies the -ffile-prefix-map options
  # already on the compile line to the cpp line markers gcc(1) says those
  # options do not reach, which is what keeps the executable's sha a function of
  # the source rather than of the checkout. The only thing it writes is the
  # preprocessed intermediate it is about to compile, inside the build
  # directory; nothing in the graph reads it. world-ynpx.
  - exoplasim/scripts/prefix_map_launcher.py
  # A library, and `--selftest` is the only thing to run in it. It is here
  # rather than under `checks` because it writes nothing the pipeline reads:
  # the door it tests is a filesystem resolver, so the fixture is a synthetic
  # `.sra` and a hand-built provenance record in a temporary directory that the
  # selftest removes. Nine refusals with right answers, including the two that
  # were wrong: a record that NAMES its build is a stamp, and a staged field is
  # not the one a named run read.
  - lib/provenance.py
  # The same shape, and here for the same reason. It is the one refusal a
  # generator of a linked artifact puts at its write door, so it writes nothing
  # the pipeline reads and `--self-test` is all there is to run: a throwaway
  # tree with a per-file link and a wholly-ignored directory link, and nine
  # cases with answers fixed in advance. The negative ones carry the weight --
  # a guard that refused every path would pass the positives alone and would
  # stop every generator in the main checkout.
  - lib/write_door.py
  - exoplasim/scripts/corrk_cross_check.py
  - exoplasim/scripts/shtns_variant_sweep.py
  - exoplasim/scripts/build_pyfft.py
  - exoplasim/scripts/filter_timestep_matrix.py
  - exoplasim/scripts/stability_probe.py
  - exoplasim/scripts/spectral_tail.py
  - exoplasim/scripts/filter_spectral_cost.py
  # Measures the eddy RMS wind that config/planet.yaml's hyperdiffusion rule
  # divides by, on a run's snapshot stream, and writes a JSON verdict under
  # exoplasim/analysis/eddy-wind/. Outside the graph because the verdict is
  # EVIDENCE for a value declared by hand in config/planet.yaml rather than an
  # input any step reads, and because it answers a question about a run that
