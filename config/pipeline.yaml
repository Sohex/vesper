# THE PIPELINE GRAPH. Single source of truth for what steps exist, what each
# generates, and what must precede it.
#
# The pipeline chapters (docs/src/pipeline/) own the REASONING -- why the order is what it is, what each stage
# is for, why the loops close, and the traps. They reference step ids from here
# and does not restate them. This file owns the graph and nothing else: no
# rationale, no narrative, no current values. Two representations of one thing in
# two files is the duplication both documents exist to prevent.
#
# The graph is directed and CYCLIC by design. Each loop carries an exit predicate
# rather than a topological order, and `scripts/pipeline.py` plans one pass at a
# time rather than solving the cycle.
#
# consumers are NOT declared: they are derived from `needs`. Declaring both would
# be the same duplication one level down.

version: 1

loops:
  A:
    name: the terrain loop
    exit: >
      Successive verdicts bracket rather than converge, because the map is
      antitone: a larger carve set produces a smaller next verdict. Exit by
      carving the INTERSECTION of the verdicts taken at the two bounding
      climates, which makes the BRACKETED set a construction rather than a
      tolerance.
  B:
    name: the soil and biosphere loop
    exit: the criteria in pedology/config/pedogenesis.yaml
  C:
    name: the vegetation-climate loop
    exit: re-take the verdict on modelled vegetation; if basins flip, re-enter A
  D:
    name: the resolution change
    exit: only after A, B and C have settled

# writes: the COMPLETE set of artifacts a step produces, not a marker for them.
#       `--purge` deletes exactly this, so a row that names only its report
#       leaves the bulk behind and reports success. Three forms are accepted:
#       a file path; a directory, written with a trailing slash, meaning the
#       step owns the whole directory; and a glob, for a family of outputs
#       whose exact names a step decides at run time (per-projection renders,
#       per-label plots).
#
# reads_export: the step consumes `source/{build}/` directly. This is NOT a
#       `needs` edge and must not become one. `needs` is the order WITHIN one
#       pass of a loop, and loop A closes by `orogen` consuming a carve list
#       produced from the previous pass -- so making the export a `need` would
#       put every step upstream of `carve_list` and collapse the carve gate to
#       "everything". The export edge crosses a pass boundary and `needs` does
#       not, which is why it is a separate key. `--purge orogen` seeds from it.
#
# cost: seconds | minutes | hours. `hours` is what must never run by accident.
# loop: which loop the step belongs to, or a LIST where it belongs to more than
#       one. A step in two loops is one that is re-run on a different input by
#       the later one, not two steps: one artifact, one row.
# gate: a condition that must hold before the step is meaningful. Absent means
#       none. A gate is NOT a request for a preference -- it is a statement that
#       the recorded procedure does not yet cover this case.

steps:

  - id: stellar_spectrum
    script: exoplasim/scripts/build_stellar_spectrum.py
    cost: minutes
    needs: []
    writes: ["exoplasim/inputs/stellarspectra/{name}.dat", "exoplasim/inputs/stellarspectra/{name}_hr.dat", "exoplasim/inputs/stellarspectra/{name}_provenance.json"]

  - id: rebuild_binaries
    script: exoplasim/scripts/rebuild_binaries.py
    cost: minutes
    needs: []
    writes: [exoplasim/binary_manifest.json]

  - id: hydrography
    reads_export: true
    script: hydrography/scripts/build_hydrography.py
    loop: A
    cost: minutes
    needs: []
    writes: ["hydrography/data/{build}/regions.nc", "hydrography/data/{build}/basins.nc", "hydrography/data/{build}/hydrography_report.json", "hydrography/data/{build}/coupling_exoplasim-T42.nc", "hydrography/data/{build}/coupling_exoplasim-T85.nc"]
    # One coupling matrix per grid in --grids, which defaults to T42 and T85.
    # They are the interface every mesh-to-grid consumer integrates catchments
    # over, and they were generated by this step but declared by no row, so
    # nothing downstream could name what it was reading.

  - id: boundary_conditions
    reads_export: true
    script: exoplasim/scripts/build_boundary_conditions.py
    loop: A
    cost: minutes
    needs: []
    writes: [exoplasim/inputs/t42/boundary_conditions_report.json, exoplasim/inputs/t42/orogen_T42_surf_0129.sra, exoplasim/inputs/t42/orogen_T42_surf_0172.sra]

  - id: surface_albedo
    reads_export: true
    script: exoplasim/scripts/build_surface_albedo.py
    loop: [A, C]
    cost: minutes
    needs: [lpj_run]
    writes: [exoplasim/inputs/t42/albedo_report.json, exoplasim/inputs/t42/orogen_T42_surf_0174.sra, exoplasim/inputs/t42/orogen_T42_surf_0175.sra, exoplasim/inputs/t42/orogen_T42_surf_0176.sra, exoplasim/inputs/t42/orogen_T42_surf_0212.sra]
    gate: >
      the `lpj_run` edge is loop C and is a BACK edge: the first pass of an
      iteration runs --mode vegetated on terrain alone, before any biosphere
      exists, and the mode this project should end up in is --mode modelled
      --vegetation <run>/fpc.out, which raises without it. One artifact, one
      row, so the mode is the state of albedo_report.json rather than a second
      step. Adopting modelled requires the flux to be re-derived: the two land
      endmembers are 15-19 W/m2 apart in absorbed flux (`docs/src/pipeline/sequencing.md` A3).

  - id: surface_roughness
    reads_export: true
    script: exoplasim/scripts/build_surface_roughness.py
    loop: A
    cost: minutes
    needs: []
    writes: [exoplasim/inputs/t42/roughness_t42_report.json, exoplasim/inputs/t42/orogen_T42_surf_0173.sra]

  - id: bootstrap_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [rebuild_binaries, boundary_conditions, surface_albedo, surface_roughness]
    writes: []
    presence: by_index   # UUID-named; ask exoplasim/runs/INDEX.json, not the path

  - id: bootstrap_convergence
    script: exoplasim/scripts/assess_convergence.py
    loop: A
    cost: minutes
    needs: [bootstrap_run, state_energy]
    writes: [exoplasim/analysis/convergence/]
    presence: by_index   # per-RUN, and the run is UUID-named; it writes the status

  - id: state_energy
    script: exoplasim/scripts/close_state_energy.py
    loop: A
    cost: minutes
    needs: [bootstrap_run]
    writes: [exoplasim/analysis/energy/]

  - id: bootstrap_climatology
    script: exoplasim/scripts/build_climatology.py
    loop: A
    cost: minutes
    needs: [bootstrap_convergence]
    writes: [exoplasim/analysis/climatology/bootstrap_regular_climatology.nc, exoplasim/analysis/climatology/bootstrap_snapshot_climatology.nc, exoplasim/analysis/climatology/bootstrap_climate_series.json]
    gate: >
      every orbit in the window ran NLOWIO = 0. A segment with low_io set, or
      with no low_io key at all, is refused without --allow-low-io.

  - id: baseline_convergence
    script: exoplasim/scripts/assess_convergence.py
    loop: A
    cost: minutes
    needs: [baseline_run, state_energy]
    writes: [exoplasim/analysis/convergence/]
    presence: by_index   # as bootstrap_convergence: the artifact is named by run

  - id: baseline_climatology
    script: exoplasim/scripts/build_climatology.py
    loop: A
    cost: minutes
    needs: [baseline_convergence]
    writes: [exoplasim/analysis/climatology/baseline_regular_climatology.nc, exoplasim/analysis/climatology/baseline_snapshot_climatology.nc, exoplasim/analysis/climatology/baseline_climate_series.json]
    gate: >
      every orbit in the window ran NLOWIO = 0, and config/planet.yaml's
      baseline_climatology is repointed here once it exists, so that nothing
      downstream keeps reading the bootstrap.

  - id: bracket_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [boundary_conditions, surface_albedo, surface_roughness, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      the SECOND flux point, on the vegetated branch, which is the only branch
      the design flux is defined against. It has to span more than 5 K of global
      mean against the other point or derive_design_flux refuses it, which at
      about 202 K per unit flux means the two fluxes differ by roughly 0.025 or
      more -- a point chosen close to the first satisfies "two converged runs"
      and fails the span check. Independent of the other point, so the two can
      run concurrently

  - id: design_flux
    script: exoplasim/scripts/derive_design_flux.py
    cost: minutes
    needs: [baseline_climatology, bracket_run]
    writes: [exoplasim/analysis/design_flux.json]
    gate: >
      the flux is re-derived on every new terrain (`docs/src/pipeline/state.md`
      section 5b and `docs/src/pipeline/sequencing.md` loop C), and the
      thresholds are declared in the script before it runs, never fitted to the
      answer. The cap on extreme-cold land fraction must be DECLARED in advance
      by this re-derivation: the purged artifact inferred it at 0.0642, which
      reproduced 0.945 from an unconstrained winner of 0.8725, and a threshold
      fitted to its own answer is what TASKS.md CLIM-30 exists to undo

  - id: analyze_climatology
    script: exoplasim/scripts/analyze_climatology.py
    loop: A
    cost: minutes
    needs: [baseline_climatology]
    writes: [exoplasim/analysis/climatology/baseline_climate_report.json, exoplasim/analysis/climatology/baseline_classification.nc, "exoplasim/analysis/climatology/baseline_*.png"]

  - id: index_runs
    script: exoplasim/scripts/index_runs.py
    cost: seconds
    needs: [bootstrap_run]
    writes: [exoplasim/runs/INDEX.json]

  - id: surface_water
    script: hydrography/scripts/surface_water.py
    loop: A
    cost: minutes
    needs: [hydrography, bootstrap_climatology]
    writes: ["hydrography/data/{build}/surface_water.nc", hydrography/analysis/surface_water_report.json]

  - id: soil
    script: pedology/scripts/build_soil.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, hydrography, lpj_run]
    writes: [pedology/analysis/soil_report.json, "pedology/data/{build}/soilmap.txt"]

  - id: surface_soil_water
    script: exoplasim/scripts/build_surface_soil_water.py
    loop: A
    cost: minutes
    needs: [soil]
    writes: [exoplasim/inputs/t42/orogen_T42_surf_0229_provenance.json, exoplasim/inputs/t42/orogen_T42_surf_0229.sra]

  - id: dust
    script: aeolian/scripts/build_dust.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, surface_water]
    writes: [aeolian/analysis/dust_baseline.nc, aeolian/analysis/dust_baseline.json]

  - id: dust_optics
    script: exoplasim/scripts/dust_optics.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [analysis/dust_optics.json]

  - id: dust_aerofile
    script: exoplasim/scripts/dust_aerofile.py
    cost: seconds
    needs: [dust_optics]
    writes: [exoplasim/data/dust/vesper_dust_aerosol.dat, exoplasim/data/dust/vesper_dust_aerosol.provenance.json]

  - id: surface_dust
    script: exoplasim/scripts/build_surface_dust.py
    loop: A
    cost: minutes
    needs: [dust, dust_aerofile]
    writes: [exoplasim/inputs/t42/orogen_T42_surf_1811_provenance.json, exoplasim/inputs/t42/orogen_T42_surf_1811.sra]
    gate: only when model.dust_source is set; a no-op at ndustrad = 0

  - id: dust_source_fields
    script: aeolian/scripts/build_dust_source_fields.py
    loop: A
    cost: minutes
    needs: [dust, surface_water, soil]
    writes: [exoplasim/inputs/t42/orogen_T42_surf_1801_provenance.json, exoplasim/inputs/t42/orogen_T42_surf_1801.sra]
    gate: only when model.dust_emission is set; a no-op at ldustemit = 0

  - id: dust_forcing
    script: exoplasim/scripts/dust_forcing.py
    cost: minutes
    needs: [dust, dust_optics, surface_albedo]
    writes: [analysis/dust_forcing.json, analysis/dust_surface_forcing.nc]

  - id: sea_salt_optics
    script: aeolian/scripts/sea_salt_optics.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [analysis/sea_salt_optics.json]

  - id: sea_salt
    script: aeolian/scripts/build_sea_salt.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, sea_salt_optics]
    writes: [aeolian/analysis/sea_salt_baseline.nc, aeolian/analysis/sea_salt_baseline.json]

  - id: volcanic_sulfate
    script: aeolian/scripts/build_volcanic_sulfate.py
    loop: A
    cost: minutes
    needs: [bootstrap_climatology, sea_salt_optics, weathering_fluxes]
    writes: [aeolian/analysis/volcanic_sulfate.nc, aeolian/analysis/volcanic_sulfate.json]

  - id: vegetation_albedo
    script: analysis/vegetation_albedo.py
    cost: seconds
    needs: [stellar_spectrum]
    writes: [analysis/vegetation_albedo.json]

  - id: shortwave_band_weights
    script: exoplasim/scripts/shortwave_band_weights.py
    cost: minutes
    needs: [stellar_spectrum]
    writes: [exoplasim/analysis/shortwave_band_weights.json]

  - id: baseline_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [surface_water, surface_albedo, surface_soil_water, rebuild_binaries]
    writes: []
    presence: by_index

  - id: stellar_cycle_run
    script: exoplasim/scripts/run_stellar_cycle.py
    loop: A
    cost: hours
    needs: [baseline_run, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      requires a FINAL baseline, not merely a converged one: anything still
      outstanding that moves the mean has to land first (`docs/src/pipeline/sequencing.md` A2)

  - id: carve_verdict
    script: hydrography/scripts/carve_verdict.py
    loop: A
    cost: minutes
    needs: [baseline_climatology, hydrography, surface_water, stellar_cycle_run, dust_forcing]
    writes: [hydrography/analysis/carve_verdict.json]

  - id: endmember_bootstrap_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [design_flux, boundary_conditions, surface_roughness, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      the COLD END of section 4's intersection bracket: same design flux, same
      terrain, model.land_albedo_source lithology instead of vegetated. It needs
      its own bootstrap because its lakes, albedo compositing and soil water must
      be built from a bare-rock climatology and cannot inherit the vegetated
      ones. Seed it with --restart-from off the vegetated baseline rather than
      cold-starting. This arm is a BOUND, NOT A WORLD; nobody claims Vesper is at
      this flux without a biosphere, and its numbers should never be quoted as a
      description of the planet

  - id: endmember_baseline_run
    script: exoplasim/scripts/run_exoplasim.py
    loop: A
    cost: hours
    needs: [endmember_bootstrap_run, rebuild_binaries]
    writes: []
    presence: by_index
    gate: >
      run on the surface fields rebuilt from the bare-rock bootstrap's own
      climatology. Everything between the two runs is minutes, so the cost of
      this arm is exactly two climate runs and nothing else

  - id: carve_verdict_endmember
    script: hydrography/scripts/carve_verdict.py
    loop: A
    cost: minutes
    needs: [endmember_baseline_run, hydrography]
    writes: [hydrography/analysis/carve_verdict_endmember.json]
    gate: >
      the cold-end verdict. Its own lakes and its own climatology, from the
      bare-rock arm, never the vegetated ones

  - id: carve_list
    script: hydrography/scripts/export_carve_list.py
    loop: A
    cost: seconds
    needs: [carve_verdict, carve_verdict_endmember]
    writes: ["hydrography/data/{build}/carve_list.txt", "hydrography/data/{build}/carve_list.json"]
    gate: >
      carves the INTERSECTION, per `docs/src/pipeline/loops.md`: retain is the larger of
      the two arms', so a rim survives wherever either climate would have kept
      it, and the disagreement is the BRACKETED set by construction rather than
      by a tolerance chosen afterwards. Pass the cold arm's climatology as
      --endmember-climatology; without it this is ONE arm of the bracket and the
      sidecar's `intersection.single_climate` says so rather than letting a
      reader mistake it for two

  - id: orogen
    script: vendor/orogen
    loop: A
    cost: hours
    needs: [carve_list]
    writes: ["source/{build}/"]
    gate: >
      the carve gate: nothing outstanding may still move an artifact the verdict
      is computed from. READ TASKS.md AND DECIDE. Deliberately not computed, and
      not because a filter over `[step: <id>]` markers performed badly -- because
      it answers a different question. Whether a row still moves the verdict is a
      fact about what closing it would CHANGE, which is its prose; a marker
      records where the work is filed. A task can name an upstream step and move
      nothing, being deferred, a bound, or blocked on something after the carve.

  - id: weathering_fluxes
    script: pedology/scripts/weathering_fluxes.py
    cost: minutes
    needs: [soil, hydrography]
    writes: [pedology/analysis/weathering_fluxes.json]

  - id: thermostat_efficiency
    script: pedology/scripts/thermostat_efficiency.py
    cost: minutes
    needs: [weathering_fluxes]
    writes: [pedology/analysis/thermostat_efficiency.json]

  - id: brine_paths
    script: pedology/scripts/brine_paths.py
    cost: minutes
    needs: [hydrography, baseline_climatology]
    writes: [pedology/analysis/brine_paths.json]

  - id: surface_classes
    script: pedology/scripts/build_surface_classes.py
    cost: minutes
    needs: [soil, brine_paths, dust, surface_water]
    writes: [pedology/analysis/surface_classes.nc]

  - id: phosphorus_budget
    script: pedology/scripts/phosphorus_budget.py
    cost: minutes
    needs: [soil, dust, surface_water]
    writes: [pedology/analysis/phosphorus_budget.json]

  - id: vesper_header
    script: biosphere/scripts/build_vesper_header.py
    loop: B
    cost: minutes
    needs: [bootstrap_climatology]
    writes: [biosphere/generated/vesper_provenance.json]
    gate: >
      declared `needs: []` until 2026-08-19, which read as "compiles from
      config/planet.yaml alone". It does not: it fits the LPJ-GUESS solstice
      offset against the solar declination an ExoPlaSim climatology actually
      reports, so day 0 of the biosphere year is pinned to the first
      climatology bin. The bootstrap's is enough, because the phase is a
      property of the model calendar rather than of the climate state -- but a
      climatology has to exist, and with none named the script exits.

  - id: vesper_pfts
    script: biosphere/scripts/build_vesper_pfts.py
    loop: B
    cost: minutes
    needs: [vesper_header]
    writes: [biosphere/generated/vesper_pfts_provenance.json]

  - id: lpj_driver
    script: biosphere/scripts/build_lpj_driver.py
    loop: B
    cost: minutes
    needs: [baseline_climatology, soil, vesper_pfts]
    writes: [biosphere/generated/vesper_driver_provenance.json]

  - id: lpj_run
    script: biosphere/scripts/run_lpj_guess.py
    loop: B
    cost: hours
    needs: [lpj_driver]
    writes: [biosphere/runs/]

  - id: prospectivity
    script: minerals/scripts/build_prospectivity.py
    cost: minutes
    needs: [hydrography]
    writes: ["minerals/data/{build}/prospectivity.nc", "minerals/data/{build}/prospectivity_report.json"]

  - id: downstream_prospectivity
    script: minerals/scripts/build_downstream_prospectivity.py
    cost: minutes
    needs: [prospectivity, brine_paths, surface_classes, soil]
    writes: ["minerals/data/{build}/downstream_prospectivity.nc", "minerals/data/{build}/downstream_prospectivity_report.json"]

  - id: error_budget
    script: scripts/error_budget.py
    cost: seconds
    needs: [carve_list, baseline_climatology]
    writes: [analysis/error_budget.json]

  - id: basemap
    script: maps/build_basemap.py
    cost: minutes
    needs: [analyze_climatology, surface_water]
    writes: [maps/build/basemap_provenance.json, maps/build/basemap.npy, maps/build/land.npy, maps/build/basemap_equirectangular.png, "maps/build/region_index_*.npy"]

  - id: projections
    script: maps/render_projections.py
    cost: minutes
    needs: [basemap]
    writes: [maps/projections_provenance.json, "maps/vesper_*.png"]

  - id: world_state
    script: scripts/world_state.py
    cost: seconds
    needs: [index_runs, analyze_climatology, carve_list, hydrography]
    writes: [world_state.json]

# Run, never generate an artifact, and gate the expensive steps.
checks:
  - id: check_consistency
    script: scripts/check_consistency.py
  - id: smoke_test
    script: scripts/smoke_test.py

# Present, deliberately outside the graph: depended on by nothing.
one_offs:
  - exoplasim/scripts/predict_ocean_terms.py
  - exoplasim/scripts/score_rank_bench.py
  - exoplasim/scripts/reset_restart_accumulators.py
  - hydrography/scripts/validate_lake_solver.py
  - hydrography/scripts/lake_balance.py
  - pedology/scripts/validate_against_earth.py
  - pedology/scripts/probe_runoff_response.py
  - biosphere/scripts/score_prediction.py
  - exoplasim/scripts/compare_flux_sweep.py
  - exoplasim/scripts/compare_albedo_bracket.py
  - exoplasim/scripts/close_term_energy.py
  - exoplasim/scripts/close_ocean_energy.py
  - exoplasim/scripts/analyze_stellar_cycles.py
  - exoplasim/scripts/analyze_smoke.py
  - exoplasim/scripts/bench_pyburn_read.py
  - exoplasim/scripts/mie_dust.py
  - exoplasim/scripts/run_albedo_bracket.sh
  - exoplasim/scripts/finalize_existing_segment.py
  - exoplasim/scripts/continue_exoplasim.py
  - aeolian/scripts/dust_runoff_sensitivity.py
  - aeolian/scripts/extract_high_cadence_wind.py
  - scripts/archive_runs.py
  - scripts/archive_builds.py
  - scripts/compare_exports.py
