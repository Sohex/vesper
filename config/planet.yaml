schema_version: 1

# Which World Orogen build every component reads. source/ is namespaced by build
# because they now multiply faster than they can be swapped in place, and a
# result's provenance should depend on what it was computed from rather than on
# when it was computed.
#
#   precarve-unzoned  821aa71b  the 292.97 K baseline; evaporite one class at 0.50
#   precarve-zoned    26fc7691  same drainage, crust/fill split
#   carved-zoned      3899a0c5  iteration-1 verdict applied, crust/fill split
#
# The names are for humans. manifest.hashes.finalElevation is the identity, and
# every run manifest and analysis report records it.
source_build: carved-zoned

planet:
  radius_earth: 1.20
  # Surface gravity is canonical, not derived. This is the value World Orogen
  # was run with, and it already scaled the terrain's maximum relief as 1/g, so
  # the geography in source/ cannot be separated from it. Mass follows from it:
  # mass_earth = g/g_earth * radius_earth^2 = 1.4976. Earlier revisions declared
  # 1.50 Earth masses and derived 10.2153 m/s2, which disagreed with the
  # geography by 0.16%.
  gravity_m_s2: 10.1989
  mass_earth: 1.4976
  rotation_hours: 30.0
  obliquity_degrees: 32.0
  eccentricity: 0.02

star:
  # Provisional empirical midpoint between K2V and K3V in the
  # Pecaut--Mamajek dwarf sequence (see notes/parameter-decisions.md).
  spectral_type: K2.5V
  mass_solar: 0.80
  luminosity_solar: 0.32359365692962827
  effective_temperature_k: 4965.0

orbit:
  earth_solar_constant_w_m2: 1361.0
  # 0.96 puts the vegetated branch at about 291.4 K, mid-range of the 290-293 K
  # design target. Chosen from the six-case albedo bracket: the vegetated window
  # for that target is 0.952-0.970 S-Earth. Note the bare-rock window is
  # 0.977-0.994 and does not overlap it, so this flux is habitable *because* the
  # world is vegetated, not independently of it.
  baseline_flux_earth: 0.96
  sweep_flux_earth: [0.90, 0.95, 1.00]
  longitude_vernal_equinox_degrees: 102.7

atmosphere:
  # Partial pressures sum to exactly 1 bar. H2O remains interactive; it is not
  # included as a fixed surface partial pressure.
  pN2_bar: 0.78025
  pO2_bar: 0.21000
  pAr_bar: 0.00930
  pCO2_bar: 0.00045
  ozone: true

radiation:
  # Separate visible/near-IR surface albedos, which matter under a red spectrum:
  # snow albedo splits 0.959/0.614 at maximum and 0.496/0.289 at minimum.
  two_band_albedo: true
  # WRONG, AND EVERY COMPLETED RUN INHERITS IT. See notes/stellar-spectrum-audit.md.
  #
  # This was chosen believing ExoPlaSim ships a measured K2 *dwarf* spectrum
  # matching this star's K2.5V. It does not. `k2.dat` is the star K2-18, an M2.5V
  # at about 3450 K, not the spectral type K2; ExoPlaSim ships no K dwarf spectrum
  # at all. All four of its spectra are M dwarfs from a tidally-locked-planet
  # study. The model's own log confirms the reading: it puts 11.6% of shortwave
  # below 0.75 um where the declared 4965 K star would put 41%.
  #
  # The reasoning below still holds, which is why this matters. nstarfile does
  # take precedence over nstartemp, and the spectrum does set the weighting for
  # every snow, ice and glacier albedo. Those are 0.11 to 0.20 too dark in every
  # run so far, worth 0.4 to 0.7 K on the current warm baseline and much more on
  # the cold branch, which is exactly where the albedo-feedback experiment lives.
  #
  # The replacement now exists: `k25v`, in exoplasim/inputs/stellarspectra/, built
  # by exoplasim/scripts/build_stellar_spectrum.py from the BT-Settl grid,
  # interpolated to 4965 K between the 4900 and 5000 K models at log g 4.5. It
  # puts 0.382 of shortwave below 0.75 um against this file's 0.116.
  #
  # Still set to `k2` so runs in flight stay comparable. Change to `k25v` when
  # ready to re-baseline; nothing else needs to move, since run_exoplasim.py
  # searches inputs/stellarspectra/ before the ExoPlaSim package. Expect snow and
  # ice to brighten by 0.10 to 0.17 and the world to cool.
  stellar_spectrum: k2

surface:
  mixed_layer_depth_m: 50.0
  sea_ice: true
  # Persistent snow converts to glacier, and glacier thickness is added to the
  # surface geopotential. That orographic term is the point: it is the feedback
  # that makes an ice sheet grow into its own cold, and without it a cold branch
  # gets snow albedo but no elevation response. On a world testing albedo-driven
  # bistability, leaving it off would answer a different question.
  #
  # initial_height_m -1 places no initial ice, so glaciers only appear where snow
  # genuinely persists year-round; the module cannot manufacture them. It does
  # not model ice flow, so continental ice-sheet extent is underestimated.
  glaciers:
    enabled: true
    min_snow_depth_m: 2.0
    initial_height_m: -1.0

model:
  # T42 for the iteration-1 baseline. The bracket ran at T21, which was right
  # for a several-kelvin question. This pass feeds the carve verdict and the
  # first LPJ-GUESS input, both of which will change and be redone, so the
  # expensive grid is not warranted yet. T85 comes once terrain and biosphere
  # have settled: it resolves the median basin catchment across 3.0 cells
  # against T42's 0.7, and recovers the full 5,769 m mesh relief against 5,101.
  resolution: T42
  latitudes: 64
  longitudes: 128
  layers: 10
  precision_bytes: 8
  # 16 physical cores on the Ryzen 9 7950X3D. Not 32: those are SMT threads and
  # MPI ranks on sibling threads contend for the same FPU and cache, which does
  # not help a compute-bound spectral model. NLAT must divide by ncpus, so at
  # T42 the valid choices are 1, 2, 4, 8, 16, 32, 64; 16 leaves 4 latitudes per
  # rank. Spectral transforms need global transposes, so scaling is sublinear
  # and may turn over before 16 -- measured against the 8-core baseline below.
  # 64 latitudes at T42, so 16 ranks leaves 4 per rank, one per physical core.
  ncpus: 16
  timestep_minutes: 45.0
  physics_filter: "gp|exp|sp"
  output_type: .nc
  # Only topography (0129) and the land mask (0172) are supplied. ExoPlaSim's
  # configure() clears every other surface .sra when a landmap is given, so
  # roughness, albedo, field capacity, forest fraction and the glacier mask all
  # take uniform namelist defaults. That is deliberate: Earth's surface maps are
  # tied to Earth's continents and would be meaningless on this geography.
  # Declared here so the fallback is a decision, not an accident.
  uniform_land_surface: true
  # Background land albedo. Bare-rock albedo from lithology averages 0.315 over
  # land against ExoPlaSim's uniform 0.22, and ranges 0.10 for basalt to 0.50 for
  # evaporite, so uniform is a planetary-albedo error of about 0.04. This is
  # substrate albedo: the first pass is a bare-rock planet and will run cold
  # relative to a vegetated one. Revisit once a vegetation model has run.
  # The world is taken to be vegetated: 0.15 on anything that can carry a canopy,
  # with evaporite left at its bare 0.50 because nothing roots in a salt pan.
  # Land-mean albedo 0.223 against bare rock's 0.314. The bracket showed this is
  # not a detail: the two endmembers differ by 3.7-7.1 K and reach the design
  # target at non-overlapping fluxes, so the biosphere and the orbit are one
  # choice.
  land_albedo_source: vegetated
  # Rock-class albedo overrides, applied on top of the export's table.
  #
  # Evaporite is the largest single lever in this planet's energy balance and its
  # exported value is not a measurement. World Orogen assigns 0.50 to the class
  # "Evaporite / playa fill" and applies it to EVERY cell of a preserved basin,
  # not just the terminal floor. 0.50 is clean halite crust; a real basin is
  # zoned, with salt only where it repeatedly floods and dries, surrounded by
  # playa mud, alluvial fan and dune sand. Typical playa is 0.25-0.35, and Salar
  # de Uyuni at 0.5-0.7 is an unusually pure end member.
  #
  # Sensitivity on the pre-carve terrain, where evaporite is 20.8% of land and
  # 9.0% of the planet: 2.76 W/m2 per 0.10 of albedo, or 2.59 K. The range 0.50
  # to 0.30 spans 5.1 K against a design band only 3 K wide, so this constant is
  # worth more than the flux choice it is being used to justify.
  #
  # 0.40 is taken as a mixed-playa value: above typical playa because these
  # basins do concentrate salt at their floors, below clean crust because most of
  # a basin's area is not crust. It is a declared assumption, not a measurement,
  # and every result computed with it inherits that.
  #
  # Orogen has proposed zoning the class by depth below spill, which would give a
  # measured area split between crust and clastics instead of one number. When
  # that lands this override should be removed rather than retuned.
  # Rock classes that cannot carry vegetation, so they keep their own albedo in
  # `vegetated` mode rather than being handed the canopy value. Nothing roots in
  # salt crust and nothing much roots in playa mud, and between them they are
  # about 21% of this planet's land, so treating either as vegetable would be a
  # first-order error in the energy balance.
  #
  # This started as a single hardcoded reference to evaporite and became wrong
  # the moment Orogen split that class into crust and clastics. Driven from
  # config now so the next addition is a config change rather than a silent one.
  barren_rock_classes: [evaporite, playa_clastic]
  #
  # INHERITED UNCERTAINTY, recorded rather than overridden. After Orogen split
  # the evaporite domain, the dominant albedo lever is `playa_clastic` at 0.30,
  # not the salt crust: playa is 18.8% of land against the crust's 2.1%, so per
  # 0.10 of albedo error it is worth 2.48 W/m2 (2.34 K) pre-carve against the
  # crust's 0.28. Nine to one.
  #
  # And playa_clastic is itself a mixture. Its name is "Playa mud / alluvial fan
  # fill"; light clay playa runs 0.30-0.35, desert-varnished fan gravel and
  # pavement run 0.15-0.25. A plausible mix spans 0.25-0.33, worth 1.99 W/m2 or
  # 1.87 K, which is 40% of what the whole crust/fill split was worth.
  #
  # Not overridden. 0.30 is a defensible central value and the range above is
  # what it is worth; tuning it to make a temperature land would be the same
  # error one level down. Orogen has proposed separating fan from mud by the same
  # depth zoning that separated crust from fill, which would resolve it without a
  # new mechanism.

  geography_land_threshold: 0.5
  seasonal_samples_per_orbit: 32
  regular_output_bins_per_orbit: 12

stellar_cycle:
  # Sinusoidal bolometric variation about the baseline flux, applied at every
  # radiation timestep by patches/exoplasim-3.4.2-star-cycle.patch.
  #
  # 0.91 to 1.01 is 10.4% peak-to-peak, essentially the same amplitude as the
  # earlier 0.85-0.95 experiment's 11.1%, and still implies unusually extensive
  # and variable spot coverage for a quiet 6-8 Gyr K dwarf. Treat it as an
  # intentionally active star rather than a typical one.
  #
  # Static endpoints on the vegetated branch are about 282.2 and 299.7 K, a
  # 17.5 K span. The 50 m slab damped the earlier experiment to 0.239 of its
  # static span, which predicts roughly 4.2 K peak-to-peak here, about 289.3 to
  # 293.5 K. If that holds the world stays inside the habitable band across the
  # whole cycle, which is the point of centring it at 0.96.
  cases:
    active:
      minimum_flux_earth: 0.91
      maximum_flux_earth: 1.01
  period_earth_years: 8.0
