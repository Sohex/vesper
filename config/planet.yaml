schema_version: 1

# Canonical parameters for Vesper. Every component reads this file and nothing
# copies a value out of it into prose or into a script.
#
# Every block carries a STATUS. It is about what STANDS BEHIND the value, not
# about how old it is. There are four atomic statuses:
#
#   DETERMINED   measured, derived by an artifact that exists, or decided in a
#                way that is now load-bearing. Downstream work may rely on it.
#   DECLARED     this project cannot compute it, or has not reproducibly. A
#                stated position, written down so it is not read back as a
#                result.
#   PROVISIONAL  a placeholder or an interim value that WILL move. Relying on it
#                is relying on something already scheduled to change.
#   DERIVED      computed by the named script from other values in this file.
#                Regenerate it rather than editing it.
#
# Compound labels build on those where a block is not one thing: MIXED and
# PARTLY DETERMINED mark blocks whose sub-keys carry different atomic
# statuses, TRANSITIVE marks operational values that are facts about the run
# rather than the world, and DECLARED ABSENT is DECLARED applied to a
# deliberate null.
#
# The distinction is not cosmetic, and it decays in one direction only:
# `stellar_cycle` carried an amplitude and a centre before there was a baseline
# flux to centre on, and both were later read back as though they had been
# chosen. So a block loses its status the moment the thing behind it does. When
# an artifact is deleted or superseded, the label above every value that rested
# on it is part of what is now worthless, and it is demoted in the same pass.
#
# Why each value is what it is: docs/src/reference/config-rationale.md, keyed by setting.
# Current measured values: world_state.json, which is generated.

# DETERMINED. lib/orogen.py is the registry: it holds the hash, the note, and
# what superseded what.
source_build: precarve-craton

# DECLARED ABSENT. Null means no baseline is named, and `climatology_path()`
# raises rather than falling back. That is the designed state and not a gap: a
# stale default returns a plausible number from the wrong world, which is worse
# than an error. There is no climatology on this build -- every run was archived
# to identity and deleted -- so nothing downstream may read one until a
# commissioning produces one. Repoint this at the REGULAR climatology of the
# baseline run when it exists, not at the bootstrap's.
baseline_climatology: null

# DETERMINED. Radius and gravity are Orogen's and canonical; mass follows from
# gravity as mass_earth = (g/g_earth) * radius_earth^2, and derive() raises if
# these two disagree.
planet:
  radius_earth: 1.20
  gravity_m_s2: 12.81
  mass_earth: 1.881009
  rotation_hours: 30.0
  obliquity_degrees: 32.0
  eccentricity: 0.02

# DETERMINED. Spectral type, activity and the surface ultraviolet that follows
# from them. The star is chromospherically active, of the kind epsilon Eridani
# represents, which is what the starspot cycle below is built on.
star:
  spectral_type: K2.5V
  activity: active
  # Measured, not assumed: Segura et al. (2003) model a K2V host with an
  # Earth-like O2 atmosphere. This world is better protected than Earth.
  surface_uv_relative_to_earth: 0.4
  mass_solar: 0.80
  luminosity_solar: 0.32359365692962827
  effective_temperature_k: 4965.0
  # DECLARED. Solar, which is an ordinary choice for a K2.5V star and is not
  # what makes this a decision. It is here because nothing else determines it
  # and because it has more leverage on the star's colour than anything else
  # that is not the temperature: half a dex moves the shortwave band-1 share by
  # about 0.011, five times what the resampler bias was worth and twenty times
  # what rounding the surface gravity to the BT-Settl grid costs. Surface
  # gravity is deliberately NOT here -- it follows from the mass, luminosity
  # and temperature above, and build_stellar_spectrum.py derives it and refuses
  # a grid point that disagrees. notes/audits/stellar-spectrum-oracle.md.
  metallicity: 0.0

# MIXED, and the mixture is the point. `earth_solar_constant_w_m2` is a physical
# constant and `sweep_flux_earth` is a sweep specification; both are DETERMINED.
#
# `baseline_flux_earth` is PROVISIONAL, and carried DETERMINED until 2026-08-19.
# What stands behind it is the habitability-by-latitude derivation of
# docs/src/pipeline/state.md section 5b, and notes/audits/inherited-earth-constants.md finding 5 establishes that
# that derivation has no script, no analysis product, no row in
# config/pipeline.yaml and no recorded threshold, and does not name the runs it
# was projected across. Those runs are now deleted, so it is not reproducible
# even in principle from this tree. TASKS.md CLIM-24. Section 6 requires the
# flux to be RE-DERIVED on every new terrain in any case, so it is scheduled to
# move rather than merely unsupported.
#
# It keeps its value rather than being cleared, because it is an INPUT and not a
# result: it fixes the semi-major axis, and that orbit is compiled into
# LPJ-GUESS. What the flux and the biosphere share is a FINDING rather than an
# artifact, and findings about mechanisms survive a regeneration -- bare rock and
# a vegetated surface reach a given design mean at non-overlapping fluxes, so
# this flux is habitable BECAUSE the world is vegetated. Move the flux by
# luminosity once the calendar is locked, not by the orbit;
# docs/src/pipeline/sequencing.md loop C says why.
orbit:
  earth_solar_constant_w_m2: 1361.0
  baseline_flux_earth: 0.945
  sweep_flux_earth: [0.90, 0.95, 1.00]
  # DECLARED, 2026-08-19, and until then it was ExoPlaSim's Earth default
  # wearing this block's DETERMINED. Nothing about this world fixes the phase
  # of perihelion against the solstices, and at e = 0.02 that phase modulates
  # the seasonal flux by 8.3% peak to peak, more than the whole stellar cycle.
  # Kept at 102.7 deliberately: it is compiled into LPJ-GUESS through the
  # solstice offset in vesper.h, so moving it costs a rebuild and a driver.
  # docs/src/reference/config-rationale.md says what an alternative would be worth.
  longitude_vernal_equinox_degrees: 102.7

# DETERMINED for the composition, DECLARED for the CO2, and the block used to
# claim DETERMINED for both while its own next sentence withdrew it.
#
# The partial pressures sum to exactly 1 bar by construction and H2O stays
# interactive. pCO2 is prescribed: nothing here solves the carbonate-silicate
# balance that would set it, so read 450 ppm as an assumption rather than a
# result, and `docs/src/pipeline/loops.md` says what the assumption costs. The
# outgassing plausibility check that backed it was computed by
# pedology/scripts/weathering_fluxes.py on a climatology that no longer exists,
# so the check is currently unbacked too; docs/src/reference/config-rationale.md keeps the
# argument and says to re-run it.
#
# What this block CAN say is bounded by what the model reads. PlaSim's longwave
# is Sasamori (1968) over water vapour, CO2 and ozone, and the shortwave adds
# Rayleigh and the same three; radmod.f90 has no CH4 and no N2O term, so there
# is nothing here to set them to. Their absence is a property of the radiation
# scheme rather than a composition choice, and the direction is one-signed: a
# world with them is warmer than this one at the same CO2, by whatever they
# would have been worth. Adding either means adding a band, not a key.
atmosphere:
  pN2_bar: 0.78025
  pO2_bar: 0.21000
  pAr_bar: 0.00930
  pCO2_bar: 0.00045
  # MEASURED, 2026-08-20, CLIM-43. Not chosen: these are photochemical products
  # of biogenic surface fluxes, so their steady state is set by this star's
  # ultraviolet. Rugheimer et al. (2013) runs that calculation over the FGK main
  # sequence at 250 K spacing with epsilon Eridani as its 5000 K grid star --
  # this host to within 35 K, and the star the activity above is modelled on --
  # and that grid point reads 1.600 ppmv of CH4 and 0.300 ppmv of N2O. Both are
  # the Sun case's values: NEITHER GAS IS ENHANCED AT THIS STAR. The enhancement
  # is real and turns on below 4750 K, which is why Segura's 4620 K K2V reads
  # several ppmv and this world does not.
  #
  # They are an ASSUMPTION in the same sense pCO2_bar is: the biogenic fluxes
  # behind them are modern Earth's, held fixed, and this world has no biosphere
  # model that could produce its own. exoplasim/notes/trace-gas-absorbers.md is
  # the pricing and analysis/trace_gas_forcing.json the derivation.
  #
  # These are trace enough that the partial pressures above still sum to 1 bar
  # to six figures; they are stated in bar for consistency with pCO2_bar, and
  # run_exoplasim.py converts them to the ppmv radmod_nl wants.
  #
  # COMMENTED OUT UNTIL CLIM-42's MAGNITUDE MISS IS CLOSED. The longwave band
  # is implemented, inert at zero and passing its reduction, sign and
  # saturation tests, but it returns 0.0175 W/m2 against the 1.56 to 1.98 the
  # pricing note says these gases are worth -- a Lorentz-only band model
  # understating absorptance in the thin paths aloft where the forcing is made.
  # Declaring these values while the term underdelivers by ninety would make
  # the config say the world carries a greenhouse effect the model does not
  # apply. exoplasim/notes/trace-gas-band.md section 4d; the candidate fix is
  # Cess (1973), on disk and unread.
  # pCH4_bar: 0.0000016
  # pN2O_bar: 0.0000003
  ozone: true

# DETERMINED. The spectrum is a measured K dwarf interpolated to this star's
# effective temperature, NOT ExoPlaSim's k2.dat, which is the star K2-18 at
# about 3450 K and made snow and ice 0.10-0.17 too dark in every run before it.
radiation:
  two_band_albedo: true
  stellar_spectrum: k25v

# DECLARED, 2026-08-18. Earth's value, and the point of the block is that it is
# now VISIBLE rather than that it has moved. Salinity reaches the model through
# one number, the freezing point of sea water, which `icemod.f90` hardcodes as
# `TFREEZE = 271.25` with the comment "at S=34.7". So Earth's ocean was being
# assumed by every run on this world without any file saying so, which is the
# DUST-6 pattern.
#
# It is DECLARED and not DETERMINED because this project cannot compute it. A
# real salinity is the steady state of riverine delivery against hydrothermal
# uptake, evaporite burial and reverse weathering, integrated over an ocean age
# and an outgassing history that nothing here supplies.
#
# The DIRECTION is knowable without the budget, and it is the interesting part.
# Most of this world's land is endorheic, so the solutes that on Earth reach the
# sea accumulate on closed-basin floors instead -- the exorheic share of the
# planet's surface is under half Earth's per unit ocean area. Less salt
# delivered means a FRESHER ocean, and fresher water freezes WARMER, so sea ice
# forms more readily than these runs show. That lands on the ice-albedo feedback
# the stellar-cycle damping turns on, which is why it is worth declaring rather
# than shrugging at.
#
# What it is worth: the freezing point runs 272.07 K at S = 20 and 270.94 K at
# S = 40, so the plausible span is about 1.1 K on one threshold. Carried in
# analysis/error_budget.json rather than guessed at here. TASKS.md CLIM-17.
ocean:
  # CLIM-16. Ocean horizontal heat diffusion, `nhdiff` and `hdiffk` in
  # oceanmod_nl. OFF here: the error budget carries no-q-flux as a STRUCTURAL
  # term and this is the cheapest bound on it, so the keys exist to be
  # BRACKETED in an A/B, not tuned into the baseline. Physics is not a knob;
  # a constant diffusivity is a bound on the missing transport rather than the
  # transport. `notes/audits/absent-and-inherited-physics.md` finding 1 and
  # the prediction in `exoplasim/notes/forcing-bundle-predictions.md`.
  horizontal_diffusion: false
  horizontal_diffusivity_m2_s: 1000.0
  salinity_psu: 34.7

# PARTLY DETERMINED. Sea ice and the glacier settings are decided, and the
# argument for the glacier block is in docs/src/reference/config-rationale.md.
#
# `mixed_layer_depth_m` is NOT, and is DECLARED: 50 m is ExoPlaSim's default
# arriving unnamed, it sets the seasonal amplitude, and this world's year is
# half Earth's, so it damps the simulation's seasonality about twice as hard as
# Earth's ocean does. scripts/error_budget.py carries it as a structural item
# awaiting one perturbation run.
surface:
  mixed_layer_depth_m: 50.0
  sea_ice: true
  glaciers:
    enabled: true
    min_snow_depth_m: 2.0
    initial_height_m: -1.0

# DETERMINED for the current configuration, and TRANSITIVE rather than a fact
# about the world: resolution, layers, ranks and timestep are operational
# choices that change with what is being run. Together they select which
# compiled binary runs, so changing any of them needs a rebuild. The ozone
# scale, the band weights and the albedo values further down are determined
# outright and each says so.
model:
  resolution: T42
  latitudes: 64
  longitudes: 128
  layers: 10
  precision_bytes: 8
  # Passed to compile.sh's -O hook and appended to MOST_F90_OPTS, so the flag is
  # DECLARED here rather than edited into the generated most_compiler_mpi, which
  # configure.sh would overwrite. znver4 rather than native: the two produce a
  # byte-identical executable on this host, and the explicit name records what
  # was targeted instead of what the build machine happened to be. Worth 2 to 3%
  # and it changes the integration; binary_manifest.json records the flag line,
  # so a binary built before it is distinguishable from one built after.
  # notes/audits/aocl-and-model-build-flags.md has the measurement.
  optimization_flag: "-march=znver4"
  ncpus: 16
  timestep_minutes: 45.0
  physics_filter: "gp|exp|sp"
  output_type: .nc
  # Declares that ExoPlaSim's configure() clears every surface field when handed
  # a landmap, so anything not supplied here falls back to a namelist default.
  uniform_land_surface: true
  # PlaSim's 28-term energy decomposition, codes 360-387 and 460-487. OFF as of
  # 2026-08-19, having answered what it was turned on for: no single term carries
  # the residual, the column decomposition closes to 0.02 W/m2, and the source is
  # the adiabatic spectral step. That is CLIM-1, and it is DONE at this
  # resolution. The surface half that continues as CLIM-11 reads the ocean and
  # ice output streams instead, which is a different instrument entirely and is
  # not affected by this being off.
  #
  # Turning them off is worth doing rather than merely harmless: the two sets are
  # about seven tenths of an orbit's output bytes, the per-level half being much
  # the larger, and postprocessing cost scales with what is written.
  #
  # TURN BOTH BACK ON for the first low-I/O-off block of any T85 run, before any
  # T42 number is carried into loop D. The term CLIM-1 measured is resolution-
  # and timestep-dependent by nature, so it has to be re-measured there rather
  # than carried; `close_term_energy.py` is what re-measures it. archive/tasks.md
  # CLIM-1 states the condition and docs/src/reference/config-rationale.md keeps the argument.
  energy_diagnostics: false
  energy_diagnostics_3d: false
  # PHYS-11, DERIVED 2026-08-20 and no longer 1.0. Multiplies the two
  # ABSORPTION-like cloud keys, `tswr3` and the `acl2` triplet, in radmod_nl.
  # Lacis and Hansen's absorptances are fractions of SOLAR flux, so every one of
  # them has to be re-weighted for this host; these are the ones that never
  # were. `cloud_band_weight.py` derives it the way the gas weights were
  # derived: from a quantity carrying no spectrum, liquid water's k(lambda) out
  # of Hale and Querry (1973) Table I, through Mie to a co-albedo, flux-weighted
  # over range 2 against a 5772 K Sun. 1.184 to 1.205 across droplet effective
  # radii 5 to 15 um and across both the weak-absorption and thick-layer
  # scalings, so the answer barely depends on either; 1.192 is the median.
  # Worth about +2.0 K on the arms' own measured slope, which is why the flux
  # re-derivation must follow it and not precede it.
  cloud_absorption_scale: 1.192
  ozone_scale: 0.794
  ozone_uv_weight: 0.335
  ozone_visible_weight: 0.914
  # The Lacis and Hansen shortwave gas absorptances are fractions of SOLAR flux,
  # so every one of them has to be re-weighted for a K2.5V host. These two are
  # the water vapour and CO2 halves, beside the ozone weights above.
  #
  # h2o_sw_weight scales an absorptance the scheme already has, so 1.0 is the
  # solar value. co2_sw_weight scales one it does NOT have, so 0.0 is the term
  # being absent and 1.0 would be the solar-weighted term; the defaults in
  # radmod.f90 are 1.0 and 0.0 respectively for exactly that reason.
  #
  # Both are derived by exoplasim/scripts/shortwave_band_weights.py and both are
  # quoted for the k25v spectrum: they are about a tenth larger than the values
  # for the 4965 K blackbody solarini builds when NSTARFILE is 0, so they belong
  # with stellar_spectrum: k25v and not without it. They have the SAME SIGN and
  # compound. Arguments in exoplasim/notes/shortwave-water-vapour.md and
  # exoplasim/notes/shortwave-co2.md.
  h2o_sw_weight: 1.346
  # A LEVEL correction to the same water vapour term, and a SEPARATE decision
  # from the weight above. `h2o_sw_weight` is a star-over-Sun ratio, so an error
  # in the absolute level of Lacis and Hansen Eq. 21 divides straight out of it
  # and is not corrected by anything. Correlated-k against Eq. 21 at the same
  # absorber amount runs 1.10 to 1.15 across the range and 1.127 at this
  # planet's operating path, the cause being that Yamamoto's bands were measured
  # at a Curtis-Godson effective pressure while Eq. 21 is refitted as though
  # they held at standard pressure.
  #
  # One-signed and a LOWER BOUND: the correlated-k side lacks the MT_CKD
  # continuum too, so the real deficit is larger than 12.7%. Carried as a key
  # rather than as a line in the error budget, per TASKS.md PHYS-9;
  # `exoplasim/notes/corrk-cross-check.md` is the measurement. radmod.f90's
  # default is 1.0, which is Eq. 21 unmodified.
  h2o_sw_level: 1.127
  co2_sw_weight: 1.510
  roughness_source: lithology
  # BOOTSTRAP: uniform. Soil water capacity comes from the pedology soil map as
  # code 229, and that soil has to be weathered under a climatology. There is no
  # climatology and no soil map on this build, so the field cannot exist and
  # run_exoplasim refuses to start without it.
  #
  # It goes back to `pedology` before the baseline run, and it has to be
  # `pedology` before the run whose climatology the verdict uses rather than
  # merely before the verdict: the land-mean capacity is well under ExoPlaSim's
  # uniform 0.5 m bucket, which changes evaporation, which changes P - E, which
  # is the numerator of the carve criterion. The flip moves config_sha256 and
  # cannot happen mid-run. `docs/src/pipeline/sequencing.md` loop A has the order.
  soil_water_source: pedology
  land_albedo_source: vegetated
  # DERIVED 2026-08-19 by analysis/vegetation_albedo.py, which reproduces
  # notes/audits/inherited-earth-constants.md finding 1. The Earth-Sun canopy
  # endmember 0.15 re-weighted to this star on 553 ECOSTRESS leaf spectra by
  # the same method every rock class went through: a leaf is dark in the
  # visible and bright in the near infrared, so this star raises the value
  # where it lowers a mineral's. The leaf ratio upper-bounds the canopy
  # correction, so the bracket runs from the uncorrected endmember to the
  # tails-carried ratio. The band pair is the same integrals split at 0.75 um,
  # anchored so their flux-weighted combination is the broadband value; codes
  # 175/176 carry it over vegetated ground, where one identical field used to
  # assert that a canopy reflects equally either side of the split.
  vegetation_albedo: 0.165
  vegetation_albedo_bracket: [0.150, 0.171]
  vegetation_albedo_bands: [0.075, 0.225]
  # Playa clastics are about a quarter of this terrain's land and the largest
  # lever on its energy balance. The export's 0.19 comes from Post et al.'s
  # all-soils field mean, which is the right kind of measurement on the wrong
  # population; 0.23 is that field level corrected by how much brighter saline
  # desert soils are than the soil population in ECOSTRESS, measured in one
  # library so the laboratory-over-field offset cancels, and re-weighted to this
  # star. Derivation in analysis/playa_albedo.py, argument in
  # notes/audits/orogen-lithology.md. `replaces` refuses to fire if the class is
  # redefined, which is what retired the previous override.
  lithology_albedo_overrides:
    playa_clastic:
      albedo: 0.23
      replaces: 0.19
  # Classes that cannot carry vegetation, so they keep their own albedo in
  # `vegetated` mode. Nothing roots in salt crust or playa mud, and between them
  # they are about a quarter of this planet's land.
  barren_rock_classes: [evaporite, playa_clastic]
  geography_land_threshold: 0.5
  seasonal_samples_per_orbit: 32
  regular_output_bins_per_orbit: 12

# PROVISIONAL. Amplitudes and periods are chosen rather than derived; the
# damping factors quoted in the notes are analytic and Planck-only, and
# measuring them is what the first cycle run is for. The two components do
# different jobs and the ratio is deliberately non-commensurate.
stellar_cycle:
  components:
    medium:
      period_earth_years: 11.0        # 22 local years, ~6.4 per lifetime
      amplitude_flux_peak_to_peak: 0.025
      note: >
        The lived rhythm. Damped about 0.83, so roughly 3.1 K peak-to-peak,
        some thirty times Earth's solar-cycle signal and the dominant climatic
        fact of any individual life. Fast enough to be planned around, too fast
        for ice to follow.
    long:
      period_earth_years: 57.0        # 114 local years, ~1.2 per lifetime
      amplitude_flux_peak_to_peak: 0.035
      note: >
        The geomorphic driver. Essentially undamped at 0.99, roughly 5.2 K
        peak-to-peak, slow enough that glaciers equilibrate rather than merely
        breathing. Each grand minimum is a distinct historical era.
  total_amplitude_flux_peak_to_peak: 0.060
  alignment_recurrence_earth_years: 314
