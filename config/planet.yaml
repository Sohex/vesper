schema_version: 1

planet:
  radius_earth: 1.20
  # Surface gravity is canonical, not derived. This is the value World Orogen
  # was run with, and it already scaled the terrain's maximum relief as 1/g, so
  # the geography in source/ cannot be separated from it. Mass follows from it:
  # mass_earth = g/g_earth * radius_earth^2 = 1.4976. Earlier revisions declared
  # 1.50 Earth masses and derived 10.2153 m/s2, which disagreed with the
  # geography by 0.16%.
  gravity_m_s2: 10.1989
  mass_earth: 1.4976
  rotation_hours: 30.0
  obliquity_degrees: 32.0
  eccentricity: 0.02

star:
  # Provisional empirical midpoint between K2V and K3V in the
  # Pecaut--Mamajek dwarf sequence (see notes/parameter-decisions.md).
  spectral_type: K2.5V
  mass_solar: 0.80
  luminosity_solar: 0.32359365692962827
  effective_temperature_k: 4965.0

orbit:
  earth_solar_constant_w_m2: 1361.0
  baseline_flux_earth: 0.90
  sweep_flux_earth: [0.85, 0.90, 0.95]
  longitude_vernal_equinox_degrees: 102.7

atmosphere:
  # Partial pressures sum to exactly 1 bar. H2O remains interactive; it is not
  # included as a fixed surface partial pressure.
  pN2_bar: 0.78025
  pO2_bar: 0.21000
  pAr_bar: 0.00930
  pCO2_bar: 0.00045
  ozone: true

radiation:
  # Use ExoPlaSim's blackbody stellar-temperature correction and retain its
  # separate visible/near-IR surface albedos for the redder K-dwarf spectrum.
  two_band_albedo: true

surface:
  mixed_layer_depth_m: 50.0
  sea_ice: true

model:
  resolution: T42
  latitudes: 64
  longitudes: 128
  layers: 10
  precision_bytes: 8
  # 16 physical cores on the Ryzen 9 7950X3D. Not 32: those are SMT threads and
  # MPI ranks on sibling threads contend for the same FPU and cache, which does
  # not help a compute-bound spectral model. NLAT must divide by ncpus, so at
  # T42 the valid choices are 1, 2, 4, 8, 16, 32, 64; 16 leaves 4 latitudes per
  # rank. Spectral transforms need global transposes, so scaling is sublinear
  # and may turn over before 16 -- measured against the 8-core baseline below.
  ncpus: 16
  timestep_minutes: 45.0
  physics_filter: "gp|exp|sp"
  output_type: .nc
  # Only topography (0129) and the land mask (0172) are supplied. ExoPlaSim's
  # configure() clears every other surface .sra when a landmap is given, so
  # roughness, albedo, field capacity, forest fraction and the glacier mask all
  # take uniform namelist defaults. That is deliberate: Earth's surface maps are
  # tied to Earth's continents and would be meaningless on this geography.
  # Declared here so the fallback is a decision, not an accident.
  uniform_land_surface: true
  # Background land albedo. Bare-rock albedo from lithology averages 0.315 over
  # land against ExoPlaSim's uniform 0.22, and ranges 0.10 for basalt to 0.50 for
  # evaporite, so uniform is a planetary-albedo error of about 0.04. This is
  # substrate albedo: the first pass is a bare-rock planet and will run cold
  # relative to a vegetated one. Revisit once a vegetation model has run.
  land_albedo_source: lithology
  geography_land_threshold: 0.5
  seasonal_samples_per_orbit: 32
  regular_output_bins_per_orbit: 12
