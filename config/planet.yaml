schema_version: 1

# Canonical parameters for Vesper. Every component reads this file and nothing
# copies a value out of it into prose or into a script.
#
# Each block is marked DETERMINED or PROVISIONAL. A determined value has been
# decided or measured and downstream work may rely on it; a provisional one is a
# placeholder or an interim result and it will move. The distinction is not
# cosmetic: `stellar_cycle` carried an amplitude and a centre before there was a
# baseline flux to centre on, and both were later read back as though they had
# been chosen.
#
# Why each value is what it is: notes/config-rationale.md, keyed by setting.
# Current measured values: world_state.json, which is generated.

# DETERMINED. lib/orogen.py is the registry: it holds the hash, the note, and
# what superseded what.
source_build: precarve-craton

# The baseline: the run whose climatology the carve verdict uses, made with
# lakes, the reconciled playa albedo and soil water all in place. Quasi-
# equilibrated at 289.72 K, missing only the TOA criterion and by 0.0014 W/m2,
# inside a structural offset of its own size. The bootstrap it replaces is still
# on disk and is what the surface fields were built from. Null means no baseline
# is named and every consumer raises rather than falling back.
baseline_climatology: exoplasim/analysis/climatology/baseline_regular_climatology.nc

# DETERMINED. Radius and gravity are Orogen's and canonical; mass follows from
# gravity as mass_earth = (g/g_earth) * radius_earth^2, and derive() raises if
# these two disagree.
planet:
  radius_earth: 1.20
  gravity_m_s2: 12.81
  mass_earth: 1.881009
  rotation_hours: 30.0
  obliquity_degrees: 32.0
  eccentricity: 0.02

# DETERMINED. Spectral type, activity and the surface ultraviolet that follows
# from them. The star is chromospherically active, of the kind epsilon Eridani
# represents, which is what the starspot cycle below is built on.
star:
  spectral_type: K2.5V
  activity: active
  # Measured, not assumed: Segura et al. (2003) model a K2V host with an
  # Earth-like O2 atmosphere. This world is better protected than Earth.
  surface_uv_relative_to_earth: 0.4
  mass_solar: 0.80
  luminosity_solar: 0.32359365692962827
  effective_temperature_k: 4965.0
  # DECIDED. Solar, which is an ordinary choice for a K2.5V star and is not
  # what makes this a decision. It is here because nothing else determines it
  # and because it has more leverage on the star's colour than anything else
  # that is not the temperature: half a dex moves the shortwave band-1 share by
  # about 0.011, five times what the resampler bias was worth and twenty times
  # what rounding the surface gravity to the BT-Settl grid costs. Surface
  # gravity is deliberately NOT here -- it follows from the mass, luminosity
  # and temperature above, and build_stellar_spectrum.py derives it and refuses
  # a grid point that disagrees. notes/audits/stellar-spectrum-oracle.md.
  metallicity: 0.0

# DETERMINED, 2026-08-16, from the habitability-by-latitude derivation rather
# than from a temperature target. The flux and the biosphere are one choice:
# bare rock and a vegetated surface reach a given design mean at non-overlapping
# fluxes. Move the flux by luminosity once the calendar is locked, not by the
# orbit; WORKFLOW.md section 6C says why.
orbit:
  earth_solar_constant_w_m2: 1361.0
  baseline_flux_earth: 0.945
  sweep_flux_earth: [0.90, 0.95, 1.00]
  # DECLARED, 2026-08-19, and until then it was ExoPlaSim's Earth default
  # wearing this block's DETERMINED. Nothing about this world fixes the phase
  # of perihelion against the solstices, and at e = 0.02 that phase modulates
  # the seasonal flux by 8.3% peak to peak, more than the whole stellar cycle.
  # Kept at 102.7 deliberately: it is compiled into LPJ-GUESS through the
  # solstice offset in vesper.h, so moving it costs a rebuild and a driver.
  # notes/config-rationale.md says what an alternative would be worth.
  longitude_vernal_equinox_degrees: 102.7

# DETERMINED. 1 bar total at 450 ppm CO2. The carbon cycle is not solved
# anywhere in this project, so read CO2 as an assumption rather than a result;
# WORKFLOW.md section 4 says what the assumption costs.
#
# What this block CAN say is bounded by what the model reads. PlaSim's longwave
# is Sasamori (1968) over water vapour, CO2 and ozone, and the shortwave adds
# Rayleigh and the same three; radmod.f90 has no CH4 and no N2O term, so there
# is nothing here to set them to. Their absence is a property of the radiation
# scheme rather than a composition choice, and the direction is one-signed: a
# world with them is warmer than this one at the same CO2, by whatever they
# would have been worth. Adding either means adding a band, not a key.
atmosphere:
  pN2_bar: 0.78025
  pO2_bar: 0.21000
  pAr_bar: 0.00930
  pCO2_bar: 0.00045
  ozone: true

# DETERMINED. The spectrum is a measured K dwarf interpolated to this star's
# effective temperature, NOT ExoPlaSim's k2.dat, which is the star K2-18 at
# about 3450 K and made snow and ice 0.10-0.17 too dark in every run before it.
radiation:
  two_band_albedo: true
  stellar_spectrum: k25v

# DECLARED, 2026-08-18. Earth's value, and the point of the block is that it is
# now VISIBLE rather than that it has moved. Salinity reaches the model through
# one number, the freezing point of sea water, which `icemod.f90` hardcodes as
# `TFREEZE = 271.25` with the comment "at S=34.7". So Earth's ocean was being
# assumed by every run on this world without any file saying so, which is the
# DUST-6 pattern.
#
# It is DECLARED and not DETERMINED because this project cannot compute it. A
# real salinity is the steady state of riverine delivery against hydrothermal
# uptake, evaporite burial and reverse weathering, integrated over an ocean age
# and an outgassing history that nothing here supplies.
#
# The DIRECTION is knowable without the budget, and it is the interesting part.
# Most of this world's land is endorheic, so the solutes that on Earth reach the
# sea accumulate on closed-basin floors instead -- the exorheic share of the
# planet's surface is under half Earth's per unit ocean area. Less salt
# delivered means a FRESHER ocean, and fresher water freezes WARMER, so sea ice
# forms more readily than these runs show. That lands on the ice-albedo feedback
# the stellar-cycle damping turns on, which is why it is worth declaring rather
# than shrugging at.
#
# What it is worth: the freezing point runs 272.07 K at S = 20 and 270.94 K at
# S = 40, so the plausible span is about 1.1 K on one threshold. Carried in
# analysis/error_budget.json rather than guessed at here. TASKS.md CLIM-17.
ocean:
  salinity_psu: 34.7

# DETERMINED. Slab ocean, interactive sea ice, glaciers on.
surface:
  mixed_layer_depth_m: 50.0
  sea_ice: true
  glaciers:
    enabled: true
    min_snow_depth_m: 2.0
    initial_height_m: -1.0

# DETERMINED for the baseline re-run. Resolution, layers and ranks together select
# which compiled binary runs, so changing any of them needs a rebuild.
model:
  resolution: T42
  latitudes: 64
  longitudes: 128
  layers: 10
  precision_bytes: 8
  ncpus: 16
  timestep_minutes: 45.0
  physics_filter: "gp|exp|sp"
  output_type: .nc
  # Declares that ExoPlaSim's configure() clears every surface field when handed
  # a landmap, so anything not supplied here falls back to a namelist default.
  uniform_land_surface: true
  # PlaSim's 28-term energy decomposition, codes 360-387 and 460-487. On for the
  # baseline re-run to name the constant -0.455 W/m2 gap between the top of the
  # atmosphere and the surface; see TASKS.md CLIM-1.
  energy_diagnostics: true
  energy_diagnostics_3d: true
  ozone_scale: 0.794
  ozone_uv_weight: 0.335
  ozone_visible_weight: 0.914
  # The Lacis and Hansen shortwave gas absorptances are fractions of SOLAR flux,
  # so every one of them has to be re-weighted for a K2.5V host. These two are
  # the water vapour and CO2 halves, beside the ozone weights above.
  #
  # h2o_sw_weight scales an absorptance the scheme already has, so 1.0 is the
  # solar value. co2_sw_weight scales one it does NOT have, so 0.0 is the term
  # being absent and 1.0 would be the solar-weighted term; the defaults in
  # radmod.f90 are 1.0 and 0.0 respectively for exactly that reason.
  #
  # Both are derived by exoplasim/scripts/shortwave_band_weights.py and both are
  # quoted for the k25v spectrum: they are about a tenth larger than the values
  # for the 4965 K blackbody solarini builds when NSTARFILE is 0, so they belong
  # with stellar_spectrum: k25v and not without it. They have the SAME SIGN and
  # compound. Arguments in exoplasim/notes/shortwave-water-vapour.md and
  # exoplasim/notes/shortwave-co2.md.
  h2o_sw_weight: 1.346
  # A LEVEL correction to the same water vapour term, and a SEPARATE decision
  # from the weight above. `h2o_sw_weight` is a star-over-Sun ratio, so an error
  # in the absolute level of Lacis and Hansen Eq. 21 divides straight out of it
  # and is not corrected by anything. Correlated-k against Eq. 21 at the same
  # absorber amount runs 1.10 to 1.15 across the range and 1.127 at this
  # planet's operating path, the cause being that Yamamoto's bands were measured
  # at a Curtis-Godson effective pressure while Eq. 21 is refitted as though
  # they held at standard pressure.
  #
  # One-signed and a LOWER BOUND: the correlated-k side lacks the MT_CKD
  # continuum too, so the real deficit is larger than 12.7%. Carried as a key
  # rather than as a line in the error budget, per TASKS.md PHYS-9;
  # `exoplasim/notes/corrk-cross-check.md` is the measurement. radmod.f90's
  # default is 1.0, which is Eq. 21 unmodified.
  h2o_sw_level: 1.127
  co2_sw_weight: 1.510
  roughness_source: lithology
  # Soil water capacity from the pedology soil map as code 229, land-mean
  # 0.151 m against ExoPlaSim's uniform 0.5 m bucket. It was `uniform` for the
  # bootstrap because 229 needs a soil weathered under a climatology and the
  # terrain had none; that run produced one, so it is `pedology` from the
  # baseline run onward. The flip moves config_sha256 and cannot happen mid-run.
  soil_water_source: pedology
  land_albedo_source: vegetated
  # DERIVED 2026-08-19 by analysis/vegetation_albedo.py, which reproduces
  # notes/audits/inherited-earth-constants.md finding 1. The Earth-Sun canopy
  # endmember 0.15 re-weighted to this star on 553 ECOSTRESS leaf spectra by
  # the same method every rock class went through: a leaf is dark in the
  # visible and bright in the near infrared, so this star raises the value
  # where it lowers a mineral's. The leaf ratio upper-bounds the canopy
  # correction, so the bracket runs from the uncorrected endmember to the
  # tails-carried ratio. The band pair is the same integrals split at 0.75 um,
  # anchored so their flux-weighted combination is the broadband value; codes
  # 175/176 carry it over vegetated ground, where one identical field used to
  # assert that a canopy reflects equally either side of the split.
  vegetation_albedo: 0.165
  vegetation_albedo_bracket: [0.150, 0.171]
  vegetation_albedo_bands: [0.075, 0.225]
  # Playa clastics are about a quarter of this terrain's land and the largest
  # lever on its energy balance. The export's 0.19 comes from Post et al.'s
  # all-soils field mean, which is the right kind of measurement on the wrong
  # population; 0.23 is that field level corrected by how much brighter saline
  # desert soils are than the soil population in ECOSTRESS, measured in one
  # library so the laboratory-over-field offset cancels, and re-weighted to this
  # star. Derivation in analysis/playa_albedo.py, argument in
  # notes/audits/orogen-lithology.md. `replaces` refuses to fire if the class is
  # redefined, which is what retired the previous override.
  lithology_albedo_overrides:
    playa_clastic:
      albedo: 0.23
      replaces: 0.19
  # Classes that cannot carry vegetation, so they keep their own albedo in
  # `vegetated` mode. Nothing roots in salt crust or playa mud, and between them
  # they are about a quarter of this planet's land.
  barren_rock_classes: [evaporite, playa_clastic]
  geography_land_threshold: 0.5
  seasonal_samples_per_orbit: 32
  regular_output_bins_per_orbit: 12

# PROVISIONAL. Amplitudes and periods are chosen rather than derived; the
# damping factors quoted in the notes are analytic and Planck-only, and
# measuring them is what the first cycle run is for. The two components do
# different jobs and the ratio is deliberately non-commensurate.
stellar_cycle:
  components:
    medium:
      period_earth_years: 11.0        # 22 local years, ~6.4 per lifetime
      amplitude_flux_peak_to_peak: 0.025
      note: >
        The lived rhythm. Damped about 0.83, so roughly 3.1 K peak-to-peak,
        some thirty times Earth's solar-cycle signal and the dominant climatic
        fact of any individual life. Fast enough to be planned around, too fast
        for ice to follow.
    long:
      period_earth_years: 57.0        # 114 local years, ~1.2 per lifetime
      amplitude_flux_peak_to_peak: 0.035
      note: >
        The geomorphic driver. Essentially undamped at 0.99, roughly 5.2 K
        peak-to-peak, slow enough that glaciers equilibrate rather than merely
        breathing. Each grand minimum is a distinct historical era.
  total_amplitude_flux_peak_to_peak: 0.060
  alignment_recurrence_earth_years: 314
