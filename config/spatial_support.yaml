# The vocabulary every spatial artifact contract uses. SPAT-1 owns this file;
# SPAT-10 owns applying it to every crossing and production artifact.
schema_version: 1
contract_version: vesper-spatial-support/1

support_kinds:
  terrain_native_mesh:
    geometry: unstructured_spherical_regions
    role: physical_reference
  atmosphere_gaussian_grid:
    geometry: structured_gaussian_latitude_longitude
    role: numerical_support
  ocean_cgenie_grid:
    geometry: structured_cgenie_goldstein
    role: numerical_support
  hydrologic_unit:
    geometry: mesh_region_set
    role: response_unit
  soil_response_unit:
    geometry: co_located_fractional_mosaic
    role: response_unit
  land_ecological_response_unit:
    geometry: co_located_fractional_mosaic
    role: response_unit
  marine_ecological_response_unit:
    geometry: co_located_fractional_mosaic
    role: response_unit
  lpj_grid_cell:
    geometry: ecological_columns_on_declared_spatial_support
    role: ecological_model_support
  lpj_demographic_patch:
    geometry: stochastic_sample_within_ecological_unit
    role: demographic_sample
    spatially_representative: false
  comparison_support:
    geometry: declared_common_support
    role: decision_support

field_semantics:
  - intensive_state
  - extensive_total
  - flux_density
  - categorical_label
  - categorical_fraction
  - dimensionless_fraction
  - vector_component
  # A table of values in the underlying field's own units, resolved at a
  # declared probability vector: what a cell's population IS rather than one
  # number summarising it. A consumer that asks what SHARE of a cell lies past
  # a threshold has no other term to declare, because no moment answers that on
  # a skewed cell and a cell mean is not a function of the answer.
  - distribution_quantiles

time_semantics:
  - static
  - instantaneous
  - interval_mean
  - interval_accumulation
  - interval_endpoint_state

effective_measure_modes:
  - native
  - native_times_fraction
  - explicit

aggregation_operators:
  - identity
  - conservative_source_area
  - conservative_destination_area
  - covered_area_mean
  - area_weighted_fraction
  - categorical_majority
  - categorical_histogram
  - covered_area_moments
  - covered_area_expectation
  - area_weighted_distribution
  - vector_rotation_and_component_remap
  - stochastic_demographic_sampling

# Which lib/gridding.py mesh-to-grid reduction each term is, so the vocabulary
# and the operators cannot drift apart silently -- they did once, and this is
# what compares them. scripts/spatial_support_gate.py requires that every
# module-level `cell_*` callable in lib.gridding is claimed by exactly one term
# and that every name claimed here exists, so a seventh reduction added to that
# module fails the gate until the vocabulary can name it. An empty list is a
# term with no mesh-to-grid reduction behind it: a crossing normalisation
# lib/remap.py owns, a rule this project declares so an artifact can say it used
# one, or a sampling another model performs.
aggregation_operator_reductions:
  identity: []
  conservative_source_area: [cell_sum]
  conservative_destination_area: []
  covered_area_mean: [cell_mean]
  area_weighted_fraction: [cell_fraction]
  categorical_majority: []
  categorical_histogram: [cell_fraction]
  covered_area_moments: [cell_moments]
  covered_area_expectation: [cell_expectation]
  area_weighted_distribution: [cell_quantiles]
  vector_rotation_and_component_remap: []
  stochastic_demographic_sampling: []

nonlinear_orders:
  - not_applicable
  - process_then_aggregate
  - aggregate_then_process

vector_bases:
  - east_north
  - grid_aligned

identity:
  digest: sha256
  canonicalization: sorted_json_utf8
  rule: >-
    Shape is never an identity. A support identity includes its kind,
    dimensions, geometry digest, coordinate digest, native measures, and any
    effective fraction or explicit measure used by a field.

required_contract_sections:
  - contract_version
  - artifact_id
  - supports
  - fields
  - time_support
  - provenance
