schema_version: 1

# The mutually exclusive wetness classification and its crossing to the climate
# grid. Read by `hydrography/scripts/build_wetness.py`. WET-2, LSHY-6.
#
# WHAT THIS IS FOR. One `PEATLAND` fraction collapses states whose carbon and
# gas physics differ: persistent peat-forming land, saturated but non-inundated
# mineral soil, seasonally flooded land, open lake, river and playa water, and
# dry mineral soil. `biosphere/notes/wetlands-peat-methane-audit.md` finding 2
# asks for those as mutually exclusive fractions rather than one column, and
# `biosphere/notes/soil-land-surface-hydraulic-consistency-audit.md` finding 7
# asks the crossing to the climate grid to keep upland soil, lake and playa, and
# groundwater-fed land apart instead of averaging them into one medium-wet
# surface. Both are the same artifact: a partition of a cell's land area whose
# pieces are named.
#
# MUTUAL EXCLUSIVITY IS THE PRODUCT, not a property of it. Overlapping classes
# double-count area, and every ledger downstream inherits the double count
# without being able to see it. So the classes are assigned as ONE label per
# region rather than as a set of masks that happen not to overlap, the shares
# are required to partition the cell, and `--selftest` runs fixtures built to
# violate each of those in a named way that the checks must catch.
#
# ONE SUPPORT TODAY, AND TWO IF A CLOSURE IS EVER REVIVED.
# `hydrography/notes/subgrid-water-table.md` section 5: the resolved classes
# stay per REGION, and the saturated non-inundated mineral class is not resolved
# anywhere on this mesh and could only ever arrive as a climate-grid AREA share.
# That closure is withdrawn, so every class this file forms today is resolved on
# the mesh and the partition closes at one support. The two-support rule is kept
# rather than deleted, because a revived closure brings the second support back
# with it: the saturated share would be taken OUT of what the resolved classes
# leave and never added beside them.
#
# WHICH SOLVE DECIDES OPEN WATER: THE PERIODIC CYCLE.
# `surface_water.py` solves the lake balance twice, as an annual equilibrium and
# as a periodic steady state through the climatology's own time bins. The annual
# area sits between the cycle's trough and its peak, so the two paints cut the
# same ground differently and the strandline is where they disagree. The cut is
# taken from the CYCLE, because that is what makes seasonal inundation a class
# rather than a remainder against a different solve, and because the cycle is
# the more determined of the two states. WORLD-T8I5 measured the two paints
# against each other before choosing; `notes/audits/wetness-partition-cut.md`
# carries the measurement and `build_wetness.py` re-measures it on every run.

# ---------------------------------------------------------------------------
# The classes
# ---------------------------------------------------------------------------
# Each carries the support it lives at, the artifact it is derived from, and --
# where it is not derivable at all -- what is missing. A class with no source is
# DECLARED AND REFUSED rather than approximated, because a wetness fraction that
# is a guess is indistinguishable in the file from one that is a measurement.
classes:
  # RESOLVED, per region, and each is a solved result rather than a threshold.
  open_water:
    support: region
    source: surface_water.nc:lake_cycle_bins_wet, surface_water.nc:lake_cycle_decided
    rule: >-
      a region under the periodic lake in EVERY time bin of the climatology: the
      always-wet set, which is the permanent lake surface the cycle expresses.
      `surface_water.py` decides this and nothing else in the project does. A
      region whose basin never closed its year has no cycle, so a zero in
      `lake_cycle_bins_wet` cannot say whether it is dry or unsolved; for those
      regions the annual equilibrium paint `surface_water.nc:lake` is the only
      statement that exists and it decides. The count of regions taken that way
      is written into `wetness_report.json` rather than absorbed, because it is
      the one place two solves meet in one partition.
  seasonal_inundation:
    support: region
    source: surface_water.nc:lake_cycle_bins_wet, surface_water.nc:lake_cycle_decided
    rule: >-
      a region under the periodic lake in SOME time bins and not all. IT IS THE
      CLOSED-BASIN THIRD OF THE SEASONAL QUANTITY AND NOTHING ELSE.
      `hydrography/notes/land-water-ledger.md` splits seasonally inundated land
      in three, and the other two thirds are not this component's and are not
      pending here: a FLOODPLAIN's inundated area needs a
      height-above-nearest-drainage distribution and a routing model, neither of
      which exists in this project, and a seasonally saturated SOIL is a water
      content rather than an area, which `refusals.area_proxy_from_cell_mean`
      below refuses to turn into one. Merging any of the three would put three
      quantities under one name and the merge would be invisible in the file, so
      a consumer reads this class as a LOWER BOUND on seasonally inundated land.
  playa:
    support: region
    source: regions.nc:filled_km, regions.nc:terminal, basins.nc:spill_km
    rule: >-
      land inside a closed depression -- its filled surface at or below the
      basin's spill -- that neither wet class above takes: the floor and
      strandline that stay exposed through the whole cycle, which is what
      `pedology/scripts/build_surface_classes.py` already means by playa. A
      basin that fills to its spill in every bin has no exposed floor and
      contributes none, which falls out of the rule rather than needing a second
      one.
  dry_mineral:
    support: region
    source: the remainder of the cell's land
    rule: land that is neither open water nor exposed closed-depression floor.
      It is the class the saturated share below is taken OUT OF, so it is a
      residual by construction and is named as one.

  # UNRESOLVED. Each of these is in the audit's list and none of them has a
  # source in this pipeline. The reason is recorded per class because "not
  # available" and "not available for THIS reason" are different statements to a
  # reader deciding whether to wait or to build something.
  saturated_mineral:
    support: climate_grid
    source: none. It would have been TOPMODEL's saturated area share, taken out
      of `dry_mineral` and never added beside it, from
      topographic_index_exoplasim-{res}.nc:f_sat_max and water_table.nc:depth_m.
    unavailable_reason: the saturated-area closure it would come from is
      WITHDRAWN in `hydrography/config/topographic_index.yaml`. The score
      declared there before any fraction was computed was the only thing that
      could license it; it was run on both Earth sets and missed, and the gain
      the terrain half carries over the cell-mean depth alone is smaller than
      the scatter its own support puts on it, so no narrower criterion can
      license it either. This class is absent permanently rather than pending,
      and reviving it is a new closure with a new criterion. GW-26.
  groundwater_fed:
    support: climate_grid
    source: >-
      none yet. The tile LSHY-6 asks to keep distinct from upland soil and
      from lake and playa: land whose water comes from the table rather than
      from the season's rain.
    unavailable_reason: >-
      two candidate sources, and they fail for different
      reasons, so a reader deciding whether to wait or to build needs both.
      GW-26's saturated-area closure is withdrawn PERMANENTLY and reviving it
      needs a different INSTRUMENT rather than a narrower criterion. World-n9sd
      measured the instrument: resampling the cells, the gain the terrain half
      carries over the cell-mean depth alone is at or below its own scatter on
      all eight arms of both Earth observation sets, so point bore depths at
      cell scale are blind to the effect and no cut of `sink_fraction` makes
      them see it. What would license a revival is an AREAL observation -- a
      measured saturation or inundation extent -- not more bores.
      PLHY-5's `groundwater_access` needs no closure at all: it evaluates the
      access criterion on the native regions where the depth lives and crosses
      an AREA, which is exactly this tile. What it needs is `water_table.nc`,
      and no build in `source/` has one -- `hydrography/data/<build>/` carries
      none on either. The cost is the `groundwater` step and then
      `groundwater_access`, both `cost: minutes` in `config/pipeline.yaml`, with
      `groundwater` needing `surface_water` and a climatology first.
    licensing_constraint: >-
      whichever route revives it, the tile carries the
      regime with it or it is not licensed. The depth it would come from scores
      0.4581 against Earth's Australian bores, below the 0.5 of no
      discrimination, and 0.6655 on the United States unconfined set, so it
      works where lateral flow sets the head and not where the local sink does.
      `groundwater_access_<grid>.nc` already reports the `sink_fraction` regime
      share per cell, including its two kinds of no-answer. A share that mixes
      the licensed regime with the unlicensed one is a number with no verdict
      attached, which is what `area_proxy_from_cell_mean` below refuses in the
      other direction.
  peat:
    support: region
    unavailable_reason: >-
      persistence of SATURATION over a cycle is what distinguishes peat-forming
      land from saturated mineral soil, and neither term is available here: the
      saturated class above has no source at any support, and the cycle this
      component does carry is a cycle of INUNDATION by a solved lake rather than
      of a water table standing at the surface. Peat is also a STOCK with an
      accumulation behind it; `docs/src/reference/no-time-axis.md` is what that
      has to answer to.
  river_water:
    support: region
    unavailable_reason: >-
      `surface_water.nc` carries a discharge and no channel width, so a river
      AREA cannot be formed from it. Discharge is a rank and a mask, not an
      area, and turning one into the other needs a hydraulic geometry this
      project does not hold.

# ---------------------------------------------------------------------------
# The crossing, and which reduction operator each field gets
# ---------------------------------------------------------------------------
# `lib/gridding.py` owns the operators and names which field semantics each is
# for. A wetness class is CATEGORICAL, so what crosses is the retained AREA
# share of each class and never a majority label: picking the majority discards
# every minority surface however much leverage it has, and a narrow riparian
# strip in a dry cell is exactly the surface these rows exist to keep.
crossing:
  class_share: cell_fraction              # CATEGORICAL, share of the cell's land AREA
  population: surface_class_land          # CLAUDE.md rule 1
  # A cell holding fewer land regions than this has shares but no useful
  # partition of them, and it is marked rather than dropped: the area is real
  # and a consumer that silently loses it has lost land, not noise.
  min_land_regions_per_cell: 4

# ---------------------------------------------------------------------------
# What this artifact refuses, by name
# ---------------------------------------------------------------------------
# Each of these is a route that produces an ordinary-looking number and a wrong
# one, and each was named as a defect somewhere before it was refused here.
refusals:
  # `biosphere/notes/wetlands-peat-methane-audit.md`: no latitude threshold may
  # select the physics. The vendored decomposition already does -- a saturated
  # mineral soil gets a moisture modifier of 0.360 on every pool against 0.025
  # on the slow and passive pools of a high-latitude peatland stand -- so a
  # classification that also selected by latitude would put the switch in two
  # places.
  regime_selector: none
  # `soil-land-surface-hydraulic-consistency-audit.md` finding 7: a mean water
  # table depth or a mean available water capacity may not stand in for an
  # accessible-area fraction. Runoff generation, groundwater access, lake
  # evaporation and root access are nonlinear and happen on different fractions,
  # so no choice of mean fixes it. The quantity is an AREA.
  area_proxy_from_cell_mean: refused
  # The saturated fraction is a fraction of a population and the only population
  # is the mesh regions inside a climate-grid cell. A per-region one would have
  # to be manufactured from a sub-region hypsometry, which GW-6 says is not
  # there. `biosphere/scripts/wetland_gate.py` refuses anything else by name.
  # This stays declared with the closure withdrawn, because it is the support
  # any REVIVED closure would have to live at and the refusal it states does not
  # depend on the closure existing.
  saturated_fraction_support: climate_grid
  # The index carries a length in `a`, so its whole distribution shifts with the
  # mesh and only its rank statistics transport.
  absolute_index_threshold: forbidden

# ---------------------------------------------------------------------------
# What the shares must close against
# ---------------------------------------------------------------------------
# Stated here as an identity a consumer can check rather than as a number this
# artifact writes. BIO-11's rootable surface fraction does not exist yet; when
# it does, these are the equations that say the two agree and that no area has
# been counted twice.
closure:
  #     open_water + seasonal_inundation + playa + dry_mineral == 1, over a
  #     cell's land area
  # and, if a saturated share is ever revived and licensed,
  #     saturated_mineral + dry_mineral_remaining == dry_mineral
  # which is the rule that keeps it OUT of the resolved classes rather than
  # beside them; the withdrawn closure never reached it.
  # and, once BIO-11 exists,
  #     rootable == 1 - open_water - barren, with barren from pedology's
  #     surface classes, and this artifact's `playa` inside that barren.
  partition_tolerance: 1.0e-9
  # THE PLAYA RULE AGAINST A QUANTITY THE CATALOGUE ALREADY KNOWS. The rule
  # selects the land a basin would flood at its spill, and `basins.nc` carries
  # `area_at_spill_km2` per basin from `build_hydrography.py`'s own hypsometry.
  # Same area, two routes, so their totals are an identity rather than a
  # comparison -- and a rule that had quietly selected the endorheic CATCHMENT
  # instead of the depression floor would miss it by a factor of several, which
  # is the mistake this class invites.
  footprint_tolerance: 1.0e-9
  rootable_surface: bio-11               # not built; the identity is stated, not asserted
