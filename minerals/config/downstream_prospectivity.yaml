schema_version: 1

# Weathering, drainage and brine ore prospectivity, per deposit type, as a 0-1
# field. The downstream half of the split in `docs/src/reference/economic-minerals.md`: a
# deposit belongs where the process that concentrates it is MODELLED, and these
# are concentrated by climate, runoff and the chemical divide, which World Orogen
# does not have.
#
# Everything the tectonic file says applies here unchanged and is not repeated.
# NOT deposits, NOT a lithology, NOT an erodibility modifier, read only by what
# comes after climate. One thing IS different and it is the reason this is a
# separate file and a separate artifact: these rules read a climatology, so the
# product carries a climate in its identity as well as a terrain, and it is
# regenerated when either moves. The tectonic half is a pure function of the
# export and survives a re-run of the baseline; this half does not.
#
# HOW WELL GROUNDED EACH RULE IS, stated per rule as `grounding`, because they
# are not equally good and a reader should not have to guess:
#   derived          - falls out of a modelled quantity with no free choice
#   sourced          - a threshold quoted from a paper that was read
#   sourced-negative - a read source states the threshold is not established, so
#                      the rule deliberately has none. Better than a number
#   declared         - judgment, reasoning written out, no source behind it

deposits:

  bauxite:
    name: Bauxite
    grounding: sourced
    # Price, Valdes and Sellwood (1997), which is the right shape for this rule
    # because it is itself a set of thresholds applied to gridded climate fields
    # and validated against observed bauxite distribution. Their modified
    # Bardossy and Aleva model, quoted from their abstract:
    #
    #   "annual mean precipitation greater than 1200 mm, and 6 or fewer months
    #    when the rainfall is less than 60 mm ... mean annual temperature to be
    #    greater than 22 C"
    #
    # THE MONTHLY HALF IS THE PART THAT NEEDED CARE, and it is the seasonality
    # that carries the mechanism: Price p. 2 says a short dry period is
    # FAVOURABLE, because "a dry interval causes an oscillating ground water
    # level to allow solution, migration and precipitation of elements within
    # the weathering profile". So this is a two-sided criterion wearing a
    # one-sided shape, and dropping the monthly test for an annual mean would
    # lose the half that does the work.
    #
    # Vesper's year is 183 days in 12 bins, so a bin is 15.2 days against an
    # Earth month's 30.4. The COUNT transfers unchanged, because 6 of 12 is a
    # fraction of a year either way. The DEPTH does not: 60 mm per Earth month
    # is 30 mm over a bin of half the length, and using 60 directly would call
    # a bin dry that received Earth's monthly rain at Earth's monthly rate.
    # `dry_bin_mm` is therefore stated per BIN and derived in the script from
    # the configured orbit, not written here as a constant.
    minimum_precipitation_mm_yr: 1200.0
    minimum_temperature_c: 22.0
    dry_month_mm_per_earth_month: 60.0
    maximum_dry_bins: 6
    # Tardy et al. (1991) hold that Bardossy and Aleva are not restrictive
    # enough and want >1700 mm with relative humidity above 80%. Carried as the
    # bracket rather than as the rule, since the humidity half is not applied.
    precipitation_bracket_mm_yr: [1200.0, 1700.0]
    # Retallack (2010) gives a LOOSER pair, 1100 mm and 17 C, and the
    # disagreement is real rather than a discrepancy to average away: his is the
    # Oxisol threshold and Price's is the bauxite-occurrence one. Price is used
    # because bauxite is what this rule places.
    #
    # Bauxite is residual: it needs the solutes to leave. A closed basin
    # concentrates them on its own floor instead, which is the opposite process,
    # so endorheic catchments are excluded rather than discounted.
    require_exorheic: true
    # Aluminous parent. Carbonate and evaporite have no alumina to residuate and
    # quartzite's alumina is negligible.
    #
    # THE RELIEF TERM IS NOW SOURCED, and it is an upper bound on regional dip.
    # Freyssinet, Butt, Morris and Piantone (2005) p. 685: bauxite-bearing plateaus "are commonly remnants of ancient large-scale plantation surfaces with overall dips of 1 deg to 5 deg so that, on a regional scale, the same paleosurface may occur at different altitudes".
    #
    # 5 degrees is applied and 1 degree is NOT. The pair is the observed range of
    # dips of the surfaces bauxite is found on, so the upper end is a limit on
    # where the deposit survives and the lower end is only where those particular
    # surfaces happened to sit. Reading 1 degree as a floor would assert that
    # flatter ground cannot carry bauxite, which the sentence does not say. The
    # mechanism a floor would stand for -- Freyssinet p. 695, "relief must be
    # sufficient to allow leaching of chemical weathering products" -- is already
    # carried by `require_exorheic`, and hydrologically rather than
    # topographically, which is the better statement of it.
    #
    # `lib/orogen.py:local_slope_deg` supplies the field, as the dip of a plane
    # fitted through each region and its neighbours. That is the same quantity
    # the source is written about, a regional tilt over roughly 20 km, and NOT a
    # hillslope. At this mesh scale the criterion is a guard against placing
    # bauxite on mountains rather than a discriminating term; how little land it
    # actually removes is measured in `docs/src/reference/economic-minerals.md`.
    maximum_slope_degrees: 5.0
    hosts: {shelf_clastic: 1.0, foreland_clastic: 1.0, pelagic: 1.0, melange: 0.8, granite: 0.8, granodiorite: 0.8, gneiss: 0.8, schist: 0.8, arc_andesite: 1.0, arc_basalt: 1.0, flood_basalt: 1.0, oib: 1.0, morb: 0.6, continental_clastic: 0.4, rift_bimodal: 1.0}

  laterite_ni:
    name: Nickel laterite
    grounding: sourced
    # The same weathering, over an ultramafic parent, and the parent is the whole
    # rule: nickel laterite is weathered peridotite and nothing else makes one.
    #
    # ON THIS WORLD THE PARENT IS `melange`, and that follows an inference this
    # repo has already made twice rather than a new one. Orogen's rock table has
    # NO peridotite class. `elevation.js` assigns `melange` to the whole forearc
    # province -- prism, forearc basin and serpentinite together, because at
    # ~15 km cells they cannot be separated -- and `podiform_cr` in the tectonic
    # file already keys on it as obducted ocean crust reaching into the mantle
    # section of an ophiolite. That is where the ultramafic rock is.
    #
    # The cost of that inference is stated rather than hidden: the serpentinite
    # fraction of a forearc is volumetrically minor, so this rule paints a
    # prospectivity over a province whose ultramafic part is a small share of it.
    # `brine_paths.py` makes the same judgment for solute chemistry and calls it
    # a known under-representation. The field should be read as "this province
    # contains the parent", not "this cell is peridotite".
    #
    # Butt and Cluzel (2013), quoting Thorne et al. (2012) at their p. 126:
    # "Ni laterites develop where rainfall exceeds 1000 mm/y and mean monthly
    # temperatures range between 22-31 C (summer) and 15-27 C (winter)."
    #
    # The upper bounds are an OBSERVED RANGE rather than a demonstrated limit --
    # they describe where Earth's deposits happen to sit -- so applying them as
    # hard bounds is conservative and the report says how much it costs. The
    # lower bounds are the ones that carry a mechanism.
    minimum_precipitation_mm_yr: 1000.0
    warmest_bin_temperature_c: [22.0, 31.0]
    coldest_bin_temperature_c: [15.0, 27.0]
    # Butt and Cluzel p. 125, and this is the hard requirement rather than a
    # weighting: "Nickel laterites form almost exclusively on olivine-rich
    # ultramafic rocks and their serpentinized equivalents". p. 125 also puts
    # "about 85% of Ni laterite resources ... on mainly serpentinized ophiolitic
    # dunite and harzburgite peridotite", which is why an obducted-ophiolite
    # province is the right host and a felsic one is not prospective at any
    # weight.
    require_exorheic: true
    hosts: {melange: 1.0}
    # THE RELIEF TERM IS NOW SOURCED, at the same 5 degrees as bauxite and from
    # the same page, and the shared threshold is an inference that is stated
    # rather than hidden. Freyssinet et al. (2005) p. 695 introduce their three
    # constraints as "some common conditions that apply to all deep lateritic
    # regoliths", and a bauxite is one, so the dip range measured on lateritic
    # planation surfaces at p. 685 is the relief those conditions describe.
    # What p. 695 gives for Ni laterite itself is the MECHANISM without a
    # gradient: the weathering front's downward progress "must exceed the rate of
    # surface lowering by collapse and erosion and this is favored by low relief.
    # Conversely, relief must be sufficient to allow leaching of chemical
    # weathering products."
    #
    # THE OMISSION IS TWO-SIDED, not one-signed as this file previously recorded.
    # Too steep strips the profile; too flat impedes the drainage the leaching
    # needs. Table 2 p. 695 makes the second end concrete by splitting the ore:
    # hydrous Mg silicate wants moderate relief and free drainage, clay silicate
    # moderate-to-low and impeded, oxide moderate-to-low and either. This rule
    # places one undifferentiated Ni laterite field, so it applies the upper
    # bound only and does not resolve which ore type a cell would grow.
    #
    # STILL NOT APPLIED, and the honest residue: the criterion is a RATE against
    # a RATE, and this project models neither. The anchors, for whoever closes
    # it -- 10 to 20 m/m.y. mean ultramafic weathering (Nahon and Tardy, 1992), 8 m/m.y. saprolitization on ultramafic schists in French Guiana (Freyssinet and Farah, 2000), 40 to 50 m/m.y. at Thio, New Caledonia (Trescases, 1973, 1975).
    # Preservation by burial or duricrust armouring is also still untested.
    maximum_slope_degrees: 5.0

  supergene_cu:
    name: Supergene copper enrichment
    grounding: sourced
    # The case that shows why the split in `docs/src/reference/economic-minerals.md` is a
    # split and not a handover: it needs an Orogen deposit AND a downstream
    # climate, and neither component can produce it alone. So this rule MULTIPLIES
    # the tectonic file's porphyry Cu-Mo field rather than re-deriving it, and a
    # cell with no porphyry protore scores zero however favourable its climate.
    #
    # The climate window is two-sided and that two-sidedness is the physical
    # content. Enrichment needs oxidation and a descending water table to carry
    # copper down to a blanket, so it needs SOME water: hyper-arid ground never
    # oxidises the protore. It also needs the copper not to be flushed away, so
    # it fails at the wet end. Semi-arid, in short.
    #
    # THE LOWER BOUND IS SOURCED AND IT MOVED BY AN ORDER OF MAGNITUDE. This
    # rule first carried 100 mm/yr as "the conventional semi-arid band", chosen
    # without a source. Reich et al. (2009) measured the Atacama directly and
    # put the meteoric enrichment stage at a "semiarid climate (>10 mm/year
    # precipitation)", with the shutdown at "modern extreme hyperarid conditions
    # (< 1-4 mm/year)". So enrichment runs an order of magnitude drier than the
    # invented bound allowed, and the invented bound was excluding the single
    # best-documented enrichment province on Earth.
    #
    # Sillitoe (2010) does NOT contain this: it delegates the whole subject at
    # its p. 5 to Sillitoe (2005), which is now held and read.
    minimum_precipitation_mm_yr: 10.0
    #
    # THERE IS NO WET BOUND, and the rule previously carried an invented one.
    # Sillitoe (2005) p. 736: "Water is an essential ingredient for supergene activity so all climatic regimes with the exception of hyperarid deserts and glacial terrains, including associated permafrost development, are able to sustain appreciable oxidative weathering and attendant enrichment."
    # He goes further and calls a tropical climate "the most favorable for rapid
    # supergene upgrading" given a deep water table. So the 500 mm/yr cap that
    # stood here was not merely unsourced, it was contradicted by the canonical
    # source, and it is removed rather than re-derived. `grounding` stays
    # `sourced` because both surviving bounds are now quoted rather than judged.
    #
    # The exclusions the sentence DOES name are the two applied. Hyperarid is
    # already the dry bound above, measured by Reich et al. (2009). Glacial and
    # permafrost ground is this, and the criterion is seasonal melting rather
    # than a mean, because p. 736 makes melting the operative thing: "Even under
    # ice-dominated conditions, any seasonal melting results in immediate
    # short-term resumption of supergene processes." Ground whose warmest bin
    # never reaches freezing is ground that never melts.
    minimum_warmest_bin_temperature_c: 0.0
    #
    # WHAT THE WET END ACTUALLY IS, and it is not applied: erosion. p. 736,
    # "the average erosion rate must be in overall balance with the rate of water
    # table descent", and "Erosional efficiency depends chiefly on rainfall and
    # slope steepness". Rainfall reaches the wet end only jointly with slope, so
    # a rainfall cap was the wrong SHAPE of term and not just the wrong number.
    # No slope cut is applied here either: unlike the laterites this deposit is
    # not tied to planation surfaces -- the abstract states that pediplains "are
    # not considered to be a requirement" -- and deep profiles do form in
    # mountainous tropics on masses isolated from drainage incision, Mount
    # Fubilan at Ok Tedi being the named case. Borrowing the laterite dip here
    # would be inventing a threshold the source declines to give.
    #
    # The sign of the omission: with no erosion term, wet steep ground is scored
    # as prospective where the real profile would be stripped before it matured,
    # so this rule OVER-predicts there. Reich and Vasconcelos (2015) p. 306 give
    # the profile physics -- oxidation in the vadose zone and the capillary
    # fringe, secondary sulfides below the water table where pO2 falls to about
    # 1e-40 atm -- but no rainfall number, and a thick leached cap needs a deep
    # water table rather than a dry climate as such.
    multiplies: porphyry_cu_mo

  placer_au:
    name: Placer gold
    grounding: sourced-negative
    # Fluvial concentration, which needs two things at once and is the product of
    # them: water to do the sorting, and an upstream source to sort.
    #
    # The upstream source is computed rather than assumed. Orogenic gold
    # prospectivity is accumulated DOWN THE DRAINAGE TREE the same way runoff is,
    # so a river's score is the gold-bearing share of everything that drains into
    # it. That is the part a rock map cannot give and the drainage network can.
    #
    # THE ABSENCE OF A DISTANCE TERM IS NOW SOURCED, which is a better outcome
    # than a threshold would have been. Slingerland and Smith (1986), the
    # canonical process review, state at their p. 143 that "additional work is
    # needed to determine the optimal regional sediment and water yields and
    # fluid energy slopes for placer development". The quantity this rule would
    # need was unresolved in the review that would have supplied it, so quoting
    # a gradient or discharge threshold here would be inventing one.
    #
    # And for GOLD specifically a distance cutoff would be wrong in kind rather
    # than merely unsourced. Knight et al. (1999) find roundness and flatness
    # rising rapidly over the first 5 km from the lode and more slowly beyond,
    # calibrated out to about 25 km, with no upper limit: gold is progressively
    # FLATTENED rather than lost, so the 5 km is a break in slope and not a
    # boundary. A decay length would have removed prospectivity the evidence
    # says is still there.
    #
    # The one sourced gradient in the read set is Schwartz et al. (1995) on the
    # Southeast Asian tin belt -- residual kaksa at 0.2-0.25% thalweg, longer
    # transport at 0.3-0.7% -- and it is cassiterite in one province, so it is
    # not applied here and would not be applicable if tin were emitted.
    #
    # What remains unbounded is extent: with no attenuation at all the field is
    # an upper bound on how far downstream prospectivity is carried.
    #
    # Tin and gem placers are NOT emitted. Cassiterite needs specialised
    # S-type granite and gem placers need their own host suites, and Orogen's
    # 20-class table separates neither from ordinary granite. Placing them would
    # be placing granite twice under different names.
    source_deposit: orogenic_au
    discharge_percentile: 90.0

# --- the brine half ----------------------------------------------------------
#
# Close to free, because `pedology/scripts/brine_paths.py` already solves the
# chemical divide per basin and that is what decides the mineral. Hardie and
# Eugster (1970): calcite removes Ca and CO3 in equal equivalents, so whichever
# is in excess at calcite saturation dominates everything after, and the first
# calcite decides irreversibly whether the brine turns carbonate-rich or
# carbonate-poor. Two of the four entries below fall straight out of that and are
# marked `derived`; two do not and are marked honestly.
brines:

  brine_soda:
    name: Soda ash (trona, natron)
    grounding: derived
    # The alkaline side of the divide, which on this world is nearly all of it:
    # every silicate and carbonate lithology in Meybeck's table sits there and
    # only the evaporites cross over. So the structural prediction is that this
    # world's closed basins are mostly soda lakes, the Lake Magadi sort, and that
    # is a testable claim rather than a tuning knob.
    path: alkaline
    # Scaled by how far the brine can concentrate, since a basin that overflows
    # never reaches saturation. `basin_fills_to_spill` from the lake solution is
    # the test and it is a boolean the solver already computed.
    require_no_overflow: true

  brine_gypsum:
    name: Gypsum and Ca-Cl brine
    grounding: derived
    # The carbonate-poor side. Rare here by construction and that is the result:
    # Orogen's rock table has no gypsum lithology at all -- its evaporite class
    # is a salt crust -- so a Ca-rich path can only arise where the catchment
    # already drains halite evaporite or a carbonate-poor silicate mix.
    path: ca_rich
    require_no_overflow: true

  brine_potash:
    name: Potash
    grounding: declared
    # K is Eugster and Jones' behaviour type IV: sigmoid, removed only mid-range
    # by exchange, sorption and biogenic reduction, and therefore surviving to
    # the end only where concentration runs far. So potash needs a high K supply
    # AND extreme evaporative concentration, which is why it is rarer than soda
    # on any world.
    #
    # The K threshold is DECLARED, at the top of Meybeck's own range across the
    # ten lithologies rather than at an absolute concentration, because table 2C
    # is temperate-stream release on Earth and carries the ordering of rock types
    # and not this world's chemistry.
    minimum_k_percentile: 75.0
    require_no_overflow: true

  # LITHIUM AND BORATE ARE ONE FIELD, AND THAT IS THE SOURCED PART.
  # Neither element is among Meybeck's eight species, so neither can be derived
  # from the chemical divide the way soda and gypsum are, and no per-lithology Li
  # or B release table exists to derive them from instead. What the literature
  # does settle, and settles for both elements at once, is WHICH ROCK the two
  # come from and that ordinary weathering is enough to move them. Sourced
  # 2026-08-18; the argument and its evidence are in `docs/src/reference/economic-minerals.md`
  # and the papers are in `references/INDEX.md`.
  #
  # Risacher and Fritz (2009) section 3.5, on Bolivian and Chilean salars, is the
  # test that could have failed. Li and B are generally enriched in thermal
  # waters, 60% of Bolivian and 78% of Chilean groundwaters sampled carry a
  # thermal influence, and neither element's concentration rises with water
  # temperature: "hydrothermal alteration is not specifically responsible for the
  # high content of Li and B in waters and brines of Andean salars. Both
  # components originate from the alteration of volcanic rocks, especially
  # ignimbrites because of their rapid alteration and weathering." Risacher et
  # al. (2003) section 7.7 reaches the same conclusion from the Chilean half.
  #
  # So the hydrothermal flux this pipeline cannot place is NOT required for the
  # Andean type, which is the world's principal Li brine and Quaternary borate
  # province. It IS required for the Anatolian borate type, where Helvaci (2019)
  # attributes the boron to thermal springs circulating through the same fertile
  # rocks; that type is not placeable here and saying so is the honest form.
  #
  # The fertile rock is the EVOLVED, GLASSY, HIGH-SILICA end, and it carries both
  # elements together. Floyd et al. (1998), quoted by Helvaci (2019): fertile
  # ignimbrites are "well-evolved and fractionated ... with a high-silica
  # rhyolitic bulk composition, exhibit a combined high content of B, As, F, Li
  # and Pb". Hence one host set for both rules rather than two, and hence no
  # `arc_basalt`: an island-arc basalt is the wrong end of the differentiation
  # series for either element. Plutonic classes sit at half weight because the
  # readily leachable phase is glass rather than crystal -- Hofstra et al. (2013),
  # via Munk et al. (2016), find fluid inclusions in quartz phenocrysts of
  # high-silica volcanics elevated in Li relative to their vitric matrices, and
  # Wolff-Boenisch et al. (2004), already read here, gives the glass-over-crystal
  # dissolution contrast that makes the same rock a different material.
  #
  # WHAT IS SOURCED-NEGATIVE is the release coefficient, and the canonical review
  # says so rather than merely omitting it. Munk et al. (2016) on Li sources:
  # "Despite the observation that multiple potential sources of Li exist they are
  # yet to be definitively identified and quantified", and the direct
  # measurements straddle orders of magnitude -- Price et al. (2000) conclude
  # groundwater leaching of volcanic tuffs alone accounts for all the Li at
  # Clayton Valley, while Jochens and Munk (2011) measured under 10 ug/L released
  # from those same rocks at ambient conditions. Huh et al. (1998) is the nearest
  # thing to a Meybeck table 2C for Li and is not one either: it groups by terrain
  # rather than rock class and its high end is marine limestone and evaporite
  # drainage, which is recycled evaporite Li and not release from fresh rock.
  # A release number entered here would be invented and quoted back as sourced.
  #
  # ONE FIELD, NOT TWO, and this is the decision that follows from the above
  # rather than a convenience. Every criterion this pipeline can apply is shared:
  # the host rock is shared because Floyd has B and Li enriched in the SAME
  # fertile ignimbrites, closure is shared, aridity is shared, and neither
  # element is on the chemical divide. Emitting two names off one set of
  # criteria would be this file's own tin-and-gem-placer error, "placing granite
  # twice under different names", and a reader seeing two fields infers two
  # predictions. The precedent is `duricrust.silcrete` in
  # `pedology/config/surface_classes.yaml`: three settings, one value, because
  # the settings separate and the products do not.
  #
  # NATURE DOES SEPARATE THEM AND THIS PIPELINE CANNOT, which is worth stating
  # precisely because the direction is known. Bradley et al. (2013): lithium
  # "does not readily produce evaporite minerals when concentrated by
  # evaporation. Instead it ends up in residual brines in the shallow
  # subsurface", whereas borate leaves solution as a mineral. Borate therefore
  # saturates EARLIER in the evaporative sequence, so the borate set CONTAINS the
  # lithium set and the two differ by where the boundary between them falls.
  # Placing that boundary needs a per-basin Li and B concentration to compare
  # against a borate saturation point, and a per-basin concentration needs the
  # release coefficient that the block above has just established does not exist.
  # The same missing number, surfacing a second time.
  #
  # WHAT WOULD SPLIT THE FIELD AGAIN, so the next person does not re-derive it.
  # Two things, and the machinery for the second already exists. (1) A per
  # lithology Li and B release table, which would give inflow concentrations that
  # an evaporation model such as Risacher's EQL/EVP could carry to borate
  # saturation; borate would come out the LARGER field. (2) A source giving the
  # evaporative concentration factor at which a borate mineral saturates against
  # the factor an economic Li brine needs. Note that this file could act on (2)
  # today: hydrography computes a graded `aridity_index` against
  # `critical_aridity_index` per basin, and `require_no_overflow` throws that
  # gradation away by reading only the boolean `basin_fills_to_spill`. The
  # gradation is present and only the threshold is missing, so do not conclude
  # from this rule that the pipeline lacks the field. It lacks the number.
  #
  # Read this rule as "the setting is the one Earth's deposits occupy", which is
  # what the minerals layer claims everywhere, and not as a modelled yield.
  brine_lithium_borate:
    name: Lithium-borate brine
    grounding: sourced-negative
    # ONE NAME FOR BOTH ELEMENTS, because the association is what the sources
    # actually assert rather than a compromise between two claims. Risacher and
    # Fritz (2009) treat them in a single section: "Lithium and boron are
    # conspicuous components of waters and brines of Andean salars", both from
    # ignimbrite alteration. Bradley et al. (2013): lithium brines are "commonly
    # associated with borate mineralization in arid, closed basins". Co
    # occurrence is the observation; separating them is the thing no source and
    # no field here supports. The preamble above says what would change that.
    #
    # Munk et al. (2016) give six characteristics common to continental Li
    # brines: arid climate, closed basin with a salar or salt lake, associated
    # igneous or hydrothermal activity, tectonically driven subsidence, a
    # suitable Li source, and time to concentrate. This rule places the first,
    # the second and the fifth; subsidence and elapsed time are not fields this
    # pipeline has, and the third is not required per Risacher and Fritz above.
    #
    # The source gate is NECESSARY rather than decorative, which Munk's own
    # negative case establishes: the closed basins of the Yilgarn craton have the
    # arid climate and the hydrology and almost no lithium, most brines under
    # 0.5 mg/L, and "significant Li brine accumulations have not been reported
    # from intracratonic basins in arid regions". A cratonic catchment with the
    # right climate does not make a Li brine, so excluding shield lithologies
    # here is the sourced part of the rule and not an incidental omission.
    #
    # The host set previously differed between the two rules, borate reading
    # {arc_andesite: 1.0, arc_basalt: 1.0}, which had boron coming out of
    # island-arc basalt. Helvaci (2019) puts the origin at "andesitic to
    # rhyolitic volcanics" and the fertile end at high-silica rhyolitic
    # ignimbrite, so that weight was against the evidence and removing it is what
    # collapsed the two rules into this one.
    catchment_hosts: {arc_andesite: 1.0, rift_bimodal: 1.0, granite: 0.5, granodiorite: 0.5}
    # NO BRINE PATH IS REQUIRED, and that is deliberate rather than an omission.
    # Helvaci gives lake water at pH 8.5 to 11 among the essential conditions for
    # the Anatolian sodium-borate deposits, which would read as this project's
    # alkaline path. Requiring it would delete the Andean borates, which are
    # mined from salars that Risacher et al. (2003) classify as sulfate-rich and
    # calcium-rich rather than alkaline. Two deposit types, one class here, so
    # the narrower gate would be wrong for half of what the class covers.
    #
    # `require_no_overflow` is sourced, and it is the one term here that a source
    # states as a mechanism rather than an association. Bradley et al. (2013):
    # "The single most important factor determining if a nonmarine basin can
    # accumulate lithium brine is whether or not the basin is closed", and if
    # precipitation rises enough "lake water will overtop some point along the
    # drainage divide and drain away, carrying with it any dissolved lithium".
    # That is the lake solver's own spill test, so the gate is the same predicate
