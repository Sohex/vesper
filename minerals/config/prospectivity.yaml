schema_version: 1

# Tectonic and magmatic ore prospectivity, per deposit type, as a 0-1 field.
#
# NOT deposits. A porphyry system is one to two kilometres against a 15.19 km
# mesh cell and a vein is under a hundredth of one, so placing individual bodies
# here would invent detail the grid cannot hold. See docs/src/reference/economic-minerals.md.
#
# NOT a lithology and NOT an erodibility modifier. This field is read only by
# what comes after climate. Nothing upstream may consume it, which is why it is
# computed downstream from the export rather than inside Orogen: a value that
# never exists during generation cannot feed back into erosion or albedo, so the
# constraint is structural instead of remembered.
#
# THESE RULES ARE FIRST ORDER. Each names the control it encodes and that control
# is standard economic geology, but the weights are judgment. They are stated
# here rather than in code so that disagreeing with one is an edit to a config
# and not a patch.

# Exhumation is the axis that separates the two big hydrothermal families, and it
# is the reason this layer is worth computing at all rather than just reading the
# rock map. Both depth claims are grounded; see references/INDEX.md.
#
# PORPHYRY, from Sillitoe (2010): the parental plutons sit at 5-15 km paleodepth
# and feed "vertically elongate (>3 km) stocks or dike swarms and associated
# mineralization" above them, while the high-sulfidation epithermal counterparts
# are at <1 km. He gives no single ore-zone depth, so the 1-5 km used here is a
# BRACKET between those two anchors rather than a figure of his. Either way the
# ore zone is shallow and deep erosion removes it.
#
# OROGENIC GOLD, from Groves et al. (1998), and this corrected the assumption
# the rule was first written on. It is not a 5-15 km band; it is a crustal
# CONTINUUM, "gold deposition from 15-20 km to the near surface environment",
# split into epizonal (<6 km), mesozonal (6-12 km) and hypozonal (>12 km). So
# exhumation does not decide whether orogenic gold is present -- it decides
# which class is exposed. Favouring deep exhumation therefore favours the
# mesozonal and hypozonal deposits specifically, and the rule means that rather
# than the cruder thing it originally said.
#
# The asymmetry survives the correction, which is the point: the same erosion
# that removes a porphyry brings a mesozonal gold system to surface, so a map of
# arcs and fold belts alone cannot tell you which you are looking at. Orogen
# tracks it -- surviving `cover_thickness` means shallow, exposed basement means
# the section above is gone.
exhumation:
  # Cover still present at all: the shallow section survives, so a porphyry
  # emplaced in it can too.
  cover_preserved_km: 0.05
  # `erosionDelta` in model units, above which the section removed is deep
  # enough to have reached an orogenic gold system's formation level. Set from
  # the granite exhumation distribution on this build -- p75 -- rather than from
  # an absolute depth, because erosionDelta carries no physical unit.
  deep_exhumation_delta: 0.058

# THE DIVISOR IS PART OF THE RULE. Each field below is a 0-1 field per deposit
# type, and what "1" means is set here rather than by whichever cell a build
# happened to score highest. `prospectivity_scale.py` argues why at length; the
# short form is that a divisor read from `field[land].max()` is one cell, so a
# generation that produces a single unusually favourable cell rescales every
# other cell downward and no two builds' numbers mean the same thing.
#
# The divisor is instead each rule's attainable maximum, the host weight times
# every modifier at the top of its range, computed in closed form from this
# file. These are the tops of those ranges. A modifier added to the script
# without an entry here fails the ceiling check on the next run.
input_ranges:
  # `r_t_foldBelt` is `min(1, stressNorm * FOLD_BELT_MULT)` in
  # `vendor/orogen/js/elevation.js`, so 1 is a bound by construction rather
  # than an observation, and the saturated fold belt is a real state on this
  # world rather than a limit nothing approaches.
  fold_belt_weight: 1.0
  # `r_t_craton` is `max(0, 1 - tectonicActivity * CRATON_TECTONIC_MULT)`, so 1
  # is a bound by construction too: a cell with no tectonic activity at all.
  craton_weight: 1.0
  # `favour_deep_exhumation` multiplies by `1 + deep`, and `deep` is the boolean
  # test against `deep_exhumation_delta` above.
  deep_exhumation: 1.0
  # Stress enters as `stress_norm`, which is `r_stress / stress_reference`
  # clipped to 1, so its top is 1 by construction once the reference is fixed.
  stress_norm: 1.0

# `r_stress` is a propagated magnitude with no declared range, in model units,
# and it is the one input here that has to be given a scale rather than reading
# with one. The scale is Orogen's own: `elevation.js` computes `maxStress` as
# the `STRESS_PERCENTILE` (0.97) quantile of propagated stress over cells above
# `STRESS_PROPAGATE_MIN` (0.01), and every internal consumer reads
# `stressNorm = min(1, r_stress / maxStress)`. Taking the same reference means
# saturated stress here is saturated stress there.
#
# It is measured once and frozen, exactly as `deep_exhumation_delta` above is,
# because a reference recomputed per build is the defect this block exists to
# remove. Measured on `precarve-craton` and verified against an identity rather
# than assumed: `min(1, min(1, r_stress/reference) * FOLD_BELT_MULT)`
# reproduces the exported `r_t_foldBelt` to 1e-6 over every land cell Orogen
# assigned one. Re-derive it, and check that identity again, if a generation
# changes the plate model or the stress propagation constants.
#
# Reading the build's own `r_stress` maximum instead, which is what this file
# used to do implicitly, took the divisor from a SEAFLOOR cell -- ocean stress
# runs higher than land stress, and the field is land-only.
stress_reference: 1.449732

deposits:

  # Arc magmatism, emplaced shallow above a batholith, and requiring both the arc
  # AND a preserved shallow section: where the arc root is unroofed the porphyry
  # level has already eroded off. On this world 59.5% of the arc belt is stripped
  # to granodiorite, so this rejects most of the arc rather than accepting all of
  # it, which is the point of keying on exhumation.
  #
  # SPLIT by arc type, on Cooke et al. (2005), and the split IS the grounding.
  # Sillitoe gives no host ranking, only that rheology and composition "may
  # strongly influence the size, grade, and type" of mineralization. Cooke gives
  # something better than a ranking: the two metal associations have DIFFERENT
  # distributions. Giant Cu-Mo deposits cluster in central and northern Chile and
  # southwest Arizona, with "compressive tectonic environments, thickened
  # continental crust, and active uplift and erosion"; the 25 largest gold-rich
  # porphyries are "concentrated in the southwest Pacific and South America".
  # Continental arc and island arc are both prospective, for different metals, so
  # a single weighted class would have thrown that away.
  #
  # Orogen already carries the distinction: `arc_andesite` is continental-arc
  # andesite/dacite, `arc_basalt` is island-arc basalt/basaltic andesite.

  porphyry_cu_mo:
    name: Porphyry Cu-Mo
    # Thickened continental crust.
    hosts: {arc_andesite: 1.0, arc_basalt: 0.3, granodiorite: 0.1}
    require_cover: true

  porphyry_au:
    name: Gold-rich porphyry
    # Island-arc association, the southwest Pacific style. Continental arc keeps
    # a lower weight rather than zero, since Cooke also places giant gold-rich
    # porphyries in South America.
    hosts: {arc_basalt: 1.0, arc_andesite: 0.4, granodiorite: 0.1}
    require_cover: true

  orogenic_au:
    name: Orogenic gold
    # Greenschist-facies fold belts, in shear zones. Groves et al. (1998) put
    # the class across the whole crustal column, so deep exhumation does not
    # gate presence -- it selects the mesozonal (6-12 km) and hypozonal (>12 km)
    # deposits, which is what this weighting means. Scales with fold-belt weight
    # and with stress, the available proxy for structural preparation.
    # Host weights from Groves' facies association: "a strong association of
    # gold and greenschist facies rocks", with "some significant deposits" in
    # higher grade terranes and a few extending into granulite facies. So
    # greenschist-grade schist leads and higher-grade gneiss follows at a
    # discount. Quartzite was in this list at 0.5 and has been REMOVED: competent
    # units plausibly act as structural traps, but Groves does not support it and
    # nothing else here does either.
    hosts: {schist: 1.0, gneiss: 0.5}
    fold_belt_weight: 1.0
    stress_weight: 0.6
    favour_deep_exhumation: true

  vms:
    name: Volcanogenic massive sulphide
    # Hannington (2014) gives the settings directly: the modern analogues are
    # black smokers "at modern mid-ocean ridges, submarine volcanic arcs, and in
    # back-arc basins", and he treats ophiolite-hosted massive sulfide as its own
    # familiar case. All three are represented here, weighted by how reachable
    # they are on LAND: obducted ophiolite in the forearc leads, island-arc
    # volcanics follow, and MORB is discounted because ocean floor is not
    # prospectable.
    hosts: {melange: 1.0, arc_basalt: 0.8, morb: 0.3}

  magmatic_nicu:
    name: Magmatic Ni-Cu-PGE
    # Naldrett (2010): these "fall naturally into two major groupings", the
    # komatiite-related class and the class associated "with flood basaltic
    # magmatism". Only the second is available here -- his komatiite class
    # "ranges from 2.7 to 1.9 Ga" and this world has no time axis, so it cannot
    # be Archean. `oib` carries a small weight as the other expression of plume
    # magmatism, which is a weaker inference than the flood-basalt entry.
    hosts: {flood_basalt: 1.0, oib: 0.2}

  podiform_cr:
    name: Podiform chromite
    # Arai & Miura (2015): "Podiform chromitites are commonly found within the
    # Moho transition zone to mantle section of ophiolites, as well as in
    # non-ophiolitic peridotite massifs", hosted in moderately refractory
    # harzburgite. So it needs obducted ocean crust and sits in the MANTLE
    # section -- the same domain as VMS at a different level of the same
    # ophiolite, which is why both key on melange.
    hosts: {melange: 1.0}

  kimberlite:
    name: Kimberlite / diamond
    # Requires a thick, cold cratonic keel. Shirey & Shigley (2013) put it
    # plainly: "only the cratonic lithospheric keel is cold enough at high
    # enough pressures to retain diamonds", with the stability field beginning
    # beyond 140 km depth. This is the only entry that keys on
    # `r_t_craton`, and until the craton basin double-count was removed this
    # world had almost none -- see notes/audits/orogen-lithology.md.
    craton_weight: 1.0
    craton_threshold: 0.30
