# THE LAND COLUMN PROPERTY CONTRACT. Read by
# pedology/scripts/land_column_properties.py.
#
# One vertically explicit description of the simulated land column's hydraulic
# and thermal properties, versioned, with its units, its potential convention
# and its uncertainty cases declared. The contract is
# pedology/notes/land-column-property-contract.md; the finding it rests on is
# biosphere/notes/soil-land-surface-hydraulic-consistency-audit.md finding 1,
# and the ownership graph it feeds is
# hydrography/config/land_water_ledger.yaml.
#
# WHAT THIS IS FOR. This is the ONE description of the simulated land column's
# hydraulics, and every consumer reads it. `land_column_properties.py`
# evaluates the closure declared here and emits per-cell states; ExoPlaSim
# installs the capacity column as its bucket depth `dwmax` and LPJ-GUESS takes
# the states and the per-layer shares through its driver file.
#
# Two consumer-side derivations stood before this one. Pedology's endmember
# volumetric mixture set the capacity ExoPlaSim installed, and LPJ-GUESS
# inverted the Cosby texture regressions for itself and then rescaled the
# result by regolith depth. They were different numbers for the same soil, by
# construction rather than by tuning. WORLD-OF6N removed both; what each
# produced is costed in the report so the removal is attributable.
#
# THE SENTINEL IS `undeclared`, AND IT REFUSES, on the same terms as
# hydrography/config/land_water_ledger.yaml. A property carrying it is
# registered and supplies no number; the report names it and the issue that
# owns it.

version: 2

# ---------------------------------------------------------------------------
# UNITS. One unit per quantity class, stated once, and never a unit that
# depends on gravity without saying so.
# ---------------------------------------------------------------------------
units:
  depth: m                       # below the mineral surface, positive downward
  volumetric_water: m3_per_m3    # of BULK soil volume, never of pore volume
  # Matric potential is a PRESSURE and never a head. A head in metres of water
  # is a pressure divided by rho_w * g, and g here is not Earth's, so a
  # potential carried as a head silently changes value when it crosses into
  # this world. Every Earth-derived retention parameter below is converted to
  # a pressure ONCE, using Earth's gravity, at the point it is declared.
  matric_potential: Pa           # negative in unsaturated soil
  hydraulic_conductivity: m_per_s
  intrinsic_permeability: m2
  volumetric_heat_capacity: J_per_m3_per_K
  thermal_conductivity: W_per_m_per_K
  bulk_density: kg_per_m3

# ---------------------------------------------------------------------------
# THE POTENTIAL CONVENTION, AND WHERE GRAVITY ENTERS.
#
# This is the one place a super-Earth changes a soil property with no free
# parameter, so it is declared before anything is derived from it.
#
# Total hydraulic potential per unit weight is  H = psi / (rho_w g) + z.
# Two of the three states below are defined at a matric potential and the
# third is not, and they respond to gravity differently:
#
#   SATURATION is a geometric property of the pore space. Gravity does not
#   enter. It is the same number on any planet.
#
#   THE WILTING POINT is a PLANT pressure: the suction a root can generate
#   before it can no longer extract. Gravity does not enter that either, so
#   the Earth value carries over as a pressure unchanged.
#
#   FIELD CAPACITY IS AN OPERATIONAL DRAINAGE EQUILIBRIUM: the water a column
#   retains against gravity once free drainage has stopped, over a stated
#   drainage length. The length is a length; the matric pressure that balances
#   it is rho_w * g * L, and THAT scales with g. Cosby's own field-capacity
#   suction, 10^2 cm of water, is exactly rho_w * g_earth * 1 m, which is what
#   makes the drainage length the honest way to state it.
#
# So on this world, the same soil drains to a drier state than it would on
# Earth, the wilting point does not move, and plant-available water falls. The
# effect is one-directional and derivable, and it IS APPLIED: the emitted states
# evaluate field capacity at this planet's gravity and every consumer installs
# them.
#
# THE TRAP THIS BLOCK EXISTS TO CLOSE. Cosby's parameters are recorded as heads
# in centimetres of water. Air entry is a CAPILLARY pressure and the wilting
# point is a PLANT pressure, so BOTH are invariant and both of their heads scale
# by the same factor when gravity changes. The closure reads them only through
# their ratio, so done consistently the wilting point does not move at all.
# Converting one and not the other mixes two frames and produces a wilting point
# that moves for a bookkeeping reason. `land_column_properties.py` evaluates the
# closure in PRESSURE for that reason, and checks the two consistent frames
# against each other and against the mixed one.
# ---------------------------------------------------------------------------
potential_convention:
  # Read at run time from config/planet.yaml, which is the single source of
  # truth for the planet. Restated here only as the name of the key.
  gravity_from: config/planet.yaml model-independent planet.gravity_m_s2
  earth_gravity_m_s2: 9.80665
  water_density_kg_m3: 1000.0
  # The drainage length field capacity is defined against. A DECLARATION:
  # a drainage equilibrium has to be cut somewhere and this says where.
  # 1 m reproduces Cosby's 10^2 cm of water suction exactly under Earth
  # gravity, which is why it is 1 m and not a rounder-looking number.
  field_capacity_drainage_length_m: 1.0
  # The plant pressure. Earth-derived and gravity-independent, so it crosses
  # unchanged. 10^4.2 cm of water under Earth gravity, which is the value
  # `soilinput.cpp` inverts at.
  wilting_point_pa: -1.5468e+6
  wilting_point_source: >
    LPJ-GUESS soilinput.cpp Psi_wilt = 10^-4.2 in the Cosby inversion's units,
    which is 10^4.2 cm of water suction, 1.5468 MPa under Earth gravity. The
    conventional -1.5 MPa to within 3 percent, and the model's own number
    rather than the textbook one.

# ---------------------------------------------------------------------------
# THE RETENTION CLOSURE. A NAMED PROPERTY WITH ITS FAMILY STATED.
#
# This project sits entirely in one family without having recorded that a
# family was chosen. LPJ-GUESS's Cosby (1984) derivation is a Clapp-Hornberger
# form and PALADYN uses Clapp-Hornberger too. The alternative family is van
# Genuchten, and the two differ most in their tails: Brooks-Corey and
# Clapp-Hornberger have a discontinuous air-entry point and a power-law tail,
# van Genuchten is smooth through saturation.
#
# That difference matters HERE specifically, because wetting and drying through
# near-saturation is a common state on this land rather than an edge case: a
# large share of it is playa clastic, which LITH-27 establishes is derived from
# endorheism and therefore carries the same pre-carve limit and moves with the
# carve list. The argument is about a class of surface this terrain produces,
# not about a settled area.
#
# This is NOT an argument for switching. It is the reason the closure is a
# named property with its family stated, so a consumer knows which it is
# reading and a later comparison has something to vary.
# ---------------------------------------------------------------------------
retention_closure:
  name: clapp_hornberger
  family: brooks_corey
  form: theta(psi) = theta_s * (psi / psi_s) ** (-1 / b)
  parameter_source: cosby1984_table4
  air_entry: discontinuous
  alternatives_registered: [van_genuchten]
  note: >
    Named so the choice is legible and comparable. Cosby et al. support texture
    as a predictor of MEAN hydraulic behaviour and emphasise that large
    residual variance remains within texture classes, so the closure carries
    the shape and the uncertainty cases below carry the spread.

# ---------------------------------------------------------------------------
# LAYER GEOMETRY. The contract's own vertical discretisation, and the mapping
# to each consumer's. Two geometries, stated once each, rather than one
# geometry restated in three places that do not stay in step.
# ---------------------------------------------------------------------------
geometry:
  # PHYSICAL layers: where water is and moves. Uniform 100 mm to 1.5 m, which
  # is LPJ-GUESS's physical profile and the only column in the pipeline that
  # has a depth at all. Matches the ledger's `column_base_m`.
  physical_layer_thickness_m: 0.1
  physical_layer_count: 15
  column_base_m: 1.5
  # ROOTABLE layers: where uptake is allowed to draw from. A subset of the
  # physical column, and NOT the same cut. Matches the root zone the abiotic
  # nutrient ledger cuts its solute pools at.
  rootable_base_m: 1.0
  # The contact with the aquifer. Below this the material, its scale and its
  # owner all change: see `aquifer_boundary`.
  vadose_base_m: 1.5
  consumers:
    exoplasim:
      geometry: 3 liquid water layers of 0.02, 0.48 and 1.0 m, ACTIVE only at nlandwcol 1
      what_it_reads: evaporable_mm from the emitted states as the column capacity `dwmax` in metres of water, and the per-layer usable shares grouped onto its three water layers as the capacity SPLIT `dsoilwfc`
      note: >
        `dwmax` is a capacity, not a thickness. The geometry above is the
        running one -- `surface.land_water_column` declares `layered` at these
        three layers -- and the 0.5 m boundary in it is not a free choice: it is
        exactly this file's own 500 mm upper and 1000 mm lower grouping, which
        is the only cut at which the climate column and the ecology column share
        a boundary. LSHY-5 needs them to share it, because two columns cannot
        agree about frozen soil across geometries that do not meet. The 0.02 m
        cut ABOVE it is `surface_layer`, and it moves no boundary either column
        reads: 0.02 + 0.48 is 0.5.

        `evaporable_mm` and not `awc_mm`, and the difference is one layer deep.
        A root cannot reach the water between air dry and the wilting point and
        a bare drying surface can, so the surface layer's capacity is cut from
        air dry and the column's is the sum. LPJ-GUESS reads `awc_mm`, which is
        unchanged. See `surface_layer`.

        THE CAPACITY SPLIT IS A FIELD, on the same footing as the capacity it
        splits. It is not one shape: measured over this build's land cells the
        upper layer's share sits at the geometric 500/1500 wherever the profile
        is uniform -- the quarter of land where the regolith fills the column,
        plus the cells whose weathered bedrock is at the capacity ceiling -- and
        rises to nearly nine tenths everywhere the regolith contact and the
        bedrock fraction reweight it. So it crosses as surface code 2290, one
        record per water layer, derived from the SAME per-layer usable shares
        the `awc_mm` column is the integral of: the split and the capacity are
        one arithmetic rather than two that agree today. `dsoilwf` in
        `landmod_nl` is what a cell no field covers takes. WORLD-VJBZ.

        Its five SOIL TEMPERATURE layers are a THIRD geometry, 0.4/0.8/1.6/3.2/
        6.4 m, which reaches 12.4 m and shares no boundary with either water
        column; landmod maps between them by midpoint.
    lpj_guess:
      geometry: 15 physical layers of 100 mm, grouped 5 upper and 10 lower
      what_it_reads: the emitted states and the per-layer usable shares, through its driver file; and sand, clay, silt, pH, organic carbon and the mineral-reactivity columns from the soil map
      note: >
        `vesperinput.cpp` multiplies each layer's awc, wp and wsats by the
        usable share emitted here, and rescales the two aggregate figures to
        match. It moves no layer boundary and no root, so a shallow-regolith
        cell has the same rooting depth as a deep one with less water in it.
        The share is READ: the weathered-bedrock vertical rule is evaluated
        once, by the enforcing script, and was implemented in both places until
        WORLD-OF6N.
    pedology:
      geometry: one bulk column cut at `column_base_m`
      what_it_writes: >
        the soil map's texture, regolith depth, weathered-bedrock fraction,
        organic and andic columns, which this contract's states are derived
        FROM. Its `awc` column is pedology's own declared endmember mixture,
        cut at the column base under WORLD-7702, and no consumer reads it: it
        is the alternative the report costs the adopted closure against.

# ---------------------------------------------------------------------------
# THE SURFACE LAYER. The ONE description of the top of the simulated land
# column, and the reason it is here rather than in either consumer.
#
# Two things read the top of this column at a depth of their own. The dust
# scheme's threshold correction takes a GRAVIMETRIC water content over its
# emitting depth; the soil albedo takes a DEGREE OF SATURATION over its albedo
# depth. Neither depth need be the other, and both are readings off ONE
# profile. DUST-17 owns the emitting depth and forbids a second central
# hydrology; PHYS-15 owns the albedo depth and consumes this rather than
# deriving one. `aeolian/config/dust.yaml`'s `moisture.soil_depth_m` is the
# emitting depth and reads `thickness_m` below once DUST-17 lands; until then
# it carries 0.5 m, which is the top water layer read whole.
#
# WHY IT IS A LAYER AND NOT A DIAGNOSTIC. The climate column's liquid water is
# a tipping-bucket cascade: the surface flux enters the top layer, each layer
# fills to capacity and passes its excess down, and a withdrawal larger than
# the top layer holds draws on the layers beneath. A store 0.02 m deep
# therefore empties under evaporation in about a day and refills with the first
# rain, where the 0.5 m layer above it relaxes on the column's own timescale.
# That distinction is not a refinement: Craft and Horel measure a salt crust
# recovering from 0.22 to 0.32 in EIGHT DAYS after flooding, so an albedo
# driven from a 0.5 m store is wrong in PHASE and not merely imprecise.
#
# TWO CHANGES, AND ONLY ONE OF THEM MOVES WATER.
#
#   THE SPLIT is free and exact. Splitting the top layer at `thickness_m` while
#   holding the column's total capacity fixed leaves the total the cascade
#   carries BITWISE unchanged, because what enters is the surface flux and what
#   leaves is base overflow and neither depends on where the internal
#   boundaries are. `pedology/scripts/land_column_properties.py`
#   `check_split_invariance` drives the model's own kernel at both layer counts
#   and requires exactly that.
#
#   THE FLOOR is a real change and it is declared. `available` is
#   field capacity minus wilting point because that is what a ROOT can remove,
#   and evaporation from a bare surface is not a root: the top of a drying soil
#   goes to air dry, which is below the wilting point and outside every state
#   this contract's capacity carries. So the surface layer's capacity is cut
#   from `air_dry` instead, and the column's capacity gains
#   `thickness_m * theta_wp` over that layer. `awc_mm` is unchanged and is what
#   LPJ-GUESS reads; `evaporable_mm` is the sum and is what ExoPlaSim installs
#   as `dwmax`. They are two different quantities and not one number stated
#   twice: a root cannot reach the water between air dry and the wilting point
#   and a bare surface can.
# ---------------------------------------------------------------------------
surface_layer:
  thickness_m: 0.02
  thickness_source: >
    ClimaLand's `albedo_calc_top_thickness`, read from
    references/climaland/src/standalone/Soil/soil_albedo.jl, which is the
    artifact rather than a description of one. Its `update_albedo!` falls back
    to the whole top layer when no layer is centred above that depth, which is
    what the 0.5 m column was doing. 0.02 m is ALREADY generous against the
    optical penetration depth of a soil, which Ciani et al. put at the
    micrometre to millimetre scale through Sadeghi, Jones and Philpot (2015);
    it is an upper bound on the depth a radiation scheme sees, and the
    direction of that bound is stated because it is the direction that
    UNDERSTATES how fast the modelled surface dries.
  shares_a_boundary_with: >
    the 0.5 m cut. 0.02 + 0.48 + 1.0 keeps the climate column's water layer
    boundary at 0.5 m, which `geometry.consumers.exoplasim` argues is the only
    two-layer cut where the climate column and the ecology column meet. LSHY-5
    needs them to meet, so a surface layer that moved that boundary would not
    be admissible however thin it was.
  lower_bound: air_dry
  air_dry_water_content: 0.0
  air_dry_argument: >
    ZERO, AND IT IS A DECLARATION RATHER THAN A MEASUREMENT. Two things make it
    the right one. It is the state every dry endmember this project stages is
    MEASURED at -- the ECOSTRESS and POSEIDON spectra `analysis/rock_albedo.py`
    and `analysis/rock_albedo_bands.py` integrate are prepared laboratory
    samples at or near zero water content -- so an empty surface layer and the
    staged dry albedo are the same state and the mixing has no level shift at
    its dry end. And it is a bound whose direction is known: a real soil holds
    adsorbed water at the ambient humidity, so this makes the layer give up at
    most `thickness_m * theta_ad` more water than it should, which the report
    states per build as `surface_layer.air_dry_overdraw_mm`.

    THE ALTERNATIVE IS REGISTERED AND NOT ADOPTED. Air dry could be evaluated
    through this contract's own retention closure at the Kelvin-equation
    potential of a declared relative humidity, which is around -160 MPa at 30
    percent and 293 K. That is a hundredfold extrapolation past the wilting
    point and far outside the suctions Cosby's samples were fitted over, and
    Clapp-Hornberger has no adsorption branch at all, so it would report a
    number the closure cannot support. Adopting it needs a dry-end retention
    form -- Campbell and Shiozawa, or Rossi and Nimmo -- which this project
    does not hold.
  capacity_form: thickness_m * (theta_fc - air_dry_water_content) * usable
  capacity_note: >
    The layers BENEATH it keep `theta_fc - theta_wp` unchanged, so
    `thermal.saturation_mapping`'s `sr_at_wilting_point` and
    `sr_at_field_capacity` still describe them exactly and the soil heat
    solver, which maps its 0.4 m first temperature layer onto the 0.48 m water
    layer by midpoint, reads a layer whose semantics have not moved.
  saturation_mapping:
    form: Sr = sr_at_air_dry + f * (sr_at_field_capacity - sr_at_air_dry)
    f_is: the surface layer's liquid store as a fraction of its own capacity
    sr_at_air_dry: 0.0
    sr_at_field_capacity_from: thermal.saturation_mapping.sr_at_field_capacity
    note: >
      A SECOND mapping and not a second hydrology. It differs from
      `thermal.saturation_mapping` in ONE place, the lower endpoint, because
      the surface layer's capacity is cut from air dry and the layers below it
      are cut from the wilting point. The upper endpoint is the same number,
      read from there rather than restated here.
  frozen_water: >
    EXCLUDED, and by construction. The store the mapping reads is the layer's
    LIQUID water; ice in the same layer occupies pore space and comes off the
    capacity, so a frozen surface layer reads as a dry one. That is the
    behaviour both consumers want -- ice in the pores neither darkens the
    modelled surface nor raises the dust threshold the way liquid water does --
    and it needs no switch, because under the default `nlandwphase = 0` there
    is no soil ice at all.
  consumers:
    albedo:
      owner: phys-15
      depth_m: 0.02
      reads: the degree of saturation, through `surface_layer.saturation_mapping`
      note: >
        `landmod`'s `getalb` under `nwetsoil = 1` mixes the staged dry and wet
        band pairs on this saturation. The mixing form is Sadeghi, Jones and
        Philpot (2015): linear in the Kubelka-Munk transformed reflectance and
        therefore NOT linear in the albedo, which is the CLM form this row
        started from and which no longer describes the shape between the ends.
    dust_emission:
      owner: dust-17
      depth_m: undeclared
      reads: a gravimetric water content, through this layer's bulk density and thickness
      note: >
        The emitting depth is DUST-17's and is not this contract's to set. What
        is settled here is that whatever depth it declares is a reading off
        this profile: `aeolian/config/dust.yaml` states the gravimetric
        conversion once and reaches the model as the single namelist constant
        `dustwcv`, and the surface layer is what that conversion applies to.
        Until DUST-17 lands, that file's `moisture.soil_depth_m` is 0.5 and the
        two rows are reading different depths off the same column, which is
        legal and is why the depth is a per-consumer field here.

# ---------------------------------------------------------------------------
# MATERIAL FRACTIONS. What the column is made of, per physical layer. The
# vertical distribution rule is part of the contract, because pedology and
# LPJ-GUESS presently use different ones and neither says so.
# ---------------------------------------------------------------------------
materials:
  mineral:
    fractions_from: pedology soilmap sand, clay, silt
    vertical_rule: uniform
    note: >
      Pedology emits one texture per cell and both consumers apply it to every
      layer. A texture profile is a real thing this contract does not yet
      carry; declaring the rule as `uniform` is what makes that visible.
  organic:
    fraction_from: undeclared
    vertical_rule: lawrence_slater_2008_fixed_profile
    owner: sdec-10
    note: >
      LPJ-GUESS redistributes total soil carbon down a fixed Earth profile
      under `iforganicsoilproperties 1` and mixes mineral and one ideal organic
      soil following Lawrence and Slater; pedology adds an additive organic
      term to a bulk capacity with no profile at all. Two rules, one soil.
      Undeclared rather than zero: the checked-in soil map carries zero soil
      carbon everywhere, which makes the two rules AGREE today and will not
      once the biosphere loop has turned.
  andic:
    fraction_from: pedology soilmap andic
    vertical_rule: uniform
    hydraulic_effect: undeclared
    owner: world-nupa
    note: >
      Allophane holds water in a way texture does not predict. The adopted
      closure is a texture regression and has no andic term, so the fraction is
      emitted, read onto the simulated soil and responded to by no equation in
      the retention curve. That is a DECLARED ABSENCE rather than a
      disagreement between consumers: it used to be a term pedology carried and
      LPJ-GUESS did not.
  weathered_bedrock:
    fraction_from: pedology soilmap bedrockfrac
    vertical_rule: below the regolith contact at `depth`
    capacity_ceiling: 1.0
    emitted_as: >
      one usable share per physical layer, in the states file. The share of the
      layer above the contact plus `bedrockfrac` capped at `capacity_ceiling`
      below it, and ONE number per layer rather than three because the same
      share scales that layer's available water, its wilting point and its
      saturation.
    note: >
      Capped at 1, so sub-bedrock material can at most match the soil above it.
      Deeply weathered saprolite really does hold two to four times what its
      soil does, and representing that needs a genuinely separate bedrock layer
      with its own porosity rather than a rescaling of the existing profile.
      The ceiling is a limitation of the model and is recorded so it is visible
      in results. ExoPlaSim sees regolith depth only through the total capacity
      and sees no bedrock storage at all.

# ---------------------------------------------------------------------------
# STATES. Volumetric water content at each declared point on the retention
# curve, and the ordering that must hold between them.
# ---------------------------------------------------------------------------
states:
  ordering: residual <= wilting_point <= field_capacity <= saturation
  saturation:
    definition: total porosity; the geometric pore volume per bulk volume
    gravity_dependent: false
    from: cosby1984 Theta_s = 0.01 * (50.5 - 14.2 * sand - 3.7 * clay)
  field_capacity:
    definition: >
      water retained against gravity at drainage equilibrium over
      `field_capacity_drainage_length_m`
    gravity_dependent: true
    evaluated_at: psi = -water_density * gravity * drainage_length
    limitation: >
      The adopted value holds the Clapp-Hornberger exponent fixed while gravity
      moves, so it is an UPPER BOUND on how far a gravity-invariant retention
      curve can drain: the whole of the shift is carried by the pressure and
      none by the curve's shape. Adopted as an upper bound rather than left at
      Earth's suction because the shift moves every cell the same way, so
      unlike a scatter it does not average out over the map, and because
      leaving it out is not a neutral choice -- it is a claim that this world's
      columns drain to Earth's equilibrium.
  wilting_point:
    definition: water held at the plant limiting pressure
    gravity_dependent: false
    evaluated_at: psi = wilting_point_pa
  residual:
    definition: water held below the wilting point and not removable by a root
    gravity_dependent: false
    value: undeclared
    owner: lshy-3
    note: >
      Both active evaporation limiters pin the residual at zero, so each
      approaches zero flux only as its store approaches empty and water held
      below the wilting point is still available to be removed. Declared
      undeclared rather than zero, because zero is a choice and this contract
      is where it would be recorded.
  available:
    definition: field_capacity - wilting_point
    gravity_dependent: true
    gravity_note: >
      A difference of a state that moves with gravity and one that does not, so
      it moves, and by more in relative terms than field capacity does. This
      contract's own check caught the omission: `available` was declared silent
      on gravity while the two states it is built from were not.
    note: >
      This is the ONLY state ExoPlaSim receives, as `awc_mm`. It is a difference
      of two states and carries neither, so nothing downstream of `dwmax` can
      recover saturation, and water between field capacity and saturation has
      nowhere to sit. LPJ-GUESS carries the same limitation from the other
      side: `wcont` is a fraction of AVAILABLE capacity refused outside [0,1],
      so water-filled pore space derived from it has a ceiling set by the ratio
      of field capacity to saturation.

# ---------------------------------------------------------------------------
# FLOW PROPERTIES.
# ---------------------------------------------------------------------------
flow:
  saturated_conductivity:
    value: undeclared
    owner: lshy-3
    note: >
      No artifact in this repository carries a saturated hydraulic
      conductivity. LPJ-GUESS derives an empirical PERCOLATION COEFFICIENT
      instead, `perc_base = 5.87 - 0.29 * b`, from a linear fit between
      Haxeltine's percolation coefficient and Cosby's b. That is a
      dimensionless exponent in a drainage rule and not a conductivity, so it
      cannot be converted into one, and any gradient-driven column needs a
      conductivity declared here rather than recovered from it.

      That is why `perc_base` stayed in `soilinput.cpp` when the retention
      states left it. The contract supplies the closure's exponent `b`, which
      the fit reads; the fit itself is a property of that model's drainage rule
      and belongs to it. Its value has not moved.
  unsaturated_conductivity:
    form: K(theta) = K_sat * (theta / theta_s) ** (2 * b + 3)
    value: undeclared
    owner: lshy-3
    note: the Clapp-Hornberger companion to the retention closure above; declared for the family, not yet for the number.
  infiltration_capacity:
    value: undeclared
    owner: lshy-3
    note: >
      Absent from both columns. ExoPlaSim's only runoff mechanism is saturation
      excess -- the bucket overflowing -- so an infiltration-excess event on a
      dry soil generates no runoff at all, whatever the rainfall rate.
  frozen_pore_impedance:
    form: (1 - ice / pore) ** k, on the ice fraction of the pore space
    exponent: undeclared
    owner: lshy-5
    note: >
      How much ice in the pore space reduces CONDUCTIVITY. The form is declared
      in landcolumn.f90 as `frozen_impedance` and is used by nothing, because
      the scheme that would use it is the gradient-driven hypothesis and this
      column has no conductivity to reduce. The layered column impedes flow the
      other way and needs no exponent for it: ice occupies pore space, so it
      comes off the layer's capacity and a frozen layer overflows sooner. Under
      the default nlandwphase = 0 there is no soil ice at all, so the answer
      today is "none".

# ---------------------------------------------------------------------------
# THERMAL PROPERTIES. Phase- and composition-dependent, or a DECLARED reduced
# approximation. The reduced approximation is what is active.
# ---------------------------------------------------------------------------
thermal:
  active_approximation: water_dependent_two_endpoint
  reduced_approximation_declared: >
    ExoPlaSim's five soil temperature layers interpolate between a dry and a
    saturated endpoint on the water the column itself carries, mixed with
    glacier ice by the glacier fraction. What they still do not respond to is
    TEXTURE, organic and andic material, the phase of that water, or regolith
    geometry: the endpoints are scalars evaluated at this build's median column
    and the saturation mapping is a pair of medians, so a cell whose texture is
    far from the median gets the median column's endpoints. That is a declared
    reduced approximation and not an oversight. What made the previous one a
    defect was not the reduction but the silence: nothing declared it, so a
    result that depended on soil thermal inertia looked like a property of the
    soil rather than of a constant nobody had sourced.
  what_was_replaced: >
    One conductivity and one heat capacity for the whole simulated planet,
    1.8 W/m/K and 2.4e6 J/m3/K, Earth's global average for a moist mineral soil
    and unattributed upstream. Their thermal inertia is 2078 J/m2/K/s^0.5, which
    is above the saturated endpoint of this build's own median column and
    therefore above every state the model's store can reach.
  constants:
    glacier_ice_heat_capacity_j_m3_k: 1.719633e+6
    snow_heat_capacity_j_m3_k: 0.6897e+6
    glacier_ice_thermal_conductivity_w_m_k: 1.961145
    snow_thermal_conductivity_w_m_k: 0.3170
    source: >
      DERIVED in the model from the density of the material each belongs to --
      the glacier pair from `rhoglac` in `glaciermod`, the snow pair from
      `rhosnow` in `landmod` -- rather than declared beside it.
      `analysis/ice_properties.py` computes all four and holds the compiled
      literals to what it computes.
  phase_dependent:
    heat_capacity: >
      Active under nlandwphase = 1 only as the LATENT term: landmod's
      `landphase` exchanges the latent heat of fusion between the water layer
      and the soil temperature layer that contains its midpoint, so freeze and
      thaw now cost and release energy in the ground. The SENSIBLE half is
      still the constant below: the heat capacity does not change with liquid
      or ice fraction.
    latent_heat_of_fusion_j_per_kg: als - alv, the difference the model derives
    layer_mapping: >
      DECLARED, and by midpoint. The soil temperature layers (`dsoilz`, five,
      reaching 12.4 m) and the water layers (`dsoilwz`) share no boundary, so a
      water layer takes the temperature of whichever temperature layer contains
      its centre. The alternative -- making one column a sub-partition of the
      other -- changes the soil heat solver's geometry and is a larger decision.
    owner: lshy-5
  composition_dependent:
    mixture_law: >
      DECLARED for the mineral and water composition, and it is the same
      formulation the conductivity comes from rather than a second one. The
      volumetric heat capacity is the volume-weighted sum over the phases
      present, c = (1 - theta_s)*c_solid + theta*c_water, which is LINEAR in the
      degree of saturation; the conductivity is Johansen's interpolation between
      a dry and a saturated value through the Kersten number, which is not.
      Carrying both from one source is what stops a consumer mixing a linear
      capacity with a linear conductivity and calling the pair a soil.
    source: >
      Farouki (1981), CRREL Monograph 81-1, Section 7.11 and Table 24, read
      2026-08-26. `analysis/soil_thermal_inertia.py` implements it and
      `notes/audits/soil-thermal-inertia.md` measures what each term is worth.
    c_solid_j_m3_k: 2.0e+6
    c_water_j_m3_k: 4.18e+6
    what_is_still_absent: organic matter, and it is a REGISTERED ABSENCE rather than a silence
    organic_thermal_term:
      value: undeclared
      owner: sdec-10
      note: >
        Lawrence and Slater show organic matter changes hydraulic AND thermal
        properties together, and their result depends on the vertical organic
        state. The organic FRACTION is undeclared in `materials.organic` and is
        sdec-10's, so the thermal term cannot be declared ahead of it; a
        contract that carried an organic profile for water and a constant for
        heat would have split one material property in two, and the two are now
        undeclared together and for one reason. The checked-in soil map carries
        zero soil carbon everywhere, so this term is zero today whatever it
        turns out to be.
    ice_in_the_mixture: >
      NOT SEPARATED from liquid water. Ice occupies the same pore space and this
      declaration gives it water's heat capacity and water's conductivity, so
      what the mixture responds to is the pore FILLING and not its phase. Under
      the default `nlandwphase = 0` there is no soil ice at all and the
      approximation is exact; with phase on it understates a frozen layer's
      conductivity, ice conducting about four times what liquid water does.
    owner: lshy-5

  # -------------------------------------------------------------------------
  # THE SATURATION MAPPING. How a consumer turns its own liquid store into the
  # degree of saturation the thermal relations above are functions of.
  #
  # This is the piece a consumer cannot derive for itself, and it is the reason
  # world-jsfm was blocked on this contract rather than on effort. ExoPlaSim's
  # `dwatc` is metres of water against `dwmax`, a PLANT-AVAILABLE capacity: an
  # empty store is the wilting point and a full one is field capacity. A degree
  # of saturation is a fraction of PORE volume. Turning one into the other needs
  # the retention states, which are this contract's.
  # -------------------------------------------------------------------------
  saturation_mapping:
    form: Sr = sr_at_wilting_point + f * (sr_at_field_capacity - sr_at_wilting_point)
    f_is: the consumer's liquid store as a fraction of its own capacity, which is exact by the definition of that capacity
    statistic: >
      DECLARED AS A MEDIAN over the build's land cells, with the spread beside
      it. The two endpoints are theta_wp/theta_s and theta_fc/theta_s, both of
      which this contract emits per cell, so a consumer that could read a field
      would not need these at all; ExoPlaSim's soil heat solver takes scalars,
      and stating which statistic they are is what makes that a declared
      reduction rather than a number picked. `land_column_properties.py`
      recomputes both from the emitted states and refuses when they drift from
      what is written here.

      NOBODY TYPES THEM. The four numbers below are the median and the spread of
      a distribution that moves with every soil rebuild, which is every turn of
      loop A, so `land_column_properties.py --update-declaration` writes them
      from the same measurement the refusal is made on. That is what keeps a
      declared constant from quietly describing the previous build's soil while
      the check is the only thing that knows. It also prints every other place
      the pair is restated and which of them the rebuild has left stale.
    sr_at_wilting_point: 0.3636
    sr_at_field_capacity: 0.7543
    sr_at_wilting_point_p5_p95: [0.2537, 0.4915]
    sr_at_field_capacity_p5_p95: [0.6452, 0.8564]
    tolerance: 0.002
    what_this_bounds: >
      THE LAYERS THIS MAPPING DESCRIBES CANNOT REACH A DRY SOIL, and that is the
      finding rather than a caveat. An empty store is the wilting point, well
      above air dry, so the thermal inertia a store-driven column can span is a
      small part of the full air-dry-to-saturated sweep; both factors are
      emitted per build under `thermal_reduction.thermal_inertia_j_m2_k_s05` in
      the report, and they move whenever the soil does. The difference is water
      held below the wilting point, which the soil physically carries and these
      layers' capacity does not represent, and it is why the dry playa and
      salt-crust surfaces cannot be given their own inertia by this route
      however the endpoints are set.

      `surface_layer` is the thin layer that DOES dry below the wilting point,
      and it carries its own mapping for that reason. What it does not yet reach
      is the soil heat solver: landmod maps its 0.4 m first temperature layer
      onto the 0.48 m water layer by midpoint, so the temperature column still
      reads a store floored at the wilting point and the inertia of a dry playa
      is still out of its range. Giving the heat solver the surface layer means
      a temperature layer thin enough to sit above 0.02 m, which is a change to
      that column's geometry and is LSHY-5's.
    owner: lshy-5

  # -------------------------------------------------------------------------
  # THE ENDPOINTS the interpolation runs between, for a consumer that carries
  # scalars. Derived from the relations above at the build's own median column,
  # not chosen: the median bulk density of the soil map and the median quartz
  # fraction of the parent materials this world's land carries.
  # -------------------------------------------------------------------------
  endpoints:
    evaluated_at:
      bulk_density_kg_m3: 1500.0
      quartz_fraction: 0.30
      statistic: the median of the soil map's bulk density, and the median quartz fraction of the declared parent materials
    dry:
      thermal_conductivity_w_m_k: 0.2088
      volumetric_heat_capacity_j_m3_k: 1.1111e+6
    saturated:
      thermal_conductivity_w_m_k: 1.4332
      volumetric_heat_capacity_j_m3_k: 2.9689e+6
    tolerance: 0.005
    spread: >
      The saturated conductivity is the one endpoint parent material moves, and
      it moves it by a factor of 1.36 across the classes this world's land
      carries; the dry conductivity carries no mineralogy at all, so the dry
      endpoint is a property of bulk density alone. Bulk density is 1500 kg/m3
      on most of this land and its p5 is 1448, so the column these are evaluated
      on is close to the whole of it.
    what_the_model_carried_instead: >
      One conductivity and one heat capacity for the whole simulated planet,
      whose thermal inertia is 2078 J/m2/K/s^0.5. That is ABOVE the saturated
      endpoint of this column, 2063, and therefore above every state the store
      can reach: a full column reaches 1834 and an empty one 1342. So the
      constant was not a mid-range value, it was past the wet end.
    owner: world-jsfm
  snow_density_kg_m3:
    exoplasim: 330.0
    lpj_guess_start: 275.0
    lpj_guess_end: 500.0
    owner: grav-8
    note: >
      A constant in the climate column with no compaction, and an ageing curve
      in the ecology. Snow depth follows from water equivalent and density, and
      depth is what sets the insulating thickness over the soil, so the two
      columns insulate differently from the same snowfall. The one snow term
      that carries gravity is the compaction that is absent.

# ---------------------------------------------------------------------------
# THE AQUIFER BOUNDARY. What this contract does NOT own.
# ---------------------------------------------------------------------------
aquifer_boundary:
  contact_depth_m: 1.5
  owned_by: hydrography groundwater solver
  property: transmissivity, as K times saturated thickness
  rule: >
    A vadose-zone unsaturated conductivity is NOT an aquifer permeability.
    They live at different material and spatial scales, they are measured on
    different things, and copying one into the other is a category error with
    plausible units. The two are joined at `contact_depth_m` through the
    ledger's `drainage` and `capillary_rise` terms and through nothing else.
  scaled_separately: true

# ---------------------------------------------------------------------------
# UNCERTAINTY CASES. CORRELATED, and named. Three cases applied coherently
# across every layer and every property, never sampled per layer.
#
# Why correlated: a soil that holds more water at one depth holds more at the
# next, because the same texture, the same organic content and the same
# endmember uncertainty produced both. Drawing each layer independently
# averages the spread away and reports a false precision, which is exactly what
# a per-layer bracket would do to a 15-layer column.
# ---------------------------------------------------------------------------
uncertainty:
  cases: [low, central, high]
  applied: coherently across all layers and all properties in one case
  sources:
    cosby_within_class_variance:
      brackets: the adopted closure, which is what every consumer installs
      from: cosby1984 Table 4, the S.D. rows
      reference: references/cosby_1984_a-statistical-exploration-of-the-relationships-of-soil-moisture-charac.pdf
      # Standard deviation of each parameter WITHIN a texture class, regressed
      # on texture in the same table and the same fit whose mean rows are the
      # central case. Coefficients per PERCENT, as Cosby writes them; the
      # evaluator converts to fractions once, at `cosby_parameter_spread`.
      sd_b: 0.92 + 0.0492 %clay + 0.0144 %silt
      sd_log_psi_s: 0.72 - 0.0026 %silt + 0.0012 %clay
      sd_theta_s_percent: 8.23 - 0.0805 %clay - 0.0070 %sand
      case_deviate: 1.0
      evaluated_by: pedology/scripts/land_column_properties.py cosby_parameter_spread
      note: >
        THE UNCERTAINTY OF THE ADOPTED CENTRAL CASE. Texture explains the mean
        structure of the retention parameters over Cosby's 1,448 samples, and
        the spread that survives inside a texture class is large: the
        exponent's within-class standard deviation is about a third of its
        mean. It is larger than everything else in this block put together and
        larger than the gravity shift the field capacity declares as an upper
        bound, which the report measures rather than asserts.

        AN ENVELOPE, NOT A DISTRIBUTION. The low and high cases are the
        per-cell extremes over the corners of the one-sigma box in the three
        parameters. Cosby reports the three residual spreads separately and no
        correlation between them, so no corner can be excluded and none can be
        weighted; a published correlation could only narrow this. The saturated
        conductivity's S.D. row is in the same table and is deliberately not
        read here, because this contract declares no conductivity for it to be
        the spread of.

        The states every consumer installs are the CENTRAL case. Emitting a
        case instead is one argument to `contract_states`, and nothing
        downstream of the states file knows which case it read.
    volumetric_capacity_endmembers:
      from: pedology/config/pedogenesis.yaml water.volumetric_capacity_by_texture_bracket
      brackets: pedology's endmember mixture, NOT the adopted closure
      note: >
        Declared endmembers with a bracket spanning the conventional range for
        each class, checked against Saxton and Rawls (2006) for ordering and
        magnitude rather than taken from it: that regression parameterises a
        continuous mixture and excluded samples above 60 percent clay, so a
        pure endmember is outside the data it was fitted on.

        THIS NO LONGER BRACKETS THE CENTRAL CASE. WORLD-OF6N adopted the Cosby
        retention closure, and these endmembers parameterise the mixture that
        was not adopted. The soil map still carries the bracketed capacity as
        pedology's own field, so the bracket is still what THAT number is worth;
        it says nothing about the states any consumer installs.
    volumetric_capacity_organic:
      from: pedology/config/pedogenesis.yaml water.volumetric_capacity_organic_bracket
      brackets: pedology's endmember mixture, NOT the adopted closure
