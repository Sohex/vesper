schema_version: 1

# Earth calibrations for the pedogenesis model. Every number here is an Earth
# measurement being transplanted to another world, so each carries its source and
# what it is worth. Nothing in pedology/scripts/ hardcodes any of it: the model is
# meant to run on a world with a different star, gravity and year without editing
# code, and this file is where a different world's soils get argued about.
#
# See pedology/README.md for the derivations and the limits.

# ---------------------------------------------------------------------------
# Chemical weathering
# ---------------------------------------------------------------------------
# The Walker-Hays-Kasting form used throughout the exoplanet weathering
# literature: W scales as a power of runoff and an exponential of temperature.
# It is the standard because it is the least parameterised thing that captures
# both controls, not because it is precise.
#
#   W = (q / q_ref)^runoff_exponent * exp((T - T_ref) / temperature_e_folding_k)
#
# W is dimensionless and normalised so that Earth's global mean land conditions
# give W = 1. It is an *intensity*, not a rate: the time integral is folded into
# the reference, because neither this world's soil age nor Earth's is known well
# enough to carry explicitly.
weathering:
  # Which moisture variable drives weathering. This is a bracket, not a detail.
  #
  # `runoff` is not one option of two. Walker, Hays and Kasting define the law on
  # river runoff, and the exponent traces to Dunne (1978) fitted against runoff;
  # silicate weathering is limited by water passing through the profile and
  # carrying solutes away, not by water that falls and evaporates.
  #
  # The citation chain was wrong here in both halves, corrected 2026-08-16
  # against the primaries. WHAK does NOT cite Dunne -- 35 references, no Dunne,
  # and 0.65 appears nowhere in it. WHAK's law is LINEAR in runoff,
  # W ~ R P^0.3 exp[(T-285)/17.7], because they took from Meybeck (1979) that
  # cation concentration is independent of runoff.
  #
  # 0.65 is Berner (1994), GEOCARB II, Am. J. Sci. 294(1), 56-91,
  # doi 10.2475/ajs.294.1.56, which does cite Dunne. Berner combines Dunne's
  # Kenyan silicate fit C ~ R^-0.4 with Peters (1984) C ~ R^-0.3 for US rivers,
  # adopts a global C ~ R^-0.35, and gets flux ~ C*R = R^0.65. It enters
  # GEOCARB as f_B(T) = [J(T)/J(T0)] * [R(T)/R(T0)]^0.65 and everything
  # downstream, including the exoplanet weathering literature, carries it.
  #
  # **0.65 is therefore correct and stays.** It was briefly changed to 0.66 here
  # on the strength of Dunne's own Fig. 1, which gives
  # denudation rate = 0.28 R^0.66 for 30 independent Kenyan catchments. That was
  # a mistake of exactly the kind it was meant to fix: it substituted one
  # region's single fit for the two-dataset global synthesis the literature
  # actually uses. Dunne alone would give 0.6, not 0.66, on Berner's reading of
  # him, because Berner fits concentration where Dunne's caption reports flux.
  #
  # What Dunne's caption does supply, and nothing here had recorded:
  # **S_y.x = 0.13 log units, a factor of 1.35 scatter about the fit.** That is
  # the honest uncertainty on the runoff term and it dwarfs the third digit of
  # the exponent. Applicability: silicate lithologies only, rainfall
  # 250-3000 mm, mean annual air temperature 10-30 C, tropical.
  #
  # The caption carries the part that actually matters and was never recorded:
  # **S_y.x = 0.13 log units is the scatter about the fit, a factor of 1.35.**
  # That is the honest uncertainty on the weathering law, and it dwarfs every
  # argument this file has had about the exponent's third digit.
  #
  # Applicability, since it bounds the transfer: fitted on 30 independent Kenyan
  # catchments of 43 sampled, silicate lithologies only (gneiss, basalt,
  # andesite, trachyte, rhyolite, phonolite), rainfall 250-3000 mm and mean
  # annual air temperature 10-30 C. Tropical and warm. This world's land mean
  # runoff sits inside the fitted range but toward its dry end.
  #
  # The precipitation branch was a hedge, added when the only runoff field
  # available was `mrro` and it looked untrustworthy at 25 mm per Earth year
  # against 892 of precipitation. That hedge is spent. `mrro` turned out to be
  # river-routed rather than local, the budget residual P - E gives 168 mm, the
  # global water budget closes to one part in ten thousand, and an offline bucket
  # built from ExoPlaSim's own scheme independently reproduces it at a ratio of
  # 0.89. The runoff field is corroborated.
  #
  # So this is now a sensitivity switch, not a bracket between equals. Report the
  # spread if a result depends on it; do not present the precipitation branch as
  # an equally likely world.
  #
  # So `runoff` may be reporting the bucket rather than the planet. Both are
  # computed and both appear in the report; this selects which one the emitted
  # soil map is built from. Do not tune it to make a result land.
  #
  # This is also the clearest place the loop wants to run the other way: soil
  # water holding capacity is exactly the field ExoPlaSim is defaulting, and
  # this component computes it.
  moisture_variable: runoff       # runoff | precipitation

  # Where "runoff" comes from. This matters more than it sounds.
  #
  # `p_minus_e`   precipitation minus evaporation, the land water budget residual
  # `mrro`        ExoPlaSim's reported surface runoff field
  #
  # They disagree by a factor of 6.6, and the reason is that they are not the
  # same quantity. Over land P = 892.1 and E = 724.3 mm per Earth year, so
  # P - E = 167.8, while mrro reports 25.4.
  #
  # mrro is not local runoff generation. landmod.f90's roffstep calls mkradv,
  # which advects runoff downhill and modifies its argument in place, so what is
  # output is generation minus river outflow plus river inflow: a net water
  # divergence. Hence its negative values, its nonzero values over ocean where
  # there is no soil at all, and its recovering 99.1% of the land budget when
  # integrated globally. The CF name surface_runoff is what misleads.
  #
  # Weathering depends on water draining through the *local* profile, so the
  # budget residual is the right quantity and the routed field is not. See
  # exoplasim/notes/water-and-energy-closure.md.
  #
  # Consequences: the land runoff ratio is 18.8%, not 2.8%, against Earth's ~35%,
  # so this world is drier than Earth but not extraordinarily so. Land-mean
  # weathering intensity moves from 0.19 to about 0.66, into the saprock regime
  # the Graham et al. anchor describes rather than the fresh-rock one.
  runoff_source: p_minus_e        # p_minus_e | mrro
  runoff_exponent: 0.65
  # Temperature e-folding. Berner's exponential fit to silicate weathering.
  # Values from 10 to 25 K appear in the literature; 13.7 is the common central
  # choice and stays.
  #
  # THE ACTIVATION ENERGY THIS IS EQUIVALENT TO IS 50 kJ/mol, NOT 74. The
  # linearised Arrhenius is T_e = R * T0^2 / E_a, so at T0 = 288 K an e-folding
  # of 13.7 K is E_a = 50.3 kJ/mol, and the 74 kJ/mol this line used to claim
  # would give 9.3 K instead. The two are not interchangeable: they differ by
  # 1.47x in d ln W / dT, which is the temperature half of the thermostat.
  #
  # It matters because 74 kJ/mol is what the other schemes on disk actually use.
  # rokgem's par_E_a is 74.0 at par_ref_T0 = 8.4777 C, giving an e-folding of
  # 8.91 K, so choosing between this scheme and those is a 1.4 to 1.5x choice
  # about thermostat strength before any runoff exponent is argued about.
  # VOLC-9 brackets it; pedology/config/weathering_schemes.yaml declares it.
  temperature_e_folding_k: 13.7
  # Reference conditions, Earth global land means. W = 1 here by construction.
  # Earth's land mean for whichever moisture variable drives the law. These have
  # to match: comparing this world's 892 mm of precipitation against Earth's
  # 300 mm of *runoff* is not a bracket, it is a unit error, and it was inflating
  # the runoff-versus-precipitation spread from 2.8x to 5.6x.
  reference_runoff_mm_per_earth_year: 300.0
  reference_precipitation_mm_per_earth_year: 750.0
  reference_temperature_c: 14.0
  # W is clipped before use. The upper bound matters: the exponential runs away
  # in hot wet cells and there is no evidence soils keep differentiating past
  # deep tropical ferralsol, which is where the clay ceiling is anyway.
  minimum: 0.02
  maximum: 6.0

# ---------------------------------------------------------------------------
# Texture
# ---------------------------------------------------------------------------
# Fresh regolith texture per rock class, before any chemical weathering, keyed by
# World Orogen's rock class codes. Three numbers per class:
#
#   sand, silt, clay   fractions of the fine earth, summing to 1
#   quartz             fraction that is chemically inert and never becomes clay
#
# The distinction matters: granite and basalt both start sandy, but granite's
# sand is mostly quartz and stays sand forever, while basalt's is feldspar and
# pyroxene and weathers to clay. That single fact is why humid tropical basalt
# terrain carries deep clay and humid tropical granite terrain carries sand.
texture:
  # `quartz` is a fraction of the FINE EARTH, i.e. of the whole rock. The values
  # here were originally read off the QAPF classification, where granite spans
  # 20-60% quartz -- but QAPF normalises Q, A, P and F to 100% *after excluding
  # mafic minerals and accessories*, so its Q is not a whole-rock fraction. A
  # granite at the QAPF mid-range of about 31% Q, carrying 10% mafics, is 0.28
  # quartz by whole rock, not 0.45.
  #
  # Corrected below as QAPF mid-range x (1 - mafic fraction). This is a
  # mineralogical correction rather than a fit: it was derived from the
  # classification, applied, and the Earth validation re-run afterwards to see
  # what happened, not adjusted until the validation agreed.
  #
  # Sedimentary classes are deliberately NOT rescaled. Their quartz is high for a
  # different and real reason -- quartz survives transport and sorting, so
  # sandstones genuinely reach 60-90% quartz -- and QAPF does not apply to them.
  #
  # CRYSTALLINE ROCKS SHARE ONE PRIMARY CLAY, 0.08, and that is a structural
  # claim rather than a fitted value. Fresh granite contains no clay: what this
  # column holds is the texture of freshly produced REGOLITH, which is set by how
  # the rock was comminuted rather than by what it is. Bockheim (1980) compiles
  # parent materials spanning under 2% to 38% clay, a spread dominated by whether
  # the material is till, alluvium or in-situ residuum. Orogen produces regolith
  # in place, so the right analogue is grus and saprolite, at the low end.
  #
  # Measured against the sixteen validation sites, one shared value beats the
  # per-rock column on every metric: bias +0.004 against +0.062, RMSE 0.084
  # against 0.104, and the felsic-mafic divergence 0.152 against 0.231 where the
  # observed is 0.179. Correlation is unchanged at 0.845. It is insensitive
  # across the range the literature allows -- 0.05 and 0.10 both beat the old
  # column too -- which is what makes it structural rather than a fit.
  #
  # The mechanism this model exists to show SURVIVES the change and is now
  # carried by the parameter that is a real rock property. Granite and basalt
  # still diverge, by 0.152, entirely through inert quartz. The old column was
  # double-counting: giving basalt more primary clay AND less quartz.
  #
  # Not applied to quartzite, which is 92% quartz and whose regolith is sand by
  # composition, nor to schist, a metamorphosed pelite that inherits its fine
  # grain. Sedimentary classes keep their own values throughout, because their
  # clay is inherited from the rock rather than produced by breaking it up -- a
  # shale IS clay. No sedimentary or pelitic site is in the validation set, so
  # nothing here is measured for them.
  #
  # Igneous, felsic: quartz-rich, weathers to sandy grus
  granite:             {sand: 0.72, silt: 0.20, clay: 0.08, quartz: 0.28}
  granodiorite:        {sand: 0.68, silt: 0.24, clay: 0.08, quartz: 0.18}
  rift_bimodal:        {sand: 0.65, silt: 0.27, clay: 0.08, quartz: 0.19}
  # Igneous, mafic: little quartz, so nearly all of it can become clay
  morb:                {sand: 0.57, silt: 0.34, clay: 0.08, quartz: 0.02}
  oib:                 {sand: 0.57, silt: 0.34, clay: 0.08, quartz: 0.02}
  flood_basalt:        {sand: 0.54, silt: 0.38, clay: 0.08, quartz: 0.02}
  arc_basalt:          {sand: 0.57, silt: 0.34, clay: 0.08, quartz: 0.05}
  arc_andesite:        {sand: 0.61, silt: 0.31, clay: 0.08, quartz: 0.08}
  # Metamorphic
  gneiss:              {sand: 0.69, silt: 0.23, clay: 0.08, quartz: 0.26}
  schist:              {sand: 0.30, silt: 0.42, clay: 0.28, quartz: 0.20}
  quartzite:           {sand: 0.90, silt: 0.07, clay: 0.03, quartz: 0.92}
  melange:             {sand: 0.40, silt: 0.35, clay: 0.25, quartz: 0.20}
  # Sedimentary: already weathering products once, so they start further along
  shelf_clastic:       {sand: 0.45, silt: 0.33, clay: 0.22, quartz: 0.40}
  carbonate:           {sand: 0.15, silt: 0.35, clay: 0.50, quartz: 0.05}
  foreland_clastic:    {sand: 0.40, silt: 0.36, clay: 0.24, quartz: 0.35}
  continental_clastic: {sand: 0.50, silt: 0.30, clay: 0.20, quartz: 0.40}

  pelagic:             {sand: 0.05, silt: 0.30, clay: 0.65, quartz: 0.10}
  evaporite:           {sand: 0.20, silt: 0.35, clay: 0.45, quartz: 0.05}
  playa_clastic:       {sand: 0.25, silt: 0.40, clay: 0.35, quartz: 0.15}
  water:               {sand: 0.40, silt: 0.35, clay: 0.25, quartz: 0.25}


  # How completely weathering converts weatherable primary minerals to clay.
  # clay_final = clay_primary + weatherable * (1 - exp(-clay_conversion * W)),
  # where weatherable = 1 - quartz - clay_primary. Saturating, because a soil
  # cannot become more than entirely clay and ferralsols top out around 0.6-0.8.
  clay_conversion: 0.55
  # BRACKET, not a value, and do not tune within it. The reciprocal of this key
  # is the weathering intensity at which the conversion is 1 - 1/e complete, in
  # the units W is normalised in, so the bracket is stated on that intensity:
  # no faster than complete by Earth's land mean, W = 1, and no slower than
  # still running at the wettest of the sixteen type localities, W = 3.41,
  # which is the wettest soil this model has ever been compared against. The
  # declared value puts the e-folding at W = 1.82.
  clay_conversion_bracket: [0.29, 1.00]
  # AND IT IS NEAR-DEGENERATE WITH `clay_yield` BELOW at low weathering
  # intensity. The two multiply, and where `clay_conversion * W` is small the
  # exponential is in its linear regime, so only the product is identified.
  # That is the same defect the regolith block removed by collapsing two keys
  # into one, and it is not removable here, because the two separate at high W
  # -- which is where the sixteen localities are and where this world is not.
  # Sweep them together, and read a Vesper clay figure as resting on the
  # product rather than on either key.
  #
  # Fraction of weatherable material that ends up as clay-SIZED silicate. The
  # rest leaves as solute, or becomes iron and aluminium sesquioxides, or is a
  # resistant primary mineral other than quartz -- none of which a texture
  # analysis counts as clay. Without it the model converts every weatherable
  # grain to clay given enough intensity, which took basalt to 0.95 clay where
  # no soil on Earth exceeds about 0.8 and the wettest site measured here reads
  # 0.60.
  #
  # 0.55 is an Earth calibration like everything else in this file, and for once
  # a measured one: the regression of SoilGrids clay on this model's prediction
  # over sixteen type localities has slope 0.543 (intercept 0.035), so the model
  # was about twice as steep as Earth across its whole range. See
  # `scripts/validate_against_earth.py` and `analysis/earth_validation.json`.
  #
  # THE FELSIC-VERSUS-MAFIC CONTRAST IS UNDERSTATED, NOT OVERSTATED, and this
  # comment used to say the opposite. `analysis/earth_validation.json` is the
  # artifact and it settles the direction: predicted divergence 0.1523 against
  # 0.1789 observed, with the regression of observed on predicted at slope 1.11,
  # so Earth moves further across this range than the model does. The earlier
  # reading came from a scoring arm that inlined the conversion without the
  # donor-pool caps; the arm that produces that artifact calls
  # `weather_texture` itself.
  #
  # **What that inverts.** Raising felsic quartz was recorded here as making the
  # divergence worse. Measured on the current code path against the same sixteen
  # sites, it moves it TOWARD the observation and then past it: 0.1523 at the
  # configured 0.28, 0.1856 at 0.45, 0.2052 at 0.55, against 0.1789 observed.
  # The mechanism is unchanged -- inert quartz leaves less material to convert,
  # so granite goes sandier -- and only the sign of the gap it is being read
  # against has changed. That does NOT make quartz the fix: the QAPF correction
  # already put felsic quartz where mineralogy says it goes, and moving it to
  # hit a texture target would be fitting a mineral fraction to a soil
  # measurement.
  #
  # What controls the contrast is the PRIMARY CLAY fractions above, and they are
  # not a mineralogical quantity at all: fresh granite contains no clay, so those
  # values describe the texture of freshly produced regolith rather than of rock.
  # They stay as they are until a source says what fresh regolith texture is.
  # Three parameters have now been compared against these same sixteen sites and
  # one has been fitted to them; fitting a second would reproduce the
  # calibration set and nothing else. What this wants is a weathering
  # chronosequence with particle-size data on young basalt and granite surfaces,
  # which is a different literature from mineralogy. See LITH-23, which is also
  # where the re-measurement of what each primary-clay fraction does belongs:
  # the response is not monotone, because lowering primary clay raises the
  # weatherable fraction that feeds the conversion.
  #
  # The residual against SoilGrids is +0.004 of clay overall, and it is NOT a
  # conversion-rate error: it barely varies with weathering intensity,
  # correlation -0.042, so what remains sits in the primary clay fractions above
  # rather than in `clay_conversion` or `clay_yield`. It is also cheap to carry,
  # because clay's volumetric capacity of 0.13 sits BETWEEN sand's 0.07 and
  # silt's 0.20, so trading clay for the other two barely moves the mixture.
  # Depth dominates that field by far.
  #
  # **The limit of validity matters more than the bias.** The sixteen sites span
  # weathering intensity 0.42 to 3.41, and this world's land-mean intensity sits
  # below the bottom of that span with a median further below still, so the
  # model is being run BELOW the range it was compared in. That is where the
  # residual is largest and where it changes sign: +0.036 over the seven sites
  # under W = 1 against -0.021 over the nine at or above it. Treat a Vesper clay
  # figure as extrapolated. `analysis/soil_report.json` carries the land mean.
  clay_yield: 0.55
  # Sand and silt give up their share of what becomes clay in this ratio.
  #
  # NOT DERIVABLE FROM MECHANISM, because the two mechanisms point opposite
  # ways. Specific surface area goes as one over grain diameter, so silt
  # carries more reactive area per unit mass than sand and dissolves faster:
  # over the USDA class limits the geometric mean diameters are 0.316 mm and
  # 0.010 mm, a factor of 31.6, which is a ratio of 0.032. Against that,
  # weathering is a size cascade -- a sand grain becomes silt before it becomes
  # clay -- so sand leaves its own class faster than dissolution alone implies
  # while silt is replenished out of it, which is a ratio above 1 and unbounded
  # in the limit where silt sits in quasi-steady state.
  #
  # So the bracket is the span those two allow, and the declared value is the
  # one point inside it that carries a statement: loss in proportion to
  # abundance, no size preference. The comment here used to read "sand goes
  # first: coarse primary grains have the most surface area to lose", which has
  # the surface-area argument backwards and is why the number beside it did not
  # follow from the sentence beside it.
  #
  # It redistributes between sand and silt at fixed clay, and it moves
  # plant-available water capacity by under one per cent, because clay's
  # volumetric capacity sits BETWEEN sand's and silt's. Report the spread if a
  # result turns on it; do not tune within it.
  sand_to_silt_loss_ratio: 1.0
  sand_to_silt_loss_ratio_bracket: [0.032, 31.6]

# ---------------------------------------------------------------------------
# Regolith depth
# ---------------------------------------------------------------------------
# Steady-state regolith thickness, production against erosion.
#
#   depth = maximum_depth_m * P / (P + E)
#
# This was Heimsath's exponential production function, whose steady state is
# h = h_star * ln(P0 / E). That form diverges as erosion approaches zero and runs
# to minus infinity as it grows, so both ends needed clipping, and a quarter of
# this world's land sat on each clip. The cause is dynamic range: spanning the
# declared depth range through a logarithm at Heimsath's measured h_star of
# 0.435 m requires P/E to cover a factor of order 100,000, which nothing in
# these inputs does. The
# discarded form is still what sets the LEVEL of the surviving one, because it
# is the form an absolute production rate and an absolute denudation rate can be
# read into; see the bracket on `erosion_coefficient_per_relief_m` below.
#
# The saturating form is bounded at both ends by construction. As erosion
# vanishes the profile approaches maximum_depth_m, which says a weathering front
# cannot advance forever because water and oxygen must reach it through what has
# already accumulated. It is a parameterisation rather than a derivation, and
# that is the trade against a principled form that cannot be evaluated here.
# ---------------------------------------------------------------------------
# Parent-rock phosphorus, ppm P
# ---------------------------------------------------------------------------
# Phosphorus is rock-derived. Unlike nitrogen it has no atmospheric source, so
# its supply is weathering, which this component already computes. That makes it
# the nutrient this pipeline is best placed to say something about.
#
# SOURCE, read directly: Hartmann, Moosdorf, Lauerwald, Hinderer & West (2014),
# "Global chemical weathering and associated P-release - The role of lithology,
# temperature and soil properties", Chemical Geology 363, 145-163, Table A1-2.
# The paper gives P2O5 weight percent per lithological class and the elemental P
# content beside it, at P2O5 x 0.4364. Values below are the elemental row in ppm.
#
# Read from the paper rather than a citation of it, and that mattered. These were
# first entered from a second-hand table which turned out to report Hartmann's
# "P content in % relative to Cat + SiO2 release" -- a release-normalised ratio,
# not a rock content -- so every value was low by about half and the units were
# misidentified. The class contrast survived; the magnitudes did not.
#
# Class mapping is to Hartmann's own classes, which is why these are grounded
# rather than interpolated: PA acid plutonic, PB basic plutonic, VA acid
# volcanic, VB basic volcanic, MT metamorphic, SS siliciclastic, SC carbonate
# sedimentary, SU unconsolidated sediment, EP evaporite. Intermediate classes
# follow the paper's own convention of averaging the two endmembers.
#
# Basic volcanic against acid plutonic is 1.94x, so basalt carries roughly twice
# the phosphorus of granite. That contrast is separate from and larger than the
# quartz-driven clay contrast already in this file, and the two multiply.
# Within-class spreads overlap, so these predict a class mean, not a sample.
phosphorus_ppm:
  granite:             700     # PA
  granodiorite:       1485     # PI, the paper's mean of PA and PB
  rift_bimodal:        830     # VI, mean of VA and VB
  morb:               1350     # VB
  oib:                1350     # VB
  flood_basalt:       1350     # VB
  arc_basalt:         1350     # VB
  arc_andesite:        830     # VI
  gneiss:              790     # MT
  schist:              790     # MT
  quartzite:           200     # MT diluted by quartz
  melange:             520     # SM
  shelf_clastic:       520     # SS
  carbonate:           480     # SC
  foreland_clastic:    520     # SS
  continental_clastic: 520     # SS
  # Basin fill is not primary rock: it is whatever the catchment delivered.
  # Playa clastics are unconsolidated sediment; salt crust is the paper's
  # evaporite class, which is the lowest of all. That matters for the aeolian
  # phosphorus term, because the brightest and most erodible surface on this
  # planet is also the one with the least P to redistribute.
  playa_clastic:       520     # SU
  evaporite:           260     # EP
  # Seafloor classes, present for completeness; no land cell carries them.
  pelagic:             520
  water:                 0

# ---------------------------------------------------------------------------
# Phosphorus release per unit chemical weathering, dimensionless (percent)
# ---------------------------------------------------------------------------
# NOT the same quantity as phosphorus_ppm above, and the distinction is the one
# this project got wrong twice in opposite directions.
#
# `phosphorus_ppm` is how much phosphorus the rock CONTAINS. This is how much
# phosphorus is RELEASED per unit of cation-and-silica weathering flux, which is
# what pairs with a weathering intensity. Hartmann et al. (2014) states the
# distinction explicitly: "The P-contents in lithological classes relative to the
# SiO2 and the major cation content are given in Appendix 1 Table A1-2, last
# lines. The P-release FP is thus calculated as FP = b_relative P-content *
# F_Si+cations."
#
# LPJ-GUESS-CNP uses exactly this, as FCW,i = (b_carbonate + b_silicate)_i * p_i
# * q with p_i cited to Table A1-2 (Dantas de Paula et al. 2025, Eq. A7), so a
# model driven by our weathering intensity wants these values, not the contents.
#
# The two rows rank the classes almost identically, which is why a contrast
# check cannot tell them apart -- see failure class 9. Basic volcanic against
# acid plutonic is 2.30x here against 1.93x by content.
phosphorus_release_relative:
  granite:             0.0915   # PA
  granodiorite:        0.2210   # PI, mean of PA and PB as the paper does
  rift_bimodal:        0.1242   # VI, mean of VA and VB
  morb:                0.2102   # VB
  oib:                 0.2102   # VB
  flood_basalt:        0.2102   # VB
  arc_basalt:          0.2102   # VB
  arc_andesite:        0.1242   # VI
  gneiss:              0.1048   # MT
  schist:              0.1048   # MT
  quartzite:           0.0300   # MT, diluted by quartz
  melange:             0.0814   # SM
  shelf_clastic:       0.0766   # SS
  carbonate:           0.1143   # SC
  foreland_clastic:    0.0766   # SS
  continental_clastic: 0.0766   # SS
  playa_clastic:       0.0814   # SU
  evaporite:           0.0624   # EP
  pelagic:             0.0814
  water:               0.0

# ---------------------------------------------------------------------------
# Andisols: volcanism as a process, not just a rock class
# ---------------------------------------------------------------------------
# Every other block here treats volcanic rock as a composition. That misses what
# makes volcanic terrain distinctive on Earth: it is resupplied. Fresh ejecta is
# glass, glass weathers far faster than the crystalline rock of identical
# composition, and the short-range-order minerals it weathers to -- allophane,
# imogolite, ferrihydrite -- give a soil whose bulk density, water retention and
# phosphorus behaviour do not follow from its texture at all.
#
# SOURCE, read: Dahlgren, Saigusa & Ugolini (2004), "The nature, properties and
# management of volcanic soils", Advances in Agronomy 82, 113-182,
# doi 10.1016/S0065-2113(03)82003-5. Rate contrast from Wolff-Boenisch et al.
# (2004) doi 10.1016/j.gca.2004.05.027 and Gislason & Oelkers (2003)
# doi 10.1016/S0016-7037(03)00176-5.
#
# WHY THE ARC AND NOTHING ELSE. Andic properties need ONGOING resupply, because
# glass is metastable and a surface that stops receiving ash weathers past it.
# Orogen has no eruption-age field, so this model cannot ask how old a lava
# surface is -- with one exception. The arc classes are placed as a band about
# the volcanic front, so arc terrain IS the active front by construction. That
# is the only place in this pipeline where volcanism is known to be ongoing
# rather than merely to have happened.
#
# `flood_basalt` and `oib` are EXCLUDED, and the reason is a duration argument
# rather than a missing measurement. Orogen has no time axis at all -- its own
# lithology module says so, "no ages, no stratigraphy and no unconformities,
# because there are no timesteps to hang them on" -- so a province's age is not
# unmeasured here, it is undefined. Asking for an eruption-age field asks the
# generator for a concept it does not have.
#
# It does not need one. A flood basalt emplaces most of its volume in about a
# million years and then persists for hundreds: the Deccan and Siberian traps
# are still mapped at 66 and 252 Ma. So a randomly chosen moment finds a given
# LIP erupting with probability of order one percent. A hotspot chain is the
# same shape -- Hawaii spans some 80 Myr and the active volcanism is confined to
# its youngest end. Expected value says these provinces are old, decisively, and
# treating them as not-resupplied is the correct default rather than a hedge.
#
# The arc is the exception precisely because it is not a province but a boundary
# process: it is active for as long as the plate is subducting, which is the
# whole time the terrain exists.
#
# THE MOISTURE THRESHOLD IS NOT A FREE PARAMETER. Allophane forms where leaching
# removes silica; where silica activity stays high the same parent material goes
# to halloysite instead, which is an ordinary clay soil with none of the andic
# properties. Dahlgren gives the boundary directly: halloysite "is found as the
# dominant mineral in volcanic materials where precipitation is generally less
# than about 1500 mm" (citing Parfitt et al. 1983, Lowe 1986, Mizota and van
# Reeuwijk 1989, Takahashi et al. 1993).
#
# Note this criterion is stated in PRECIPITATION and is used in precipitation,
# even though the weathering law above runs on runoff. That is deliberate: the
# threshold is transferred in the variable it was measured in. Do not "fix" it
# to match the weathering law's moisture variable.
#
# MEASURED CONSEQUENCE on this world, and it is the reason this block is worth
# having rather than assuming: only about 14% of arc terrain clears 1500 mm.
# Arc-weighted mean precipitation is barely above the land mean, so this
# world's arcs are NOT preferentially wet the way Earth's Indonesian and Central
# American arcs are. Most of its volcanic terrain is halloysitic, and true
# allophanic Andisols cover well under one percent of land. Anything that
# assumed "volcanic terrain therefore andisols" would have been wrong by an
# order of magnitude, in the direction that matters for phosphorus.
andisol:
  # Classes with known ongoing ejecta supply. See above for why this is the arc
  # and only the arc.
  resupplied_classes: [arc_andesite, arc_basalt]
  # Volcanic classes treated as NOT resupplied, on the duration argument above.
  # Still reported separately, because their area is what the argument is being
  # applied to and a reader should be able to see how much rests on it.
  unresupplied_classes: [flood_basalt, oib, rift_bimodal]

  # Allophane over halloysite. Centre from Dahlgren; the width is a smoothing of
  # a soft literature boundary ("generally less than about"), not a measured
  # transition, and no result should turn on its value.
  allophane_precipitation_mm: 1500.0
  allophane_transition_mm: 300.0

  # Development: vitric -> andic. Andic horizons need Alox + 1/2Feox >= 2%,
  # which is a weathering-progress requirement rather than a compositional one.
  # Half-saturation at W = 1 is not arbitrary: W is normalised so that 1 is
  # Earth's land-mean weathering intensity, and Earth's andisols form readily at
  # that intensity. This is the least determined number in the block.
  development_half_saturation_w: 1.0

  # Phosphate retention, the property that matters most and the one that runs
  # OPPOSITE to the intuition that volcanic soil is fertile. Andic horizons fix
  # phosphorus hard: Soil Taxonomy requires >= 85% retention, the WRB andic
  # horizon >= 70%, and a vitric horizon only > 25%. Dahlgren is explicit that P
  # availability is HIGH in young volcanic material -- rapid apatite weathering,
  # little active Al and Fe yet -- and falls as development proceeds, because
  # allophane, imogolite and Al-humus complexes fix it. So the same terrain is a
  # phosphorus source early and a phosphorus sink late, and `development` above
  # is the axis it moves along.
  phosphate_retention_vitric: 0.25
  phosphate_retention_andic: 0.85

  # Bulk density, Mg/m3. Andic soil material is defined at <= 0.90 at 33 kPa;
  # measured allophanic profiles run 0.2-0.9 (Shoji et al. 1996), and <0.9
  # appears once allophane exceeds ~5%. 0.70 is a representative andic value,
  # applied in proportion to the andic fraction of the cell.
  bulk_density_andic: 0.70

  # Extra plant-available water held by noncrystalline material, volumetric.
  # Andisols retain far more water than their texture implies, because the water
  # is in allophane micropores and humus rather than between grains -- which is
  # exactly what the texture terms above cannot represent.
  #
  # BRACKET, not a value. Dahlgren gives the relations (available water is about
  # 60% of 33 kPa water at the surface, 50% at depth) but no headline volumetric
  # capacity, so this is bounded by the organic term, which is the other
  # micropore-dominated phase in this file. Report the spread if a result turns
  # on it; do not tune within it. Treated the same way as `bedrock_water`.
  volumetric_capacity_allophane: 0.30
  volumetric_capacity_allophane_minimum: 0.20
  volumetric_capacity_allophane_maximum: 0.40


regolith:
  # Asymptote, not a clip: the depth to which weathering can reach at all, and
  # NOT a steady-state thickness. Neither paper under the coefficient below
  # bears on it, and that is a statement about the quantity rather than a gap in
  # those two: Heimsath's production function has no asymptote, running to
  # infinity as erosion vanishes, and Portenga and Bierman measure denudation
  # rather than the depth a weathering front reaches. A production function
  # integrates to a steady-state depth against an erosion rate; it does not
  # integrate to a maximum reach.
  #
  # SOURCE, read directly: Shangguan, Hengl, Mendes de Jesus, Yuan and Dai
  # (2017), "Mapping the global depth to bedrock for land surface modeling",
  # JAMES 9, 65-88, 10.1002/2016MS000686. Table 1, the world row of ABSOLUTE
  # depth to bedrock over 1,590,464 soil-profile and borehole observations:
  # median 670 cm, mean 1,309.3 cm, maximum 312,541 cm. Their definition is the
  # depth from the ground surface to contact with coherent bedrock, so what it
  # measures is the thickness of everything unconsolidated above rock.
  #
  # BRACKET, not a value, and the two ends are the two ways that measurement
  # differs from this quantity. The paper states both.
  #
  #   6.70 m, the observed MEDIAN, bounds it from BELOW. The observed
  #   population is overwhelmingly eroding land, whose depth to bedrock sits
  #   under the depth an uneroded profile reaches. The paper adds a second
  #   reason pointing the same way: a soil survey logs intact weathered rock as
  #   R horizon and stops at 2 m, so a map built from profiles reads as "deeper
  #   than" what it prints.
  #
  #   13.09 m, the observed MEAN, bounds it from ABOVE. Depth to bedrock counts
  #   transported fill as readily as in-situ weathering product, and this
  #   model's regolith is in-situ product only. The mean is 1.95 times the
  #   median and the maximum is 3.1 km, which is the size of that
  #   contamination.
  #
  # The declared value is the low end, which is a reading of the direction
  # every correction runs in rather than a point chosen inside the bracket: the
  # observations are dominated by boreholes in North America and Europe, where
  # glacial drift and alluvium are most of what the drill passes through.
  #
  # THIS KEY AND `erosion_coefficient_per_relief_m` ARE JOINTLY CONSTRAINED.
  # This one is a pure prefactor and that one carries the level, and the
  # land-mean depth the pair produces has to land inside
  # `regolith_depth_bracket_m` below, which brackets the LEVEL and not either
  # key. A sweep runs the two together, and moving one alone can leave the
  # level outside a bracket that neither key's own bracket mentions.
  maximum_depth_m: 6.70
  maximum_depth_bracket_m: [6.70, 13.09]
  minimum_depth_m: 0.02
  # ONE COEFFICIENT, NOT TWO. Erosion entered the depth law through a weight of
  # 1.5 against production and a reference relief of 200 m, and the two were
  # exactly degenerate: the law reads them only as the ratio, so halving the
  # relief was identical to doubling the weight. One degree of freedom was
  # carried in two keys of which only one was labelled free, and the other's
  # comment described a normalisation ("E near 1 at Earth-like mean land
  # conditions") that nothing established. They are one key here. The value is
  # 1.5 / 200 and the law is unchanged.
  #
  #   erosion = erosion_coefficient_per_relief_m
  #             * erodibility * max(relief_m, 0) * moisture
  #
  # THE FORM IS SOURCED AND THE LEVEL IS BRACKETED, which are two separate
  # statements.
  #
  # The form: Portenga and Bierman (2011), the standardised global cosmogenic
  # 10Be compilation, find mean basin SLOPE the strongest single control on
  # drainage-basin denudation, the top regressor in nearly every climatic,
  # lithologic and tectonic subpopulation and the strongest bivariate
  # relationship globally. `relief_m` here is the height spread across a cell's
  # neighbours, so at fixed mesh spacing it is a slope, and erosion rising with
  # it is that result and not an assumption. The same compilation is why nothing
  # in this block keys on lithology beyond `erodibility`: outcrop denudation
  # separates by rock type over a factor of 2.3 (sedimentary 20 +/- 2.0,
  # metamorphic 11 +/- 1.4, igneous 8.7 +/- 1.0 m/Myr) while drainage-basin
  # denudation does not separate by lithology at all in their ANOVA.
  #
  # The level: BRACKET, not a value, and do not tune within it. A soil-mantled
  # hillslope at steady state has production equal to erosion, so Heimsath et
  # al. (1997)'s measured production function inverts to h = 0.435 m *
  # ln(77 / E) with E in m/Myr, and Portenga and Bierman supply E. Their
  # drainage-basin median of 54 m/Myr gives 0.15 m; their outcrop mean of 12
  # gives 0.81 m and outcrop median of 5.4 gives 1.16 m; their slowest
  # subpopulation, polar outcrops at 3.9, gives 1.30 m. Their basin MEAN of 218
  # and their arid-basin mean of 100 both exceed Heimsath's maximum production
  # rate of 77 m/Myr, where the balance has no solution and no soil is possible.
  # So the pair does NOT close on one number: it brackets the land-mean regolith
  # at 0.15 to 1.30 m and identifies a regime with no steady state in it. The
  # width is real -- Heimsath's 77 m/Myr is one greywacke site, and Portenga and
  # Bierman's basins cover 2.3% of Earth's land with a stated bias toward
  # accessible tectonically active terrain -- and it is not narrowable from
  # these two papers.
  #
  # The declared value puts the land-mean regolith at 1.04 m, inside the bracket
  # and in its upper third, which is the branch reached by outcrop denudation
  # rather than by basin denudation. Report the spread where a result turns on
  # it. `regolith_depth_bracket_m` below is what a sweep runs over.
  erosion_coefficient_per_relief_m: 0.0075
  regolith_depth_bracket_m: [0.15, 1.30]
  # Denudation that does not need runoff: wind, dry ravel, freeze-thaw creep,
  # rare events. Without it, erosion is exactly zero wherever P - E is zero, and
  # depth pins to the ceiling across the whole arid fraction of the planet. A
  # slope in a desert still loses material.
  #
  # The moisture term is `runoff / reference_runoff + dry_erosion_baseline`, so
  # this key IS the ratio of denudation at zero runoff to denudation at Earth's
  # reference runoff, as b / (1 + b). That is a quantity the compilation
  # already read for the coefficient above reports.
  #
  # SOURCE. Portenga and Bierman (2011) put arid drainage basins at
  # 100 +/- 17.3 m/Myr, the slowest of their climate zones, against a global
  # drainage-basin mean of 218 +/- 35 m/Myr. The ratio is 0.459, which inverts
  # to 0.85.
  #
  # BRACKET from their two stated uncertainties; do not tune within it. Two
  # approximations set its width and they pull opposite ways: arid basins carry
  # some runoff, so the true zero-runoff ratio is below theirs; and their global
  # mean is drawn from steep, tectonically active, accessible terrain, so it is
  # high for a reference condition, which makes the ratio too low.
  #
  # The same compilation is why the bracket reaches a moisture term nearly flat
  # in runoff: their basin denudation has NO significant bivariate correlation
  # with mean annual precipitation at all, slope being the regressor. A weak
  # moisture dependence is what that paper supports. What this key used to be,
  # 0.15, is a suppression of dry denudation to 13 per cent of the reference
  # rate, and nothing supported it.
  dry_erosion_baseline: 0.85
  dry_erosion_baseline_bracket: [0.49, 1.79]

  # ---------------------------------------------------------------------------
  # Water held below the bedrock contact
  # ---------------------------------------------------------------------------
  # How much plant-available water the material *below* the regolith holds, as a
  # fraction of what the soil above it holds per unit volume. It is not a
  # rounding term: deep-rooted woody plants demonstrably use it, and on thin
  # soils it carries a large share of transpiration.
  #
  # This entered the model as a hardcoded 0.02 in vesperinput.cpp, introduced as
  # a numerical guard against a division by zero, and measurement showed it was
  # doing physical work. It is a declared parameter now, and a function of
  # weathering rather than a constant, because that is what the observations say.
  #
  #   fraction(W) = minimum + (maximum - minimum) * (1 - exp(-shape * W))
  #
  # Anchors, all as volumetric plant-available water against the soil above:
  #
  #   Fresh rock      Intact bedrock between joints has porosity of about 1% or
  #                   less (Graham, Rossi and Hubbert, GSA Today 2010), so almost
  #                   nothing is available. -> `minimum`
  #
  #   Saprock         Same paper's Jeffrey pine site in the Sierra Nevada: soil
  #                   75 cm at 20% PAWC holding 15 cm, over saprock 275 cm at
  #                   12% PAWC holding 33 cm. Twice the water in rock as in soil,
  #                   at 0.12/0.20 = 0.60 of the volumetric capacity. `shape` is
  #                   set so W = 1, the Earth land mean, lands near 0.60.
  #
  #   Deep saprolite  Swaziland Middleveld: available water capacity of the
  #                   saprolite two to four times that of the soils above.
  #                   -> `maximum`
  #
  # For scale, Rempe and Dietrich (PNAS 2018) measured 100-530 mm of seasonal
  # rock moisture, up to 27% of annual rainfall, and Lapides et al.
  # (Biogeosciences 2024) added a bedrock vadose zone to LPJ-GUESS itself with
  # 180-480 mm of storage at their sites, raising annual transpiration by a
  # median of 100-150 mm and turning a model that could not tell two catchments
  # apart into one that reproduced both.
  #
  # The range is wide because the underlying quantity genuinely varies by two
  # orders of magnitude between fresh rock and deep saprolite. Report the
  # bracket; do not tune within it.
  bedrock_water:
    minimum: 0.05
    maximum: 2.00
    shape: 0.33

# ---------------------------------------------------------------------------
# pH
# ---------------------------------------------------------------------------
# Base cations leach with drainage, so pH falls as runoff rises. Parent material
# sets the starting point. Endorheic basins run the other way: salts concentrate
# rather than leaving, and the soil goes alkaline and sodic.
#
# WHAT THE ONE GLOBAL MEASUREMENT OF THIS QUANTITY SAYS, and where this form
# departs from it. Slessarev, Lin, Bingham, Johnson, Dai, Schimel and Chadwick
# (2016), "Water balance creates a threshold in soil pH at the global scale",
# Nature 540, 567-569, 10.1038/nature20139, draw a spatially random sample of
# 20,000 subsoil pH measurements from a compilation of 60,291 and find the
# distribution BIMODAL: a calcite-buffered mode near 8.2 and a gibbsite-buffered
# mode near 5.1, with an abrupt step between them where mean annual
# precipitation begins to exceed potential evapotranspiration. Predicting only
# those two values from the sign of the water balance explains 42 per cent of
# the observed variation. Soils in the neutral range are UNCOMMON, because that
# range is held by primary mineral dissolution, which is slow.
#
# Two consequences, and they differ in kind.
#
# THE ACID END IS PARENT-INDEPENDENT in the observation and parent-dependent
# here. Gibbsite sets it wherever leaching has run, whatever the rock was. This
# block instead carries every parent down a line of its own, so its wet cells
# spread where the measurement clusters, and a single `leaching_slope` cannot
# land them all on one buffer. That is a property of the FORM and not of any
# value in it, which is why the values below are bracketed rather than fitted:
# they cannot be sized against this observation without changing the form
# first.
#
# THE ALKALINE END IS DERIVABLE, and is derived below at this world's own
# atmosphere rather than read off Earth's.
ph:
  # pH of a fresh, unleached soil on each rock category.
  #
  # DERIVED BRACKET on the silicate entries, from the carbonate system at this
  # planet's declared pCO2 (`config/planet.yaml` is the source of that number
  # and nothing here restates it). A soil solution supplied with base cations
  # sits above water in equilibrium with the atmosphere and nothing else, and
  # below the point where calcite precipitates and takes the buffering over:
  #
  #   5.59  water and atmospheric CO2 alone, no alkalinity
  #   8.16  calcite equilibrium, open to the atmosphere
  #
  # Both ends come out of the same equilibrium, Slessarev's Methods eq. (6) in
  # the four dissociation constants and the calcite solubility, and the
  # implementation reproduces their published 8.2 at their stated laboratory
  # pCO2 before being evaluated at this world's. The bracket therefore travels
  # to another planet, which is the point of deriving it instead of taking a
  # value measured on Earth.
  #
  # WHAT IS STILL DECLARED is the ORDER and the SPACING inside that bracket.
  # Mafic above clastic above metamorphic above felsic is a contrast this file
  # asserts; no source here sizes it. Do not tune within the bracket.
  parent_by_category:
    igneous_mafic: 7.6
    igneous_felsic: 6.4
    metamorphic: 6.6
    sedimentary_clastic: 6.8
    # DERIVED, not declared: calcite equilibrium at this world's pCO2, open to
    # the atmosphere. That is the condition a laboratory pH is measured under
    # and the one Slessarev's 8.2 is stated at, so it is the condition to put
    # a number that gets compared against measured pH on. Soil air runs ten to
    # a hundred times atmospheric and the same equilibrium gives 7.50 and 6.83
    # there, so a field pH on carbonate reads below this.
    carbonate: 8.16
    # Above the calcite buffer, because sodium carbonate rather than calcite
    # sets it.
    evaporite: 8.8
  parent_bracket_silicate: [5.59, 8.16]
  parent_bracket_carbonate: [6.83, 8.16]
  # Bracketed by what a closed basin reaches. Helvaci (2019) lists lake water
  # at pH 8.5 to 11 among the conditions the Turkish borate deposits form
  # under, which is the one measured closed-basin range this project holds. It
  # is LAKE WATER in one depositional setting and not a soil, which is why it
  # bounds the entry and does not set it.
  parent_bracket_evaporite: [8.50, 11.00]
  # pH lost per e-folding of the leaching index (runoff over reference runoff).
  #
  # BRACKET, not a value, and both ends are one requirement evaluated at two
  # runoffs: that the term can carry the modal clastic parent down to
  # Slessarev's gibbsite buffer of 5.1, a drop of 1.7. At Earth's reference
  # runoff the index is ln 2 and the slope that does it is 2.45; at five times
  # that runoff the index is ln 6 and the slope is 0.95. The multiple of five
  # is declared, not measured.
  #
  # The declared value is the low end, and the reason is the clip below rather
  # than a preference: a steeper slope drives the felsic and metamorphic
  # parents onto `minimum` across the wet fraction of this world's land, which
  # is the railing the regolith block above was rewritten to remove. A form
  # with a parent-independent acid end would not have to choose. Report the
  # spread; do not tune within it.
  leaching_slope: 0.95
  leaching_slope_bracket: [0.95, 2.45]
  # Clips, and nothing here rests on either. The two buffered modes Slessarev
  # measures are at 8.2 and 5.1 and are not clips: a soil goes below the
  # gibbsite buffer under organic acids and above the calcite one under sodium
  # carbonate, and these bound those two directions.
  minimum: 3.8
  maximum: 9.5
  # Added where drainage is closed and salts accumulate.
  #
  # BRACKET from the carbonate entry above: the bonus has to carry a
  # calcite-buffered soil at 8.16 into the range a closed basin reaches, which
  # is Helvaci's 8.5 to 11. Do not tune within it.
  endorheic_alkalinity_bonus: 0.8
  endorheic_alkalinity_bonus_bracket: [0.34, 2.84]

# ---------------------------------------------------------------------------
# Organic matter, the loop closure
# ---------------------------------------------------------------------------
# Soil organic carbon is not a property of the rock. It is what the biosphere
# leaves behind, which means it can only come from the vegetation model, which
# in turn needs the soil. Iteration 0 runs with `initial_soil_carbon_kg_m2`;
# every iteration after reads LPJ-GUESS's own cpool output.
organic:
  initial_soil_carbon_kg_m2: 0.0
  # Bulk density of pure organic matter and of mineral soil, for the mixing rule
  # and for converting kgC/m2 into a mass fraction.
  organic_bulk_density_kg_m3: 224.0
  mineral_bulk_density_kg_m3: 1500.0
  # Carbon is this fraction of organic matter by mass (van Bemmelen)
  carbon_fraction_of_organic_matter: 0.58
  # Depth over which soil carbon is taken to be distributed, for the fraction
  # calculation. LPJ-GUESS's own upper layer is 0.5 m.
  reference_depth_m: 0.5
  maximum_organic_fraction: 0.60
  # Soil C:N. A single declared value: this world has no measured nitrogen
  # cycle, and the deposition rate feeding LPJ-GUESS is itself an assumption.
  carbon_nitrogen_ratio: 12.0

# ---------------------------------------------------------------------------
# Convergence of the soil-biosphere loop
# ---------------------------------------------------------------------------
# Fixed before any iteration has been run, in the same way the albedo bracket's
# criteria were written into the script docstring before any run finished.
convergence:
  # Land-mean soil organic carbon, relative change between iterations
  soil_carbon_relative_tolerance: 0.02
  # Fraction of land cells whose clay content moves by more than 0.02
  texture_cells_moved_tolerance: 0.05
  maximum_iterations: 6

# ---------------------------------------------------------------------------
# Plant-available water capacity
# ---------------------------------------------------------------------------
# Volumetric plant-available water, field capacity minus wilting point, as a
# fraction of soil volume. Loam holds the most: sand drains and clay holds water
# too tightly for roots to take it.
#
# Multiplied by regolith depth, this gives the millimetres of water the ground
# can actually hold, which is two things at once:
#
#   - what LPJ-GUESS's fixed 1.5 m profile should be scaled down to where the
#     regolith is thinner than that
#   - what ExoPlaSim's dwmax bucket should be, whose overflow *is* its runoff
#
# So this is the field that closes the loop back to the climate model, which is
# why it is the one block in this file that was carrying "standard textbook
# mid-range values" and no source. LITH-24.
#
# SOURCE, and what it does and does not license. Saxton and Rawls (2006), *Soil
# Water Characteristic Estimates by Texture and Organic Matter for Hydrologic
# Solutions*, Soil Science Society of America Journal 70:1569-1578,
# `10.2136/sssaj2005.0117`, regressed 33 kPa and 1500 kPa water contents against
# sand, clay and organic matter over 1,722 A-horizon samples from the USDA/NRCS
# National Soil Characterization database. That is the standard basis for
# texture-to-water-capacity and it establishes the SHAPE used here: plant
# available water is a maximum at intermediate texture and falls off toward both
# ends.
#
# It does NOT license these three numbers, and saying so is the point of the
# label below. Saxton and Rawls parameterise a CONTINUOUS mixture and explicitly
# excluded samples above 60% clay from the fit, so a pure endmember is outside
# the data the regression was built on. Reading endmember values off it would be
# taking a number from a citation rather than from the paper --
# `docs/src/practice/failure-modes.md` class 9.
#
# So the values are DECLARED, with the paper as the check on their ordering and
# magnitude rather than their origin, and each carries a bracket spanning the
# conventional range for its class. `build_soil.py` reports the spread in soil
# water capacity across those brackets, because this field reaches the climate
# and a single number would hide what it is worth.
water:
  volumetric_capacity_by_texture:
    sand: 0.07
    silt: 0.20
    clay: 0.13
  volumetric_capacity_by_texture_bracket:
    sand: [0.05, 0.10]
    silt: [0.15, 0.25]
    clay: [0.10, 0.18]
  volumetric_capacity_organic: 0.30
  volumetric_capacity_organic_bracket: [0.20, 0.40]
  # ExoPlaSim's uniform namelist default is 500 mm. The bounds keep a degenerate
  # cell from producing a bucket that never fills or never empties.
  minimum_mm: 10.0
  maximum_mm: 800.0

# ---------------------------------------------------------------------------
# Catena: physical production and topographic transport
# ---------------------------------------------------------------------------
# Chemical weathering alone does not make a soil. The catena concept adds two
# things to it, and both are cheap here because the inputs already exist.
#
# PHYSICAL PRODUCTION. Frost shattering breaks rock far faster than dissolution
# does, and it needs freeze-thaw cycling rather than cold: a bin whose diurnal
# range straddles freezing cracks rock, one frozen solid all day does not. The
# climatology carries `mint` and `maxt` as timestep extrema, so the fraction of
# the orbit spent straddling 0 C is directly measurable. On this world 34.8% of
# land has a frost season at all, so it is not a polar-only term.
#
# TOPOGRAPHIC TRANSPORT. Regolith moves downhill. A steep ridge sheds its fines
# and keeps thin stony lithosol; a valley floor accumulates deep clay-rich fill.
# Modelling that as a slope divisor is the standard first-order treatment and it
# is what makes the soil map look like terrain rather than like a climate map.
#
#   depth = depth_weathered * (1 + frost_bonus * frost_fraction)
#                           / (1 + slope_transport * tan(beta))
#
# The chemical side is untouched: clay fraction still comes from the
# Walker-Hays-Kasting intensity above. This only moves material around and
# decides how much of it there is.
# SOURCE for the mechanism, and the four constants are DECLARED against it
# rather than taken from it. Heimsath, Dietrich, Nishiizumi and Finkel (1997),
# *The soil production function and landscape equilibrium*, Nature 388:358-361,
# `10.1038/41056`, is the first empirical soil production function, measured by
# cosmogenic 10Be and 26Al in bedrock under soils of different depths in
# northern California. Two of its results are what this block rests on.
#
# Soil production declines EXPONENTIALLY with the depth already there:
# -(de/dt) = (77 +/- 9) exp(-(0.023 +/- 0.003) h) um/yr, h in cm, so an
# e-folding depth near 43 cm and a bare-bedrock maximum near 77 um/yr. And the
# paper's own reason for expecting that form is "the decrease in effectiveness
# of such mechanical processes as freeze-thaw", which is the frost term below
# named by the source rather than assumed.
#
# What it does NOT give is any of these four numbers. Its control variable is
# hillslope CURVATURE -- the divergence of the transport flux -- while this
# block uses tan(beta), the flux itself, which is the cheaper surrogate the
# export supports. That is a stated simplification, not an equivalence. So each
# constant is declared with a bracket, in the same way `aeolian/config/dust.yaml`
# handles the constants no source fixes. LITH-24.
catena:
  # Extra regolith production per unit frost-cycling fraction, relative to the
  # chemical rate. Frost shattering is commonly an order of magnitude faster
  # than dissolution in periglacial settings; 3.0 is deliberately conservative
  # against that, since this world's frost season is short. DECLARED; the
  # bracket runs from no bonus at all to the order-of-magnitude literature
  # figure.
  frost_production_bonus: 3.0
  frost_production_bonus_bracket: [1.0, 10.0]
  # Slope divisor. tan(beta) = 0.1, a 6 degree hillslope, thins the profile by
  # about a third at k = 4; tan(beta) = 0.5, a 27 degree mountainside, thins it
  # to a third. Both are the right order for measured catenas. DECLARED; the
  # bracket spans thinning that is half and twice as aggressive.
  slope_transport: 4.0
  slope_transport_bracket: [2.0, 8.0]
  # The run the within-cell elevation spread is divided by to make tan(beta),
  # in kilometres of ground. DECLARED here rather than read from the export,
  # and that is the whole point of the key: the mesh spacing is a property of
  # the region count and not of the terrain, so a gradient quoted over it
  # doubles when the region count quadruples while the terrain converges
  # (WORLD-UYFB, `analysis/subgrid_slope_support.py`). Thirty kilometres is
  # above Orogen's measured ~20 km terrain-information floor, below which the
  # generator designs no terrain and a shorter run would report mesh texture.
  # It is a unit for the spread and not a sampling length: what has to transport
  # here is the within-cell spread, and that is measured converged to 1.069x
  # between this project's two builds. A statistic that SAMPLES the 15 to 30 km
  # band does not converge, which is why the scarp relief term next door
  # declares 90 km instead.
  gradient_baseline_km: 30.0
  # Fines are shed preferentially, so what survives on a slope is coarser. This
  # is the fraction of the clay excess over the sand that migrates per unit
  # tan(beta), capped so a cliff does not go to pure sand. Both DECLARED.
  slope_fines_loss: 0.35
  slope_fines_loss_bracket: [0.20, 0.50]
  maximum_fines_loss: 0.6
  maximum_fines_loss_bracket: [0.45, 0.75]
